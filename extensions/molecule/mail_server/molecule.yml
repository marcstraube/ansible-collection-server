---
# Stack scenario of the mail_server playbook in the split setup of the
# README: four containers on one podman network.
#
#   mail-server-mail   Postfix, Dovecot, rspamd and Valkey (mail_servers)
#   mail-server-db     PostgreSQL with the databases of PostfixAdmin,
#                      Roundcube and SOGo (db_servers)
#   mail-server-web    nginx and PHP, PostfixAdmin, Roundcube and SOGo
#                      (web_servers, mail_servers)
#   mail-server-clamd  clamd for rspamd, no mail role
#
# converge runs the plays of a site playbook: the base system (PHP, clamd),
# the database_server, web_server and mail_server playbooks of the
# collection. Every connection between the hosts uses TLS verified against
# the test CA of prepare, which marcstraube.common.pki puts into the trust
# store of the mail hosts. The inventory lives in inventory/ (group_vars,
# host_vars) as in the README. All four containers run in one job: the
# scenario needs them at once.
driver:
  name: podman
platforms:
  - name: mail-server-mail
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: mail-server
    groups:
      - mail_servers
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: mail-server-db
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: mail-server
    groups:
      - db_servers
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: mail-server-web
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: mail-server
    groups:
      - web_servers
      - mail_servers
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: mail-server-clamd
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: mail-server
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  # The inventory as in the README; ansible_python_interpreter of every
  # platform is in its host_vars file there
  inventory:
    links:
      group_vars: inventory/group_vars/
      host_vars: inventory/host_vars/
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
