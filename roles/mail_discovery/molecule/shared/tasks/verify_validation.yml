# Existing web roots the role must refuse without touching them: writable by
# the group, and owned by another user than root
- name: Verify | Create web roots writable by others than root
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: root
    mode: '{{ item.mode }}'
  loop: &verify_foreign_roots
    - path: /var/www/mail-discovery-group-writable
      owner: root
      mode: '0775'
    - path: /var/www/mail-discovery-foreign-owner
      owner: nobody
      mode: '0755'
  loop_control:
    label: '{{ item.path }}'

- name: Verify | Run role with a group-writable web root
  block:
    - name: Verify | Include mail_discovery role with a group-writable web root  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        mail_discovery_web_root: /var/www/mail-discovery-group-writable
  rescue:
    - name: Verify | Record the failure with a group-writable web root
      ansible.builtin.set_fact:
        __verify_validation: >-
          {{ __verify_validation | default({}) | combine({'web_root_group_writable': {
               'msg': ansible_failed_result.msg | default(''),
               'task': ansible_failed_task.name | default('')}}) }}

- name: Verify | Run role with a web root of another owner
  block:
    - name: Verify | Include mail_discovery role with a web root of another owner  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        mail_discovery_web_root: /var/www/mail-discovery-foreign-owner
  rescue:
    - name: Verify | Record the failure with a web root of another owner
      ansible.builtin.set_fact:
        __verify_validation: >-
          {{ __verify_validation | default({}) | combine({'web_root_foreign_owner': {
               'msg': ansible_failed_result.msg | default(''),
               'task': ansible_failed_task.name | default('')}}) }}

- name: Verify | Check the refused web roots after the runs
  ansible.builtin.find:
    paths: '{{ item.path }}'
    file_type: any
    hidden: true
  loop: *verify_foreign_roots
  loop_control:
    label: '{{ item.path }}'
  register: __verify_foreign_contents

- name: Verify | Check owner and mode of the refused web roots
  ansible.builtin.stat:
    path: '{{ item.path }}'
  loop: *verify_foreign_roots
  loop_control:
    label: '{{ item.path }}'
  register: __verify_foreign_stats

# The assert stops the role before the first change: no files, owner and
# mode as they were
- name: Verify | Assert the refused web roots are unchanged
  ansible.builtin.assert:
    that:
      - item.0.matched == 0
      - item.1.stat.pw_name == item.1.item.owner
      - item.1.stat.mode == item.1.item.mode
    fail_msg: >-
      {{ item.1.item.path }}: {{ item.0.matched }} entries, owner {{ item.1.stat.pw_name }},
      mode {{ item.1.stat.mode }}
  loop: '{{ __verify_foreign_contents.results | zip(__verify_foreign_stats.results) | list }}'
  loop_control:
    label: '{{ item.1.item.path }}'

- name: Verify | Assert every bad value failed its own assert
  ansible.builtin.assert:
    that:
      - __verify_validation[item.key] is defined
      - __verify_validation[item.key].task == item.value.task
      - item.value.msg in __verify_validation[item.key].msg
    fail_msg: '{{ item.key }}: {{ __verify_validation[item.key] | default("role run succeeded") }}'
  loop: '{{ __verify_validation_expected | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  vars:
    __verify_validation_expected:
      domains_empty:
        task: 'Main | Assert mail domains'
        msg: 'mail_discovery_domains must be a non-empty list of domain names'
      domains_string:
        task: 'Main | Assert mail domains'
        msg: 'mail_discovery_domains must be a non-empty list of domain names'
      domains_invalid:
        task: 'Main | Assert mail domains'
        msg: 'mail_discovery_domains must be a non-empty list of domain names'
      imap_host:
        task: 'Main | Assert server host names'
        msg: 'must be fully qualified host names'
      pop3_host:
        task: 'Main | Assert server host names'
        msg: 'must be fully qualified host names'
      submission:
        task: 'Main | Assert submission mode'
        msg: 'At least one of mail_discovery_submission_implicit_tls_enabled'
      port_range:
        task: 'Main | Assert ports'
        msg: 'must be integers from 1 to 65535'
      port_type:
        task: 'Main | Assert ports'
        msg: 'must be integers from 1 to 65535'
      web_root:
        task: 'Main | Assert web root'
        msg: 'mail_discovery_web_root must be an absolute path'
      web_host:
        task: 'Main | Assert web host'
        msg: 'mail_discovery_web_host must be the fully qualified name'
      web_root_group_writable:
        task: 'Main | Assert web root permissions'
        msg: 'must be a directory owned by root and not writable by group or others'
      web_root_foreign_owner:
        task: 'Main | Assert web root permissions'
        msg: 'must be a directory owned by root and not writable by group or others'
      mta_sts_mode:
        task: 'Main | Assert MTA-STS mode'
        msg: "mail_discovery_mta_sts_mode must be 'testing', 'enforce' or 'none'"
      mta_sts_mx_empty:
        task: 'Main | Assert MTA-STS MX hosts'
        msg: 'mail_discovery_mta_sts_mx must be a non-empty list'
      mta_sts_mx_invalid:
        task: 'Main | Assert MTA-STS MX hosts'
        msg: 'mail_discovery_mta_sts_mx must be a non-empty list'
      mta_sts_max_age:
        task: 'Main | Assert MTA-STS max age'
        msg: 'mail_discovery_mta_sts_max_age must be an integer from 1 to 31557600'
      tls_rpt_rua:
        task: 'Main | Assert TLS-RPT report URIs'
        msg: 'mail_discovery_tls_rpt_rua must be a list of report URIs'
      mta_sts_mx_newline:
        task: 'Main | Assert MTA-STS MX hosts'
        msg: 'mail_discovery_mta_sts_mx must be a non-empty list'
      mta_sts_max_age_zero:
        task: 'Main | Assert MTA-STS max age'
        msg: 'mail_discovery_mta_sts_max_age must be an integer from 1 to 31557600'
      mta_sts_max_age_type:
        task: 'Main | Assert MTA-STS max age'
        msg: 'mail_discovery_mta_sts_max_age must be an integer from 1 to 31557600'
      tls_rpt_rua_string:
        task: 'Main | Assert TLS-RPT report URIs'
        msg: 'mail_discovery_tls_rpt_rua must be a list of report URIs'
      tls_rpt_rua_http:
        task: 'Main | Assert TLS-RPT report URIs'
        msg: 'mail_discovery_tls_rpt_rua must be a list of report URIs'
      tls_rpt_rua_quote:
        task: 'Main | Assert TLS-RPT report URIs'
        msg: 'mail_discovery_tls_rpt_rua must be a list of report URIs'

# Every case above that turns MTA-STS on stopped at its assert: on a
# platform with MTA-STS off no policy was written
- name: Verify | Check MTA-STS policy after the validation runs
  ansible.builtin.stat:
    path: /var/www/mail-discovery/.well-known/mta-sts.txt
  register: __verify_mta_sts_after_validation
  when: not mail_discovery_mta_sts_enabled | bool

- name: Verify | Assert no MTA-STS policy was written by the refused runs
  ansible.builtin.assert:
    that:
      - not __verify_mta_sts_after_validation.stat.exists
  when: not mail_discovery_mta_sts_enabled | bool
