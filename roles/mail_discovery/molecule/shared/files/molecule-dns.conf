# Test resolver for the DNS check of the mail_discovery role. Published to
# the controller on the port of the platform (molecule_dns_port).
port=10053
user=root
no-resolv
no-hosts
local=/example.com/
local=/example.org/
local=/example.net/

# Web host and mail host
host-record=web.example.net,192.0.2.10
host-record=mail.example.com,192.0.2.20

# example.com: every record present (CNAME and A for the two hosts)
cname=autoconfig.example.com,web.example.net
host-record=autodiscover.example.com,192.0.2.10
srv-host=_imaps._tcp.example.com,mail.example.com,993,0,1
srv-host=_submissions._tcp.example.com,mail.example.com,465,0,1
srv-host=_submission._tcp.example.com,mail.example.com,587,0,1
srv-host=_pop3s._tcp.example.com,mail.example.com,995,0,1
srv-host=_autodiscover._tcp.example.com,web.example.net,443,0,1
# MTA-STS and TLS-RPT: the id of the policy in shared/vars (first 20 hex
# characters of its SHA-256), written without the space after the separator;
# the TLS-RPT record split into two strings, an unrelated TXT record beside
# the policy record
cname=mta-sts.example.com,web.example.net
txt-record=_mta-sts.example.com,"v=STSv1;id=e87fe8b627a1dcffb997"
txt-record=_mta-sts.example.com,"site-verification=molecule"
txt-record=_smtp._tls.example.com,"v=TLSRPTv1; rua=mailto:tls-reports@example.com,","https://reports.example.net/tlsrpt"
# MX hosts the MTA-STS policy lists, one through its '*.mx.example.net' entry
mx-host=example.com,mail.example.com,10
mx-host=example.com,a.mx.example.net,20

# example.org: different (address, target, port) or missing
host-record=autoconfig.example.org,198.51.100.20
srv-host=_imaps._tcp.example.org,imap.example.org,993,0,1
srv-host=_submissions._tcp.example.org,mail.example.com,2465,0,1
srv-host=_autodiscover._tcp.example.org,autodiscover.example.org,443,0,1
# MTA-STS and TLS-RPT: the id of an older policy, no mta-sts host, no TLS-RPT
txt-record=_mta-sts.example.org,"v=STSv1; id=20250101000000"
# MX hosts: one the policy lists (other case), one two labels below the
# wildcard entry, which it does not match
mx-host=example.org,Mail.Example.com,10
mx-host=example.org,a.b.mx.example.net,20

# Domains of the implicit and null MX test in verify.yml: example.net and
# a.mx.example.net have no MX record (implicit MX), null.example.net has a
# null MX (RFC 7505)
mx-host=null.example.net,.,0
