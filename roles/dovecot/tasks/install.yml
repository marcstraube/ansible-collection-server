---
# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - dovecot_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - dovecot_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  retries: 3
  delay: 5
  when:
    - dovecot_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed Dovecot package, not only the
# configured ones: every protocol and driver package pins the exact version
# of the core package and must move in the same transaction. The facts also hold the version before the update for the
# minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when: dovecot_packages_state == 'latest' or __dovecot_minimum | length > 0
  tags:
    - always

- name: Install | Set Dovecot package list
  ansible.builtin.set_fact:
    __dovecot_install_packages: >-
      {{ (__dovecot_packages
          + __dovecot_db_packages[dovecot_db_type]
          + (__dovecot_pop3_packages if dovecot_pop3_enabled | bool else [])
          + (__dovecot_managesieve_packages if dovecot_managesieve_enabled | bool else [])
          + ((ansible_facts['packages'] | list
              | select('match', __dovecot_update_pattern) | list)
             if (dovecot_packages_state == 'latest'
                 and ansible_facts['os_family'] in ['RedHat', 'Debian'])
             else []))
         | unique | list }}

# Full version of the core package as the package manager writes it:
# [epoch:]version[-release]. package_facts reports a missing rpm epoch as
# None, which counts as no epoch like 0.
- name: Install | Record the installed Dovecot version
  ansible.builtin.set_fact:
    __dovecot_version_before: '{{ __dovecot_installed_version }}'
  vars:
    __dovecot_pkg: "{{ ansible_facts['packages'][__dovecot_version_package] | default([{}]) | first }}"
    __dovecot_installed_version: >-
      {{ ((__dovecot_pkg.epoch ~ ':')
          if ((__dovecot_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__dovecot_pkg.version | default(''))
         ~ (('-' ~ __dovecot_pkg.release) if (__dovecot_pkg.release | default('', true)) else '') }}
  when: dovecot_packages_state == 'latest' or __dovecot_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install, resolved like the install (dnf honors module streams, excludes
# and versionlock, apt honors pinning). Arch Linux installs a missing
# package from the sync database and otherwise keeps the installed version,
# which the system upgrade updates. The queries change nothing, so they
# also run under --check. dnf fetches expired metadata for the query.
- name: Install | Query the version the update would install (RedHat)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - repoquery
      - --latest-limit=1
      - '--queryformat=%{epoch}:%{version}-%{release}'
      - '{{ __dovecot_version_package }}'
  register: __dovecot_candidate_dnf
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - __dovecot_minimum | length > 0
    - ansible_facts['os_family'] == 'RedHat'
    - dovecot_packages_state == 'latest' or __dovecot_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __dovecot_version_package }}'
  environment:
    LC_ALL: C
  register: __dovecot_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __dovecot_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - dovecot_packages_state == 'latest' or __dovecot_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the install would add (Archlinux)
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --info
      - '{{ __dovecot_version_package }}'
  environment:
    LC_ALL: C
  register: __dovecot_candidate_pacman
  changed_when: false
  # Exit status 1: the sync database has no such package. The version stays
  # empty and the minimum check reports that nothing would be installed.
  failed_when: __dovecot_candidate_pacman.rc not in [0, 1]
  check_mode: false
  when:
    - __dovecot_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __dovecot_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __dovecot_check_stage: 'pre'
    __dovecot_check_installed: '{{ __dovecot_version_before }}'
    # epoch 0 is the default and left out, as in the installed version
    __dovecot_check_candidate: >-
      {{ (((__dovecot_candidate_dnf.stdout_lines | default([])) + [''])
          | first | regex_replace('^0:', ''))
         ~ (((__dovecot_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', '')
         ~ (((__dovecot_candidate_pacman.stdout | default('')) | regex_findall('(?m)^Version *: *([^ ]+)$')) + [''])
           | first }}
  when: __dovecot_minimum | length > 0
  tags:
    - always

# Debian: the postinst of dovecot-core starts Dovecot right away with the
# packaged configuration (PAM, the system users, every address). On the
# first install a temporary policy-rc.d keeps the package from starting it;
# service.yml starts it with the role's configuration. A policy-rc.d
# without the role's marker is the host's own policy and stays untouched.
#
# A first run interrupted during the install (lost connection, Ctrl-C)
# never reaches the removal in always: below. The policy-rc.d it left
# behind carries the marker and is removed on every run before the install,
# also when the package is installed by now.
- name: Install | Check for a policy-rc.d left behind by the role (Debian)
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --fixed-strings
      - '{{ __dovecot_policy_rc_marker }}'
      - '{{ __dovecot_policy_rc_file }}'
  register: __dovecot_policy_rc_leftover
  changed_when: false
  # Exit status 1: a policy-rc.d without the marker; 2: none
  failed_when: __dovecot_policy_rc_leftover.rc not in [0, 1, 2]
  check_mode: false
  when: ansible_facts['os_family'] == 'Debian'

# Check mode reports the removal
- name: Install | Remove the policy-rc.d left behind by the role (Debian)
  ansible.builtin.file:
    path: '{{ __dovecot_policy_rc_file }}'
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'
    - (__dovecot_policy_rc_leftover.rc | default(1)) == 0

- name: Install | Check whether the Dovecot core package is installed (Debian)
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - '{{ __dovecot_version_package }}'
  register: __dovecot_core_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Install | Check for a policy-rc.d (Debian)
  ansible.builtin.stat:
    path: '{{ __dovecot_policy_rc_file }}'
  register: __dovecot_policy_rc_stat
  when:
    - ansible_facts['os_family'] == 'Debian'
    - __dovecot_core_status.stdout | default('') != 'installed'

# EL in check mode before the first run: the repository file is missing and
# dnf cannot resolve the packages; the install is reported as pending.
- name: Install | Install the Dovecot packages
  when: not (ansible_check_mode and not (__dovecot_repo_stat.stat.exists | default(true)))
  block:
    # Denies Dovecot only; other packages of the transaction start as
    # without a policy-rc.d. invoke-rc.d passes the init script name,
    # deb-systemd-invoke the unit names of dovecot-core.
    - name: Install | Keep the packages from starting Dovecot (Debian)
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          # {{ __dovecot_policy_rc_marker }}: keeps the first
          # install of Dovecot from starting it, removed right after
          case "$1" in
            dovecot | dovecot.service | dovecot.socket) exit 101 ;;
          esac
          exit 0
        dest: '{{ __dovecot_policy_rc_file }}'
        owner: root
        group: root
        mode: '0755'
      register: __dovecot_policy_rc_result
      when:
        - not ansible_check_mode
        - ansible_facts['os_family'] == 'Debian'
        - __dovecot_core_status.stdout | default('') != 'installed'
        - not (__dovecot_policy_rc_stat.stat.exists | default(true))

    - name: Install | Dovecot packages
      ansible.builtin.package:
        name: '{{ __dovecot_install_packages }}'
        state: "{{ (ansible_facts['os_family'] == 'Archlinux') | ternary('present', dovecot_packages_state) }}"
      register: __dovecot_packages_result
      retries: 3
      delay: 5

  always:
    - name: Install | Allow the packages to start services again (Debian)
      ansible.builtin.file:
        path: '{{ __dovecot_policy_rc_file }}'
        state: absent
      when: __dovecot_policy_rc_result is not skipped

# curl posts the messages of the spam training to the rspamd controller.
# Separate from the Dovecot packages: a targeted update must not move it.
- name: Install | curl for the spam training
  ansible.builtin.package:
    name: '{{ __dovecot_curl_packages }}'
    state: present
  retries: 3
  delay: 5
  when: dovecot_rspamd_learn_enabled | bool

# The SELinux tools that semanage and community.general.seport need
- name: Install | SELinux management tools (RedHat)
  ansible.builtin.package:
    name: '{{ __dovecot_selinux_packages }}'
    state: present
  retries: 3
  delay: 5
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'

# Check mode installs nothing: on a new host the service user, the
# configuration directory and the service unit do not exist yet, and the
# tasks that need them are skipped.
- name: Install | Record a pending first install in check mode
  ansible.builtin.set_fact:
    __dovecot_check_mode_install: >-
      {{ ansible_check_mode
         and (__dovecot_packages_result is changed or __dovecot_packages_result is skipped) }}

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - not ansible_check_mode
    - __dovecot_minimum | length > 0
      or (dovecot_packages_state == 'latest' and (__dovecot_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated Dovecot version
  ansible.builtin.set_fact:
    __dovecot_version_after: >-
      {{ ((__dovecot_pkg.epoch ~ ':')
          if ((__dovecot_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__dovecot_pkg.version | default(''))
         ~ (('-' ~ __dovecot_pkg.release) if (__dovecot_pkg.release | default('', true)) else '') }}
  vars:
    __dovecot_pkg: "{{ ansible_facts['packages'][__dovecot_version_package] | default([{}]) | first }}"
  when:
    - not ansible_check_mode
    - __dovecot_minimum | length > 0
      or (dovecot_packages_state == 'latest' and (__dovecot_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the Dovecot version change
  ansible.builtin.debug:
    msg: >-
      {{ __dovecot_version_package }} {{ __dovecot_version_before | default('none', true) }}
      -> {{ __dovecot_version_after }}
  when:
    - not ansible_check_mode
    - dovecot_packages_state == 'latest'
    - (__dovecot_packages_result | default({})) is changed
    - __dovecot_version_before != __dovecot_version_after

#
# Restart After Update
#
# A running Dovecot keeps executing the old binary after an update. The
# packages usually restart it themselves (dpkg maintainer scripts, rpm
# scriptlets), but policy-rc.d or the systemd update helper can prevent
# that, and pacman never restarts it. With 'latest' the role restarts the
# service while the master process still executes a replaced binary, so an
# update never restarts it twice. The check does not depend on changed
# packages: a run that updated the packages but could not restart the
# service restarts it on the next run, and on Arch Linux the role run
# together with the system upgrade restarts a service whose binary the
# upgrade replaced. Before the restart the new binary tests the active
# configuration (doveconf -n); a configuration it rejects stops the run and
# the running service keeps serving with the old binary.
#

# systemd knows the main PID on every platform, independent of the PID file.
# A unit that is not installed (check mode on a new host) reports 0.
- name: Install | Read the main PID of the running service
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - '--property=MainPID'
      - '--value'
      - '{{ __dovecot_service_name }}'
  register: __dovecot_main_pid
  changed_when: false
  check_mode: false
  when: dovecot_packages_state == 'latest'

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of the running service
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __dovecot_main_pid.stdout | default("0") | trim }}/exe'
  register: __dovecot_master_exe
  changed_when: false
  # Exit status 1: the service exited between the two reads; there is no
  # running binary to replace then.
  failed_when: __dovecot_master_exe.rc not in [0, 1]
  check_mode: false
  when:
    - dovecot_packages_state == 'latest'
    - (__dovecot_main_pid.stdout | default('0') | trim) not in ['', '0']

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __dovecot_restart_binary: >-
      {{ ((__dovecot_main_pid.stdout | default('0') | trim) not in ['', '0'])
         and dovecot_service_enabled | bool
         and (((__dovecot_master_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and (__dovecot_packages_result | default({})) is changed)) }}
  when: dovecot_packages_state == 'latest'

- name: Install | Test the configuration with the new binary
  ansible.builtin.command:
    argv:
      - doveconf
      - -n
  register: __dovecot_update_config_test
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - dovecot_packages_state == 'latest'
    - __dovecot_restart_binary | bool
    - not ansible_check_mode

- name: Install | Assert the new binary accepts the configuration
  ansible.builtin.assert:
    that:
      - __dovecot_update_config_test.rc == 0
    fail_msg: >-
      The updated Dovecot rejects the active configuration, the service keeps
      running with the old binary: {{ __dovecot_update_config_test.stderr | default('') }}
    quiet: true
  when:
    - dovecot_packages_state == 'latest'
    - __dovecot_restart_binary | bool
    - not ansible_check_mode

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running.
- name: Install | Restart Dovecot for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __dovecot_service_name }}'
    state: restarted
  when:
    - dovecot_packages_state == 'latest'
    - __dovecot_restart_binary | bool

# Post-check: the transaction can install something else than the queried
# candidate (dependencies, excludes), so the installed version is checked
# again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __dovecot_check_stage: 'post'
    __dovecot_check_installed: '{{ __dovecot_version_after }}'
    __dovecot_check_candidate: ''
  when:
    - __dovecot_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always

#
# Version
#
# Only Dovecot 2.4 is supported: the configuration uses the 2.4 syntax, and
# dovecot_config_version / dovecot_storage_version above the installed
# release are fatal for Dovecot. An older release (AppStream 2.3 installed
# before the upstream repository) is never upgraded by the role.
#

- name: Install | Read the installed Dovecot version
  ansible.builtin.command:
    argv:
      - dovecot
      - --version
  register: __dovecot_version_output
  changed_when: false
  check_mode: false
  when: not __dovecot_check_mode_install | default(false) | bool
  tags:
    - always

- name: Install | Record the installed Dovecot release
  ansible.builtin.set_fact:
    __dovecot_release: >-
      {{ (__dovecot_version_output.stdout | default('') | regex_search('^[0-9]+\.[0-9]+\.[0-9]+')) or '' }}
  when: not __dovecot_check_mode_install | default(false) | bool
  tags:
    - always

- name: Install | Assert the Dovecot release
  ansible.builtin.assert:
    that:
      - __dovecot_errors | length == 0
    fail_msg: '{{ __dovecot_errors | join(" ") }}'
    quiet: true
  vars:
    __dovecot_errors: >-
      {{ [
           ("Only Dovecot " ~ __dovecot_supported_major_minor ~ " is supported; installed: '"
            ~ (__dovecot_version_output.stdout | default('') | trim) ~ "'.")
             if not (__dovecot_release.startswith(__dovecot_supported_major_minor ~ '.')) else '',
           ("dovecot_config_version " ~ dovecot_config_version ~ " is above the installed release "
            ~ __dovecot_release ~ ", which Dovecot refuses.")
             if __dovecot_release | length > 0 and dovecot_config_version is version(__dovecot_release, '>')
             else '',
           ("dovecot_storage_version " ~ dovecot_storage_version ~ " is above the installed release "
            ~ __dovecot_release ~ ", which Dovecot refuses.")
             if __dovecot_release | length > 0 and dovecot_storage_version is version(__dovecot_release, '>')
             else ''
         ] | select | list }}
  when: not __dovecot_check_mode_install | default(false) | bool
  tags:
    - always
