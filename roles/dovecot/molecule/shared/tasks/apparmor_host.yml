---
# A host with AppArmor as far as a container can be one: the apparmor
# package (Arch Linux ships the Dovecot profiles with it, Debian does not),
# the directory that marks AppArmor as active (a tmpfs in place of
# securityfs) and a wrapper around apparmor_parser that compiles the
# profiles without loading them. EL gets a stand-in profile: the role must
# not touch it there.
- name: Prepare | Install AppArmor (Arch, Debian)
  ansible.builtin.package:
    name: apparmor
    state: present
  retries: 3
  delay: 5
  when: ansible_facts['os_family'] != 'RedHat'

- name: Prepare | Create a stand-in profile directory (EL)
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/apparmor.d
    - /etc/apparmor.d/local
  when: ansible_facts['os_family'] == 'RedHat'

- name: Prepare | Create a stand-in profile (EL)
  ansible.builtin.copy:
    content: "profile dovecot-lmtp /usr/lib*/dovecot/lmtp {\n  include if exists <local/usr.lib.dovecot.lmtp>\n}\n"
    dest: /etc/apparmor.d/usr.lib.dovecot.lmtp
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['os_family'] == 'RedHat'

- name: Prepare | Mount a tmpfs in place of securityfs
  ansible.posix.mount:
    src: tmpfs
    path: /sys/kernel/security
    fstype: tmpfs
    opts: mode=0755
    state: ephemeral

- name: Prepare | Mark AppArmor as active
  ansible.builtin.file:
    path: /sys/kernel/security/apparmor
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Prepare | Deploy the apparmor_parser wrapper
  ansible.builtin.copy:
    src: apparmor_parser.sh
    dest: /usr/local/sbin/apparmor_parser
    owner: root
    group: root
    mode: '0755'
