---
# MariaDB scenario: the playbooks of the postgresql scenario with the mariadb
# role of this collection; Dovecot connects through the socket of the
# platform ('localhost').
driver:
  name: podman
platforms:
  - name: dovecot-mariadb-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: dovecot-mariadb-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: dovecot-mariadb-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: dovecot-mariadb-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: ../shared/side_effect.yml
    verify: ../shared/verify.yml
  inventory:
    group_vars:
      all:
        # Shared by prepare, converge and verify; the test data is in
        # ../shared/vars/main.yml
        dovecot_db_type: 'mariadb'
        dovecot_db_host: 'localhost'
        # MariaDB on the instance, from the distribution packages
        mariadb_enabled: true
        mariadb_repo: 'distro'
        mariadb_version: '11.8'
        mariadb_arch_package: 'mariadb'
        # AppArmor on every platform: the Dovecot profiles of the apparmor
        # package on Arch Linux, none on Debian, a stand-in on EL; the
        # postgresql scenario has no AppArmor
        __molecule_apparmor: true
    host_vars:
      dovecot-mariadb-archlinux:
        ansible_python_interpreter: /usr/bin/python
      dovecot-mariadb-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
      dovecot-mariadb-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
      dovecot-mariadb-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
