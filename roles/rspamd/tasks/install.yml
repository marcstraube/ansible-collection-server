---
# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - rspamd_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - rspamd_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  retries: 3
  delay: 5
  when:
    - rspamd_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed rspamd package, not only the
# configured one: the debug and ASAN builds pin the exact version of the
# main package and must move in the same transaction. The facts also hold
# the version before the update for the minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when: rspamd_packages_state == 'latest' or __rspamd_minimum | length > 0
  tags:
    - always

- name: Install | Set rspamd package list
  ansible.builtin.set_fact:
    __rspamd_install_packages: >-
      {{ (__rspamd_packages
          + ((ansible_facts['packages'] | list
              | select('match', __rspamd_update_pattern) | list)
             if (rspamd_packages_state == 'latest'
                 and ansible_facts['os_family'] in ['RedHat', 'Debian'])
             else []))
         | unique | list }}

# Full version of the main package as the package manager writes it:
# [epoch:]version[-release]. package_facts reports a missing rpm epoch as
# None, which counts as no epoch like 0.
- name: Install | Record the installed rspamd version
  ansible.builtin.set_fact:
    __rspamd_version_package: '{{ __rspamd_packages | first }}'
    __rspamd_version_before: '{{ __rspamd_installed_version }}'
  vars:
    __rspamd_pkg: "{{ ansible_facts['packages'][__rspamd_packages | first] | default([{}]) | first }}"
    __rspamd_installed_version: >-
      {{ ((__rspamd_pkg.epoch ~ ':')
          if ((__rspamd_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__rspamd_pkg.version | default(''))
         ~ (('-' ~ __rspamd_pkg.release) if (__rspamd_pkg.release | default('', true)) else '') }}
  when: rspamd_packages_state == 'latest' or __rspamd_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install, resolved like the install (dnf honors excludes and versionlock,
# apt honors pinning). Arch Linux installs a missing package from the sync
# database and otherwise keeps the installed version, which the system
# upgrade updates. The queries change nothing, so they also run under
# --check. dnf fetches expired metadata for the query; in check mode on a
# new EL host the repository is missing and nothing is found.
- name: Install | Query the version the update would install (RedHat)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - repoquery
      - --latest-limit=1
      - '--queryformat=%{epoch}:%{version}-%{release}'
      - '{{ __rspamd_version_package }}'
  register: __rspamd_candidate_dnf
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - __rspamd_minimum | length > 0
    - ansible_facts['os_family'] == 'RedHat'
    - rspamd_packages_state == 'latest' or __rspamd_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __rspamd_version_package }}'
  environment:
    LC_ALL: C
  register: __rspamd_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __rspamd_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - rspamd_packages_state == 'latest' or __rspamd_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the install would add (Archlinux)
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --info
      - '{{ __rspamd_version_package }}'
  environment:
    LC_ALL: C
  register: __rspamd_candidate_pacman
  changed_when: false
  # Exit status 1: the sync database has no such package. The version stays
  # empty and the minimum check reports that nothing would be installed.
  failed_when: __rspamd_candidate_pacman.rc not in [0, 1]
  check_mode: false
  when:
    - __rspamd_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __rspamd_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __rspamd_check_stage: 'pre'
    __rspamd_check_installed: '{{ __rspamd_version_before }}'
    # epoch 0 is the default and left out, as in the installed version
    __rspamd_check_candidate: >-
      {{ (((__rspamd_candidate_dnf.stdout_lines | default([])) + [''])
          | first | regex_replace('^0:', ''))
         ~ (((__rspamd_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', '')
         ~ (((__rspamd_candidate_pacman.stdout | default('')) | regex_findall('(?m)^Version *: *([^ ]+)$')) + [''])
           | first }}
  when: __rspamd_minimum | length > 0
  tags:
    - always

# Debian: the postinst starts rspamd right away with the packaged
# configuration (controller password 'q1', trusted without a password from
# the loopback interface). On the first install a temporary policy-rc.d
# keeps the package from starting it; service.yml starts it with the
# role's configuration. A policy-rc.d without the role's marker is the
# host's own policy and stays untouched.
#
# A first run interrupted during the install (lost connection, Ctrl-C)
# never reaches the removal in always: below. The policy-rc.d it left
# behind carries the marker and is removed on every run before the install,
# also when the package is installed by now.
- name: Install | Check for a policy-rc.d left behind by the role (Debian)
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --fixed-strings
      - '{{ __rspamd_policy_rc_marker }}'
      - '{{ __rspamd_policy_rc_file }}'
  register: __rspamd_policy_rc_leftover
  changed_when: false
  # Exit status 1: a policy-rc.d without the marker; 2: none
  failed_when: __rspamd_policy_rc_leftover.rc not in [0, 1, 2]
  check_mode: false
  when: ansible_facts['os_family'] == 'Debian'

# Check mode reports the removal
- name: Install | Remove the policy-rc.d left behind by the role (Debian)
  ansible.builtin.file:
    path: '{{ __rspamd_policy_rc_file }}'
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'
    - (__rspamd_policy_rc_leftover.rc | default(1)) == 0

- name: Install | Check whether the rspamd package is installed (Debian)
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - '{{ __rspamd_packages | first }}'
  register: __rspamd_package_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Install | Check for a policy-rc.d (Debian)
  ansible.builtin.stat:
    path: '{{ __rspamd_policy_rc_file }}'
  register: __rspamd_policy_rc_stat
  when:
    - ansible_facts['os_family'] == 'Debian'
    - __rspamd_package_status.stdout | default('') != 'installed'

# Debian and EL in check mode before the first run: the repository is
# missing and the package cannot be resolved; the install is reported as
# pending.
- name: Install | Install the rspamd packages
  when: not (ansible_check_mode and not (__rspamd_repo_stat.stat.exists | default(true)))
  block:
    # Denies rspamd only; other packages of the transaction start as without
    # a policy-rc.d
    - name: Install | Keep the packages from starting rspamd (Debian)
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          # {{ __rspamd_policy_rc_marker }}: keeps the first
          # install of rspamd from starting it, removed right after
          case "$1" in
            rspamd | rspamd.service) exit 101 ;;
          esac
          exit 0
        dest: '{{ __rspamd_policy_rc_file }}'
        owner: root
        group: root
        mode: '0755'
      register: __rspamd_policy_rc_result
      when:
        - not ansible_check_mode
        - ansible_facts['os_family'] == 'Debian'
        - __rspamd_package_status.stdout | default('') != 'installed'
        - not (__rspamd_policy_rc_stat.stat.exists | default(true))

    - name: Install | rspamd packages
      ansible.builtin.package:
        name: '{{ __rspamd_install_packages }}'
        state: "{{ (ansible_facts['os_family'] == 'Archlinux') | ternary('present', rspamd_packages_state) }}"
      register: __rspamd_packages_result
      retries: 3
      delay: 5

  always:
    - name: Install | Allow the packages to start services again (Debian)
      ansible.builtin.file:
        path: '{{ __rspamd_policy_rc_file }}'
        state: absent
      when: __rspamd_policy_rc_result is not skipped

# Check mode installs nothing: on a new host the service user, rspamadm and
# the service unit do not exist yet, and the tasks that need them are
# skipped.
- name: Install | Record a pending first install in check mode
  ansible.builtin.set_fact:
    __rspamd_check_mode_install: >-
      {{ ansible_check_mode
         and (__rspamd_packages_result is changed or __rspamd_packages_result is skipped) }}

#
# Service User
#
# The unit runs rspamd as the service user of the package. The EL packages
# of rspamd 4.3.0 do not create it (a broken condition in the %pre
# scriptlet, rspamd/rspamd#6385), and their %post then cannot hand the data
# and log directories to it. The role creates the user only while it is
# missing, as the package should have, and leaves an existing one alone.
#

- name: Install | Look up the service user
  ansible.builtin.getent:
    database: passwd
    key: '{{ __rspamd_user }}'
    fail_key: false
  when: not __rspamd_check_mode_install | default(false) | bool

- name: Install | Create the missing service group
  ansible.builtin.group:
    name: '{{ __rspamd_group }}'
    system: true
    state: present
  when:
    - not __rspamd_check_mode_install | default(false) | bool
    - ansible_facts['getent_passwd'][__rspamd_user] | default(none) is none

- name: Install | Create the missing service user
  ansible.builtin.user:
    name: '{{ __rspamd_user }}'
    group: '{{ __rspamd_group }}'
    comment: 'rspamd spam filtering system'
    home: '{{ __rspamd_db_dir }}'
    shell: '{{ __rspamd_nologin_shell }}'
    system: true
    create_home: false
    state: present
  when:
    - not __rspamd_check_mode_install | default(false) | bool
    - ansible_facts['getent_passwd'][__rspamd_user] | default(none) is none

# Unix sockets of local peers, e.g. clamd (group of the clamav service
# user) or Valkey (valkey_unix_socket_group). systemd sets the groups when
# the service starts: rspamd restarts while its main process lacks one of
# the groups. The decision compares the running process with the groups,
# not the change of the membership, so a run that added the user but failed
# before the restart restarts on the next run.
- name: Install | Add the service user to the socket groups
  ansible.builtin.user:
    name: '{{ __rspamd_user }}'
    groups: '{{ rspamd_socket_groups }}'
    append: true
  when:
    - rspamd_socket_groups | length > 0
    - not __rspamd_check_mode_install | default(false) | bool

- name: Install | Look up the socket groups
  ansible.builtin.getent:
    database: group
  when:
    - rspamd_socket_groups | length > 0
    - not __rspamd_check_mode_install | default(false) | bool

# A unit that is not running reports 0; it starts with the groups
- name: Install | Read the main PID for the group check
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - '--property=MainPID'
      - '--value'
      - '{{ __rspamd_service_name }}'
  register: __rspamd_group_pid
  changed_when: false
  check_mode: false
  when:
    - rspamd_socket_groups | length > 0
    - not __rspamd_check_mode_install | default(false) | bool

- name: Install | Read the groups of the running main process
  ansible.builtin.command:
    argv:
      - grep
      - '^Groups:'
      - '/proc/{{ __rspamd_group_pid.stdout | trim }}/status'
  register: __rspamd_group_status
  changed_when: false
  # Exit status 1 or 2: the process exited between the two reads
  failed_when: __rspamd_group_status.rc not in [0, 1, 2]
  check_mode: false
  when:
    - rspamd_socket_groups | length > 0
    - not __rspamd_check_mode_install | default(false) | bool
    - (__rspamd_group_pid.stdout | default('0') | trim) not in ['', '0']

# Set on every run, so an earlier run in the same play never leaves it on;
# configure.yml adds a changed listener, and the handlers restart once
- name: Install | Decide on a restart for new groups
  ansible.builtin.set_fact:
    __rspamd_restart_needed: >-
      {{ (__rspamd_group_status.rc | default(1)) == 0
         and (__rspamd_group_gids | reject('in', __rspamd_group_running) | list | length > 0) }}
  vars:
    __rspamd_group_gids: >-
      {{ rspamd_socket_groups
         | map('extract', ansible_facts['getent_group'] | default({}))
         | select('defined') | map(attribute=1) | map('string') | list }}
    __rspamd_group_running: >-
      {{ (__rspamd_group_status.stdout | default('')).split()[1:] }}

- name: Install | Schedule the restart for new groups
  ansible.builtin.debug:
    msg: >-
      The running rspamd lacks a group of rspamd_socket_groups
      ({{ rspamd_socket_groups | join(', ') }}); rspamd restarts.
  changed_when: true
  notify: Restart rspamd
  when: __rspamd_restart_needed | bool

# rspamd writes its statistics cache, history and hyperscan cache here and
# its log file there
- name: Install | Hand the data and log directories to the service user
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ __rspamd_user }}'
    group: '{{ __rspamd_group }}'
    mode: '0750'
  loop:
    - '{{ __rspamd_db_dir }}'
    - '{{ __rspamd_log_dir }}'
  when: not __rspamd_check_mode_install | default(false) | bool

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - not ansible_check_mode
    - __rspamd_minimum | length > 0
      or (rspamd_packages_state == 'latest' and (__rspamd_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated rspamd version
  ansible.builtin.set_fact:
    __rspamd_version_after: >-
      {{ ((__rspamd_pkg.epoch ~ ':')
          if ((__rspamd_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__rspamd_pkg.version | default(''))
         ~ (('-' ~ __rspamd_pkg.release) if (__rspamd_pkg.release | default('', true)) else '') }}
  vars:
    __rspamd_pkg: "{{ ansible_facts['packages'][__rspamd_version_package] | default([{}]) | first }}"
  when:
    - not ansible_check_mode
    - __rspamd_minimum | length > 0
      or (rspamd_packages_state == 'latest' and (__rspamd_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the rspamd version change
  ansible.builtin.debug:
    msg: >-
      {{ __rspamd_version_package }} {{ __rspamd_version_before | default('none', true) }}
      -> {{ __rspamd_version_after }}
  when:
    - not ansible_check_mode
    - rspamd_packages_state == 'latest'
    - (__rspamd_packages_result | default({})) is changed
    - __rspamd_version_before != __rspamd_version_after

#
# Restart After Update
#
# A running rspamd keeps executing the old binary after an update. The
# packages usually restart it themselves (dpkg maintainer scripts, rpm
# scriptlets), but policy-rc.d or the systemd update helper can prevent
# that, and pacman never restarts it. With 'latest' the role restarts the
# service while the main process still executes a replaced binary, so an
# update never restarts it twice. The check does not depend on changed
# packages: a run that updated the packages but could not restart the
# service restarts it on the next run, and on Arch Linux the role run
# together with the system upgrade restarts a service whose binary the
# upgrade replaced. Before the restart the new rspamadm tests the active
# configuration; a configuration it rejects stops the run and the running
# service keeps serving with the old binary.
#

# systemd knows the main PID on every platform. A unit that is not
# installed (check mode on a new host) reports 0.
- name: Install | Read the main PID of the running service
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - '--property=MainPID'
      - '--value'
      - '{{ __rspamd_service_name }}'
  register: __rspamd_main_pid
  changed_when: false
  check_mode: false
  when: rspamd_packages_state == 'latest'

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of the running service
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __rspamd_main_pid.stdout | default("0") | trim }}/exe'
  register: __rspamd_main_exe
  changed_when: false
  # Exit status 1: the service exited between the two reads; there is no
  # running binary to replace then.
  failed_when: __rspamd_main_exe.rc not in [0, 1]
  check_mode: false
  when:
    - rspamd_packages_state == 'latest'
    - (__rspamd_main_pid.stdout | default('0') | trim) not in ['', '0']

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __rspamd_restart_binary: >-
      {{ ((__rspamd_main_pid.stdout | default('0') | trim) not in ['', '0'])
         and rspamd_service_enabled | bool
         and (((__rspamd_main_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and (__rspamd_packages_result | default({})) is changed)) }}
  when: rspamd_packages_state == 'latest'

- name: Install | Test the configuration with the new binary
  ansible.builtin.command:
    argv:
      - rspamadm
      - configtest
      - -c
      - '{{ __rspamd_config_file }}'
  register: __rspamd_update_config_test
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - rspamd_packages_state == 'latest'
    - __rspamd_restart_binary | bool
    - not ansible_check_mode

- name: Install | Assert the new binary accepts the configuration
  ansible.builtin.assert:
    that:
      - __rspamd_update_config_test.rc == 0
    fail_msg: >-
      The updated rspamd rejects the active configuration, the service keeps
      running with the old binary:
      {{ (__rspamd_update_config_test.stdout_lines | default([]))
         + (__rspamd_update_config_test.stderr_lines | default([])) }}
    quiet: true
  when:
    - rspamd_packages_state == 'latest'
    - __rspamd_restart_binary | bool
    - not ansible_check_mode

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running.
- name: Install | Restart rspamd for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __rspamd_service_name }}'
    state: restarted
  when:
    - rspamd_packages_state == 'latest'
    - __rspamd_restart_binary | bool

# The restart above already applies new socket groups; a listener change in
# configure.yml sets the flag again.
- name: Install | Clear the pending restart after the binary restart
  ansible.builtin.set_fact:
    __rspamd_restart_needed: false
  when:
    - rspamd_packages_state == 'latest'
    - __rspamd_restart_binary | bool

# Post-check: the transaction can install something else than the queried
# candidate (dependencies, excludes), so the installed version is checked
# again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __rspamd_check_stage: 'post'
    __rspamd_check_installed: '{{ __rspamd_version_after }}'
    __rspamd_check_candidate: ''
  when:
    - __rspamd_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always
