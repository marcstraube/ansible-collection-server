---
# Split scenario with MariaDB: the server runs in a second container on a
# podman network and refuses unencrypted TCP connections
# (require_secure_transport); PostfixAdmin connects by host name with TLS
# and verifies the server certificate and the host name against the CA of
# prepare (database_ssl_verify_server_cert). The database and its owner come
# from the mariadb role on the database host, as for a server that is not
# on the PostfixAdmin host. Both containers run in one job: the scenario
# needs both platforms at once.
driver:
  name: podman
platforms:
  - name: postfixadmin-split-mariadb-db
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: postfixadmin-split-mariadb
    groups:
      - database
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postfixadmin-split-mariadb-web
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: postfixadmin-split-mariadb
    groups:
      - web
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: ../split/converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        __molecule_db_password: 'test-db-Password-42'
        __molecule_ca_file: '/etc/ssl/certs/postfixadmin-split-mariadb-ca.pem'
      database:
        mariadb_enabled: true
        mariadb_repo: 'distro'
        mariadb_version: '11.8'
        mariadb_bind_address: '0.0.0.0'
        mariadb_ssl_enabled: true
        mariadb_ssl_cert_file: '/etc/mariadb-tls/server.crt'
        mariadb_ssl_key_file: '/etc/mariadb-tls/server.key'
        # Remote clients only with TLS; the unix socket stays allowed
        mariadb_require_secure_transport: true
        mariadb_databases:
          - name: 'postfixadmin'
        mariadb_users:
          - name: 'postfixadmin'
            host: '%'
            password: '{{ __molecule_db_password }}'
            priv: 'postfixadmin.*:ALL'
      web:
        postfixadmin_enabled: true
        postfixadmin_db_type: 'mariadb'
        postfixadmin_db_host: 'postfixadmin-split-mariadb-db'
        postfixadmin_db_password: '{{ __molecule_db_password }}'
        postfixadmin_db_tls: true
        postfixadmin_db_tls_ca_file: '{{ __molecule_ca_file }}'
        postfixadmin_sogo_view_enabled: true
        postfixadmin_domains:
          - domain: 'example.com'
        postfixadmin_admins:
          - username: 'admin@example.com'
            password: 'admin-Secret-42'
            superadmin: true
        postfixadmin_mailboxes:
          - username: 'alice@example.com'
            password: 'alice-Secret-42'
            name: 'Alice'
    host_vars:
      postfixadmin-split-mariadb-db:
        ansible_python_interpreter: /usr/bin/python3
      postfixadmin-split-mariadb-web:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
