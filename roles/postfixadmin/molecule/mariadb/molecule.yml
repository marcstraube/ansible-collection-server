---
# MariaDB scenario: the playbooks of the postgresql scenario with the
# mariadb role of this collection; PostfixAdmin connects through the
# socket of the platform ('localhost').
driver:
  name: podman
platforms:
  - name: postfixadmin-mariadb-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postfixadmin-mariadb-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postfixadmin-mariadb-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postfixadmin-mariadb-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: ../shared/side_effect.yml
    verify: ../shared/verify.yml
  inventory:
    group_vars:
      all:
        # Shared by prepare, converge, side_effect and verify
        postfixadmin_db_type: 'mariadb'
        postfixadmin_enabled: true
        postfixadmin_db_password: 'test-db-Password-42'
        postfixadmin_db_create: true
        postfixadmin_db_readers:
          - name: 'postfix_ro'
            password: 'postfix-Reader-42'
          - name: 'sogo_ro'
            password: 'sogo-Reader-42'
            tables: ['sogo_users']
        postfixadmin_sogo_view_enabled: true
        # A dedicated PHP-FPM pool with a user of its own (prepare creates
        # both); verify requests PostfixAdmin through its socket
        postfixadmin_php_fpm_user: 'postfixadmin'
        postfixadmin_php_fpm_group: 'postfixadmin'
        # TOTP on here, the default (off) in the postgresql scenario
        postfixadmin_totp: true
        # The test domains under .example have no DNS records, which
        # PostfixAdmin checks for every domain and address by default
        postfixadmin_extra_config:
          emailcheck_resolve_domain: 'NO'
        # MariaDB on the instance, from the distribution packages
        mariadb_enabled: true
        mariadb_repo: 'distro'
        mariadb_version: '11.8'
        mariadb_arch_package: 'mariadb'
    host_vars:
      postfixadmin-mariadb-archlinux:
        ansible_python_interpreter: /usr/bin/python
      postfixadmin-mariadb-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
      postfixadmin-mariadb-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
      postfixadmin-mariadb-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
