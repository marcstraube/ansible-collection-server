---
# Split scenario: PostgreSQL runs in a second container on a podman
# network and accepts the PostfixAdmin user over TLS only (hostssl);
# PostfixAdmin connects by host name and verifies the server certificate
# against the CA of prepare (sslmode verify-full). The database and its
# owner come from the postgresql role on the database host, as for a
# server that is not on the PostfixAdmin host. Both containers run in one
# job: the scenario needs both platforms at once.
driver:
  name: podman
platforms:
  - name: postfixadmin-split-db
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: postfixadmin-split
    groups:
      - database
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postfixadmin-split-web
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: postfixadmin-split
    groups:
      - web
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        __molecule_db_password: 'test-db-Password-42'
        __molecule_ca_file: '/etc/ssl/certs/postfixadmin-split-ca.pem'
      database:
        postgresql_enabled: true
        postgresql_listen_addresses: '*'
        postgresql_firewalld_enabled: false
        postgresql_shared_buffers: '64MB'
        postgresql_effective_cache_size: '128MB'
        postgresql_lc_messages: 'en_US.UTF-8'
        postgresql_lc_monetary: 'en_US.UTF-8'
        postgresql_lc_numeric: 'en_US.UTF-8'
        postgresql_lc_time: 'en_US.UTF-8'
        postgresql_ssl_enabled: true
        postgresql_ssl_cert_file: '/etc/postgresql-tls/server.crt'
        postgresql_ssl_key_file: '/etc/postgresql-tls/server.key'
        # Remote clients only with TLS: there is no host entry for them
        postgresql_hba_additional:
          - type: 'hostssl'
            database: 'postfixadmin'
            user: 'postfixadmin'
            address: '0.0.0.0/0'
            method: 'scram-sha-256'
          - type: 'hostssl'
            database: 'postfixadmin'
            user: 'postfixadmin'
            address: '::/0'
            method: 'scram-sha-256'
        postgresql_users:
          - name: 'postfixadmin'
            password: '{{ __molecule_db_password }}'
        postgresql_databases:
          - name: 'postfixadmin'
            owner: 'postfixadmin'
      web:
        postfixadmin_enabled: true
        postfixadmin_db_type: 'postgresql'
        postfixadmin_db_host: 'postfixadmin-split-db'
        postfixadmin_db_password: '{{ __molecule_db_password }}'
        postfixadmin_db_tls: true
        postfixadmin_db_tls_ca_file: '{{ __molecule_ca_file }}'
        postfixadmin_sogo_view_enabled: true
        postfixadmin_domains:
          - domain: 'example.com'
        postfixadmin_admins:
          - username: 'admin@example.com'
            password: 'admin-Secret-42'
            superadmin: true
        postfixadmin_mailboxes:
          - username: 'alice@example.com'
            password: 'alice-Secret-42'
            name: 'Alice'
    host_vars:
      postfixadmin-split-db:
        ansible_python_interpreter: /usr/bin/python3
      postfixadmin-split-web:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
