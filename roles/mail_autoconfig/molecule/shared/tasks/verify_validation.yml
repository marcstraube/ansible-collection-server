---
# Every assert of the role rejects a bad value with its own message. The
# role is run once per case; the assert stops it before any file changes.

- name: Verify | Run role with an empty domain list
  block:
    - name: Verify | Include mail_autoconfig role with an empty domain list  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        mail_autoconfig_domains: []
  rescue:
    - name: Verify | Record the failure with an empty domain list
      ansible.builtin.set_fact:
        __verify_validation: >-
          {{ __verify_validation | default({}) | combine({'domains_empty': {
               'msg': ansible_failed_result.msg | default(''),
               'task': ansible_failed_task.name | default('')}}) }}

- name: Verify | Run role with a single domain instead of a list
  block:
    - name: Verify | Include mail_autoconfig role with a single domain instead of a list  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        mail_autoconfig_domains: 'example.com'
  rescue:
    - name: Verify | Record the failure with a single domain instead of a list
      ansible.builtin.set_fact:
        __verify_validation: >-
          {{ __verify_validation | default({}) | combine({'domains_string': {
               'msg': ansible_failed_result.msg | default(''),
               'task': ansible_failed_task.name | default('')}}) }}

- name: Verify | Run role with an invalid domain name
  block:
    - name: Verify | Include mail_autoconfig role with an invalid domain name  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        mail_autoconfig_domains:
          - 'example.com'
          - 'example_com'
