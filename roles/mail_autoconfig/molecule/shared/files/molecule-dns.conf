# Test resolver for the DNS check of the mail_autoconfig role. Published to
# the controller on the port of the platform (molecule_dns_port).
port=10053
user=root
no-resolv
no-hosts
local=/example.com/
local=/example.org/
local=/example.net/

# Web host and mail host
host-record=web.example.net,192.0.2.10
host-record=mail.example.com,192.0.2.20

# example.com: every record present (CNAME and A for the two hosts)
cname=autoconfig.example.com,web.example.net
host-record=autodiscover.example.com,192.0.2.10
srv-host=_imaps._tcp.example.com,mail.example.com,993,0,1
srv-host=_submissions._tcp.example.com,mail.example.com,465,0,1
srv-host=_submission._tcp.example.com,mail.example.com,587,0,1
srv-host=_pop3s._tcp.example.com,mail.example.com,995,0,1
srv-host=_autodiscover._tcp.example.com,web.example.net,443,0,1

# example.org: different (address, target, port) or missing
host-record=autoconfig.example.org,198.51.100.20
srv-host=_imaps._tcp.example.org,imap.example.org,993,0,1
srv-host=_submissions._tcp.example.org,mail.example.com,2465,0,1
srv-host=_autodiscover._tcp.example.org,autodiscover.example.org,443,0,1
