---
driver:
  name: podman
# Each platform publishes the test resolver (dnsmasq on port 10053 in the
# container) on its own controller port, so the platforms can run side by
# side; the DNS check of the role queries it from the controller. The
# controller cannot reach the web server in the container by name, so the
# HTTP check runs in the container (shared/vars), where etc_hosts points the
# autoconfig and autodiscover names to the local web server. Each platform
# runs another toggle set (molecule_variant, see shared/vars).
platforms:
  - name: mail-autoconfig-apache-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15401:10053/udp'
    etc_hosts:
      autoconfig.example.com: 127.0.0.1
      autodiscover.example.com: 127.0.0.1
      autoconfig.example.org: 127.0.0.1
      autodiscover.example.org: 127.0.0.1
  - name: mail-autoconfig-apache-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15402:10053/udp'
    etc_hosts:
      autoconfig.example.com: 127.0.0.1
      autodiscover.example.com: 127.0.0.1
      autoconfig.example.org: 127.0.0.1
      autodiscover.example.org: 127.0.0.1
  - name: mail-autoconfig-apache-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15403:10053/udp'
    etc_hosts:
      autoconfig.example.com: 127.0.0.1
      autodiscover.example.com: 127.0.0.1
      autoconfig.example.org: 127.0.0.1
      autodiscover.example.org: 127.0.0.1
  - name: mail-autoconfig-apache-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15404:10053/udp'
    etc_hosts:
      autoconfig.example.com: 127.0.0.1
      autodiscover.example.com: 127.0.0.1
      autoconfig.example.org: 127.0.0.1
      autodiscover.example.org: 127.0.0.1
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      mail-autoconfig-apache-archlinux:
        ansible_python_interpreter: /usr/bin/python
        molecule_dns_port: 15401
        molecule_variant: 'full'
      mail-autoconfig-apache-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
        molecule_dns_port: 15402
        molecule_variant: 'implicit_tls'
      mail-autoconfig-apache-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
        molecule_dns_port: 15403
        molecule_variant: 'starttls'
      mail-autoconfig-apache-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
        molecule_dns_port: 15404
        molecule_variant: 'defaults'
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
