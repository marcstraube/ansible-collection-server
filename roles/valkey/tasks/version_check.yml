---
# Compares the Valkey server package with the minimum version, using the
# distribution's own version rules (epochs, Debian revisions such as
# +deb13u3, EL release strings). Passes when the installed version or the
# version the update would install meets the minimum.
#
# Input:
#   __valkey_check_stage      'pre' (before the package task) or 'post'
#   __valkey_check_installed  installed version, '' when not installed
#   __valkey_check_candidate  version the update would install, '' if none
#
# A minimum without an epoch takes the epoch of the compared version: dpkg,
# rpm and vercmp treat a missing epoch as 0, so a package that gains an
# epoch would otherwise count as newer than any minimum without one.

- name: Version Check | Compare with the minimum version
  ansible.builtin.command:
    argv: '{{ __valkey_vercmp_argv[ansible_facts["os_family"]] }}'
  vars:
    __valkey_check_minimum: >-
      {{ (item.split(':') | first ~ ':' ~ __valkey_minimum)
         if (':' not in (__valkey_minimum | string) and item is match('^[0-9]+:'))
         else (__valkey_minimum | string) }}
    # dpkg answers with its exit code, rpm and vercmp print -1, 0 or 1
    __valkey_vercmp_argv:
      Debian: ['dpkg', '--compare-versions', '{{ item }}', 'ge', '{{ __valkey_check_minimum }}']
      RedHat: ['rpm', '--eval', '%{lua: print(rpm.vercmp("{{ item }}", "{{ __valkey_check_minimum }}"))}']
      Archlinux: ['vercmp', '{{ item }}', '{{ __valkey_check_minimum }}']
  loop: '{{ [__valkey_check_installed, __valkey_check_candidate] | select | unique | list }}'
  register: __valkey_check_result
  changed_when: false
  failed_when: __valkey_check_result.rc not in [0, 1]
  check_mode: false

- name: Version Check | Assert the minimum version
  ansible.builtin.assert:
    that:
      - __valkey_check_met | length > 0
    fail_msg: >-
      valkey_packages_minimum requires {{ __valkey_minimum }};
      installed: {{ __valkey_check_installed | default('none', true) }}{{
        ('; the update would install: ' ~ (__valkey_check_candidate | default('none', true)))
        if __valkey_check_stage == 'pre' else '' }}.
      The repository does not carry the required version yet{{
        ', nothing was changed' if __valkey_check_stage == 'pre' else '' }}.
    success_msg: >-
      {{ __valkey_version_package }} {{ (__valkey_check_met + ['']) | first }} meets the
      minimum {{ __valkey_minimum }}
  vars:
    __valkey_check_met: >-
      {{ (__valkey_check_result.results | default([]) | selectattr('rc', 'eq', 0) | map(attribute='item') | list)
         if ansible_facts['os_family'] == 'Debian'
         else (__valkey_check_result.results | default([]) | selectattr('stdout', 'in', ['0', '1'])
               | map(attribute='item') | list) }}
