---
# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - valkey_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - valkey_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  retries: 3
  delay: 5
  when:
    - valkey_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed Valkey package, not only the
# configured ones: parts pulled in as dependencies (valkey-tools on Debian)
# pin the exact version of the server package and must move in the same
# transaction. The facts also hold the version before the update for the
# minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when: valkey_packages_state == 'latest' or __valkey_minimum | length > 0
  tags:
    - always

- name: Install | Set Valkey package list
  ansible.builtin.set_fact:
    __valkey_install_packages: >-
      {{ (__valkey_packages
          + ((ansible_facts['packages'] | list
              | select('match', __valkey_update_pattern) | list)
             if (valkey_packages_state == 'latest'
                 and ansible_facts['os_family'] in ['RedHat', 'Debian'])
             else []))
         | unique | list }}

# Full version of the server package as the package manager writes it:
# [epoch:]version[-release]. package_facts reports a missing rpm epoch as
# None, which counts as no epoch like 0.
- name: Install | Record the installed Valkey version
  ansible.builtin.set_fact:
    __valkey_version_package: '{{ __valkey_packages | first }}'
    __valkey_version_before: '{{ __valkey_installed_version }}'
  vars:
    __valkey_pkg: "{{ ansible_facts['packages'][__valkey_packages | first] | default([{}]) | first }}"
    __valkey_installed_version: >-
      {{ ((__valkey_pkg.epoch ~ ':')
          if ((__valkey_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__valkey_pkg.version | default(''))
         ~ (('-' ~ __valkey_pkg.release) if (__valkey_pkg.release | default('', true)) else '') }}
  when: valkey_packages_state == 'latest' or __valkey_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install, resolved like the install (dnf honors module streams, excludes
# and versionlock, apt honors pinning). Arch Linux installs a missing
# package from the sync database and otherwise keeps the installed version,
# which the system upgrade updates. The queries change nothing, so they
# also run under --check. dnf fetches expired metadata for the query.
- name: Install | Query the version the update would install (RedHat)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - repoquery
      - --latest-limit=1
      - '--queryformat=%{epoch}:%{version}-%{release}'
      - '{{ __valkey_version_package }}'
  register: __valkey_candidate_dnf
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - __valkey_minimum | length > 0
    - ansible_facts['os_family'] == 'RedHat'
    - valkey_packages_state == 'latest' or __valkey_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __valkey_version_package }}'
  environment:
    LC_ALL: C
  register: __valkey_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __valkey_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - valkey_packages_state == 'latest' or __valkey_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the install would add (Archlinux)
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --info
      - '{{ __valkey_version_package }}'
  environment:
    LC_ALL: C
  register: __valkey_candidate_pacman
  changed_when: false
  # Exit status 1: the sync database has no such package. The version stays
  # empty and the minimum check reports that nothing would be installed.
  failed_when: __valkey_candidate_pacman.rc not in [0, 1]
  check_mode: false
  when:
    - __valkey_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __valkey_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __valkey_check_stage: 'pre'
    __valkey_check_installed: '{{ __valkey_version_before }}'
    # epoch 0 is the default and left out, as in the installed version
    __valkey_check_candidate: >-
      {{ (((__valkey_candidate_dnf.stdout_lines | default([])) + [''])
          | first | regex_replace('^0:', ''))
         ~ (((__valkey_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', '')
         ~ (((__valkey_candidate_pacman.stdout | default('')) | regex_findall('(?m)^Version *: *([^ ]+)$')) + [''])
           | first }}
  when: __valkey_minimum | length > 0
  tags:
    - always

- name: Install | Valkey packages
  ansible.builtin.package:
    name: '{{ __valkey_install_packages }}'
    state: "{{ (ansible_facts['os_family'] == 'Archlinux') | ternary('present', valkey_packages_state) }}"
  register: __valkey_packages_result
  retries: 3
  delay: 5

# Check mode installs nothing: on a new host the service user, the
# configuration directory and the service unit do not exist yet, and the
# tasks that need them are skipped.
- name: Install | Record a pending first install in check mode
  ansible.builtin.set_fact:
    __valkey_check_mode_install: '{{ ansible_check_mode and __valkey_packages_result is changed }}'

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - not ansible_check_mode
    - __valkey_minimum | length > 0
      or (valkey_packages_state == 'latest' and (__valkey_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated Valkey version
  ansible.builtin.set_fact:
    __valkey_version_after: >-
      {{ ((__valkey_pkg.epoch ~ ':')
          if ((__valkey_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__valkey_pkg.version | default(''))
         ~ (('-' ~ __valkey_pkg.release) if (__valkey_pkg.release | default('', true)) else '') }}
  vars:
    __valkey_pkg: "{{ ansible_facts['packages'][__valkey_version_package] | default([{}]) | first }}"
  when:
    - not ansible_check_mode
    - __valkey_minimum | length > 0
      or (valkey_packages_state == 'latest' and (__valkey_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the Valkey version change
  ansible.builtin.debug:
    msg: >-
      {{ __valkey_version_package }} {{ __valkey_version_before | default('none', true) }}
      -> {{ __valkey_version_after }}
  when:
    - not ansible_check_mode
    - valkey_packages_state == 'latest'
    - (__valkey_packages_result | default({})) is changed
    - __valkey_version_before != __valkey_version_after

#
# Restart After Update
#
# A running server keeps executing the old binary after an update. The
# packages usually restart it themselves (dpkg maintainer scripts, rpm
# scriptlets), but policy-rc.d or the systemd update helper can prevent
# that, and pacman never restarts it. With 'latest' the role restarts the
# server while it still executes a replaced binary, so an update never
# restarts it twice. The check does not depend on changed packages: a run
# that updated the packages but could not restart the server restarts it
# on the next run, and on Arch Linux the role run together with the system
# upgrade restarts a server whose binary the upgrade replaced.
#
# valkey-server has no configuration test (no option like nginx -t), so
# the restart cannot be preceded by one. A configuration the new binary
# rejects fails the restart and the service; the run fails with it.
#

# systemd knows the main PID on every platform, independent of the PID file.
# A unit that is not installed (check mode on a new host) reports 0.
- name: Install | Read the main PID of the running server
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - '--property=MainPID'
      - '--value'
      - '{{ __valkey_service_name }}'
  register: __valkey_main_pid
  changed_when: false
  check_mode: false
  when: valkey_packages_state == 'latest'

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of the running server
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __valkey_main_pid.stdout | default("0") | trim }}/exe'
  register: __valkey_server_exe
  changed_when: false
  # Exit status 1: the server exited between the two reads; there is no
  # running binary to replace then.
  failed_when: __valkey_server_exe.rc not in [0, 1]
  check_mode: false
  when:
    - valkey_packages_state == 'latest'
    - (__valkey_main_pid.stdout | default('0') | trim) not in ['', '0']

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __valkey_restart_binary: >-
      {{ ((__valkey_main_pid.stdout | default('0') | trim) not in ['', '0'])
         and valkey_service_enabled | bool
         and (((__valkey_server_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and (__valkey_packages_result | default({})) is changed)) }}
  when: valkey_packages_state == 'latest'

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running.
- name: Install | Restart Valkey for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __valkey_service_name }}'
    state: restarted
  when:
    - valkey_packages_state == 'latest'
    - __valkey_restart_binary | bool

# Post-check: the transaction can install something else than the queried
# candidate (dependencies, excludes), so the installed version is checked
# again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __valkey_check_stage: 'post'
    __valkey_check_installed: '{{ __valkey_version_after }}'
    __valkey_check_candidate: ''
  when:
    - __valkey_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always
