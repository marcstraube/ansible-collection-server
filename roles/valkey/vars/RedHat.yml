---
__valkey_packages:
  - valkey

__valkey_service_name: 'valkey'

# valkey.conf and users.conf: ownership and mode the package's tmpfiles.d
# entry restores on every boot (Z /etc/valkey ~0750 valkey root, recursive,
# so it covers users.conf too): it turns 0600 into 0640, so 0600 would
# change the files and restart the service on every run after a reboot. The
# group is root, so the group read adds no reader.
__valkey_config_owner: 'valkey'
__valkey_config_group: 'root'
__valkey_config_mode: '0640'

# Files of the packaged configuration and logrotate configuration
__valkey_pid_file: '/run/valkey/valkey.pid'
__valkey_log_file: '/var/log/valkey/valkey.log'
