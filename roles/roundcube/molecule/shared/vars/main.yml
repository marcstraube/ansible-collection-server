---
# Test data shared by prepare, converge, side_effect and verify of the
# postgresql, mariadb and update scenarios. __molecule_db_type and the
# database hosts of Dovecot and the password plugin come from the scenario
# (127.0.0.1 for PostgreSQL, the socket through 'localhost' for MariaDB).

# The nginx user per platform, which connects to the socket of the
# roundcube PHP-FPM pool
__molecule_web_user:
  Archlinux: 'http'
  Debian: 'www-data'
  RedHat: 'nginx'

# Socket of the dedicated PHP-FPM pool, the same on every platform
__molecule_fpm_socket: '/run/roundcube-fpm.sock'

# Test certificate of Dovecot; Roundcube verifies it with the file itself
__molecule_tls_cert: '/etc/ssl/certs/molecule-mail.pem'
__molecule_tls_key: '/etc/ssl/private/molecule-mail.key'

#
# PostfixAdmin
#

postfixadmin_enabled: true
postfixadmin_db_type: '{{ __molecule_db_type }}'
postfixadmin_db_password: 'pfa-db-Password-42'
postfixadmin_db_create: true
postfixadmin_db_readers:
  - name: 'dovecot'
    password: '{{ dovecot_db_password }}'
    tables: ['mailbox', 'domain']
# The test domains under .example have no DNS records, which PostfixAdmin
# checks for every domain and address by default
postfixadmin_extra_config:
  emailcheck_resolve_domain: 'NO'
postfixadmin_domains:
  - domain: 'example.com'
# initial: the password plugin changes the password of alice@ in verify; a
# later prepare must not reset it
postfixadmin_mailboxes:
  - username: 'alice@example.com'
    password: 'alice-Secret-42'
    name: 'Alice'
    mode: 'initial'
  - username: 'bob@example.com'
    password: 'bob-Secret-42'
    name: 'Bob'
    mode: 'initial'

# User of the password plugin with UPDATE on mailbox.password only
# (prepare grants it, as the README describes)
__molecule_password_db_user: 'roundcube_password'
__molecule_password_db_password: 'rc-Password-Changer-42'

#
# Dovecot
#

dovecot_enabled: true
dovecot_db_type: '{{ __molecule_db_type }}'
dovecot_db_password: 'dovecot-Reader-42'
dovecot_tls_cert_file: '{{ __molecule_tls_cert }}'
dovecot_tls_key_file: '{{ __molecule_tls_key }}'
dovecot_managesieve_enabled: true
# No Postfix in these scenarios: no local LMTP and auth listeners
dovecot_postfix_local: false

#
# Roundcube
#

roundcube_enabled: true
roundcube_db_type: '{{ __molecule_db_type }}'
roundcube_db_password: 'rc-db-Password-42'
roundcube_db_create: true
roundcube_des_key: 'molecule-des-key-0123456789abcdef'
roundcube_php_fpm_user: 'roundcube'
roundcube_php_fpm_group: 'roundcube'
roundcube_product_name: 'Molecule Webmail'
roundcube_username_domain: 'example.com'
roundcube_tls_ca_file: '{{ __molecule_tls_cert }}'
# The password plugin is off by default; the scenarios enable it
roundcube_plugins: ['managesieve', 'password', 'acl', 'markasjunk']
roundcube_password_db_type: '{{ __molecule_db_type }}'
roundcube_password_db_user: '{{ __molecule_password_db_user }}'
roundcube_password_db_password: '{{ __molecule_password_db_password }}'
roundcube_extra_config:
  support_url: 'https://www.example.com/support'

#
# Web Server
#

nginx_enabled: true
nginx_sites:
  - name: 'roundcube'
    server_names:
      - 'localhost'
      - 'webmail.example.com'
    type: 'custom'
    root: '/var/www/roundcube/current/public_html'
    index: 'index.php'
    client_max_body_size: '25m'
    locations:
      - path: '/'
        config: |
          try_files $uri $uri/ /index.php$is_args$args;
      - path: '~ \.php(/|$)'
        config: |
          fastcgi_split_path_info ^(.+?\.php)(/.*)$;
          try_files $fastcgi_script_name =404;
          set $path_info $fastcgi_path_info;
          fastcgi_pass unix:{{ __molecule_fpm_socket }};
          fastcgi_index index.php;
          include fastcgi_params;
          # The release behind 'current' of this request
          fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
          fastcgi_param DOCUMENT_ROOT $realpath_root;
          fastcgi_param PATH_INFO $path_info;
