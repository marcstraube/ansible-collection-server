---
# A changed unit or schedule needs the daemon reload and a restart of the
# timer to apply. A check run reports the changed unit files; on a fresh
# host the timer it would restart does not exist yet.
- name: Restart Roundcube maintenance timer
  ansible.builtin.systemd_service:
    name: '{{ __roundcube_maintenance_timer }}'
    state: restarted
    daemon_reload: true
  when:
    - roundcube_timer_enabled | bool
    - not __roundcube_check_mode | bool
