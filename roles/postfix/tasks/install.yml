---
# The Debian package asks for a configuration type; the role writes main.cf
# and master.cf itself, so the answer only matters until configure.yml
# runs. 'Internet Site' gives a base that starts.
- name: Install | Preseed Postfix debconf selections (Debian)
  ansible.builtin.debconf:
    name: postfix
    question: '{{ item.question }}'
    value: '{{ item.value }}'
    vtype: '{{ item.vtype }}'
  loop:
    - question: 'postfix/main_mailer_type'
      value: 'Internet Site'
      vtype: 'select'
    - question: 'postfix/mailname'
      value: '{{ postfix_myhostname }}'
      vtype: 'string'
  loop_control:
    label: '{{ item.question }}'
  when: ansible_facts['os_family'] == 'Debian'

# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - postfix_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - postfix_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  retries: 3
  delay: 5
  when:
    - postfix_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed Postfix package, not only the
# configured ones: the lookup modules (postfix-lmdb, -pgsql, -mysql) pin
# the exact version of the main package and must move in the same
# transaction. The facts also hold the version before the update for the
# minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when: postfix_packages_state == 'latest' or __postfix_minimum | length > 0
  tags:
    - always

- name: Install | Set Postfix package list
  ansible.builtin.set_fact:
    __postfix_install_packages: >-
      {{ (__postfix_packages + [__postfix_db_packages[postfix_db_type]]
          + ((ansible_facts['packages'] | list
              | select('match', __postfix_update_pattern) | list)
             if (postfix_packages_state == 'latest'
                 and ansible_facts['os_family'] in ['RedHat', 'Debian'])
             else []))
         | unique | list }}

# Full version of the main package as the package manager writes it:
# [epoch:]version[-release]. package_facts reports a missing rpm epoch as
# None, which counts as no epoch like 0.
- name: Install | Record the installed Postfix version
  ansible.builtin.set_fact:
    __postfix_version_package: '{{ __postfix_packages | first }}'
    __postfix_version_before: '{{ __postfix_installed_version }}'
  vars:
    __postfix_pkg: "{{ ansible_facts['packages'][__postfix_packages | first] | default([{}]) | first }}"
    __postfix_installed_version: >-
      {{ ((__postfix_pkg.epoch ~ ':')
          if ((__postfix_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__postfix_pkg.version | default(''))
         ~ (('-' ~ __postfix_pkg.release) if (__postfix_pkg.release | default('', true)) else '') }}
  when: postfix_packages_state == 'latest' or __postfix_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install, resolved like the install (dnf honors module streams, excludes
# and versionlock, apt honors pinning). Arch Linux installs a missing
# package from the sync database and otherwise keeps the installed version,
# which the system upgrade updates. The queries change nothing, so they
# also run under --check. dnf fetches expired metadata for the query.
- name: Install | Query the version the update would install (RedHat)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - repoquery
      - --latest-limit=1
      - '--queryformat=%{epoch}:%{version}-%{release}'
      - '{{ __postfix_version_package }}'
  register: __postfix_candidate_dnf
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  when:
    - __postfix_minimum | length > 0
    - ansible_facts['os_family'] == 'RedHat'
    - postfix_packages_state == 'latest' or __postfix_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __postfix_version_package }}'
  environment:
    LC_ALL: C
  register: __postfix_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __postfix_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - postfix_packages_state == 'latest' or __postfix_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the install would add (Archlinux)
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --info
      - '{{ __postfix_version_package }}'
  environment:
    LC_ALL: C
  register: __postfix_candidate_pacman
  changed_when: false
  # Exit status 1: the sync database has no such package. The version stays
  # empty and the minimum check reports that nothing would be installed.
  failed_when: __postfix_candidate_pacman.rc not in [0, 1]
  check_mode: false
  when:
    - __postfix_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __postfix_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __postfix_check_stage: 'pre'
    __postfix_check_installed: '{{ __postfix_version_before }}'
    # epoch 0 is the default and left out, as in the installed version
    __postfix_check_candidate: >-
      {{ (((__postfix_candidate_dnf.stdout_lines | default([])) + [''])
          | first | regex_replace('^0:', ''))
         ~ (((__postfix_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', '')
         ~ (((__postfix_candidate_pacman.stdout | default('')) | regex_findall('(?m)^Version *: *([^ ]+)$')) + [''])
           | first }}
  when: __postfix_minimum | length > 0
  tags:
    - always

# Debian: the package starts Postfix right away with the packaged
# configuration ('Internet Site', port 25 on every interface). On the first
# install a temporary policy-rc.d keeps the package from starting it;
# service.yml starts it with the role's configuration. A policy-rc.d
# without the role's marker is the host's own policy (or the one of the
# dovecot role, with its own marker) and stays untouched.
#
# A first run interrupted during the install (lost connection, Ctrl-C)
# never reaches the removal in always: below. The policy-rc.d it left
# behind carries the marker and is removed on every run before the install,
# also when the package is installed by now.
- name: Install | Check for a policy-rc.d left behind by the role (Debian)
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --fixed-strings
      - '{{ __postfix_policy_rc_marker }}'
      - '{{ __postfix_policy_rc_file }}'
  register: __postfix_policy_rc_leftover
  changed_when: false
  # Exit status 1: a policy-rc.d without the marker; 2: none
  failed_when: __postfix_policy_rc_leftover.rc not in [0, 1, 2]
  check_mode: false
  when: ansible_facts['os_family'] == 'Debian'

# Check mode reports the removal
- name: Install | Remove the policy-rc.d left behind by the role (Debian)
  ansible.builtin.file:
    path: '{{ __postfix_policy_rc_file }}'
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'
    - (__postfix_policy_rc_leftover.rc | default(1)) == 0

- name: Install | Check whether the Postfix package is installed (Debian)
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${db:Status-Status}
      - '{{ __postfix_packages | first }}'
  register: __postfix_package_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Install | Check for a policy-rc.d (Debian)
  ansible.builtin.stat:
    path: '{{ __postfix_policy_rc_file }}'
  register: __postfix_policy_rc_stat
  when:
    - ansible_facts['os_family'] == 'Debian'
    - __postfix_package_status.stdout | default('') != 'installed'

- name: Install | Install the Postfix packages
  block:
    # Denies Postfix only; other packages of the transaction start as
    # without a policy-rc.d. The postinst of postfix restarts it through
    # deb-systemd-invoke with the unit name (invoke-rc.d with the init
    # script name on a host without systemd).
    - name: Install | Keep the packages from starting Postfix (Debian)
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          # {{ __postfix_policy_rc_marker }}: keeps the first
          # install of Postfix from starting it, removed right after
          case "$1" in
            postfix | postfix.service) exit 101 ;;
          esac
          exit 0
        dest: '{{ __postfix_policy_rc_file }}'
        owner: root
        group: root
        mode: '0755'
      register: __postfix_policy_rc_result
      when:
        - not ansible_check_mode
        - ansible_facts['os_family'] == 'Debian'
        - __postfix_package_status.stdout | default('') != 'installed'
        - not (__postfix_policy_rc_stat.stat.exists | default(true))

    - name: Install | Postfix packages
      ansible.builtin.package:
        name: '{{ __postfix_install_packages }}'
        state: "{{ (ansible_facts['os_family'] == 'Archlinux') | ternary('present', postfix_packages_state) }}"
      register: __postfix_packages_result
      retries: 3
      delay: 5

  always:
    - name: Install | Allow the packages to start services again (Debian)
      ansible.builtin.file:
        path: '{{ __postfix_policy_rc_file }}'
        state: absent
      when: __postfix_policy_rc_result is not skipped

# Check mode installs nothing: on a new host postconf, postmap and the
# service unit do not exist yet, and the tasks that need them are skipped.
- name: Install | Record a pending first install in check mode
  ansible.builtin.set_fact:
    __postfix_check_mode_install: '{{ ansible_check_mode and __postfix_packages_result is changed }}'

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - not ansible_check_mode
    - __postfix_minimum | length > 0
      or (postfix_packages_state == 'latest' and (__postfix_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated Postfix version
  ansible.builtin.set_fact:
    __postfix_version_after: >-
      {{ ((__postfix_pkg.epoch ~ ':')
          if ((__postfix_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__postfix_pkg.version | default(''))
         ~ (('-' ~ __postfix_pkg.release) if (__postfix_pkg.release | default('', true)) else '') }}
  vars:
    __postfix_pkg: "{{ ansible_facts['packages'][__postfix_version_package] | default([{}]) | first }}"
  when:
    - not ansible_check_mode
    - __postfix_minimum | length > 0
      or (postfix_packages_state == 'latest' and (__postfix_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the Postfix version change
  ansible.builtin.debug:
    msg: >-
      {{ __postfix_version_package }} {{ __postfix_version_before | default('none', true) }}
      -> {{ __postfix_version_after }}
  when:
    - not ansible_check_mode
    - postfix_packages_state == 'latest'
    - (__postfix_packages_result | default({})) is changed
    - __postfix_version_before != __postfix_version_after

# failed_when: false — the services of other MTAs may not be installed
- name: Install | Disable conflicting services
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: false
    state: stopped
  loop: '{{ __postfix_conflicting_services }}'
  failed_when: false

# EL keeps sendmail in the 'mta' alternatives group; another MTA may hold it
- name: Install | Set Postfix as the system MTA
  community.general.alternatives:
    name: mta
    path: '{{ __postfix_alternatives_path }}'
  when:
    - __postfix_alternatives_path | length > 0
    - not __postfix_check_mode_install | default(false) | bool

#
# Restart After Update
#
# A running Postfix keeps executing the old binaries after an update. The
# packages usually restart it themselves (dpkg maintainer scripts, rpm
# scriptlets), but policy-rc.d or the systemd update helper can prevent
# that, and pacman never restarts it. With 'latest' the role restarts
# Postfix while its master process still executes a replaced binary, so an
# update never restarts it twice. The check does not depend on changed
# packages: a run that updated the packages but could not restart Postfix
# restarts it on the next run, and on Arch Linux the role run together with
# the system upgrade restarts a Postfix whose binary the upgrade replaced.
#

# The master process writes its PID into the queue directory on every
# platform, so the PID file works the same way on all of them.
- name: Install | Read the PID of the master process
  ansible.builtin.slurp:
    src: '{{ __postfix_pid_file }}'
  register: __postfix_master_pid
  failed_when: false
  when: postfix_packages_state == 'latest'

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of the master process
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __postfix_master_pid_value }}/exe'
  register: __postfix_master_exe
  changed_when: false
  # Exit status 1: a stale PID file or a master that exited between the two
  # reads; there is no running binary to replace then.
  failed_when: __postfix_master_exe.rc not in [0, 1]
  check_mode: false
  vars:
    __postfix_master_pid_value: '{{ __postfix_master_pid.content | default("") | b64decode | trim }}'
  when:
    - postfix_packages_state == 'latest'
    - __postfix_master_pid_value is match('^[0-9]+$')

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __postfix_restart_binary: >-
      {{ (__postfix_master_exe.rc | default(1)) == 0
         and postfix_service_enabled | bool
         and (((__postfix_master_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and (__postfix_packages_result | default({})) is changed)) }}
  when: postfix_packages_state == 'latest'

# The new binaries check the active configuration first: when they reject
# it, the old master keeps serving and the run fails with the output.
- name: Install | Check the configuration with the new Postfix
  ansible.builtin.command:
    argv:
      - postfix
      - check
  register: __postfix_update_check
  changed_when: false
  failed_when: >-
    __postfix_update_check.rc != 0
    or __postfix_update_check.stderr_lines | default([])
       | reject('match', __postfix_chroot_differ_regex)
       | select('search', '(warning|fatal|error):') | list | length > 0
  check_mode: false
  when:
    - not ansible_check_mode
    - postfix_packages_state == 'latest'
    - __postfix_restart_binary | default(false) | bool

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running.
- name: Install | Restart Postfix for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __postfix_service_name }}'
    state: restarted
  when:
    - postfix_packages_state == 'latest'
    - __postfix_restart_binary | default(false) | bool

# Post-check: the transaction can install something else than the queried
# candidate (dependencies, excludes), so the installed version is checked
# again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __postfix_check_stage: 'post'
    __postfix_check_installed: '{{ __postfix_version_after }}'
    __postfix_check_candidate: ''
  when:
    - __postfix_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always
