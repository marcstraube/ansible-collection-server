---
# Compares the Postfix main package with the minimum version, using the
# distribution's own version rules (epochs, Debian revisions such as
# +deb13u1, EL release strings). Passes when the installed version or the
# version the update would install meets the minimum.
#
# Input:
#   __postfix_check_stage      'pre' (before the package task) or 'post'
#   __postfix_check_installed  installed version, '' when not installed
#   __postfix_check_candidate  version the update would install, '' if none
#
# A minimum without an epoch takes the epoch of the compared version: dpkg,
# rpm and vercmp treat a missing epoch as 0, and the EL package carries
# epoch 2, so 3.8.5 would otherwise count as older than 2:3.5.25.

- name: Version Check | Compare with the minimum version
  ansible.builtin.command:
    argv: '{{ __postfix_vercmp_argv[ansible_facts["os_family"]] }}'
  vars:
    __postfix_check_minimum: >-
      {{ (item.split(':') | first ~ ':' ~ __postfix_minimum)
         if (':' not in (__postfix_minimum | string) and item is match('^[0-9]+:'))
         else (__postfix_minimum | string) }}
    # dpkg answers with its exit code, rpm and vercmp print -1, 0 or 1
    __postfix_vercmp_argv:
      Debian: ['dpkg', '--compare-versions', '{{ item }}', 'ge', '{{ __postfix_check_minimum }}']
      RedHat: ['rpm', '--eval', '%{lua: print(rpm.vercmp("{{ item }}", "{{ __postfix_check_minimum }}"))}']
      Archlinux: ['vercmp', '{{ item }}', '{{ __postfix_check_minimum }}']
  loop: '{{ [__postfix_check_installed, __postfix_check_candidate] | select | unique | list }}'
  register: __postfix_check_result
  changed_when: false
  failed_when: __postfix_check_result.rc not in [0, 1]
  check_mode: false

- name: Version Check | Assert the minimum version
  ansible.builtin.assert:
    that:
      - __postfix_check_met | length > 0
    fail_msg: >-
      postfix_packages_minimum requires {{ __postfix_minimum }};
      installed: {{ __postfix_check_installed | default('none', true) }}{{
        ('; the update would install: ' ~ (__postfix_check_candidate | default('none', true)))
        if __postfix_check_stage == 'pre' else '' }}.
      The repository does not carry the required version yet{{
        ', nothing was changed' if __postfix_check_stage == 'pre' else '' }}.
    success_msg: >-
      {{ __postfix_version_package }} {{ (__postfix_check_met + ['']) | first }} meets the
      minimum {{ __postfix_minimum }}
  vars:
    __postfix_check_met: >-
      {{ (__postfix_check_result.results | default([]) | selectattr('rc', 'eq', 0) | map(attribute='item') | list)
         if ansible_facts['os_family'] == 'Debian'
         else (__postfix_check_result.results | default([]) | selectattr('stdout', 'in', ['0', '1'])
               | map(attribute='item') | list) }}
