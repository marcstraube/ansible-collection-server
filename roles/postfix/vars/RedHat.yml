---
# Compatibility level of the Postfix release of EL 10 (postfix 3.8); the
# default of postfix_compatibility_level
__postfix_compatibility_level: '3.8'

# Directories and programs as compiled into the package (postconf -d)
__postfix_command_directory: '/usr/sbin'
__postfix_daemon_directory: '/usr/libexec/postfix'
__postfix_shlib_directory: '/usr/lib64/postfix'
__postfix_sendmail_path: '/usr/sbin/sendmail.postfix'
__postfix_newaliases_path: '/usr/bin/newaliases.postfix'
__postfix_mailq_path: '/usr/bin/mailq.postfix'
__postfix_sample_directory: '/usr/share/doc/postfix/samples'
__postfix_readme_directory: '/usr/share/doc/postfix/README_FILES'
__postfix_html_directory: 'no'

# Alias file of the package (setup)
__postfix_alias_file: '/etc/aliases'

# CA bundle of the system trust store (ca-certificates)
__postfix_ca_bundle: '/etc/pki/tls/certs/ca-bundle.crt'

# Chroot column of the shipped master.cf: no service is chrooted
__postfix_chroot: 'n'

# sendmail of Postfix in the 'mta' alternatives group
__postfix_alternatives_path: '/usr/sbin/sendmail.postfix'

# Other MTAs that would hold port 25
__postfix_conflicting_services:
  - 'sendmail'
  - 'exim'

# Socket of a local MariaDB server ('localhost' with postfix_db_type mariadb)
__postfix_mariadb_socket: '/var/lib/mysql/mysql.sock'

# Postfix 3.6 and later accept protocol ranges (">=TLSv1.2") besides the
# exclusion syntax
__postfix_tls_protocol_ranges: true
