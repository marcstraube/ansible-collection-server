---
# MariaDB scenario: the playbooks of the postgresql scenario with the
# mariadb role of this collection; Postfix and Dovecot connect through the
# socket of the platform ('localhost'), verify also runs the Postfix
# lookups over TCP with TLS (db.example.com, certificate verified). The
# Received header of submission stays (postfix_submission_hide_client
# off), the postgresql scenario removes it.
driver:
  name: podman
platforms:
  - name: postfix-mariadb-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15421:53/udp'
  - name: postfix-mariadb-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15422:53/udp'
  - name: postfix-mariadb-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15423:53/udp'
  - name: postfix-mariadb-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
    published_ports:
      - '127.0.0.1:15424:53/udp'
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: ../shared/side_effect.yml
    verify: ../shared/verify.yml
  inventory:
    group_vars:
      all:
        # Postfix
        postfix_enabled: true
        postfix_db_type: 'mariadb'
        postfix_db_password: 'postfix-Reader-42'
        postfix_myhostname: 'mail.example.com'
        postfix_mydomain: 'example.com'
        postfix_tls_cert_file: '/etc/molecule-tls/mail.pem'
        postfix_tls_key_file: '/etc/molecule-tls/mail.key'
        # No milter in the instance: verify points it to a closed port
        postfix_milters: []
        postfix_policy_services:
          - 'inet:127.0.0.1:12340'
        postfix_sender_permissions:
          'support@example.com':
            - 'alice@example.com'
        # postmaster replaces the entry of the package alias file
        postfix_aliases:
          root: 'alice@example.com'
          postmaster: 'bob@example.com'
        postfix_submission_hide_client: false
        # Mail for other domains (relayed for mynetworks, Sieve) stays in
        # the queue, where verify finds it
        postfix_extra_main_cf:
          defer_transports: 'smtp'
        postfix_dns_domains:
          - 'example.com'
          - 'example.org'
          - 'missing.example.com'
        postfix_dns_addresses:
          - '192.0.2.20'
          - '2001:db8::20'
        postfix_dns_resolver: '127.0.0.1'
        postfix_dns_tlsa_enabled: true
        postfix_dns_resolver_port: '{{ molecule_dns_port }}'
        # PostfixAdmin with the read-only users of Postfix and Dovecot; the
        # accounts come from shared/vars/accounts.yml
        postfixadmin_enabled: true
        postfixadmin_db_type: 'mariadb'
        postfixadmin_db_password: 'test-db-Password-42'
        postfixadmin_db_create: true
        postfixadmin_db_readers:
          - name: 'postfix'
            password: 'postfix-Reader-42'
          # Lookups over TCP with TLS (verify), TLS required by prepare
          - name: 'postfix'
            password: 'postfix-Reader-42'
            host: '127.0.0.1'
          - name: 'dovecot'
            password: 'dovecot-Reader-42'
        # Dovecot with the defaults of the mail stack contract: unix
        # listeners in the Postfix queue directory (dovecot_postfix_local)
        dovecot_enabled: true
        dovecot_db_type: 'mariadb'
        dovecot_db_password: 'dovecot-Reader-42'
        dovecot_tls_cert_file: '/etc/molecule-tls/mail.pem'
        dovecot_tls_key_file: '/etc/molecule-tls/mail.key'
        dovecot_quota_status_listen: '127.0.0.1:12340'
        # MariaDB on the instance, from the distribution packages
        mariadb_enabled: true
        mariadb_repo: 'distro'
        mariadb_version: '11.8'
        mariadb_arch_package: 'mariadb'
        # TLS for the lookups over TCP of verify (db.example.com)
        mariadb_ssl_enabled: true
        mariadb_ssl_cert_file: '/etc/molecule-tls/db.pem'
        mariadb_ssl_key_file: '/etc/molecule-tls/db.key'
    host_vars:
      postfix-mariadb-archlinux:
        ansible_python_interpreter: /usr/bin/python
        molecule_dns_port: 15421
      postfix-mariadb-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
        molecule_dns_port: 15422
      postfix-mariadb-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
        molecule_dns_port: 15423
      postfix-mariadb-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
        molecule_dns_port: 15424
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
