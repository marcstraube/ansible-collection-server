---
# Split scenario: Postfix in one container, PostgreSQL, PostfixAdmin and
# Dovecot in a second one on a podman network. Postfix reads the lookups
# over TCP with TLS (verify-full against the test CA), delivers over the
# LMTP TCP listener of Dovecot and authenticates submission through its
# SASL TCP listener. Dovecot runs without a local Postfix
# (dovecot_postfix_local false) and sends Sieve redirects and vacation
# replies to port 25 of the Postfix container, which trusts its address
# (postfix_mynetworks). The Postfix container has no policy-rc.d of the
# image, like a Debian host, and the role installs Postfix there for the
# first time. Both containers run in one job: the scenario needs both
# platforms at once.
driver:
  name: podman
platforms:
  - name: postfix-split-mail
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: postfix-split
    groups:
      - mail
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postfix-split-backend
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: postfix-split
    groups:
      - backend
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        __molecule_backend: 'postfix-split-backend'
        __molecule_mail: 'postfix-split-mail'
      mail:
        postfix_enabled: true
        postfix_db_type: 'postgresql'
        postfix_db_host: 'postfix-split-backend'
        postfix_db_password: 'postfix-Reader-42'
        postfix_db_tls: true
        postfix_db_tls_ca_file: '/etc/molecule-tls/ca.pem'
        postfix_lmtp_address: 'inet:postfix-split-backend:24'
        postfix_sasl_path: 'inet:postfix-split-backend:12345'
        # The Dovecot container may relay through port 25 (Sieve); the
        # facts of both hosts are gathered by the first play of converge
        # and verify
        postfix_mynetworks:
          - '127.0.0.0/8'
          - '[::1]/128'
          - "{{ hostvars['postfix-split-backend']['ansible_facts']['default_ipv4']['address'] }}/32"
        postfix_myhostname: 'mail.example.com'
        postfix_mydomain: 'example.com'
        postfix_tls_cert_file: '/etc/molecule-tls/mail.pem'
        postfix_tls_key_file: '/etc/molecule-tls/mail.key'
        postfix_milters: []
        # Mail for other domains stays in the queue, where verify finds it
        postfix_extra_main_cf:
          defer_transports: 'smtp'
        # The DNS report is tested in the postgresql and mariadb scenarios
        postfix_dns_check_enabled: false
      backend:
        # PostgreSQL for the other container: TLS only for the Postfix user
        postgresql_enabled: true
        postgresql_listen_addresses: '*'
        postgresql_firewalld_enabled: false
        postgresql_shared_buffers: '64MB'
        postgresql_effective_cache_size: '128MB'
        postgresql_lc_messages: 'en_US.UTF-8'
        postgresql_lc_monetary: 'en_US.UTF-8'
        postgresql_lc_numeric: 'en_US.UTF-8'
        postgresql_lc_time: 'en_US.UTF-8'
        postgresql_ssl_enabled: true
        postgresql_ssl_cert_file: '/etc/molecule-tls/backend.pem'
        postgresql_ssl_key_file: '/etc/molecule-tls/backend.key'
        postgresql_hba_additional:
          - type: 'hostssl'
            database: 'postfixadmin'
            user: 'postfix'
            address: '0.0.0.0/0'
            method: 'scram-sha-256'
          - type: 'hostssl'
            database: 'postfixadmin'
            user: 'postfix'
            address: '::/0'
            method: 'scram-sha-256'
        # PostfixAdmin with the database on this host and the read-only
        # users of Postfix and Dovecot
        postfixadmin_enabled: true
        postfixadmin_db_type: 'postgresql'
        postfixadmin_db_password: 'test-db-Password-42'
        postfixadmin_db_create: true
        postfixadmin_db_readers:
          - name: 'postfix'
            password: 'postfix-Reader-42'
          - name: 'dovecot'
            password: 'dovecot-Reader-42'
        # Dovecot for a Postfix on another host: TCP listeners on the
        # address of the container, Sieve mail to port 25 of Postfix with
        # STARTTLS (the test CA is in the trust store of this container)
        dovecot_enabled: true
        dovecot_db_type: 'postgresql'
        dovecot_db_password: 'dovecot-Reader-42'
        dovecot_tls_cert_file: '/etc/molecule-tls/backend.pem'
        dovecot_tls_key_file: '/etc/molecule-tls/backend.key'
        dovecot_postfix_local: false
        dovecot_lmtp_listen: "{{ ansible_facts['default_ipv4']['address'] }}:24"
        dovecot_auth_listen: "{{ ansible_facts['default_ipv4']['address'] }}:12345"
        dovecot_submission_host: 'postfix-split-mail:25'
        dovecot_submission_ssl: 'starttls'
        # Redirect and vacation reply of verify, chosen by the subject
        dovecot_sieve_before:
          - name: 'molecule-outgoing'
            content: |
              require ["vacation"];
              if header :contains "subject" "redirect-test" {
                redirect "dave@example.net";
                stop;
              }
              if header :contains "subject" "vacation-test" {
                vacation :days 1 :subject "Away" "Out of office (molecule).";
              }
    host_vars:
      postfix-split-mail:
        ansible_python_interpreter: /usr/bin/python3
      postfix-split-backend:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
