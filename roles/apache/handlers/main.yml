---
- name: Reload Apache systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  failed_when: false
  when: apache_enabled | bool

- name: Restart Apache
  ansible.builtin.systemd_service:
    name: '{{ __apache_service_name }}'
    state: restarted
  when: apache_service_enabled | bool

# Also subscribes to the 'Reload cert services' topic of the certbot role and
# marcstraube.common.pki, so a new or renewed certificate takes effect in the
# same run.
- name: Reload Apache
  ansible.builtin.systemd_service:
    name: '{{ __apache_service_name }}'
    state: reloaded
  listen: Reload cert services
  when: apache_service_enabled | bool
