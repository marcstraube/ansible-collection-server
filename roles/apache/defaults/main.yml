---
#
# Role Control
#

# Enable the apache role
apache_enabled: false

# Enable and start the apache service
apache_service_enabled: true

#
# Modules
#

# The role loads the modules its own configuration needs: a small base set
# plus the module of every enabled feature (SSL, security headers,
# compression, caching, ACME, HTTP/2, server-status, HTTPS redirects,
# PHP-FPM, reverse proxies). Switching a feature off drops its module.
#
# Additional modules an application needs, e.g. rewrite for .htaccess rules,
# auth_basic + authn_file + authz_user for Basic Auth, access_compat for
# Apache 2.2 syntax (Order/Allow/Deny), autoindex for directory listings.
# Names without the mod_ prefix.
apache_modules_enabled: []

# Modules to keep out even if a feature or apache_modules_enabled lists them.
# On Debian, modules the apache2 package enables but nothing needs are
# disabled automatically.
apache_modules_disabled: []

# Same as apache_modules_enabled; kept for existing inventories.
apache_optional_modules: []

# /server-status (mod_status), reachable from localhost only
apache_status_enabled: false

#
# Server Configuration
#

# Server name (FQDN)
apache_server_name: '{{ ansible_facts["fqdn"] }}'

# Server admin email
apache_server_admin: 'webmaster@{{ ansible_facts["domain"] }}'

# Listen ports
apache_listen_ports:
  - 80

# Listen ports for HTTPS (requires SSL module)
apache_listen_ssl_ports:
  - 443

# Server tokens (reduce information disclosure): Full, Prod, Minimal, OS, Minor
apache_server_tokens: 'Prod'

# Server signature (disable in production)
apache_server_signature: 'Off'

# Trace/Track methods (disable for security)
apache_trace_enable: 'Off'

#
# MPM (Multi-Processing Module)
#

# MPM module: prefork, worker, event
# - prefork: Non-threaded, compatible with non-thread-safe modules
# - worker: Threaded, better performance
# - event: Like worker but handles keep-alive better (recommended)
apache_mpm_module: 'event'

# Event/Worker MPM Settings

# Event/worker tuning (maps to Apache MPM directives)
apache_mpm_start_servers: 3
apache_mpm_min_spare_threads: 25
apache_mpm_max_spare_threads: 75
apache_mpm_thread_limit: 64
apache_mpm_threads_per_child: 25
apache_mpm_max_request_workers: 400
apache_mpm_max_connections_per_child: 1000

# ServerLimit (event/worker): the number of scoreboard slots for server
# processes. Empty: no directive, Apache derives it from
# MaxRequestWorkers / ThreadsPerChild (16 with the defaults above). Processes
# that are shutting down keep their slot until their last connection ends
# (after a graceful reload, above MaxSpareThreads, at MaxConnectionsPerChild);
# set headroom above that ratio when Apache logs AH03490 "scoreboard is full".
# Apache reads ServerLimit only at startup, so a change restarts the service.
apache_mpm_server_limit: ''

# Prefork MPM Settings

# Prefork tuning (maps to Apache MPM directives)
apache_mpm_prefork_start_servers: 5
apache_mpm_prefork_min_spare_servers: 5
apache_mpm_prefork_max_spare_servers: 10
apache_mpm_prefork_max_request_workers: 256
apache_mpm_prefork_max_connections_per_child: 1000

#
# Performance and Timeouts
#

# Timeout for requests (seconds)
apache_timeout: 60

# Keep-alive settings
apache_keep_alive: 'On'
apache_keep_alive_timeout: 5
apache_max_keep_alive_requests: 100

# Request limits (DoS protection)
apache_limit_request_body: 10485760  # 10MB
apache_limit_request_fields: 100
apache_limit_request_field_size: 8190
apache_limit_request_line: 8190

#
# Security
#

# Disable directory indexing
apache_options_indexes: false

# Follow symbolic links (needed for most setups)
apache_options_follow_symlinks: true

# Allow .htaccess overrides: None, All, AuthConfig, Indexes, Limit, Options
apache_allow_override: 'None'

# Disable .ht* file access
apache_deny_htaccess: true

# Deny access to sensitive files and directories. Each pattern must match a
# whole path component: the role anchors the list as /(...)(/|$), so '\.git'
# blocks .git and everything below it, but not .github. Directory sections
# match file paths too, so this covers files such as .env as well.
apache_deny_sensitive_files: true
apache_deny_patterns:
  # Version control metadata
  - '\.git'
  - '\.svn'
  - '\.hg'
  # Environment files (.env, .env.local, .env.production, ...)
  - '\.env'
  - '\.env\.[^/]+'
  # OS clutter
  - '\.DS_Store'
  - 'Thumbs\.db'
  # Editor backups and swap files
  - '[^/]+~'
  - '[^/]+\.(bak|orig|swp|swo)'
  # Database dumps
  - '[^/]+\.sql(\.(gz|bz2|xz|zst))?'

#
# HTTP Security Headers
#

# Enable security headers globally
apache_security_headers_enabled: true

# Security headers to set
apache_security_headers:
  # Prevent clickjacking
  X-Frame-Options: 'SAMEORIGIN'

  # Prevent MIME type sniffing
  X-Content-Type-Options: 'nosniff'

  # Referrer policy
  Referrer-Policy: 'strict-origin-when-cross-origin'

  # Content Security Policy (SECURITY: Customize for your application!)
  # OWASP recommendation - Start strict, relax as needed
  Content-Security-Policy: >-
    default-src 'self'; script-src 'self'; style-src 'self';
    img-src 'self' data:; font-src 'self'; connect-src 'self';
    frame-ancestors 'self'

  # Permissions Policy (disable risky features by default)
  Permissions-Policy: "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

# HSTS (HTTP Strict Transport Security)

# Enable HSTS
apache_hsts_enabled: true
apache_hsts_max_age: 31536000  # 1 year
apache_hsts_include_subdomains: true
apache_hsts_preload: false  # Set to true only after testing

#
# SSL/TLS
#

# Enable SSL/TLS
apache_ssl_enabled: false

# SSL protocol versions
apache_ssl_protocol: 'all -SSLv3 -TLSv1 -TLSv1.1'

# SSL cipher suite (Mozilla Modern compatibility)
# yamllint disable-line rule:line-length
apache_ssl_cipher_suite: 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384'

# Honor server cipher order
apache_ssl_honor_cipher_order: true

# SSL session cache (path set per OS in vars/)
apache_ssl_session_cache: '{{ __apache_ssl_session_cache }}'
apache_ssl_session_cache_timeout: 300

# SSL compression (disable for BREACH attack mitigation)
apache_ssl_compression: false

# OCSP stapling
apache_ssl_use_stapling: true
apache_ssl_stapling_responder_timeout: 5
apache_ssl_stapling_return_responder_errors: false
apache_ssl_stapling_cache: '{{ __apache_ssl_stapling_cache }}'

#
# HTTP/2
#

# Enable HTTP/2 (requires mod_http2)
apache_http2_enabled: false
apache_http2_max_session_streams: 100
apache_http2_initial_window_size: 65535

#
# Compression (mod_deflate)
#

# Enable compression
apache_compression_enabled: true

# Compression level (1-9, higher = more CPU usage)
apache_compression_level: 6

# MIME types to compress
apache_compression_types:
  - 'text/html'
  - 'text/plain'
  - 'text/css'
  - 'text/xml'
  - 'text/javascript'
  - 'application/javascript'
  - 'application/x-javascript'
  - 'application/json'
  - 'application/xml'
  - 'application/xhtml+xml'
  - 'application/rss+xml'
  - 'application/atom+xml'
  - 'image/svg+xml'

#
# Caching (mod_expires)
#

# Enable caching
apache_caching_enabled: true
apache_cache_control_enabled: true

# Default cache expiration
apache_expires_default: 'access plus 1 month'

# Per-type cache expiration
apache_expires_by_type:
  - type: 'text/html'
    expires: 'access plus 0 seconds'
  - type: 'text/css'
    expires: 'access plus 1 year'
  - type: 'application/javascript'
    expires: 'access plus 1 year'
  - type: 'image/jpeg'
    expires: 'access plus 1 year'
  - type: 'image/png'
    expires: 'access plus 1 year'
  - type: 'image/gif'
    expires: 'access plus 1 year'
  - type: 'image/svg+xml'
    expires: 'access plus 1 year'
  - type: 'image/x-icon'
    expires: 'access plus 1 year'
  - type: 'font/woff'
    expires: 'access plus 1 year'
  - type: 'font/woff2'
    expires: 'access plus 1 year'

#
# Logging
#

# Log level: emerg, alert, crit, error, warn, notice, info, debug
apache_log_level: 'warn'

# Access log format: common, combined, custom
apache_access_log_format: 'combined'

# Custom log format (when apache_access_log_format is custom)
apache_custom_log_format: '"%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""'

# Patterns to exclude from access log (e.g. health checks)
# Example:
#   - '/health'
#   - '/ping'
#   - '\.ico$'
apache_log_ignore_patterns: []

#
# ACME / Let's Encrypt (HTTP-01)
#

# Serve the ACME HTTP-01 challenge from a shared webroot and exclude it from
# HTTPS redirects, so certbot's webroot authenticator works even when a vhost
# redirects everything to HTTPS. Defaults to certbot_enabled: when certbot
# manages certificates on this host the challenge handling is on automatically;
# otherwise it stays off. Override explicitly to force either behaviour.
apache_acme_challenge_enabled: '{{ certbot_enabled | default(false) | bool }}'

# Shared webroot serving /.well-known/acme-challenge/ (match certbot_webroot_path)
apache_acme_webroot: '/var/www/letsencrypt'

#
# Virtual Hosts
#

# Remove default virtual host
apache_remove_default_vhost: true

# Remove orphaned vhost configs that this role deployed earlier but that are no
# longer listed in apache_vhosts, apache_vhosts_ssl or apache_reverse_proxies.
# Only files whose content starts with the ansible_managed header are removed —
# distro-provided or hand-written configs are never touched. Opt-in because it
# deletes files.
apache_vhosts_exclusive: false

# Config file names to keep even when unmanaged (exclusive mode)
# Example:
#   - 'legacy-site.conf'
apache_vhosts_keep: []

# HTTP virtual hosts
# Set default_vhost: true on at most one entry per list to deploy its config as
# 00-<name>.conf — it then loads first and becomes Apache's catch-all for
# requests whose Host header matches no vhost (also valid in apache_vhosts_ssl
# and apache_reverse_proxies; on SSL it also serves unknown-SNI requests).
# Example:
#   - server_name: 'www.example.com'
#     server_alias:
#       - 'example.com'
#     document_root: '/var/www/example.com'
#     listen_port: 80
#     default_vhost: true
#     custom_config: |
#       <Directory "/var/www/example.com">
#         Options -Indexes +FollowSymLinks
#         AllowOverride None
#         Require all granted
#       </Directory>
apache_vhosts: []

# SSL virtual hosts
# Example:
#   - server_name: 'www.example.com'
#     document_root: '/var/www/example.com'
#     certificate_file: '/etc/letsencrypt/live/example.com/fullchain.pem'
#     certificate_key_file: '/etc/letsencrypt/live/example.com/privkey.pem'
#     certificate_chain_file: ''
#     custom_config: |
#       Header always set Strict-Transport-Security "max-age=63072000"
apache_vhosts_ssl: []

#
# Reverse Proxy
#

# Reverse proxy configurations
# Example:
#   - server_name: 'app.example.com'
#     proxy_pass: 'http://localhost:3000'
#     proxy_preserve_host: true
#     proxy_timeout: 60
#     websocket_enabled: false
#     custom_config: |
#       RequestHeader set X-Forwarded-Proto "https"
apache_reverse_proxies: []

#
# PHP-FPM
#

# Enable PHP-FPM integration
apache_php_fpm_enabled: false

# PHP-FPM socket path
apache_php_fpm_socket: 'unix:/run/php-fpm/php-fpm.sock|fcgi://localhost'

# Where the PHP-FPM handler is configured:
#   global - a single block in the server configuration, inherited by every
#            vhost, including vhosts written by something other than this role
#   vhost  - one block per vhost
# A vhost overrides the handler through its own php_fpm_socket, because a
# vhost-local <FilesMatch> takes precedence over the server-context one. The same
# holds for php_fpm_timeout, and both override independently of each other.
apache_php_fpm_scope: 'global'

# SELinux booleans (RedHat). Each takes one of three values:
#   null  - leave the boolean as it is on the host (default)
#   true  - switch it on
#   false - switch it off
# The booleans apply to the whole httpd_t domain, which nginx and PHP-FPM share,
# so the role only switches one off when told to explicitly.

# Allow PHP-FPM workers to reach a database over the network. Not derived from
# apache_php_fpm_enabled, because the role cannot tell whether an application
# talks to a database at all, and the boolean should not be widened on hosts
# that never need it.
apache_selinux_connect_db: null

# Allow httpd to open outbound network connections. Reverse proxy vhosts need
# this boolean and switch it on automatically, derived from
# apache_reverse_proxies; false is rejected while any are configured. Set it
# when the application itself calls out to a remote service.
apache_selinux_network_connect: null

# Allow httpd and its PHP-FPM workers to submit mail through the local MTA.
# Needed by applications that send mail through PHP's mail() or a sendmail
# binary; without it submission fails with a bare permission error.
apache_selinux_sendmail: null

# PHP-FPM proxy timeout
apache_php_fpm_timeout: 60

#
# Extra Configuration
#

# Extra configuration snippets (inserted at end of main config)
apache_extra_config: ''

# Include additional configuration files
# Example:
#   - '/etc/apache2/conf-available/custom.conf'
apache_extra_conf_includes: []

#
# Service Limits
#

# Open file limit (LimitNOFILE) of the Apache service, deployed as a systemd
# drop-in and on Debian also as APACHE_ULIMIT_MAX_FILES in envvars, since
# apachectl sets its own limit there; empty keeps the distro default (systemd
# soft limit 1024, on Debian 8192 from apachectl). Apache needs one
# descriptor per log directive in a virtual host (one per distinct error log
# file), so hosts with many virtual hosts that log separately exceed the
# default: the configuration test passes, but the restart fails with
# 'AH00019: Unable to open logs'. Changing the value restarts Apache.
# Example: 65536
apache_limit_nofile: ''

#
# Firewall
#

# Enable firewalld rule for Apache ports
apache_firewalld_enabled: true

# Firewalld zone for Apache services
apache_firewalld_zone: 'public'
