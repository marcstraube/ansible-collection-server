---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Validate package update settings
  ansible.builtin.assert:
    that:
      - apache_packages_state in ['present', 'latest']
      - apache_packages_minimum is string or apache_packages_minimum is mapping
    fail_msg: >-
      apache_packages_state must be 'present' or 'latest' (got
      '{{ apache_packages_state }}'), apache_packages_minimum must be a
      version string, e.g. '2.4.66', or a mapping per platform
  when: apache_enabled | bool
  tags:
    - always

# A mapping selects the minimum by '<os_family>-<major>', then
# '<os_family>'. A host without a matching key fails here, before any
# change, so a platform left out of the mapping cannot pass unchecked.
- name: Main | Select the minimum version for this platform
  ansible.builtin.set_fact:
    __apache_minimum: >-
      {{ (apache_packages_minimum[__apache_minimum_key] if __apache_minimum_key | length > 0 else '')
         if apache_packages_minimum is mapping
         else apache_packages_minimum }}
    __apache_minimum_key_found: '{{ apache_packages_minimum is not mapping or __apache_minimum_key | length > 0 }}'
  vars:
    __apache_minimum_key: >-
      {{ ([ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version'],
           ansible_facts['os_family']]
          | select('in', apache_packages_minimum) | list + [''])
         | first
         if apache_packages_minimum is mapping
         else '' }}
  when: apache_enabled | bool
  tags:
    - always

# The value reaches dpkg, rpm and vercmp as an argument; only characters of
# a package version are accepted.
- name: Main | Validate the minimum version for this platform
  ansible.builtin.assert:
    that:
      - __apache_minimum_key_found | bool
      - __apache_minimum | string is match('^[0-9A-Za-z.+~:_-]*$')
    fail_msg: >-
      {{ ('apache_packages_minimum has no key for this host (expected '
          ~ ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']
          ~ ' or ' ~ ansible_facts['os_family'] ~ ')')
         if not (__apache_minimum_key_found | bool)
         else ('apache_packages_minimum ' ~ __apache_minimum ~ ' is not a package version') }}
    quiet: true
  when: apache_enabled | bool
  tags:
    - always

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:install

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:configure

- name: Main | Import vhosts tasks
  ansible.builtin.import_tasks: vhosts.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:vhosts

- name: Main | Include vhosts exclusive tasks
  ansible.builtin.include_tasks:
    file: vhosts_exclusive.yml
    apply:
      tags:
        - apache
        - apache:vhosts
  when:
    - apache_enabled | bool
    - apache_vhosts_exclusive | bool
  tags:
    - apache
    - apache:vhosts

- name: Main | Import validate tasks
  ansible.builtin.import_tasks: validate.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:configure
    - apache:vhosts

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:service

- name: Main | Include firewall tasks
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - apache
        - apache:firewall
  when:
    - apache_enabled | bool
    - apache_firewalld_enabled | bool
  tags:
    - apache
    - apache:firewall
