---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:install

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:configure

- name: Main | Import vhosts tasks
  ansible.builtin.import_tasks: vhosts.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:vhosts

- name: Main | Include vhosts exclusive tasks
  ansible.builtin.include_tasks:
    file: vhosts_exclusive.yml
    apply:
      tags:
        - apache
        - apache:vhosts
  when:
    - apache_enabled | bool
    - apache_vhosts_exclusive | bool
  tags:
    - apache
    - apache:vhosts

- name: Main | Import validate tasks
  ansible.builtin.import_tasks: validate.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:configure
    - apache:vhosts

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: apache_enabled | bool
  tags:
    - apache
    - apache:service

- name: Main | Include firewall tasks
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - apache
        - apache:firewall
  when:
    - apache_enabled | bool
    - apache_firewalld_enabled | bool
  tags:
    - apache
    - apache:firewall
