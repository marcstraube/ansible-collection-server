---
# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - apache_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  when:
    - apache_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  when:
    - apache_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed Apache package, not only the
# configured ones: parts pulled in as dependencies (apache2-bin,
# httpd-core, httpd-filesystem) pin the exact version of the main package
# and must move in the same transaction. The facts also hold the version
# before the update for the minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when: apache_packages_state == 'latest' or __apache_minimum | length > 0
  tags:
    - always

- name: Install | Merge installed packages into the update
  ansible.builtin.set_fact:
    __apache_update_packages: >-
      {{ (__apache_packages
          + (ansible_facts['packages'] | list
             | select('match', __apache_update_pattern) | list))
         | unique | list }}
  when:
    - apache_packages_state == 'latest'
    - ansible_facts['os_family'] in ['RedHat', 'Debian']

# Full version of the main package as the package manager writes it:
# [epoch:]version[-release]. package_facts reports a missing rpm epoch as
# None, which counts as no epoch like 0.
- name: Install | Record the installed Apache version
  ansible.builtin.set_fact:
    __apache_version_package: '{{ __apache_packages | first }}'
    __apache_version_before: '{{ __apache_installed_version }}'
  vars:
    __apache_pkg: "{{ ansible_facts['packages'][__apache_packages | first] | default([{}]) | first }}"
    __apache_installed_version: >-
      {{ ((__apache_pkg.epoch ~ ':')
          if ((__apache_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__apache_pkg.version | default(''))
         ~ (('-' ~ __apache_pkg.release) if (__apache_pkg.release | default('', true)) else '') }}
  when: apache_packages_state == 'latest' or __apache_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install, resolved like the install (dnf honors module streams, excludes
# and versionlock, apt honors pinning). Arch Linux installs a missing
# package from the sync database and otherwise keeps the installed version,
# which the system upgrade updates. The queries change nothing, so they
# also run under --check.
- name: Install | Query the version the update would install (RedHat)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - repoquery
      - --latest-limit=1
      - '--queryformat=%{epoch}:%{version}-%{release}'
      - '{{ __apache_version_package }}'
  register: __apache_candidate_dnf
  changed_when: false
  check_mode: false
  when:
    - __apache_minimum | length > 0
    - ansible_facts['os_family'] == 'RedHat'
    - apache_packages_state == 'latest' or __apache_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __apache_version_package }}'
  environment:
    LC_ALL: C
  register: __apache_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __apache_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - apache_packages_state == 'latest' or __apache_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the install would add (Archlinux)
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --info
      - '{{ __apache_version_package }}'
  environment:
    LC_ALL: C
  register: __apache_candidate_pacman
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - __apache_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __apache_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __apache_check_stage: 'pre'
    __apache_check_installed: '{{ __apache_version_before }}'
    # epoch 0 is the default and left out, as in the installed version
    __apache_check_candidate: >-
      {{ (((__apache_candidate_dnf.stdout_lines | default([])) + [''])
          | first | regex_replace('^0:', ''))
         ~ (((__apache_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', '')
         ~ (((__apache_candidate_pacman.stdout | default('')) | regex_findall('(?m)^Version *: *([^ ]+)$')) + [''])
           | first }}
  when: __apache_minimum | length > 0
  tags:
    - always

- name: Install | Apache packages
  ansible.builtin.package:
    name: '{{ __apache_update_packages | default(__apache_packages) }}'
    state: "{{ (ansible_facts['os_family'] == 'Archlinux') | ternary('present', apache_packages_state) }}"
  register: __apache_packages_result
  retries: 3
  delay: 5

- name: Install | Apache utilities (Debian)
  ansible.builtin.package:
    name: '{{ __apache_utils_packages }}'
    state: present
  retries: 3
  delay: 5
  when:
    - ansible_facts['os_family'] == 'Debian'
    - __apache_utils_packages is defined

- name: Install | Apache tools (RedHat)
  ansible.builtin.package:
    name: '{{ __apache_tools_packages }}'
    state: present
  retries: 3
  delay: 5
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - __apache_tools_packages is defined

- name: Install | SSL module (RedHat)
  ansible.builtin.package:
    name: '{{ __apache_ssl_packages }}'
    state: present
  retries: 3
  delay: 5
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - apache_ssl_enabled | bool
    - __apache_ssl_packages is defined

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - not ansible_check_mode
    - __apache_minimum | length > 0
      or (apache_packages_state == 'latest' and (__apache_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated Apache version
  ansible.builtin.set_fact:
    __apache_version_after: >-
      {{ ((__apache_pkg.epoch ~ ':')
          if ((__apache_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__apache_pkg.version | default(''))
         ~ (('-' ~ __apache_pkg.release) if (__apache_pkg.release | default('', true)) else '') }}
  vars:
    __apache_pkg: "{{ ansible_facts['packages'][__apache_version_package] | default([{}]) | first }}"
  when:
    - not ansible_check_mode
    - __apache_minimum | length > 0
      or (apache_packages_state == 'latest' and (__apache_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the Apache version change
  ansible.builtin.debug:
    msg: >-
      {{ __apache_version_package }} {{ __apache_version_before | default('none', true) }}
      -> {{ __apache_version_after }}
  when:
    - not ansible_check_mode
    - apache_packages_state == 'latest'
    - (__apache_packages_result | default({})) is changed
    - __apache_version_before != __apache_version_after

# A running main process keeps executing the old binary after an update.
# The packages usually restart it themselves (dpkg maintainer scripts, rpm
# scriptlets), but policy-rc.d or the systemd update helper can prevent
# that, and pacman never restarts it. With 'latest' the role restarts
# Apache while the running main process still executes a replaced binary,
# so an update never restarts it twice. The check does not depend on
# changed packages: a run that updated Apache but could not restart it
# (failed configuration test) restarts it on the next run.
- name: Install | Check for a running main process
  ansible.builtin.stat:
    path: '{{ __apache_pid_file }}'
  register: __apache_pid_stat
  when: apache_packages_state == 'latest'

- name: Install | Read the main process PID
  ansible.builtin.slurp:
    src: '{{ __apache_pid_file }}'
  register: __apache_pid
  when:
    - apache_packages_state == 'latest'
    - __apache_pid_stat.stat.exists | default(false)

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of the running main process
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __apache_pid.content | b64decode | trim }}/exe'
  register: __apache_main_exe
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - apache_packages_state == 'latest'
    - __apache_pid_stat.stat.exists | default(false)

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __apache_restart_binary: >-
      {{ (__apache_pid_stat.stat.exists | default(false))
         and apache_service_enabled | bool
         and (((__apache_main_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and __apache_packages_result is changed)) }}
  when: apache_packages_state == 'latest'

# The new binary must accept the configuration before the restart. When it
# does not, the run fails without a restart and the running main process
# keeps serving with the old binary.
- name: Install | Test the configuration before the restart
  ansible.builtin.command:
    cmd: apachectl configtest
  changed_when: false
  check_mode: false
  when:
    - apache_packages_state == 'latest'
    - __apache_restart_binary | bool

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running.
- name: Install | Restart Apache for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __apache_service_name }}'
    state: restarted
  when:
    - apache_packages_state == 'latest'
    - __apache_restart_binary | bool

# Post-check: the transaction can install something else than the queried
# candidate (dependencies, excludes), so the installed version is checked
# again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __apache_check_stage: 'post'
    __apache_check_installed: '{{ __apache_version_after }}'
    __apache_check_candidate: ''
  when:
    - __apache_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always

- name: Install | Create vhosts directory
  ansible.builtin.file:
    path: '{{ __apache_vhosts_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install | Create sites-enabled directory (Debian)
  ansible.builtin.file:
    path: '{{ __apache_vhosts_enabled_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - ansible_facts['os_family'] == 'Debian'
    - __apache_vhosts_enabled_dir is defined

- name: Install | Create modules directory (Arch)
  ansible.builtin.file:
    path: '{{ __apache_modules_available_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['os_family'] == 'Archlinux'
