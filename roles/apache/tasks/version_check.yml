---
# Compares the Apache main package with the minimum version, using the
# distribution's own version rules (epochs, Debian revisions such as
# +deb13u10, EL release strings). Passes when the installed version or the
# version the update would install meets the minimum.
#
# Input:
#   __apache_check_stage      'pre' (before the package task) or 'post'
#   __apache_check_installed  installed version, '' when not installed
#   __apache_check_candidate  version the update would install, '' if none
#
# A minimum without an epoch takes the epoch of the compared version: dpkg,
# rpm and vercmp treat a missing epoch as 0, so for a package with an epoch
# (1:2.4.62) a minimum of 2.4.66 would otherwise count as older.

- name: Version Check | Compare with the minimum version
  ansible.builtin.command:
    argv: '{{ __apache_vercmp_argv[ansible_facts["os_family"]] }}'
  vars:
    __apache_check_minimum: >-
      {{ (item.split(':') | first ~ ':' ~ __apache_minimum)
         if (':' not in (__apache_minimum | string) and item is match('^[0-9]+:'))
         else (__apache_minimum | string) }}
    # dpkg answers with its exit code, rpm and vercmp print -1, 0 or 1
    __apache_vercmp_argv:
      Debian: ['dpkg', '--compare-versions', '{{ item }}', 'ge', '{{ __apache_check_minimum }}']
      RedHat: ['rpm', '--eval', '%{lua: print(rpm.vercmp("{{ item }}", "{{ __apache_check_minimum }}"))}']
      Archlinux: ['vercmp', '{{ item }}', '{{ __apache_check_minimum }}']
  loop: '{{ [__apache_check_installed, __apache_check_candidate] | select | unique | list }}'
  register: __apache_check_result
  changed_when: false
  failed_when: __apache_check_result.rc not in [0, 1]
  check_mode: false

- name: Version Check | Assert the minimum version
  ansible.builtin.assert:
    that:
      - __apache_check_met | length > 0
    fail_msg: >-
      apache_packages_minimum requires {{ __apache_minimum }};
      installed: {{ __apache_check_installed | default('none', true) }}{{
        ('; the update would install: ' ~ (__apache_check_candidate | default('none', true)))
        if __apache_check_stage == 'pre' else '' }}.
      The repository does not carry the required version yet{{
        ', nothing was changed' if __apache_check_stage == 'pre' else '' }}.
    success_msg: >-
      {{ __apache_version_package }} {{ (__apache_check_met + ['']) | first }} meets the
      minimum {{ __apache_minimum }}
  vars:
    __apache_check_met: >-
      {{ (__apache_check_result.results | default([]) | selectattr('rc', 'eq', 0) | map(attribute='item') | list)
         if ansible_facts['os_family'] == 'Debian'
         else (__apache_check_result.results | default([]) | selectattr('stdout', 'in', ['0', '1'])
               | map(attribute='item') | list) }}
