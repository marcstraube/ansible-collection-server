---
# Targeted update: the first play rolls the Apache packages back to an older
# build. A minimum the repository does not offer must fail before any
# change, a mapping without a key for the host must fail, and on Debian a
# configuration the new binary rejects must fail the update without a
# restart. The converge playbook then runs with apache_packages_state:
# latest and the full distribution version as minimum, and Apache must run
# the new binary after at most one restart. Arch Linux ignores the state.
- name: Side Effect | Roll back
  hosts: all
  gather_facts: true

  vars:
    __side_effect_package: >-
      {{ {'Debian': 'apache2', 'RedHat': 'httpd', 'Archlinux': 'apache'}[ansible_facts['os_family']] }}
    # version-release of the main package from the latest package facts
    # (Debian has no separate release field)
    __side_effect_version: >-
      {{ [(ansible_facts['packages'][__side_effect_package] | first).version,
          (ansible_facts['packages'][__side_effect_package] | first).release | default('')]
         | select | join('-') }}

  tasks:
    - name: Side Effect | Gather package facts before the rollback
      ansible.builtin.package_facts:

    - name: Side Effect | Record the current Apache package version
      ansible.builtin.set_fact:
        __side_effect_version_current: '{{ __side_effect_version }}'

    # Debian: policy-rc.d keeps the maintainer scripts from restarting
    # Apache, so only the role can restart it
    - name: Side Effect | Block service restarts by packages (Debian)
      ansible.builtin.copy:
        content: "#!/bin/sh\nexit 101\n"
        dest: /usr/sbin/policy-rc.d
        mode: '0755'
      when: ansible_facts['os_family'] == 'Debian'

    # The EL AppStream keeps the older builds of a release; mod_ssl requires
    # the exact httpd version and moves back with it. When the repository
    # holds only one build, nothing is rolled back and verify.yml skips the
    # version comparison.
    - name: Side Effect | Roll the Apache packages back (RedHat)
      ansible.builtin.command:
        cmd: dnf downgrade -y 'httpd*' mod_ssl
      changed_when: true
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    # Every installed package built from the apache2 source carries its
    # version and moves back with it.
    - name: Side Effect | Roll the Apache packages back (Debian)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          installed=$(dpkg-query -W -f '${Version}' apache2)
          # madison lists the newest build first; take the first older one
          old=$(apt-cache madison apache2 \
            | awk -F' [|] ' -v cur="${installed}" '$2 != cur { print $2; exit }')
          [ -n "${old}" ] || exit 0
          pkgs=$(dpkg-query -W -f '${Package} ${Version} ${db:Status-Abbrev}\n' 'apache2*' \
            | awk -v cur="${installed}" '$2 == cur && $3 == "ii" { print $1 }')
          args=''
          for pkg in ${pkgs}; do args="${args} ${pkg}=${old}"; done
          # shellcheck disable=SC2086
          DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-downgrades ${args}
        executable: /bin/bash
      changed_when: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Side Effect | Gather package facts after the rollback
      ansible.builtin.package_facts:

    - name: Side Effect | Record the rolled back Apache package version
      ansible.builtin.set_fact:
        __side_effect_version_rolled_back: '{{ __side_effect_version }}'

    # verify.yml runs as a separate playbook; the versions before and after
    # the rollback and the time of the update reach it through this file.
    - name: Side Effect | Record the Apache package versions around the rollback
      ansible.builtin.copy:
        content: |
          {{ __side_effect_version_current }}
          {{ __side_effect_version_rolled_back }}
        dest: /root/apache-update-versions
        mode: '0600'

- name: Side Effect | Minimum
  hosts: all
  gather_facts: true

  vars:
    __side_effect_package: >-
      {{ {'Debian': 'apache2', 'RedHat': 'httpd', 'Archlinux': 'apache'}[ansible_facts['os_family']] }}
    __side_effect_version: >-
      {{ [(ansible_facts['packages'][__side_effect_package] | first).version,
          (ansible_facts['packages'][__side_effect_package] | first).release | default('')]
         | select | join('-') }}

  tasks:
    # The pre-check runs before the package task, so a minimum the
    # repository does not offer leaves the rolled back packages in place.
    # It runs in the install stage, before the configuration, so the role
    # needs no further settings.
    - name: Side Effect | Run with a minimum the repository does not offer
      block:
        - name: Side Effect | Include apache role with an unmet minimum  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_packages_state: 'latest'
            apache_packages_minimum: "{{ {ansible_facts['os_family']: '99.0'} }}"
      rescue:
        - name: Side Effect | Record the minimum check failure
          ansible.builtin.set_fact:
            __side_effect_minimum_error: '{{ ansible_failed_result.msg | default("") }}'

    - name: Side Effect | Gather package facts after the unmet minimum
      ansible.builtin.package_facts:

    - name: Side Effect | Assert the unmet minimum failed without a change
      ansible.builtin.assert:
        that:
          - __side_effect_minimum_error is defined
          - "'requires 99.0' in __side_effect_minimum_error"
          - "'nothing was changed' in __side_effect_minimum_error"
          - __side_effect_version == __side_effect_version_rolled_back
        fail_msg: >-
          A minimum of 99.0 did not fail before the update (error:
          {{ __side_effect_minimum_error | default('none') }}, Apache
          {{ __side_effect_version_rolled_back }} -> {{ __side_effect_version }})
        success_msg: 'The pre-check rejects a minimum the repository does not offer'

    - name: Side Effect | Run with a mapping without a key for the host
      block:
        - name: Side Effect | Include apache role with a mapping for another platform  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_packages_state: 'latest'
            apache_packages_minimum:
              Solaris: '1.0'
      rescue:
        - name: Side Effect | Record the mapping failure
          ansible.builtin.set_fact:
            __side_effect_mapping_error: '{{ ansible_failed_result.msg | default("") }}'

    - name: Side Effect | Assert the mapping without a key failed
      ansible.builtin.assert:
        that:
          - __side_effect_mapping_error is defined
          - "'has no key for this host' in __side_effect_mapping_error"
        fail_msg: 'A mapping without a key for the host did not fail the run'
        success_msg: 'A mapping without a key for the host fails the run'

# Debian only: policy-rc.d keeps the old main process running after the
# update, so the role has to restart it and tests the configuration first.
- name: Side Effect | Configuration test
  hosts: all
  gather_facts: true

  vars:
    # Only a rolled back build leaves a replaced binary to restart
    __side_effect_config_test: >-
      {{ ansible_facts['os_family'] == 'Debian'
         and __side_effect_version_rolled_back != __side_effect_version_current }}

  tasks:
    - name: Side Effect | Add a configuration the new binary rejects (Debian)
      ansible.builtin.copy:
        content: "NotADirective on\n"
        dest: /etc/apache2/conf-enabled/zz-broken.conf
        mode: '0644'
      when: __side_effect_config_test | bool

    - name: Side Effect | Run the update with a rejected configuration (Debian)
      when: __side_effect_config_test | bool
      block:
        - name: Side Effect | Include apache role with a rejected configuration  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_packages_state: 'latest'
      rescue:
        - name: Side Effect | Record the failed task
          ansible.builtin.set_fact:
            __side_effect_config_task: '{{ ansible_failed_task.name | default("") }}'

    - name: Side Effect | Read the Apache main process PID (Debian)
      ansible.builtin.slurp:
        src: /var/run/apache2/apache2.pid
      register: __side_effect_pid
      when: __side_effect_config_test | bool

    - name: Side Effect | Read the binary of the running main process (Debian)
      ansible.builtin.command:
        argv:
          - readlink
          - '/proc/{{ __side_effect_pid.content | b64decode | trim }}/exe'
      register: __side_effect_exe
      changed_when: false
      when: __side_effect_config_test | bool

    - name: Side Effect | Assert the rejected configuration stopped the restart (Debian)
      ansible.builtin.assert:
        that:
          - __side_effect_config_task | default('') == 'Install | Test the configuration before the restart'
          - __side_effect_exe.stdout is search(' \(deleted\)$')
        fail_msg: >-
          The update did not stop at the configuration test (failed task:
          {{ __side_effect_config_task | default('none') }}, main process runs
          {{ __side_effect_exe.stdout }})
        success_msg: 'The old main process keeps serving when the new binary rejects the configuration'
      when: __side_effect_config_test | bool

    - name: Side Effect | Remove the rejected configuration (Debian)
      ansible.builtin.file:
        path: /etc/apache2/conf-enabled/zz-broken.conf
        state: absent
      when: __side_effect_config_test | bool

# On Debian the packages are already updated; the role restarts the main
# process that still runs the replaced binary.
- name: Side Effect | Update
  ansible.builtin.import_playbook: converge.yml
  vars:
    apache_packages_state: 'latest'
    apache_packages_minimum: '{{ __side_effect_version_current }}'

# Every invalid writable path entry must fail the validation in main.yml,
# which runs before any change.
- name: Side Effect | Writable path validation
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Run with a relative path
      block:
        - name: Side Effect | Include apache role with a relative path  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_writable_paths:
              - path: 'var/www/relative'
      rescue:
        - name: Side Effect | Record the error for a relative path
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'relative': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with a trailing slash
      block:
        - name: Side Effect | Include apache role with a trailing slash  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_writable_paths:
              - path: '/var/www/trailing/'
      rescue:
        - name: Side Effect | Record the error for a trailing slash
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'trailing': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with a '..' component
      block:
        - name: Side Effect | Include apache role with a '..' component  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_writable_paths:
              - path: '/var/www/../etc'
      rescue:
        - name: Side Effect | Record the error for a '..' component
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'dotdot': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with an entry without a path
      block:
        - name: Side Effect | Include apache role with an entry without a path  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_writable_paths:
              - type: 'httpd_log_t'
      rescue:
        - name: Side Effect | Record the error for an entry without a path
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'nopath': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with an unsupported type
      block:
        - name: Side Effect | Include apache role with an unsupported type  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_writable_paths:
              - path: '/var/www/type'
                type: 'httpd_sys_content_t'
      rescue:
        - name: Side Effect | Record the error for an unsupported type
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'type': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with a numeric mode
      block:
        - name: Side Effect | Include apache role with a numeric mode  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            apache_enabled: true
            apache_writable_paths:
              - path: '/var/www/mode'
                mode: 750
      rescue:
        - name: Side Effect | Record the error for a numeric mode
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'mode': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Assert every invalid writable path failed the validation
      ansible.builtin.assert:
        that:
          - __errors['relative'] | default('') is search('must be absolute')
          - __errors['trailing'] | default('') is search('must be absolute')
          - __errors['dotdot'] | default('') is search('must be absolute')
          - __errors['nopath'] | default('') is search('needs a path')
          - __errors['type'] | default('') is search('must be one of')
          - __errors['mode'] | default('') is search('must be a quoted octal string')
        fail_msg: 'Unexpected validation results: {{ __errors }}'
        success_msg: 'The validation rejects every invalid writable path'
      vars:
        __errors: '{{ __side_effect_writable_errors | default({}) }}'

- name: Side Effect | Clean up
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Allow service restarts by packages again (Debian)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: ansible_facts['os_family'] == 'Debian'
