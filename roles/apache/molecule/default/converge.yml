---
- name: Converge
  hosts: all
  gather_facts: true

  vars: &converge_vars
    apache_enabled: true
    apache_service_enabled: true
    apache_mpm_module: 'event'
    # Server default on; php.example.local below switches it off for itself,
    # present.example.local inherits it. verify.yml checks the ALPN result.
    apache_http2_enabled: true
    apache_server_name: 'testsite.local'
    apache_server_admin: 'admin@testsite.local'
    # 127.0.0.2 is a loopback address distinct from 127.0.0.1: the bound vhost
    # below must answer there and nowhere else.
    apache_listen_ports:
      - 80
      - '127.0.0.2:8081'
    apache_ssl_enabled: true
    apache_server_tokens: 'Prod'
    apache_server_signature: 'Off'
    apache_trace_enable: 'Off'
    apache_timeout: 60
    apache_keep_alive: 'On'
    apache_keep_alive_timeout: 5
    apache_remove_default_vhost: true
    # Raised open file limit via systemd drop-in; verify.yml reads it from the
    # running main process. An uncommon value, so it cannot match a default the
    # container runtime already sets (65536 on some CI runners).
    apache_limit_nofile: 40000
    # Headroom above MaxRequestWorkers / ThreadsPerChild (400 / 25 = 16).
    apache_mpm_server_limit: 20
    # Feature modules (ssl, headers, deflate, expires, alias, rewrite, proxy)
    # are derived; only what an application would add is listed here.
    apache_modules_enabled:
      - 'auth_basic'
    apache_acme_challenge_enabled: true
    apache_vhosts:
      # default_vhost deploys this as 00-testsite.local.conf, so the functional
      # HTTP test against 127.0.0.1 without a Host header lands here explicitly
      # instead of relying on alphabetical file order.
      - server_name: 'testsite.local'
        server_alias:
          - 'www.testsite.local'
        document_root: '/var/www/testsite'
        listen_port: 80
        default_vhost: true
        custom_config: |
          <Directory "/var/www/testsite">
            Options -Indexes +FollowSymLinks
            AllowOverride None
            Require all granted
          </Directory>
      # Only exercises ACME redirect-exclusion rendering; testsite.local is the
      # explicit default vhost via default_vhost above.
      - server_name: 'zz-redirect-test.local'
        listen_port: 80
        redirect_to_https: true
      # Renders <VirtualHost 127.0.0.2:8081>; verify.yml requests it on that
      # address and expects 127.0.0.1:8081 to refuse the connection. Its own
      # php_fpm_socket must render a handler into the HTTP vhost, resolved
      # lazily from the socket the pre_tasks discover.
      - server_name: 'bound.example.local'
        document_root: '/var/www/bound'
        listen_address: '127.0.0.2'
        listen_port: 8081
        php_fpm_socket: '{{ apache_php_fpm_socket }}'
      # One vhost per document root policy. prepare.yml plants the existing
      # paths with owners and modes the role must keep or correct; verify.yml
      # asserts each outcome. testsite.local and bound.example.local above set
      # no policy and run with the default 'disabled'.
      - server_name: 'docroot-managed.local'
        document_root: '/var/www/docroot-managed'
        document_root_policy: 'managed'
        mode: '0750'
      - server_name: 'docroot-seed-new.local'
        document_root: '/var/www/docroot-seed-new'
        document_root_policy: 'seed'
      - server_name: 'docroot-seed-existing.local'
        document_root: '/var/www/docroot-seed-existing'
        document_root_policy: 'seed'
      - server_name: 'docroot-seed-link.local'
        document_root: '/var/www/docroot-seed-link'
        document_root_policy: 'seed'
      - server_name: 'docroot-seed-dangling.local'
        document_root: '/var/www/docroot-seed-dangling'
        document_root_policy: 'seed'
      - server_name: 'docroot-disabled.local'
        document_root: '/var/www/docroot-disabled'
        document_root_policy: 'disabled'
      # Deprecated key, maps to 'managed'.
      - server_name: 'docroot-legacy.local'
        document_root: '/var/www/docroot-legacy'
        create_document_root: true
    # Cache below a document root (owner and group default to the web server
    # user), a log directory created below /var/log and a label-only path.
    apache_writable_paths:
      - path: '/var/www/writable.example.local/var/cache'
        mode: '0750'
      - path: '/var/log/molecule-writable'
        type: 'httpd_log_t'
        owner: 'root'
        group: 'root'
        mode: '0770'
      - path: '/var/www/writable.example.local/uploads'
    # The client address from X-Forwarded-For replaces the peer address only for
    # requests from 127.0.0.1; verify.yml also sends one from 127.0.0.2, whose
    # header must be ignored.
    apache_remoteip_header: 'X-Forwarded-For'
    apache_remoteip_trusted_proxies:
      - '127.0.0.1'
    # Two SSL vhosts exercise the conditional deploy: 'present' has a certificate
    # (deployed), 'pending' does not (skipped until certbot issues it).
    apache_vhosts_ssl:
      - server_name: 'present.example.local'
        certificate_file: '/etc/ssl/test/present.crt'
        certificate_key_file: '/etc/ssl/test/present.key'
        certificate_chain_file: ''
      - server_name: 'pending.example.local'
        certificate_file: '/etc/ssl/test/missing.crt'
        certificate_key_file: '/etc/ssl/test/missing.key'
        certificate_chain_file: ''
      # Exercises the PHP-FPM handler end to end; verify.yml requests a script
      # from this vhost and asserts the response is output, not source. It
      # also overrides the HTTP/2 server default on the shared *:443.
      - server_name: 'php.example.local'
        document_root: '/var/www/php-test'
        certificate_file: '/etc/ssl/test/present.crt'
        certificate_key_file: '/etc/ssl/test/present.key'
        certificate_chain_file: ''
        http2: false
    # Exclusive mode prunes the 'zz-orphan' fixture planted in prepare.yml;
    # the 'zz-foreign' (no managed header) and 'zz-keep' (keep-listed)
    # fixtures must survive.
    apache_vhosts_exclusive: true
    apache_vhosts_keep:
      - 'zz-keep.example.local.conf'

  pre_tasks:
    # Socket path differs per distribution and PHP version, so it is discovered
    # rather than hardcoded. Deliberately passed WITHOUT the |fcgi://localhost
    # suffix, so the role has to add the protocol itself.
    - name: Converge | Find the PHP-FPM socket
      ansible.builtin.find:
        paths: /run
        patterns: '*.sock'
        file_type: any
        recurse: true
      register: __converge_fpm_socket

    - name: Converge | Assert exactly one FPM socket was found
      ansible.builtin.assert:
        that:
          - __converge_fpm_paths | length == 1
        fail_msg: >-
          Expected one php-fpm socket, found {{ __converge_fpm_paths | length }}:
          {{ __converge_fpm_paths }}
      vars:
        __converge_fpm_paths: >-
          {{
            __converge_fpm_socket.files | rejectattr('islnk') | map(attribute='path')
            | select('search', 'fpm') | list
          }}

    - name: Converge | Enable PHP-FPM for the vhosts
      ansible.builtin.set_fact:
        apache_php_fpm_enabled: true
        apache_php_fpm_socket: >-
          unix:{{
            __converge_fpm_socket.files | rejectattr('islnk') | map(attribute='path')
            | select('search', 'fpm') | list | first
          }}

  tasks:
    - name: Converge | Include apache role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

# Handler behaviour, exercised once (a marker file keeps the idempotence run
# clean): a configuration change must reload Apache gracefully, keeping the
# main PID; an MPM change must restart it. verify.yml asserts on the PIDs.
- name: Converge | Reload versus restart
  hosts: all
  gather_facts: true
  vars:
    <<: *converge_vars
    __converge_apache_service: "{{ 'apache2' if ansible_facts['os_family'] == 'Debian' else 'httpd' }}"

  tasks:
    - name: Converge | Check whether the handler test already ran
      ansible.builtin.stat:
        path: /root/apache-handler-test.json
      register: __converge_handler_marker

    - name: Converge | Skip the handler test on later runs
      ansible.builtin.meta: end_host
      when: __converge_handler_marker.stat.exists

    - name: Converge | Read the Apache main PID before the change
      ansible.builtin.systemd_service:
        name: '{{ __converge_apache_service }}'
      register: __converge_pid_before

    - name: Converge | Read the Apache journal before the change
      ansible.builtin.command:
        argv: ['journalctl', '-u', '{{ __converge_apache_service }}', '-o', 'cat', '--no-pager']
      register: __converge_reloads_before
      changed_when: false

    - name: Converge | Change httpd.conf without touching the MPM  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        apache_timeout: 61

    - name: Converge | Run handlers for the configuration change
      ansible.builtin.meta: flush_handlers

    - name: Converge | Read the Apache main PID after the reload
      ansible.builtin.systemd_service:
        name: '{{ __converge_apache_service }}'
      register: __converge_pid_reload

    - name: Converge | Read the Apache journal after the configuration change
      ansible.builtin.command:
        argv: ['journalctl', '-u', '{{ __converge_apache_service }}', '-o', 'cat', '--no-pager']
      register: __converge_reloads_reload
      changed_when: false

    # The MPM switch also changes the main configuration, so it notifies both
    # the restart and the reload handler; only the restart may run.

    - name: Converge | Switch the MPM  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        apache_mpm_module: 'worker'

    - name: Converge | Run handlers for the MPM change
      ansible.builtin.meta: flush_handlers

    - name: Converge | Read the Apache main PID after the restart
      ansible.builtin.systemd_service:
        name: '{{ __converge_apache_service }}'
      register: __converge_pid_restart

    - name: Converge | Read the Apache journal after the MPM change
      ansible.builtin.command:
        argv: ['journalctl', '-u', '{{ __converge_apache_service }}', '-o', 'cat', '--no-pager']
      register: __converge_reloads_restart
      changed_when: false

    # Emptying the limit must remove the drop-in and bring the default limit
    # back, which only a restart applies.
    - name: Converge | Drop the open file limit  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        apache_limit_nofile: ''

    - name: Converge | Run handlers for the limit removal
      ansible.builtin.meta: flush_handlers

    - name: Converge | Check the drop-in after the limit removal
      ansible.builtin.stat:
        path: '/etc/systemd/system/{{ __converge_apache_service }}.service.d/limits.conf'
      register: __converge_dropin_removed

    - name: Converge | Read the Apache main PID without the limit
      ansible.builtin.systemd_service:
        name: '{{ __converge_apache_service }}'
      register: __converge_pid_unlimited

    - name: Converge | Read the open file limit without the drop-in
      ansible.builtin.command:
        argv: ['grep', 'Max open files', '/proc/{{ __converge_pid_unlimited.status.MainPID }}/limits']
      register: __converge_nofile_unlimited
      changed_when: false

    # ServerLimit is read only at startup, so a change must restart Apache
    # even though only httpd.conf changes. MPM and open file limit stay as in
    # the previous step, so ServerLimit is the only reason for a restart.
    - name: Converge | Change the ServerLimit  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        apache_limit_nofile: ''
        apache_mpm_server_limit: 24

    - name: Converge | Run handlers for the ServerLimit change
      ansible.builtin.meta: flush_handlers

    - name: Converge | Read the Apache main PID after the ServerLimit change
      ansible.builtin.systemd_service:
        name: '{{ __converge_apache_service }}'
      register: __converge_pid_server_limit

    # Switching SSL off removes mod_ssl from the main configuration while the
    # SSL vhosts that use it are only pruned later in the same run (exclusive
    # mode). The configuration test must run after the prune, or this include
    # fails on the stale vhosts. With HTTP/2 off as well and no SSL vhost
    # left, nothing enables HTTP/2 and mod_http2 must be unloaded. HTTP/2 is
    # switched off with the string 'false', as -e apache_http2_enabled=false
    # passes it; the next step covers the boolean.
    - name: Converge | Switch SSL and HTTP/2 off and drop the SSL vhosts  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        apache_limit_nofile: ''
        apache_mpm_server_limit: 24
        apache_ssl_enabled: false
        apache_http2_enabled: 'false'
        apache_vhosts_ssl: []

    - name: Converge | Run handlers for the SSL removal
      ansible.builtin.meta: flush_handlers

    # The EL apachectl wrapper rejects -M; Debian's apache2 binary needs the
    # environment apache2ctl sets up.
    - name: Converge | Read the loaded modules without HTTP/2
      ansible.builtin.command:
        cmd: "{{ 'apache2ctl' if ansible_facts['os_family'] == 'Debian' else 'httpd' }} -M"
      register: __converge_modules_without_http2
      changed_when: false

    # Server default off, only php.example.local enables HTTP/2: mod_http2
    # must be loaded for that vhost alone, which then carries its own
    # Protocols line and negotiates h2, while the inheriting vhost stays on
    # HTTP/1.1.
    - name: Converge | Enable HTTP/2 for one vhost only  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        apache_limit_nofile: ''
        apache_mpm_server_limit: 24
        apache_http2_enabled: false
        apache_vhosts_ssl:
          - server_name: 'present.example.local'
            certificate_file: '/etc/ssl/test/present.crt'
            certificate_key_file: '/etc/ssl/test/present.key'
          - server_name: 'php.example.local'
            document_root: '/var/www/php-test'
            certificate_file: '/etc/ssl/test/present.crt'
            certificate_key_file: '/etc/ssl/test/present.key'
            http2: true

    - name: Converge | Run handlers for the per-vhost HTTP/2
      ansible.builtin.meta: flush_handlers

    - name: Converge | Read the loaded modules with HTTP/2 for one vhost
      ansible.builtin.command:
        cmd: "{{ 'apache2ctl' if ansible_facts['os_family'] == 'Debian' else 'httpd' }} -M"
      register: __converge_modules_vhost_http2
      changed_when: false

    - name: Converge | Read the vhost that enables HTTP/2
      ansible.builtin.slurp:
        src: "{{ {'Debian': '/etc/apache2/sites-available', 'RedHat': '/etc/httpd/conf.d',
                  'Archlinux': '/etc/httpd/conf/vhosts'}[ansible_facts['os_family']] }}/php.example.local-ssl.conf"
      register: __converge_vhost_http2_conf

    # After an h2 handshake the server sends a binary SETTINGS frame, which
    # is not valid text; only the ALPN line is kept.
    - name: Converge | Negotiate the protocol with HTTP/2 for one vhost
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          openssl s_client -connect 127.0.0.1:443 -servername {{ item }} \
            -alpn h2,http/1.1 < /dev/null 2> /dev/null \
            | grep -a -E '^(ALPN protocol|No ALPN)'
        executable: /bin/bash
      loop:
        - 'present.example.local'
        - 'php.example.local'
      register: __converge_alpn_vhost_http2
      changed_when: false

    - name: Converge | Restore the converged configuration  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    - name: Converge | Run handlers for the restore
      ansible.builtin.meta: flush_handlers

    - name: Converge | Record the PIDs for verify.yml
      ansible.builtin.copy:
        content: "{{ __converge_pids | to_json }}\n"
        dest: /root/apache-handler-test.json
        owner: root
        group: root
        mode: '0600'
      vars:
        __converge_pids:
          before: '{{ __converge_pid_before.status.MainPID }}'
          reload: '{{ __converge_pid_reload.status.MainPID }}'
          restart: '{{ __converge_pid_restart.status.MainPID }}'
          reloads_before: >-
            {{ __converge_reloads_before.stdout_lines | select('match', 'Reloading') | list | length }}
          reloads_reload: >-
            {{ __converge_reloads_reload.stdout_lines | select('match', 'Reloading') | list | length }}
          reloads_restart: >-
            {{ __converge_reloads_restart.stdout_lines | select('match', 'Reloading') | list | length }}
          dropin_removed: '{{ not __converge_dropin_removed.stat.exists }}'
          nofile_without_dropin: '{{ __converge_nofile_unlimited.stdout.split()[3] }}'
          unlimited: '{{ __converge_pid_unlimited.status.MainPID }}'
          server_limit: '{{ __converge_pid_server_limit.status.MainPID }}'
          http2_loaded_without_users: "{{ 'http2_module' in __converge_modules_without_http2.stdout }}"
          http2_loaded_for_vhost: "{{ 'http2_module' in __converge_modules_vhost_http2.stdout }}"
          http2_vhost_protocols: >-
            {{ (__converge_vhost_http2_conf.content | b64decode)
               is search('(?m)^\s+Protocols h2 http/1\.1$') }}
          http2_vhost_alpn: >-
            {{ dict(__converge_alpn_vhost_http2.results | map(attribute='item')
                    | zip(__converge_alpn_vhost_http2.results | map(attribute='stdout')
                          | map('regex_search', 'ALPN protocol: (\S+)', '\1')
                          | map('default', ['none'], true) | map('first'))) }}
