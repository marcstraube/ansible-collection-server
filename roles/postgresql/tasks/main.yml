---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

# The deprecated retention in days maps onto the number of dumps; the
# replacement is the only name the tasks and templates use.
- name: Main | Handle the deprecated postgresql_backup_retention
  ansible.builtin.set_fact:
    postgresql_backup_keep: '{{ postgresql_backup_retention | default(postgresql_backup_keep) | int }}'
  when: postgresql_backup_retention is defined
  tags:
    - always

- name: Main | Warn about the deprecated postgresql_backup_schedule
  ansible.builtin.debug:
    msg: >-
      postgresql_backup_schedule is deprecated and will be removed in the
      next major version. While it is set, the backup runs from a cron job
      instead of postgresql-backup.timer. Use postgresql_backup_on_calendar
      instead.
  when:
    - postgresql_enabled | bool
    - postgresql_backup_schedule is defined
  tags:
    - always

- name: Main | Warn about the deprecated postgresql_backup_retention
  ansible.builtin.debug:
    msg: >-
      postgresql_backup_retention is deprecated and will be removed in the
      next major version. Its value now counts dumps per database instead
      of days. Use postgresql_backup_keep instead.
  when:
    - postgresql_enabled | bool
    - postgresql_backup_retention is defined
  tags:
    - always

- name: Main | Validate package source
  ansible.builtin.assert:
    that:
      - postgresql_repo in ['distro', 'pgdg']
    fail_msg: >-
      postgresql_repo must be 'distro' or 'pgdg'.
      Got: {{ postgresql_repo }}
  when: postgresql_enabled | bool
  tags:
    - always

- name: Main | Validate package update settings
  ansible.builtin.assert:
    that:
      - postgresql_packages_state in ['present', 'latest']
      - postgresql_packages_minimum is string
    fail_msg: >-
      postgresql_packages_state must be 'present' or 'latest' (got
      '{{ postgresql_packages_state }}'), postgresql_packages_minimum must be
      a version string, e.g. '17.7'
  when: postgresql_enabled | bool
  tags:
    - always

- name: Main | Validate backup settings
  ansible.builtin.assert:
    that:
      - postgresql_backup_keep | int >= 1
      - postgresql_backup_schedule | default('') | length == 0
        or postgresql_backup_schedule.split() | length == 5
      - postgresql_restore is string
    fail_msg: >-
      postgresql_backup_keep must be at least 1 (got
      '{{ postgresql_backup_keep }}'), the deprecated
      postgresql_backup_schedule a cron expression with five fields (got
      '{{ postgresql_backup_schedule | default('') }}') and
      postgresql_restore the file name of a dump.
  when: postgresql_enabled | bool
  tags:
    - always

# Guard against an unintended major-version upgrade: a cluster of another
# version at a different path (a change of postgresql_repo or
# postgresql_version on an installed host) would get a second, empty
# cluster next to it, and both would claim the same port.
- name: Main | Check for the cluster root directory
  ansible.builtin.stat:
    path: '{{ __postgresql_cluster_root }}'
  register: __postgresql_cluster_root_stat
  when: postgresql_enabled | bool
  tags:
    - always

- name: Main | Find clusters below the cluster root
  ansible.builtin.find:
    paths: '{{ __postgresql_cluster_root }}'
    patterns: PG_VERSION
    recurse: true
    depth: 3
  register: __postgresql_cluster_scan
  when:
    - postgresql_enabled | bool
    - __postgresql_cluster_root_stat.stat.exists
  tags:
    - always

- name: Main | Assert no cluster exists outside the managed data directory
  ansible.builtin.assert:
    that:
      - __postgresql_foreign_clusters | length == 0
    fail_msg: |
      Found PostgreSQL cluster(s) outside the managed data directory
      {{ __postgresql_data_dir }}:

      {% for cluster in __postgresql_foreign_clusters %}
        - {{ cluster }}
      {% endfor %}

      This happens when postgresql_repo or postgresql_version changes on a
      host with an existing cluster. The role does not perform major
      version upgrades. Either restore the previous values, or upgrade the
      cluster by hand (pg_upgrade / pg_upgradecluster) and remove the old
      data directory afterwards.
  vars:
    __postgresql_foreign_clusters: >-
      {{ __postgresql_cluster_scan.files | default([])
         | map(attribute='path') | map('dirname')
         | reject('equalto', __postgresql_data_dir) | list }}
  when: postgresql_enabled | bool
  tags:
    - always

- name: Main | Import repository tasks
  ansible.builtin.import_tasks: repos.yml
  when:
    - postgresql_enabled | bool
    - postgresql_repo == 'pgdg'
  tags:
    - postgresql
    - postgresql:install

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: postgresql_enabled | bool
  tags:
    - postgresql
    - postgresql:install

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: postgresql_enabled | bool
  tags:
    - postgresql
    - postgresql:configure

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: postgresql_enabled | bool
  tags:
    - postgresql
    - postgresql:service

- name: Main | Import users tasks
  ansible.builtin.import_tasks: users.yml
  when: postgresql_enabled | bool
  tags:
    - postgresql
    - postgresql:users

- name: Main | Import databases tasks
  ansible.builtin.import_tasks: databases.yml
  when: postgresql_enabled | bool
  tags:
    - postgresql
    - postgresql:databases

- name: Main | Import backup tasks
  ansible.builtin.import_tasks: backup.yml
  when: postgresql_enabled | bool
  tags:
    - postgresql
    - postgresql:backup

- name: Main | Import restore tasks
  ansible.builtin.import_tasks: restore.yml
  when:
    - postgresql_enabled | bool
    - postgresql_restore | length > 0
  tags:
    - postgresql
    - postgresql:restore

- name: Main | Include firewall tasks
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - postgresql
        - postgresql:firewall
  when:
    - postgresql_enabled | bool
    - postgresql_firewalld_enabled | bool
  tags:
    - postgresql
    - postgresql:firewall
