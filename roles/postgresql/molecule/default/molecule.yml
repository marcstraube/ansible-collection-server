---
driver:
  name: podman
platforms:
  - name: postgresql-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postgresql-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postgresql-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: postgresql-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Shared by converge and verify: the OS vars derive package names,
        # service name and paths from it.
        postgresql_repo: 'distro'
        # Shared by converge, side_effect and verify: side_effect runs the
        # backup service once next to two older dumps per name, verify
        # expects the rotation to leave the new dump only and restores it.
        postgresql_backup_enabled: true
        postgresql_backup_keep: 1
    host_vars:
      postgresql-archlinux:
        ansible_python_interpreter: /usr/bin/python
      postgresql-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
        # Non-default port: converge, idempotence, the backup run of
        # side_effect and the restore of verify connect on it; the other
        # platforms keep the default.
        postgresql_port: 5433
      postgresql-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
        # The deprecated retention has to take effect until its removal and
        # maps onto the count: verify expects the rotation of keep 1.
        postgresql_backup_keep: 3
        postgresql_backup_retention: 1
      postgresql-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
