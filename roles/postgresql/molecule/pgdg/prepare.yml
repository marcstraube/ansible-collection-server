---
# Same container preparation as the default scenario, without enabling an
# AppStream module stream: the packages come from PGDG.
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Debian:
        - systemd
        - dbus
        - procps
        - locales
      RedHat:
        - systemd
        - dbus
        - procps-ng
        - glibc-langpack-en

  tasks:
    # Sudo PAM bypass — required for tasks using `become_user` on
    # geerlingguy Rocky containers under GitHub-hosted runners
    # (test container only).

    - name: Prepare | Bypass sudo PAM stack (RedHat container)
      ansible.builtin.copy:
        content: |
          #%PAM-1.0
          auth       sufficient   pam_permit.so
          account    sufficient   pam_permit.so
          password   sufficient   pam_permit.so
          session    sufficient   pam_permit.so
        dest: /etc/pam.d/sudo
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Disable sudoers authentication (RedHat container)
      ansible.builtin.copy:
        content: 'Defaults !authenticate'
        dest: /etc/sudoers.d/molecule-no-auth
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5

    - name: Prepare | Generate en_US.UTF-8 locale (Debian)
      community.general.locale_gen:
        name: en_US.UTF-8
        state: present
      when: ansible_facts['os_family'] == 'Debian'
