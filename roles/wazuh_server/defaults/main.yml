---
#
# Role Control
#

# Enable the wazuh_server role
wazuh_server_enabled: false

#
# Installation
#
# All-in-one deployment: Wazuh indexer, Wazuh manager, Filebeat and
# Wazuh dashboard on a single host.

# Wazuh release, pins the indexer, manager and dashboard packages
wazuh_server_version: '4.14.10'

# Filebeat OSS release the Wazuh module supports
wazuh_server_filebeat_version: '7.10.2'

# Wazuh Filebeat module release
wazuh_server_filebeat_module_version: '0.5'

#
# Updates
#
# A wazuh_server_version (or wazuh_server_filebeat_version) that differs
# from the installed packages fails the run unless the update is requested.
# The update follows the upstream order: indexer snapshot and backup set,
# Filebeat and dashboard stopped, indexer with the shard allocation limited
# to primaries, manager with the Filebeat module and alerts template, then
# the dashboard. Wazuh does not support a downgrade; a lower version fails
# the run.

# Update the installed Wazuh packages to wazuh_server_version. Pass it with
# the update command instead of setting it in inventory:
#   --tags wazuh-server -e wazuh_server_update=true
wazuh_server_update: false

# Update without the indexer snapshot. Without
# wazuh_server_indexer_snapshot_path the update fails before any change
# unless this is true.
wazuh_server_update_skip_snapshot: false

# Directory for the backup sets taken before an update. A set
# wazuh-<version>-<timestamp> holds /var/ossec/etc (agent keys, local rules
# and decoders, enrollment key) and the indexer security configuration.
wazuh_server_update_backup_path: '/var/backups/wazuh'

# Backup sets and pre-update snapshots (update-<version>-<timestamp>) to
# keep; the oldest beyond it are deleted
wazuh_server_update_backup_keep: 3

#
# Certificates
#
# Paths on the managed host to PEM files issued by one CA, for example
# deployed by marcstraube.common.pki. The role copies them into the
# certificate directory of each component and converts the private keys to
# PKCS#8. The subjects of the node and admin certificates become
# plugins.security.nodes_dn and plugins.security.authcz.admin_dn.

# CA certificate that issued all certificates below
wazuh_server_ca_cert_file: ''

# Indexer node certificate and key, also served by the dashboard on HTTPS
wazuh_server_node_cert_file: ''
wazuh_server_node_key_file: ''

# Admin client certificate and key for the security plugin (securityadmin)
wazuh_server_admin_cert_file: ''
wazuh_server_admin_key_file: ''

# Dashboard certificate and key, defaults to the node certificate
wazuh_server_dashboard_cert_file: '{{ wazuh_server_node_cert_file }}'
wazuh_server_dashboard_key_file: '{{ wazuh_server_node_key_file }}'

#
# Credentials
#
# Required. Keep them in an Ansible Vault. The role replaces the internal
# users of the indexer with 'admin' and 'kibanaserver' and sets the
# passwords of the Wazuh API users 'wazuh' and 'wazuh-wui'. A changed
# password is applied on the next run.

# Indexer user 'admin': dashboard login and Filebeat
wazuh_server_indexer_admin_password: ''

# Indexer user 'kibanaserver': dashboard backend
wazuh_server_indexer_kibanaserver_password: ''

# Wazuh API passwords: 8 to 64 characters with upper and lower case
# letters, a digit and a symbol.

# Wazuh API user 'wazuh': administrator
wazuh_server_api_wazuh_password: ''

# Wazuh API user 'wazuh-wui': dashboard access to the manager API
wazuh_server_api_wui_password: ''

#
# Wazuh Indexer
#

# Enable and start the Wazuh indexer service
wazuh_server_indexer_service_enabled: true

# Address the indexer binds to; the manager (Filebeat) and the dashboard
# run on the same host, so loopback is enough
wazuh_server_indexer_network_host: '127.0.0.1'

# HTTP port of the indexer REST API
wazuh_server_indexer_http_port: 9200

# Node and cluster name
wazuh_server_indexer_node_name: 'node-1'
wazuh_server_indexer_cluster_name: 'wazuh'

# JVM heap size (Xms and Xmx), e.g. '4g'. Empty keeps the package default.
# Upstream recommends half of the RAM, at most 32g.
wazuh_server_indexer_heap_size: ''

# Snapshots

# Directory for indexer snapshots, rendered as path.repo in opensearch.yml
# and created for the indexer user. Empty disables snapshots: the role
# removes the policy and the repository below and keeps the directory with
# its data.
wazuh_server_indexer_snapshot_path: ''

# Name of the filesystem snapshot repository
wazuh_server_indexer_snapshot_repository: 'local'

# Cron schedule and time zone of the snapshot management policy; the
# retention check runs on the same schedule
wazuh_server_indexer_snapshot_schedule: '0 2 * * *'
wazuh_server_indexer_snapshot_timezone: 'UTC'

# Number of snapshots to keep, the oldest beyond it are deleted
wazuh_server_indexer_snapshot_max_count: 14

#
# Wazuh Manager
#

# Enable and start the Wazuh manager service
wazuh_server_manager_service_enabled: true

#
# Agent Enrollment
#
# The enrollment service wazuh-authd (port 1515/tcp) registers new agents,
# see marcstraube.common.wazuh_agent. It serves the node certificate, so
# agents verify the manager with the CA of wazuh_server_ca_cert_file.

# Password agents need to enroll. Empty accepts every agent. Keep it in an
# Ansible Vault.
wazuh_server_enrollment_password: ''

# Path on the managed host to the CA certificate that issued the agent
# certificates. When set, an agent has to present a certificate signed by
# this CA to enroll. Empty enrolls agents without a certificate.
wazuh_server_enrollment_agent_ca_file: ''

# Also require the common name of the agent certificate to match the
# agent's address; only applies with wazuh_server_enrollment_agent_ca_file
wazuh_server_enrollment_verify_host: false

#
# Outgoing Proxy
#
# The manager downloads vulnerability content from the Wazuh CTI API
# (cti.wazuh.com). ossec.conf has no proxy option, so the role sets the
# proxy in the environment of the wazuh-manager service through a systemd
# drop-in. The connection to the indexer bypasses the proxy.

# HTTP proxy for outgoing requests of the manager (empty = no proxy)
# Example: http://proxy.example.com:3128
wazuh_server_http_proxy: ''

# HTTPS proxy, defaults to wazuh_server_http_proxy
wazuh_server_https_proxy: '{{ wazuh_server_http_proxy }}'

# Comma-separated hosts and addresses that bypass the proxy. The role adds
# the indexer address (wazuh_server_indexer_network_host) itself.
wazuh_server_no_proxy: 'localhost,127.0.0.1'

#
# Filebeat
#

# Enable and start the Filebeat service
wazuh_server_filebeat_service_enabled: true

#
# Wazuh Dashboard
#

# Enable and start the Wazuh dashboard service
wazuh_server_dashboard_service_enabled: true

# Address and port the dashboard listens on
wazuh_server_dashboard_server_host: '0.0.0.0'
wazuh_server_dashboard_server_port: 443

# Lifetime of a dashboard login session and its cookie in milliseconds
wazuh_server_dashboard_session_ttl: 900000

# Extend the session on every request, so it only ends after
# wazuh_server_dashboard_session_ttl without activity
wazuh_server_dashboard_session_keepalive: true

# Page the dashboard opens after the login
wazuh_server_dashboard_default_route: '/app/wz-home'

# Server address the dashboard offers for agent enrollment in the
# "Deploy new agent" wizard; empty leaves the setting out
wazuh_server_dashboard_enrollment_dns: ''
