---
# Packages pinned to wazuh_server_version / wazuh_server_filebeat_version
__wazuh_server_packages:
  - 'wazuh-indexer={{ wazuh_server_version }}-*'
  - 'wazuh-manager={{ wazuh_server_version }}-*'
  - 'filebeat={{ wazuh_server_filebeat_version }}-*'
  - 'wazuh-dashboard={{ wazuh_server_version }}-*'

# Dependencies (dashboard: debhelper, libcap2-bin; certificate handling:
# cryptography; deb822_repository: python3-debian)
__wazuh_server_dependency_packages:
  - 'ca-certificates'
  - 'debhelper'
  - 'libcap2-bin'
  - 'python3-cryptography'
  - 'python3-debian'
  - 'tar'

# Wazuh apt repository
__wazuh_server_repo_uri: 'https://packages.wazuh.com/{{ __wazuh_server_repo_major }}/apt/'
