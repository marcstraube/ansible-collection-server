---
# Wazuh package repository (one repository per major version)
__wazuh_server_repo_major: "{{ wazuh_server_version.split('.') | first }}.x"
__wazuh_server_repo_key_url: 'https://packages.wazuh.com/key/GPG-KEY-WAZUH'

# Service names (identical on every platform)
__wazuh_server_indexer_service_name: 'wazuh-indexer'
__wazuh_server_manager_service_name: 'wazuh-manager'
__wazuh_server_filebeat_service_name: 'filebeat'
__wazuh_server_dashboard_service_name: 'wazuh-dashboard'

# System users created by the packages
__wazuh_server_indexer_user: 'wazuh-indexer'
__wazuh_server_dashboard_user: 'wazuh-dashboard'

# Wazuh indexer
__wazuh_server_indexer_config_dir: '/etc/wazuh-indexer'
__wazuh_server_indexer_config_file: '{{ __wazuh_server_indexer_config_dir }}/opensearch.yml'
__wazuh_server_indexer_jvm_options_dir: '{{ __wazuh_server_indexer_config_dir }}/jvm.options.d'
__wazuh_server_indexer_heap_config_file: '{{ __wazuh_server_indexer_jvm_options_dir }}/heap.options'
__wazuh_server_indexer_certs_dir: '{{ __wazuh_server_indexer_config_dir }}/certs'
__wazuh_server_indexer_data_dir: '/var/lib/wazuh-indexer'
__wazuh_server_indexer_log_dir: '/var/log/wazuh-indexer'
__wazuh_server_indexer_home_dir: '/usr/share/wazuh-indexer'
__wazuh_server_indexer_java_home: '{{ __wazuh_server_indexer_home_dir }}/jdk'
__wazuh_server_indexer_security_config_dir: '{{ __wazuh_server_indexer_config_dir }}/opensearch-security'
__wazuh_server_indexer_security_tools_dir: '{{ __wazuh_server_indexer_home_dir }}/plugins/opensearch-security/tools'
# Indexer address for URLs and host:port pairs: an IPv6 address needs
# brackets; host names and IPv4 addresses contain no colon
__wazuh_server_indexer_address: >-
  {{ ('[' ~ wazuh_server_indexer_network_host ~ ']')
     if ':' in wazuh_server_indexer_network_host
     else wazuh_server_indexer_network_host }}
__wazuh_server_indexer_url: 'https://{{ __wazuh_server_indexer_address }}:{{ wazuh_server_indexer_http_port }}'

# Snapshot management policy that takes the scheduled snapshots; snapshot
# names start with the policy name
__wazuh_server_indexer_snapshot_policy_name: 'wazuh'
__wazuh_server_indexer_snapshot_policy_url: >-
  {{ __wazuh_server_indexer_url }}/_plugins/_sm/policies/{{ __wazuh_server_indexer_snapshot_policy_name }}
__wazuh_server_indexer_snapshot_repository_url: >-
  {{ __wazuh_server_indexer_url }}/_snapshot/{{ wazuh_server_indexer_snapshot_repository }}
# Plugin indices the snapshot management policy brings along; the plugins
# create them with one replica shard, which a single node cannot allocate
__wazuh_server_indexer_plugin_indices:
  - '.opendistro-ism-config'
  - '.opendistro-job-scheduler-lock'

# Desired snapshot management policy; the role compares the same fields of
# the stored policy with it. The retention keeps the newest
# wazuh_server_indexer_snapshot_max_count snapshots (count-based, never
# age-based) and runs on the creation schedule.
__wazuh_server_indexer_snapshot_policy:
  description: 'Scheduled snapshots of the Wazuh indexer, managed by Ansible'
  enabled: true
  creation:
    schedule:
      cron:
        expression: '{{ wazuh_server_indexer_snapshot_schedule }}'
        timezone: '{{ wazuh_server_indexer_snapshot_timezone }}'
  deletion:
    schedule:
      cron:
        expression: '{{ wazuh_server_indexer_snapshot_schedule }}'
        timezone: '{{ wazuh_server_indexer_snapshot_timezone }}'
    condition:
      max_count: '{{ wazuh_server_indexer_snapshot_max_count | int }}'
  snapshot_config:
    repository: '{{ wazuh_server_indexer_snapshot_repository }}'

# Wazuh manager API
__wazuh_server_api_url: 'https://127.0.0.1:55000'
__wazuh_server_api_wui_user: 'wazuh-wui'

# Users the manager creates on installation, with their package default
# passwords
__wazuh_server_api_users:
  - name: 'wazuh'
    password: '{{ wazuh_server_api_wazuh_password }}'
    default_password: 'wazuh'
  - name: '{{ __wazuh_server_api_wui_user }}'
    password: '{{ wazuh_server_api_wui_password }}'
    default_password: 'wazuh-wui'

# Wazuh API password policy: 8 to 64 characters with upper and lower case
# letters, a digit and a symbol
__wazuh_server_api_password_regex: '^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,64}$'

# Filebeat
__wazuh_server_filebeat_config_dir: '/etc/filebeat'
__wazuh_server_filebeat_config_file: '{{ __wazuh_server_filebeat_config_dir }}/filebeat.yml'
__wazuh_server_filebeat_certs_dir: '{{ __wazuh_server_filebeat_config_dir }}/certs'
__wazuh_server_filebeat_template_file: '{{ __wazuh_server_filebeat_config_dir }}/wazuh-template.json'
__wazuh_server_filebeat_template_url: >-
  https://raw.githubusercontent.com/wazuh/wazuh/v{{ wazuh_server_version
  }}/extensions/elasticsearch/7.x/wazuh-template.json
__wazuh_server_filebeat_module_parent_dir: '/usr/share/filebeat/module'
__wazuh_server_filebeat_module_dir: '{{ __wazuh_server_filebeat_module_parent_dir }}/wazuh'
__wazuh_server_filebeat_module_url: >-
  https://packages.wazuh.com/{{ __wazuh_server_repo_major
  }}/filebeat/wazuh-filebeat-{{ wazuh_server_filebeat_module_version }}.tar.gz

# Wazuh dashboard
__wazuh_server_dashboard_config_dir: '/etc/wazuh-dashboard'
__wazuh_server_dashboard_config_file: '{{ __wazuh_server_dashboard_config_dir }}/opensearch_dashboards.yml'
__wazuh_server_dashboard_certs_dir: '{{ __wazuh_server_dashboard_config_dir }}/certs'
__wazuh_server_dashboard_keystore_bin: '/usr/share/wazuh-dashboard/bin/opensearch-dashboards-keystore'
__wazuh_server_dashboard_plugin_config_dir: '/usr/share/wazuh-dashboard/data/wazuh/config'
__wazuh_server_dashboard_plugin_config_file: '{{ __wazuh_server_dashboard_plugin_config_dir }}/wazuh.yml'

# Wazuh manager; wazuh-authd resolves relative paths from the installation
# directory
__wazuh_server_manager_dir: '/var/ossec'
__wazuh_server_manager_group: 'wazuh'
__wazuh_server_manager_config_file: '{{ __wazuh_server_manager_dir }}/etc/ossec.conf'
__wazuh_server_enrollment_password_file: '{{ __wazuh_server_manager_dir }}/etc/authd.pass'
__wazuh_server_manager_keystore_bin: '{{ __wazuh_server_manager_dir }}/bin/wazuh-keystore'
__wazuh_server_manager_keystore_hash_file: '{{ __wazuh_server_manager_dir }}/etc/indexer-keystore.sha512'

# Indexer credentials of the manager: the admin user, like Filebeat
__wazuh_server_manager_indexer_credentials:
  username: 'admin'
  password: '{{ wazuh_server_indexer_admin_password }}'
__wazuh_server_manager_keystore_hash_value: >-
  {{ (__wazuh_server_manager_indexer_credentials.username ~ ':'
      ~ __wazuh_server_manager_indexer_credentials.password) | hash('sha512') }}
__wazuh_server_enrollment_cert_path: 'etc/authd-node.pem'
__wazuh_server_enrollment_key_path: 'etc/authd-node-key.pem'
__wazuh_server_enrollment_agent_ca_path: 'etc/authd-agent-ca.pem'

# Systemd drop-in with the outgoing proxy of the manager
__wazuh_server_manager_dropin_dir: '/etc/systemd/system/{{ __wazuh_server_manager_service_name }}.service.d'
__wazuh_server_manager_proxy_dropin_file: '{{ __wazuh_server_manager_dropin_dir }}/proxy.conf'

# Hosts that bypass the proxy of the manager: wazuh_server_no_proxy plus
# the indexer address, so the indexer connection never goes through the proxy
__wazuh_server_manager_no_proxy: >-
  {{ (wazuh_server_no_proxy.split(',') + [wazuh_server_indexer_network_host])
     | map('trim') | reject('equalto', '') | unique | join(',') }}

# <auth> elements of ossec.conf the role sets
__wazuh_server_enrollment_options:
  use_password: "{{ (wazuh_server_enrollment_password | length > 0) | ternary('yes', 'no') }}"
  ssl_verify_host: "{{ wazuh_server_enrollment_verify_host | bool | ternary('yes', 'no') }}"
  ssl_manager_cert: '{{ __wazuh_server_enrollment_cert_path }}'
  ssl_manager_key: '{{ __wazuh_server_enrollment_key_path }}'

# Certificate file names inside the component certificate directories
__wazuh_server_ca_cert_name: 'root-ca.pem'
__wazuh_server_node_cert_name: 'node.pem'
__wazuh_server_node_key_name: 'node-key.pem'
__wazuh_server_admin_cert_name: 'admin.pem'
__wazuh_server_admin_key_name: 'admin-key.pem'
__wazuh_server_dashboard_cert_name: 'dashboard.pem'
__wazuh_server_dashboard_key_name: 'dashboard-key.pem'

# RFC 4514 short names for the subject attributes of the node and admin
# certificates; the security plugin compares the DNs in this notation
__wazuh_server_dn_attribute_names:
  commonName: 'CN'
  organizationalUnitName: 'OU'
  organizationName: 'O'
  localityName: 'L'
  stateOrProvinceName: 'ST'
  countryName: 'C'
  domainComponent: 'DC'

# Package names (identical on every platform), held at the installed
# version against a system upgrade
__wazuh_server_package_names:
  - 'wazuh-indexer'
  - 'wazuh-manager'
  - 'filebeat'
  - 'wazuh-dashboard'

# Pinned package specifications in install order (OS vars define the map)
__wazuh_server_packages: '{{ __wazuh_server_package_names | map("extract", __wazuh_server_package_specs) | list }}'

# Configured version of each package
__wazuh_server_expected_versions:
  wazuh-indexer: '{{ wazuh_server_version }}'
  wazuh-manager: '{{ wazuh_server_version }}'
  filebeat: '{{ wazuh_server_filebeat_version }}'
  wazuh-dashboard: '{{ wazuh_server_version }}'

# Installed packages of the role and their versions without the package
# release
__wazuh_server_installed_names: >-
  {{ __wazuh_server_package_names | select('in', ansible_facts.packages | default({})) | list }}
__wazuh_server_installed_versions: >-
  {{ dict(__wazuh_server_installed_names
          | zip(__wazuh_server_installed_names
                | map('extract', ansible_facts.packages)
                | map('first')
                | map(attribute='version')
                | map('regex_replace', '-.*$', ''))) }}

# Installed packages whose version differs from the configured one
__wazuh_server_version_mismatches: >-
  {{ __wazuh_server_installed_names
     | zip(__wazuh_server_installed_names | map('extract', __wazuh_server_expected_versions))
     | map('join', '=')
     | difference(__wazuh_server_installed_names
                  | zip(__wazuh_server_installed_names | map('extract', __wazuh_server_installed_versions))
                  | map('join', '='))
     | map('regex_replace', '=.*$', '')
     | list }}

# Update: names of the pre-update backup sets and snapshots. The snapshot
# names must not start with the snapshot policy name, whose retention would
# delete them.
__wazuh_server_update_backup_prefix: 'wazuh-'
__wazuh_server_update_snapshot_prefix: 'update-'
__wazuh_server_cluster_settings_url: '{{ __wazuh_server_indexer_url }}/_cluster/settings'
# Wrapper of the Filebeat package with the paths of the Wazuh installation
__wazuh_server_filebeat_bin: '/usr/bin/filebeat'
