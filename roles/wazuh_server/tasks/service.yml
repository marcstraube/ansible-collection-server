---
# Start order follows the data flow: the indexer first, then the manager
# and Filebeat that write into it, the dashboard last.

- name: Service | Manage Wazuh indexer service
  ansible.builtin.systemd_service:
    name: '{{ __wazuh_server_indexer_service_name }}'
    enabled: "{{ wazuh_server_indexer_service_enabled | bool }}"
    state: "{{ wazuh_server_indexer_service_enabled | bool | ternary('started', 'stopped') }}"
    daemon_reload: true

- name: Service | Manage Wazuh manager service
  ansible.builtin.systemd_service:
    name: '{{ __wazuh_server_manager_service_name }}'
    enabled: "{{ wazuh_server_manager_service_enabled | bool }}"
    state: "{{ wazuh_server_manager_service_enabled | bool | ternary('started', 'stopped') }}"

- name: Service | Manage Filebeat service
  ansible.builtin.systemd_service:
    name: '{{ __wazuh_server_filebeat_service_name }}'
    enabled: "{{ wazuh_server_filebeat_service_enabled | bool }}"
    state: "{{ wazuh_server_filebeat_service_enabled | bool | ternary('started', 'stopped') }}"

- name: Service | Manage Wazuh dashboard service
  ansible.builtin.systemd_service:
    name: '{{ __wazuh_server_dashboard_service_name }}'
    enabled: "{{ wazuh_server_dashboard_service_enabled | bool }}"
    state: "{{ wazuh_server_dashboard_service_enabled | bool | ternary('started', 'stopped') }}"
