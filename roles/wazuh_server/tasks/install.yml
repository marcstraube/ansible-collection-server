---
# A Wazuh update has to follow the upstream order (indexer, manager,
# dashboard) with the indexer shard allocation limited in between. A
# changed wazuh_server_version on a host with Wazuh installed fails here
# with both versions, unless wazuh_server_update requests the update
# (update.yml). Tagged always so that every stage sees the same
# precondition.
# The packages are held at the installed version so that a system upgrade
# cannot move them either. Only the update releases the hold, one package
# at a time.
- name: Install | Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - always

# Wazuh does not support a downgrade, with or without the update
- name: Install | Assert no Wazuh package is newer than the configured version
  ansible.builtin.assert:
    that:
      - __wazuh_server_installed_versions[item]
        is version(__wazuh_server_expected_versions[item], '<=')
    fail_msg: >-
      {{ item }} {{ __wazuh_server_installed_versions[item] }} is installed,
      newer than the configured {{ __wazuh_server_expected_versions[item] }}.
      Wazuh does not support a downgrade; set wazuh_server_version and
      wazuh_server_filebeat_version to the installed versions.
    quiet: true
  loop: '{{ __wazuh_server_version_mismatches }}'
  tags:
    - always

- name: Install | Include update tasks
  ansible.builtin.include_tasks:
    file: update.yml
    apply:
      tags:
        - always
  when:
    - wazuh_server_update | bool
    - __wazuh_server_version_mismatches | length > 0
    - not ansible_check_mode
  tags:
    - always

# Check mode does not run the update; it reports the pending one instead
- name: Install | Report pending Wazuh update
  ansible.builtin.debug:
    msg: >-
      Would update {{ item }} from {{ __wazuh_server_installed_versions[item] }}
      to {{ __wazuh_server_expected_versions[item] }}
  loop: '{{ __wazuh_server_version_mismatches }}'
  changed_when: true
  when:
    - wazuh_server_update | bool
    - ansible_check_mode
  tags:
    - always

# filebeat is checked against wazuh_server_filebeat_version: the hold below
# would otherwise fail a changed version with a package manager error.
# After an update the facts are current again (update.yml), so this also
# checks the result of the update.
- name: Install | Assert installed Wazuh versions match the configured versions
  ansible.builtin.assert:
    that:
      - __wazuh_server_version_mismatches | length == 0
        or (wazuh_server_update | bool and ansible_check_mode)
    fail_msg: |
      Installed Wazuh packages differ from the configured versions:

      {% for package in __wazuh_server_version_mismatches %}
      {% set installed = __wazuh_server_installed_versions[package] %}
        - {{ package }} {{ installed }}, configured {{ __wazuh_server_expected_versions[package] }}
      {% endfor %}

      Pass -e wazuh_server_update=true to update Wazuh in the upstream
      order, or restore the previous wazuh_server_version and
      wazuh_server_filebeat_version.
  tags:
    - always

- name: Install | Dependency packages
  ansible.builtin.package:
    name: '{{ __wazuh_server_dependency_packages }}'
    state: present
  retries: 3
  delay: 5
  register: __wazuh_server_dependencies

# The Wazuh repo file check (repos.yml) only exists on RedHat; everywhere
# else the gate falls through.
# The hold (versionlock) from an earlier run does not get in the way: the
# assertion above guarantees that the installed packages already match the
# pinned versions, so the install changes nothing on a held package and
# needs no option to bypass the hold.
- name: Install | Wazuh packages
  ansible.builtin.package:
    name: '{{ __wazuh_server_packages }}'
    state: present
  retries: 3
  delay: 5
  register: __wazuh_server_install
  # In check mode a pending update leaves the held packages at the
  # installed version
  when:
    - __wazuh_server_repo_stat.stat.exists | default(true)
    - not (ansible_check_mode and __wazuh_server_version_mismatches | length > 0)
  notify:
    - Reload Wazuh systemd units

# Not a handler: the hold tasks below need the new packages in the facts
- name: Install | Refresh package facts after install  # noqa: no-handler
  ansible.builtin.package_facts:
    manager: auto
  when: __wazuh_server_install is changed

# Only an installed package can be held. In check mode the install above
# changes nothing, so the packages (or the versionlock plugin) may be
# missing.
- name: Install | Hold Wazuh packages (Debian)
  ansible.builtin.dpkg_selections:
    name: '{{ item }}'
    selection: hold
  loop: '{{ __wazuh_server_package_names | select("in", ansible_facts.packages) | list }}'
  when: ansible_facts['os_family'] == 'Debian'

- name: Install | Lock Wazuh package versions (RedHat)
  community.general.dnf_versionlock:
    name: '{{ __wazuh_server_installed_package_names }}'
    state: present
  vars:
    __wazuh_server_installed_package_names: >-
      {{ __wazuh_server_package_names | select('in', ansible_facts.packages) | list }}
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - __wazuh_server_installed_package_names | length > 0
    - not (ansible_check_mode and __wazuh_server_dependencies is changed)
