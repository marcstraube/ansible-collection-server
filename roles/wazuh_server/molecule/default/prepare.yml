---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Debian:
        - systemd
        - dbus
        - procps
        - gnupg
        - ca-certificates
        - openssl
      RedHat:
        - systemd
        - dbus
        - procps-ng
        - openssl

  tasks:
    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5

    # systemd caps each service at DefaultTasksMax of the container's pids
    # limit (podman: 2048). Debian ships 15%, which leaves the manager too few
    # threads for wazuh-modulesd; EL ships 80%. Use 80% everywhere.
    - name: Prepare | Create systemd manager drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Prepare | Raise systemd DefaultTasksMax
      ansible.builtin.copy:
        content: |
          [Manager]
          DefaultTasksMax=80%
        dest: /etc/systemd/system.conf.d/50-molecule-tasks-max.conf
        owner: root
        group: root
        mode: '0644'

    - name: Prepare | Reload systemd manager configuration
      ansible.builtin.systemd_service:
        daemon_reexec: true

    # The certificates the role consumes, issued by a local CA through
    # marcstraube.common.pki — the documented way to provide them.

    - name: Prepare | Issue test certificates
      ansible.builtin.include_role:
        name: marcstraube.common.pki
      vars:
        pki_enabled: true
        pki_system_config_enabled: false
        pki_ca_enabled: true
        pki_ca_organization: 'Wazuh Test'
        pki_ca_common_name: 'Wazuh Test Root CA'
        pki_ca_passphrase: ''
        pki_server_certs:
          - name: 'wazuh-node'
            common_name: 'wazuh-node'
            san:
              - 'DNS:localhost'
              - 'IP:127.0.0.1'
            sign_with_ca: true
        pki_client_certs:
          - name: 'wazuh-admin'
            common_name: 'admin'
          - name: 'wazuh-agent'
            common_name: 'wazuh-agent-test'
