---
driver:
  name: podman
platforms:
  - name: wazuh-server-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: wazuh-server-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: wazuh-server-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Shared by converge and verify
        wazuh_server_indexer_admin_password: 'Admin-Test-Pass1'
        wazuh_server_indexer_kibanaserver_password: 'Kibana-Test-Pass1'
        wazuh_server_api_wazuh_password: 'Wazuh-Test-Pass1'
        wazuh_server_api_wui_password: 'Wui-Test-Pass1'
        wazuh_server_dashboard_enrollment_dns: 'wazuh.example.com'
        wazuh_server_enrollment_password: 'Enroll-Test-Pass1'
        wazuh_server_enrollment_agent_ca_file: '/etc/ssl/ca/certs/ca.crt'
        # Never contacted: nothing listens there, the manager has to start
        # anyway. side_effect.yml removes the proxy and sets it again.
        wazuh_server_http_proxy: 'http://127.0.0.1:3128'
        # Without the indexer address: the role has to add 127.0.0.1 itself
        wazuh_server_no_proxy: 'localhost'
        # Snapshots: enabled in converge, disabled again in side_effect;
        # verify checks the disabled state and the kept directory
        wazuh_server_indexer_snapshot_path: '/var/lib/wazuh-indexer-snapshots'
        wazuh_server_indexer_snapshot_repository: 'molecule'
        wazuh_server_indexer_snapshot_schedule: '30 3 * * *'
        wazuh_server_indexer_snapshot_timezone: 'Europe/Berlin'
        wazuh_server_indexer_snapshot_max_count: 7
    host_vars:
      wazuh-server-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
      wazuh-server-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
      wazuh-server-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    # Run the role once in check mode against the converged instance
    - check
    # Assert the snapshot setup, remove and restore the proxy, then disable
    # snapshots and assert that a second disabled run changes nothing
    - side_effect
    - verify
    - destroy
