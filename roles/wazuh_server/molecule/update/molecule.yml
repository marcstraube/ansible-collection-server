---
driver:
  name: podman
platforms:
  - name: wazuh-server-update-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: wazuh-server-update-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: wazuh-server-update-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    # The certificates and container preparation of the default scenario
    prepare: ../default/prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Shared by converge, side_effect and verify
        wazuh_server_enabled: true
        wazuh_server_ca_cert_file: '/etc/ssl/ca/certs/ca.crt'
        wazuh_server_node_cert_file: '/etc/ssl/certs/wazuh-node.crt'
        wazuh_server_node_key_file: '/etc/ssl/private/wazuh-node.key'
        wazuh_server_admin_cert_file: '/etc/ssl/certs/wazuh-admin.crt'
        wazuh_server_admin_key_file: '/etc/ssl/private/wazuh-admin.key'
        wazuh_server_indexer_heap_size: '512m'
        wazuh_server_indexer_admin_password: 'Admin-Test-Pass1'
        wazuh_server_indexer_kibanaserver_password: 'Kibana-Test-Pass1'
        wazuh_server_api_wazuh_password: 'Wazuh-Test-Pass1'
        wazuh_server_api_wui_password: 'Wui-Test-Pass1'
        wazuh_server_indexer_snapshot_path: '/var/lib/wazuh-indexer-snapshots'
        wazuh_server_indexer_snapshot_repository: 'molecule'
        # converge adds an older backup set and pre-update snapshot; the
        # update has to rotate both out
        wazuh_server_update_backup_keep: 1
        # Release installed first; converge updates to the role default
        wazuh_server_update_previous_version: '4.14.9'
    host_vars:
      wazuh-server-update-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
      wazuh-server-update-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
      wazuh-server-update-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    # Refused updates: a downgrade and a version the repository lacks
    - side_effect
    - verify
    - destroy
