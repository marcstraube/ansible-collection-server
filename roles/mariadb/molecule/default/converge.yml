---
# mariadb_repo, mariadb_version and mariadb_arch_package come from the
# scenario inventory (molecule.yml) so that side_effect and verify resolve
# the same packages and paths.
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    mariadb_enabled: true
    mariadb_innodb_buffer_pool_size: '64M'
    mariadb_slow_query_log: true
    mariadb_long_query_time: 5
    mariadb_databases:
      - name: testdb
    # verify.yml connects over TCP, which matches the host 127.0.0.1, not
    # localhost (the socket)
    mariadb_users:
      - name: testuser
        password: testpassword
        host: '127.0.0.1'
        priv: 'testdb.*:ALL'
    mariadb_extra_config:
      sql_mode: 'STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION'
    mariadb_backup_enabled: true

  tasks:
    - name: Converge | Include mariadb role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
