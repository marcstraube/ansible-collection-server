---
#
# AppStream Module Stream (EL 9)
#
# 10.11 and 11.8 are module streams, 10.5 is the non-modular default. A
# stream is exclusive: the role enables the requested one on a host without
# an enabled stream and fails with the switch commands when another one is
# active. The disabled state ([x]) counts as no stream.
#

- name: Install | Read the AppStream mariadb module state (EL 9)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - module
      - list
      - mariadb
  environment:
    LC_ALL: C
  register: __mariadb_module_list
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not __mariadb_upstream | bool
    - __mariadb_module_streams | length > 0

- name: Install | Record the enabled module stream (EL 9)
  ansible.builtin.set_fact:
    __mariadb_enabled_stream: >-
      {{ (__mariadb_module_list.stdout | default('')
          | regex_findall('(?m)^mariadb\s+(\S+)\s+\[e\]') + ['']) | first }}
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not __mariadb_upstream | bool
    - __mariadb_module_streams | length > 0

- name: Install | Assert the enabled module stream matches the requested version (EL 9)
  ansible.builtin.assert:
    that:
      - __mariadb_enabled_stream | length == 0 or __mariadb_enabled_stream == __mariadb_version
    fail_msg: |
      The AppStream mariadb module stream {{ __mariadb_enabled_stream }} is
      enabled, the inventory requests MariaDB {{ __mariadb_version }}.
      Module streams are exclusive. Switch the stream before rerunning the
      role (the major version guard above makes sure no server of the other
      stream is installed):

        dnf module reset -y mariadb
      {% if __mariadb_version in __mariadb_module_streams %}
        dnf module enable -y mariadb:{{ __mariadb_version }}
      {% endif %}
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not __mariadb_upstream | bool
    - __mariadb_module_streams | length > 0

- name: Install | Enable the AppStream mariadb module stream (EL 9)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - --assumeyes
      - module
      - enable
      - 'mariadb:{{ __mariadb_version }}'
  changed_when: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not __mariadb_upstream | bool
    - __mariadb_version in __mariadb_module_streams
    - __mariadb_enabled_stream | length == 0

#
# Packages
#

# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - mariadb_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  when:
    - mariadb_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  when:
    - mariadb_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed MariaDB package, not only the
# configured ones: parts pulled in as dependencies (common, errmsg, client
# utilities, libraries) pin the exact version of the server package and
# must move in the same transaction. The facts also hold the version before
# the update for the minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when: mariadb_packages_state == 'latest' or __mariadb_minimum | length > 0
  tags:
    - always

- name: Install | Set MariaDB package list
  ansible.builtin.set_fact:
    __mariadb_install_packages: >-
      {{ (__mariadb_packages
          + ((ansible_facts['packages'] | list
              | select('match', __mariadb_update_pattern) | list)
             if (mariadb_packages_state == 'latest'
                 and ansible_facts['os_family'] in ['RedHat', 'Debian'])
             else []))
         | unique | list }}

# Full version of the server package as the package manager writes it:
# [epoch:]version[-release]. package_facts reports a missing rpm epoch as
# None, which counts as no epoch like 0.
- name: Install | Record the installed MariaDB version
  ansible.builtin.set_fact:
    __mariadb_version_before: '{{ __mariadb_installed_version }}'
  vars:
    __mariadb_pkg: "{{ ansible_facts['packages'][__mariadb_server_package] | default([{}]) | first }}"
    __mariadb_installed_version: >-
      {{ ((__mariadb_pkg.epoch ~ ':')
          if ((__mariadb_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__mariadb_pkg.version | default(''))
         ~ (('-' ~ __mariadb_pkg.release) if (__mariadb_pkg.release | default('', true)) else '') }}
  when: mariadb_packages_state == 'latest' or __mariadb_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install, resolved like the install (dnf honors module streams, excludes
# and versionlock, apt honors pinning). Arch Linux installs a missing
# package from the sync database and otherwise keeps the installed version,
# which the system upgrade updates. The queries change nothing, so they
# also run under --check.
- name: Install | Query the version the update would install (RedHat)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - repoquery
      - --latest-limit=1
      - '--queryformat=%{epoch}:%{version}-%{release}'
      - '{{ __mariadb_server_package }}'
  register: __mariadb_candidate_dnf
  changed_when: false
  check_mode: false
  when:
    - __mariadb_minimum | length > 0
    - ansible_facts['os_family'] == 'RedHat'
    - mariadb_packages_state == 'latest' or __mariadb_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __mariadb_server_package }}'
  environment:
    LC_ALL: C
  register: __mariadb_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __mariadb_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - mariadb_packages_state == 'latest' or __mariadb_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the install would add (Archlinux)
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --info
      - '{{ __mariadb_server_package }}'
  environment:
    LC_ALL: C
  register: __mariadb_candidate_pacman
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - __mariadb_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __mariadb_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __mariadb_check_stage: 'pre'
    __mariadb_check_installed: '{{ __mariadb_version_before }}'
    # epoch 0 is the default and left out, as in the installed version
    __mariadb_check_candidate: >-
      {{ (((__mariadb_candidate_dnf.stdout_lines | default([])) + [''])
          | first | regex_replace('^0:', ''))
         ~ (((__mariadb_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', '')
         ~ (((__mariadb_candidate_pacman.stdout | default('')) | regex_findall('(?m)^Version *: *([^ ]+)$')) + [''])
           | first }}
  when: __mariadb_minimum | length > 0
  tags:
    - always

# The upstream repo file check (repos.yml) only exists on RedHat with
# mariadb_repo 'upstream'; everywhere else the gate falls through.
- name: Install | MariaDB packages
  ansible.builtin.package:
    name: '{{ __mariadb_install_packages }}'
    state: "{{ (ansible_facts['os_family'] == 'Archlinux') | ternary('present', mariadb_packages_state) }}"
  register: __mariadb_packages_result
  retries: 3
  delay: 5
  when: __mariadb_upstream_repo_stat.stat.exists | default(true)

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - not ansible_check_mode
    - __mariadb_minimum | length > 0
      or (mariadb_packages_state == 'latest' and (__mariadb_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated MariaDB version
  ansible.builtin.set_fact:
    __mariadb_version_after: >-
      {{ ((__mariadb_pkg.epoch ~ ':')
          if ((__mariadb_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__mariadb_pkg.version | default(''))
         ~ (('-' ~ __mariadb_pkg.release) if (__mariadb_pkg.release | default('', true)) else '') }}
  vars:
    __mariadb_pkg: "{{ ansible_facts['packages'][__mariadb_server_package] | default([{}]) | first }}"
  when:
    - not ansible_check_mode
    - __mariadb_minimum | length > 0
      or (mariadb_packages_state == 'latest' and (__mariadb_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the MariaDB version change
  ansible.builtin.debug:
    msg: >-
      {{ __mariadb_server_package }} {{ __mariadb_version_before | default('none', true) }}
      -> {{ __mariadb_version_after }}
  when:
    - not ansible_check_mode
    - mariadb_packages_state == 'latest'
    - (__mariadb_packages_result | default({})) is changed
    - __mariadb_version_before != __mariadb_version_after

#
# Restart After Update
#
# A running server keeps executing the old binary after an update. The
# packages usually restart it themselves (dpkg maintainer scripts, rpm
# scriptlets), but policy-rc.d or the systemd update helper can prevent
# that, and pacman never restarts it. With 'latest' the role restarts the
# server while it still executes a replaced binary, so an update never
# restarts it twice. The check does not depend on changed packages: a run
# that updated the packages but could not restart the server restarts it
# on the next run, and on Arch Linux the role run together with the system
# upgrade restarts a server whose binary the upgrade replaced.
#

# systemd knows the main PID on every platform; the PID file differs per
# distribution, and Arch Linux configures none
- name: Install | Read the main PID of the running server
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - '--property=MainPID'
      - '--value'
      - '{{ __mariadb_service_name }}'
  register: __mariadb_main_pid
  changed_when: false
  failed_when: false
  check_mode: false
  when: mariadb_packages_state == 'latest'

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of the running server
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __mariadb_main_pid.stdout | default("0") | trim }}/exe'
  register: __mariadb_server_exe
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - mariadb_packages_state == 'latest'
    - (__mariadb_main_pid.stdout | default('0') | trim) not in ['', '0']

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __mariadb_restart_binary: >-
      {{ ((__mariadb_main_pid.stdout | default('0') | trim) not in ['', '0'])
         and mariadb_service_enabled | bool
         and (((__mariadb_server_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and (__mariadb_packages_result | default({})) is changed)) }}
  when: mariadb_packages_state == 'latest'

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running. InnoDB rolls the redo log forward at the start, so a restart is
# the whole update for a minor release; a new major version is refused by
# the guard above before the packages change.
- name: Install | Restart MariaDB for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __mariadb_service_name }}'
    state: restarted
  when:
    - mariadb_packages_state == 'latest'
    - __mariadb_restart_binary | bool

# Post-check: the transaction can install something else than the queried
# candidate (dependencies, excludes), so the installed version is checked
# again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __mariadb_check_stage: 'post'
    __mariadb_check_installed: '{{ __mariadb_version_after }}'
    __mariadb_check_candidate: ''
  when:
    - __mariadb_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always

#
# Data Directory (Arch Linux)
#
# The Debian and EL packages initialize the data directory themselves
# (maintainer script, ExecStartPre of the service unit); the Arch Linux
# package leaves it to the administrator.
#

- name: Install | Initialize the data directory (Arch)
  ansible.builtin.command:
    argv:
      - mariadb-install-db
      - '--user={{ __mariadb_user }}'
      - '--basedir=/usr'
      - '--datadir={{ __mariadb_data_dir }}'
    creates: '{{ __mariadb_data_dir }}/mysql'
  when: ansible_facts['os_family'] == 'Archlinux'
