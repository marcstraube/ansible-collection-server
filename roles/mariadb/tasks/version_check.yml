---
# Compares the MariaDB server package with the minimum version, using the
# distribution's own version rules (epochs, Debian revisions such as
# +deb13u1, EL release strings). Passes when the installed version or the
# version the update would install meets the minimum.
#
# Input:
#   __mariadb_check_stage      'pre' (before the package task) or 'post'
#   __mariadb_check_installed  installed version, '' when not installed
#   __mariadb_check_candidate  version the update would install, '' if none
#
# A minimum without an epoch takes the epoch of the compared version: dpkg,
# rpm and vercmp treat a missing epoch as 0, and MariaDB carries epoch 1 on
# Debian and 3 on EL, so 11.8.6 would otherwise count as older than
# 1:11.8.6-0+deb13u1.

- name: Version Check | Compare with the minimum version
  ansible.builtin.command:
    argv: '{{ __mariadb_vercmp_argv[ansible_facts["os_family"]] }}'
  vars:
    __mariadb_check_minimum: >-
      {{ (item.split(':') | first ~ ':' ~ __mariadb_minimum)
         if (':' not in (__mariadb_minimum | string) and item is match('^[0-9]+:'))
         else (__mariadb_minimum | string) }}
    # dpkg answers with its exit code, rpm and vercmp print -1, 0 or 1
    __mariadb_vercmp_argv:
      Debian: ['dpkg', '--compare-versions', '{{ item }}', 'ge', '{{ __mariadb_check_minimum }}']
      RedHat: ['rpm', '--eval', '%{lua: print(rpm.vercmp("{{ item }}", "{{ __mariadb_check_minimum }}"))}']
      Archlinux: ['vercmp', '{{ item }}', '{{ __mariadb_check_minimum }}']
  loop: '{{ [__mariadb_check_installed, __mariadb_check_candidate] | select | unique | list }}'
  register: __mariadb_check_result
  changed_when: false
  failed_when: __mariadb_check_result.rc not in [0, 1]
  check_mode: false

- name: Version Check | Assert the minimum version
  ansible.builtin.assert:
    that:
      - __mariadb_check_met | length > 0
    fail_msg: >-
      mariadb_packages_minimum requires {{ __mariadb_minimum }};
      installed: {{ __mariadb_check_installed | default('none', true) }}{{
        ('; the update would install: ' ~ (__mariadb_check_candidate | default('none', true)))
        if __mariadb_check_stage == 'pre' else '' }}.
      The repository does not carry the required version yet{{
        ', nothing was changed' if __mariadb_check_stage == 'pre' else '' }}.
    success_msg: >-
      {{ __mariadb_server_package }} {{ (__mariadb_check_met + ['']) | first }} meets the
      minimum {{ __mariadb_minimum }}
  vars:
    __mariadb_check_met: >-
      {{ (__mariadb_check_result.results | default([]) | selectattr('rc', 'eq', 0) | map(attribute='item') | list)
         if ansible_facts['os_family'] == 'Debian'
         else (__mariadb_check_result.results | default([]) | selectattr('stdout', 'in', ['0', '1'])
               | map(attribute='item') | list) }}
