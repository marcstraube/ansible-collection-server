---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Validate package update settings
  ansible.builtin.assert:
    that:
      - nginx_packages_state in ['present', 'latest']
      - nginx_packages_minimum is string or nginx_packages_minimum is mapping
    fail_msg: >-
      nginx_packages_state must be 'present' or 'latest' (got
      '{{ nginx_packages_state }}'), nginx_packages_minimum must be a version
      string, e.g. '1.28.1', or a mapping per platform
  when: nginx_enabled | bool
  tags:
    - always

# A mapping selects the minimum by '<os_family>-<major>', then
# '<os_family>'. A host without a matching key fails here, before any
# change, so a platform left out of the mapping cannot pass unchecked.
- name: Main | Select the minimum version for this platform
  ansible.builtin.set_fact:
    __nginx_minimum: >-
      {{ (nginx_packages_minimum[__nginx_minimum_key] if __nginx_minimum_key | length > 0 else '')
         if nginx_packages_minimum is mapping
         else nginx_packages_minimum }}
    __nginx_minimum_key_found: '{{ nginx_packages_minimum is not mapping or __nginx_minimum_key | length > 0 }}'
  vars:
    __nginx_minimum_key: >-
      {{ ([ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version'],
           ansible_facts['os_family']]
          | select('in', nginx_packages_minimum) | list + [''])
         | first
         if nginx_packages_minimum is mapping
         else '' }}
  when: nginx_enabled | bool
  tags:
    - always

# The value reaches dpkg, rpm and vercmp as an argument; only characters of
# a package version are accepted.
- name: Main | Validate the minimum version for this platform
  ansible.builtin.assert:
    that:
      - __nginx_minimum_key_found | bool
      - __nginx_minimum | string is match('^[0-9A-Za-z.+~:_-]*$')
    fail_msg: >-
      {{ ('nginx_packages_minimum has no key for this host (expected '
          ~ ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']
          ~ ' or ' ~ ansible_facts['os_family'] ~ ')')
         if not (__nginx_minimum_key_found | bool)
         else ('nginx_packages_minimum ' ~ __nginx_minimum ~ ' is not a package version') }}
    quiet: true
  when: nginx_enabled | bool
  tags:
    - always

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: nginx_enabled | bool
  tags:
    - nginx
    - nginx:install

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: nginx_enabled | bool
  tags:
    - nginx
    - nginx:configure

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: nginx_enabled | bool
  tags:
    - nginx
    - nginx:service

- name: Main | Include firewall tasks
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - nginx
        - nginx:firewall
  when:
    - nginx_enabled | bool
    - nginx_firewalld_enabled | bool
  tags:
    - nginx
    - nginx:firewall
