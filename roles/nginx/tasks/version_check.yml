---
# Compares the nginx main package with the minimum version, using the
# distribution's own version rules (epochs, Debian revisions such as
# +deb13u10, EL release strings). Passes when the installed version or the
# version the update would install meets the minimum.
#
# Input:
#   __nginx_check_stage      'pre' (before the package task) or 'post'
#   __nginx_check_installed  installed version, '' when not installed
#   __nginx_check_candidate  version the update would install, '' if none
#
# A minimum without an epoch takes the epoch of the compared version: dpkg,
# rpm and vercmp treat a missing epoch as 0, and nginx carries epoch 2 on
# EL, so 1.28.1 would otherwise count as older than 2:1.20.1.

- name: Version Check | Compare with the minimum version
  ansible.builtin.command:
    argv: '{{ __nginx_vercmp_argv[ansible_facts["os_family"]] }}'
  vars:
    __nginx_check_minimum: >-
      {{ (item.split(':') | first ~ ':' ~ __nginx_minimum)
         if (':' not in (__nginx_minimum | string) and item is match('^[0-9]+:'))
         else (__nginx_minimum | string) }}
    # dpkg answers with its exit code, rpm and vercmp print -1, 0 or 1
    __nginx_vercmp_argv:
      Debian: ['dpkg', '--compare-versions', '{{ item }}', 'ge', '{{ __nginx_check_minimum }}']
      RedHat: ['rpm', '--eval', '%{lua: print(rpm.vercmp("{{ item }}", "{{ __nginx_check_minimum }}"))}']
      Archlinux: ['vercmp', '{{ item }}', '{{ __nginx_check_minimum }}']
  loop: '{{ [__nginx_check_installed, __nginx_check_candidate] | select | unique | list }}'
  register: __nginx_check_result
  changed_when: false
  failed_when: __nginx_check_result.rc not in [0, 1]
  check_mode: false

- name: Version Check | Assert the minimum version
  ansible.builtin.assert:
    that:
      - __nginx_check_met | length > 0
    fail_msg: >-
      nginx_packages_minimum requires {{ __nginx_minimum }};
      installed: {{ __nginx_check_installed | default('none', true) }}{{
        ('; the update would install: ' ~ (__nginx_check_candidate | default('none', true)))
        if __nginx_check_stage == 'pre' else '' }}.
      The repository does not carry the required version yet{{
        ', nothing was changed' if __nginx_check_stage == 'pre' else '' }}.
    success_msg: >-
      {{ __nginx_version_package }} {{ (__nginx_check_met + ['']) | first }} meets the
      minimum {{ __nginx_minimum }}
  vars:
    __nginx_check_met: >-
      {{ (__nginx_check_result.results | default([]) | selectattr('rc', 'eq', 0) | map(attribute='item') | list)
         if ansible_facts['os_family'] == 'Debian'
         else (__nginx_check_result.results | default([]) | selectattr('stdout', 'in', ['0', '1'])
               | map(attribute='item') | list) }}
