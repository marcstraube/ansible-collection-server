---
# nginx connects to a backend on any port only with httpd_can_network_connect;
# without it the policy only allows ports in http_port_t. A proxy site reaches
# its backend with or without an upstream definition, the Authentik location
# of a site of any type proxies to the outpost, and a stream server connects
# to its upstream. An upstream alone opens no connection, so it does not
# count.
- name: Configure | SELinux booleans
  vars:
    __nginx_selinux_sites: >-
      {{
        nginx_sites | selectattr('enabled', 'undefined') | list
        + nginx_sites | selectattr('enabled', 'defined') | selectattr('enabled') | list
      }}
    __nginx_selinux_network_connect_required: >-
      {{
        nginx_sites | selectattr('type', 'defined') | selectattr('type', 'eq', 'proxy') | list | length > 0
        or __nginx_selinux_sites | selectattr('authentik', 'defined')
           | selectattr('authentik.enabled', 'defined') | selectattr('authentik.enabled') | list | length > 0
        or (nginx_stream_enabled | bool and nginx_stream_servers | length > 0)
      }}
  block:
    - name: Configure | Assert proxies keep outbound connections allowed
      ansible.builtin.assert:
        that:
          - nginx_selinux_network_connect is not sameas false
        fail_msg: >-
          nginx_selinux_network_connect is false, but proxy sites, Authentik
          locations or stream servers need httpd_can_network_connect. Set it
          to true or null.
        success_msg: 'SELinux network setting is consistent with proxies.'
      when: __nginx_selinux_network_connect_required | bool

    # Without these, nginx and its PHP-FPM workers cannot open outbound
    # connections or submit mail. The symptom is a bare "Permission denied"
    # from the application, or a 502 from nginx, with nothing in the logs
    # pointing at SELinux. A null value leaves the boolean untouched.
    - name: Configure | Set SELinux booleans
      ansible.posix.seboolean:
        name: '{{ item.name }}'
        state: '{{ item.state | bool }}'
        persistent: true
      loop:
        - name: httpd_can_network_connect
          state: >-
            {{ true if __nginx_selinux_network_connect_required | bool
               else nginx_selinux_network_connect | default(none) }}
        - name: httpd_can_network_connect_db
          state: '{{ nginx_selinux_connect_db | default(none) }}'
        - name: httpd_can_sendmail
          state: '{{ nginx_selinux_sendmail | default(none) }}'
      loop_control:
        label: '{{ item.name }}'
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
        - item.state is not none

# The policy only lets nginx bind the TCP ports in http_port_t (80, 81, 443,
# 488, 8008, 8009, 8443 and 9000) and no UDP port. Any other port of an
# enabled site or a stream server needs the label, or nginx fails to bind it
# with "Permission denied"; a port of another type (e.g. 3306, mysqld_port_t)
# gets http_port_t instead. A site listens on listen_ssl with SSL, on listen
# without SSL or for the HTTP redirect. A stream server listens on the port
# of listen ("3306", "127.0.0.1:3306", "[::1]:3306"), on UDP with udp: true or
# the udp parameter in listen; a UNIX socket needs no label.
- name: Configure | Label additional site and stream ports for SELinux
  community.general.seport:
    ports: '{{ item.ports }}'
    proto: '{{ item.proto }}'
    setype: http_port_t
    state: present
  loop:
    - proto: tcp
      ports: >-
        {{
          (__nginx_selinux_site_ports + __nginx_selinux_stream_tcp_ports)
          | reject('in', __nginx_selinux_default_ports) | unique | list
        }}
    - proto: udp
      ports: '{{ __nginx_selinux_stream_udp_ports | unique | list }}'
  loop_control:
    label: "{{ item.proto }}: {{ item.ports | join(', ') }}"
  vars:
    __nginx_selinux_sites: >-
      {{
        nginx_sites | selectattr('enabled', 'undefined') | list
        + nginx_sites | selectattr('enabled', 'defined') | selectattr('enabled') | list
      }}
    __nginx_selinux_ssl_sites: >-
      {{
        __nginx_selinux_sites | selectattr('ssl', 'defined')
        | selectattr('ssl.enabled', 'defined') | selectattr('ssl.enabled') | list
      }}
    __nginx_selinux_site_ports: >-
      {{
        (__nginx_selinux_ssl_sites | map(attribute='listen_ssl', default=443) | list
         + __nginx_selinux_sites | reject('in', __nginx_selinux_ssl_sites)
           | map(attribute='listen', default=80) | list
         + __nginx_selinux_ssl_sites | selectattr('http_redirect', 'defined')
           | selectattr('http_redirect') | map(attribute='listen', default=80) | list)
        | map('string') | list
      }}
    __nginx_selinux_stream_servers: '{{ nginx_stream_servers if nginx_stream_enabled | bool else [] }}'
    __nginx_selinux_stream_udp_servers: >-
      {{ __nginx_selinux_stream_servers | selectattr('udp', 'defined') | selectattr('udp') | list }}
    # listen of every stream server as rendered, " udp" appended for udp: true
    __nginx_selinux_stream_listens: >-
      {{
        __nginx_selinux_stream_servers | reject('in', __nginx_selinux_stream_udp_servers)
        | map(attribute='listen') | map('string') | list
        + __nginx_selinux_stream_udp_servers | map(attribute='listen') | map('string')
          | map('regex_replace', '$', ' udp') | list
      }}
    # Port (or port range) of the address: the part after the last colon
    __nginx_selinux_stream_tcp_ports: >-
      {{
        __nginx_selinux_stream_listens | reject('search', ' udp( |$)')
        | map('split') | map('first') | map('regex_replace', '^.*:', '')
        | select('match', '^[0-9]+(-[0-9]+)?$') | list
      }}
    __nginx_selinux_stream_udp_ports: >-
      {{
        __nginx_selinux_stream_listens | select('search', ' udp( |$)')
        | map('split') | map('first') | map('regex_replace', '^.*:', '')
        | select('match', '^[0-9]+(-[0-9]+)?$') | list
      }}
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
    - item.ports | length > 0

- name: Configure | Create required directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner | default("root") }}'
    group: '{{ item.group | default("root") }}'
    mode: '{{ item.mode | default("0755") }}'
  loop: '{{ nginx_create_directories }}'

- name: Configure | Create sites-available directory
  ansible.builtin.file:
    path: '{{ __nginx_sites_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure | Create sites-enabled directory
  ansible.builtin.file:
    path: '{{ __nginx_sites_enabled_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure | Create conf.d directory
  ansible.builtin.file:
    path: '{{ __nginx_conf_d_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure | Deploy main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: '{{ __nginx_config_file }}'
    owner: root
    group: root
    mode: '0644'
    validate: 'nginx -t -c %s'
  notify: Reload Nginx

- name: Configure | Create htpasswd files
  community.general.htpasswd:
    path: '{{ item.0.path }}'
    name: '{{ item.1.name }}'
    password: '{{ item.1.password }}'
    owner: root
    group: '{{ __nginx_group }}'
    mode: '0640'
  loop: >-
    {{ nginx_htpasswd_files | subelements('users', skip_missing=True) }}
  loop_control:
    label: '{{ item.0.name }}: {{ item.1.name }}'
  no_log: true

- name: Configure | Deploy upstream configurations
  ansible.builtin.template:
    src: upstream.conf.j2
    dest: '{{ __nginx_conf_d_dir }}/upstream-{{ item.name }}.conf'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ nginx_upstreams }}'
  loop_control:
    label: '{{ item.name }}'
  notify: Reload Nginx

- name: Configure | Create SSL directory
  ansible.builtin.file:
    path: '{{ __nginx_config_dir }}/ssl'
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - nginx_default_site_enabled | bool
    - nginx_default_site_ssl_certificate | length == 0

- name: Configure | Generate self-signed certificate for default site
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -nodes -days 3650 -newkey rsa:2048
      -keyout {{ __nginx_config_dir }}/ssl/default.key
      -out {{ __nginx_config_dir }}/ssl/default.crt
      -subj "/CN=localhost"
    creates: '{{ __nginx_config_dir }}/ssl/default.crt'
  when:
    - nginx_default_site_enabled | bool
    - nginx_default_site_ssl_certificate | length == 0

- name: Configure | Set permissions on self-signed key
  ansible.builtin.file:
    path: '{{ __nginx_config_dir }}/ssl/default.key'
    owner: root
    group: root
    mode: '0600'
  when:
    - nginx_default_site_enabled | bool
    - nginx_default_site_ssl_certificate | length == 0

- name: Configure | Deploy default site
  ansible.builtin.template:
    src: default-site.conf.j2
    dest: '{{ __nginx_sites_dir }}/default.conf'
    owner: root
    group: root
    mode: '0644'
  when: nginx_default_site_enabled | bool
  notify: Reload Nginx

- name: Configure | Enable default site
  ansible.builtin.file:
    src: '{{ __nginx_sites_dir }}/default.conf'
    dest: '{{ __nginx_sites_enabled_dir }}/default.conf'
    state: link
  when: nginx_default_site_enabled | bool
  notify: Reload Nginx

- name: Configure | Disable default site
  ansible.builtin.file:
    path: '{{ __nginx_sites_enabled_dir }}/default.conf'
    state: absent
  when: not (nginx_default_site_enabled | bool)
  notify: Reload Nginx

- name: Configure | Deploy site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: '{{ __nginx_sites_dir }}/{{ item.name }}.conf'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ nginx_sites }}'
  loop_control:
    label: '{{ item.name }}'
  notify: Reload Nginx

- name: Configure | Enable sites
  ansible.builtin.file:
    src: '{{ __nginx_sites_dir }}/{{ item.name }}.conf'
    dest: '{{ __nginx_sites_enabled_dir }}/{{ item.name }}.conf'
    state: link
  loop: >-
    {{
      nginx_sites | selectattr('enabled', 'undefined') | list +
      nginx_sites | selectattr('enabled', 'defined') | selectattr('enabled') | list
    }}
  loop_control:
    label: '{{ item.name }}'
  notify: Reload Nginx

- name: Configure | Disable sites
  ansible.builtin.file:
    path: '{{ __nginx_sites_enabled_dir }}/{{ item.name }}.conf'
    state: absent
  loop: "{{ nginx_sites | selectattr('enabled', 'defined') | rejectattr('enabled') | list }}"
  loop_control:
    label: '{{ item.name }}'
  notify: Reload Nginx

- name: Configure | Deploy stream configuration
  ansible.builtin.template:
    src: stream.conf.j2
    dest: '{{ __nginx_conf_d_dir }}/stream.conf'
    owner: root
    group: root
    mode: '0644'
  when: nginx_stream_enabled | bool
  notify: Reload Nginx

- name: Configure | Remove stream config if disabled
  ansible.builtin.file:
    path: '{{ __nginx_conf_d_dir }}/stream.conf'
    state: absent
  when: not (nginx_stream_enabled | bool)
  notify: Reload Nginx
