---
- name: Install | Set Nginx package list
  ansible.builtin.set_fact:
    __nginx_install_packages: >-
      {{ [__nginx_mainline_package]
         if (ansible_facts['os_family'] == 'Archlinux' and nginx_mainline | bool)
         else __nginx_packages }}

# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - nginx_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  when:
    - nginx_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  when:
    - nginx_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed nginx package, not only the
# configured ones: parts pulled in as dependencies (nginx-common,
# nginx-core) and the dynamic modules pin the exact version of the main
# package and must move in the same transaction. The facts also hold the
# version before the update for the minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when: nginx_packages_state == 'latest' or __nginx_minimum | length > 0
  tags:
    - always

- name: Install | Merge installed packages into the update
  ansible.builtin.set_fact:
    __nginx_install_packages: >-
      {{ (__nginx_install_packages
          + (ansible_facts['packages'] | list
             | select('match', __nginx_update_pattern) | list))
         | unique | list }}
  when:
    - nginx_packages_state == 'latest'
    - ansible_facts['os_family'] in ['RedHat', 'Debian']

# Full version of the main package as the package manager writes it:
# [epoch:]version[-release]
- name: Install | Record the installed nginx version
  ansible.builtin.set_fact:
    __nginx_version_package: '{{ __nginx_main_package }}'
    __nginx_version_before: '{{ __nginx_installed_version }}'
  vars:
    __nginx_main_package: >-
      {{ __nginx_mainline_package
         if (ansible_facts['os_family'] == 'Archlinux' and nginx_mainline | bool)
         else __nginx_packages | first }}
    __nginx_pkg: "{{ ansible_facts['packages'][__nginx_main_package] | default([{}]) | first }}"
    __nginx_installed_version: >-
      {{ ((__nginx_pkg.epoch ~ ':') if (__nginx_pkg.epoch | default(none, true)) else '')
         ~ (__nginx_pkg.version | default(''))
         ~ (('-' ~ __nginx_pkg.release) if (__nginx_pkg.release | default('', true)) else '') }}
  when: nginx_packages_state == 'latest' or __nginx_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install, resolved like the install (dnf honors module streams, excludes
# and versionlock, apt honors pinning). Arch Linux installs a missing
# package from the sync database and otherwise keeps the installed version,
# which the system upgrade updates. The queries change nothing, so they
# also run under --check.
- name: Install | Query the version the update would install (RedHat)
  ansible.builtin.command:
    argv:
      - dnf
      - --quiet
      - repoquery
      - --latest-limit=1
      - '--queryformat=%{epoch}:%{version}-%{release}'
      - '{{ __nginx_version_package }}'
  register: __nginx_candidate_dnf
  changed_when: false
  check_mode: false
  when:
    - __nginx_minimum | length > 0
    - ansible_facts['os_family'] == 'RedHat'
    - nginx_packages_state == 'latest' or __nginx_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __nginx_version_package }}'
  environment:
    LC_ALL: C
  register: __nginx_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __nginx_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - nginx_packages_state == 'latest' or __nginx_version_before | length == 0
  tags:
    - always

- name: Install | Query the version the install would add (Archlinux)
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --info
      - '{{ __nginx_version_package }}'
  environment:
    LC_ALL: C
  register: __nginx_candidate_pacman
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - __nginx_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __nginx_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __nginx_check_stage: 'pre'
    __nginx_check_installed: '{{ __nginx_version_before }}'
    # epoch 0 is the default and left out, as in the installed version
    __nginx_check_candidate: >-
      {{ (((__nginx_candidate_dnf.stdout_lines | default([])) + [''])
          | first | regex_replace('^0:', ''))
         ~ (((__nginx_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', '')
         ~ (((__nginx_candidate_pacman.stdout | default('')) | regex_findall('(?m)^Version *: *([^ ]+)$')) + [''])
           | first }}
  when: __nginx_minimum | length > 0
  tags:
    - always

- name: Install | Nginx packages
  ansible.builtin.package:
    name: '{{ __nginx_install_packages }}'
    state: "{{ (ansible_facts['os_family'] == 'Archlinux') | ternary('present', nginx_packages_state) }}"
  register: __nginx_packages_result
  retries: 3
  delay: 5

- name: Install | Nginx module packages
  ansible.builtin.package:
    name: '{{ __nginx_module_packages[item] }}'
    state: present
  retries: 3
  delay: 5
  loop: '{{ nginx_modules }}'
  when: item in (__nginx_module_packages | default({}))
  notify: Restart Nginx

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - not ansible_check_mode
    - __nginx_minimum | length > 0
      or (nginx_packages_state == 'latest' and (__nginx_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated nginx version
  ansible.builtin.set_fact:
    __nginx_version_after: >-
      {{ ((__nginx_pkg.epoch ~ ':') if (__nginx_pkg.epoch | default(none, true)) else '')
         ~ (__nginx_pkg.version | default(''))
         ~ (('-' ~ __nginx_pkg.release) if (__nginx_pkg.release | default('', true)) else '') }}
  vars:
    __nginx_pkg: "{{ ansible_facts['packages'][__nginx_version_package] | default([{}]) | first }}"
  when:
    - not ansible_check_mode
    - __nginx_minimum | length > 0
      or (nginx_packages_state == 'latest' and (__nginx_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the nginx version change
  ansible.builtin.debug:
    msg: >-
      {{ __nginx_version_package }} {{ __nginx_version_before | default('none', true) }}
      -> {{ __nginx_version_after }}
  when:
    - not ansible_check_mode
    - nginx_packages_state == 'latest'
    - (__nginx_packages_result | default({})) is changed
    - __nginx_version_before != __nginx_version_after

# A running master keeps executing the old binary after an update. The
# packages usually restart or upgrade it themselves (dpkg maintainer
# scripts, rpm scriptlets), but policy-rc.d or the systemd update helper
# can prevent that, and pacman never restarts it. With 'latest' the role
# restarts nginx while the running master still executes a replaced
# binary, so an update never restarts it twice. The check does not depend
# on changed packages: a run that updated nginx but could not restart it
# (failed configuration test) restarts it on the next run.
- name: Install | Check for a running master
  ansible.builtin.stat:
    path: '{{ __nginx_pid_file }}'
  register: __nginx_pid_stat
  when: nginx_packages_state == 'latest'

- name: Install | Read the master PID
  ansible.builtin.slurp:
    src: '{{ __nginx_pid_file }}'
  register: __nginx_pid
  when:
    - nginx_packages_state == 'latest'
    - __nginx_pid_stat.stat.exists | default(false)

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of the running master
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __nginx_pid.content | b64decode | trim }}/exe'
  register: __nginx_master_exe
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - nginx_packages_state == 'latest'
    - __nginx_pid_stat.stat.exists | default(false)

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __nginx_restart_binary: >-
      {{ (__nginx_pid_stat.stat.exists | default(false))
         and nginx_service_enabled | bool
         and (((__nginx_master_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and __nginx_packages_result is changed)) }}
  when: nginx_packages_state == 'latest'

# The new binary must accept the configuration before the restart. When it
# does not, the run fails without a restart and the running master keeps
# serving with the old binary.
- name: Install | Test the configuration before the restart
  ansible.builtin.command:
    argv:
      - nginx
      - -t
  changed_when: false
  check_mode: false
  when:
    - nginx_packages_state == 'latest'
    - __nginx_restart_binary | bool

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running.
- name: Install | Restart nginx for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __nginx_service_name }}'
    state: restarted
  when:
    - nginx_packages_state == 'latest'
    - __nginx_restart_binary | bool

# Post-check: the transaction can install something else than the queried
# candidate (dependencies, excludes), so the installed version is checked
# again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __nginx_check_stage: 'post'
    __nginx_check_installed: '{{ __nginx_version_after }}'
    __nginx_check_candidate: ''
  when:
    - __nginx_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always

- name: Install | Htpasswd utility
  ansible.builtin.package:
    name: '{{ __nginx_htpasswd_package }}'
    state: present
  retries: 3
  delay: 5
  when: nginx_htpasswd_files | length > 0
