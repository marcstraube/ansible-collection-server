---
# nginx 1.25.1 introduced the http2 directive and deprecated the http2
# parameter of listen. The installed binary decides which of the two the
# templates render. In check mode before the first install there is no
# binary yet; the directive is assumed then.
- name: HTTP/2 Syntax | Read the installed nginx version
  ansible.builtin.command:
    argv:
      - nginx
      - -v
  register: __nginx_binary_version
  changed_when: false
  failed_when:
    - __nginx_binary_version.rc != 0
    - not ansible_check_mode
  check_mode: false

- name: HTTP/2 Syntax | Select the HTTP/2 syntax
  ansible.builtin.set_fact:
    __nginx_version_installed: '{{ __nginx_version_reported }}'
    __nginx_http2_directive: >-
      {{ __nginx_version_reported | length == 0
         or __nginx_version_reported is version('1.25.1', '>=') }}
  vars:
    # nginx -v writes "nginx version: nginx/1.26.3" to stderr
    __nginx_version_reported: >-
      {{ (__nginx_binary_version.stderr | default('')
          | regex_search('nginx/([0-9.]+)', '\1') or ['']) | first }}
