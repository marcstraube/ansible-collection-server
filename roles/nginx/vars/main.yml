---
#
# Shared Variables
#

# Packages (same on all OSes)
__nginx_packages:
  - nginx

# Default mainline package (Arch overrides with nginx-mainline)
__nginx_mainline_package: 'nginx'

# Service name
__nginx_service_name: 'nginx'

# Configuration paths
__nginx_config_dir: '/etc/nginx'
__nginx_config_file: '/etc/nginx/nginx.conf'
__nginx_sites_dir: '/etc/nginx/sites-available'
__nginx_sites_enabled_dir: '/etc/nginx/sites-enabled'
__nginx_conf_d_dir: '/etc/nginx/conf.d'

# Log and run directories
__nginx_log_dir: '/var/log/nginx'

# MIME types and PID file
__nginx_mime_types_file: '/etc/nginx/mime.types'
__nginx_pid_file: '/run/nginx.pid'

# SELinux types an entry of nginx_writable_paths may carry: content httpd
# reads and writes, append-only content, log files and the mod_cache store.
__nginx_writable_path_types:
  - 'httpd_sys_rw_content_t'
  - 'httpd_sys_ra_content_t'
  - 'httpd_log_t'
  - 'httpd_cache_t'

# Own ACME challenge location of a site or of nginx_global_locations: the
# prefix itself, with or without the modifier ^~, or a regex that names it
# outside a negative lookaround. An exact match (=) covers a single file only
# and does not count.
__nginx_acme_own_regex: >-
  (?m)^[^#\n]*\blocation\s+(?:(?:\^~\s*)?["']?/\.well-known/acme-challenge/?["']?\s*(?:\{|$)|~(?:(?!\(\?<?!)[^{\n])*acme-challenge)
