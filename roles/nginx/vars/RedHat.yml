---
__nginx_module_packages:
  http_geoip: 'nginx-mod-http-geoip'
  http_image_filter: 'nginx-mod-http-image-filter'
  http_perl: 'nginx-mod-http-perl'
  http_xslt_filter: 'nginx-mod-http-xslt-filter'
  stream: 'nginx-mod-stream'
  mail: 'nginx-mod-mail'

__nginx_run_dir: '/run'
__nginx_user: 'nginx'
__nginx_group: 'nginx'
__nginx_default_root: '/usr/share/nginx/html'
__nginx_htpasswd_package: 'httpd-tools'

# Installed packages a targeted update moves along (nginx, nginx-core,
# nginx-filesystem, dynamic modules)
__nginx_update_pattern: '^nginx(-.+)?$'

# TCP ports the SELinux policy labels http_port_t out of the box; site and
# stream server ports outside this list get the label from the role.
__nginx_selinux_default_ports:
  - '80'
  - '81'
  - '443'
  - '488'
  - '8008'
  - '8009'
  - '8443'
  - '9000'
