---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    #
    # Load Role Variables
    #

    - name: Verify | Load shared variables
      ansible.builtin.include_vars:
        file: '../../vars/main.yml'

    - name: Verify | Load OS-specific variables
      ansible.builtin.include_vars: '{{ item }}'
      with_first_found:
        - files:
            - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["distribution"] }}.yml'
            - '{{ ansible_facts["os_family"] }}.yml'
          paths:
            - '../../vars'

    #
    # Package Verification
    #

    - name: Verify | Check Nginx packages are installed
      ansible.builtin.package:
        name: '{{ __nginx_packages }}'
        state: present
      check_mode: true
      register: __nginx_pkg_check
      failed_when: __nginx_pkg_check.changed

    #
    # Configuration Verification
    #

    - name: Verify | Check nginx.conf exists
      ansible.builtin.stat:
        path: '{{ __nginx_config_file }}'
      register: __nginx_conf_stat

    - name: Verify | Assert nginx.conf exists
      ansible.builtin.assert:
        that:
          - __nginx_conf_stat.stat.exists
          - __nginx_conf_stat.stat.mode == '0644'
        fail_msg: "nginx.conf missing or wrong permissions"
        success_msg: "nginx.conf exists with correct permissions"

    - name: Verify | Read nginx.conf content
      ansible.builtin.slurp:
        src: '{{ __nginx_config_file }}'
      register: __nginx_conf_content

    - name: Verify | Assert nginx.conf contains expected settings
      ansible.builtin.assert:
        that:
          - "'worker_processes 2' in (__nginx_conf_content.content | b64decode)"
          - "'worker_connections 512' in (__nginx_conf_content.content | b64decode)"
          - "'client_max_body_size 100m' in (__nginx_conf_content.content | b64decode)"
          - "'gzip on' in (__nginx_conf_content.content | b64decode)"
          - "'gzip_comp_level 5' in (__nginx_conf_content.content | b64decode)"
          - "'limit_req_zone' in (__nginx_conf_content.content | b64decode)"
        fail_msg: "nginx.conf missing expected settings"
        success_msg: "nginx.conf contains expected settings"

    #
    # Site Verification
    #

    - name: Verify | Check sites-enabled directory exists
      ansible.builtin.stat:
        path: '{{ __nginx_sites_enabled_dir }}'
      register: __nginx_sites_enabled_stat

    - name: Verify | Assert sites-enabled directory
      ansible.builtin.assert:
        that:
          - __nginx_sites_enabled_stat.stat.exists
          - __nginx_sites_enabled_stat.stat.isdir
        fail_msg: "sites-enabled directory missing"
        success_msg: "sites-enabled directory exists"

    - name: Verify | Check test-static site exists
      ansible.builtin.stat:
        path: '{{ __nginx_sites_dir }}/test-static.conf'
      register: __nginx_test_static

    - name: Verify | Assert test-static site
      ansible.builtin.assert:
        that:
          - __nginx_test_static.stat.exists
        fail_msg: "test-static.conf missing"
        success_msg: "test-static.conf exists"

    - name: Verify | Check test-proxy site exists
      ansible.builtin.stat:
        path: '{{ __nginx_sites_dir }}/test-proxy.conf'
      register: __nginx_test_proxy

    - name: Verify | Assert test-proxy site
      ansible.builtin.assert:
        that:
          - __nginx_test_proxy.stat.exists
        fail_msg: "test-proxy.conf missing"
        success_msg: "test-proxy.conf exists"

    #
    # Proxy and WebSocket Verification
    #

    - name: Verify | Read test-proxy.conf content
      ansible.builtin.slurp:
        src: '{{ __nginx_sites_dir }}/test-proxy.conf'
      register: __nginx_proxy_content

    - name: Verify | Assert proxy site contains WebSocket support
      ansible.builtin.assert:
        that:
          - "'proxy_pass http://127.0.0.1:8080' in (__nginx_proxy_content.content | b64decode)"
          - "'Upgrade $http_upgrade' in (__nginx_proxy_content.content | b64decode)"
          - "'$connection_upgrade' in (__nginx_proxy_content.content | b64decode)"
        fail_msg: "test-proxy.conf missing WebSocket configuration"
        success_msg: "test-proxy.conf contains WebSocket configuration"

    #
    # Upstream Verification
    #

    - name: Verify | Check upstream config exists
      ansible.builtin.stat:
        path: '{{ __nginx_conf_d_dir }}/upstream-test_backend.conf'
      register: __nginx_upstream_stat

    - name: Verify | Assert upstream config
      ansible.builtin.assert:
        that:
          - __nginx_upstream_stat.stat.exists
        fail_msg: "upstream-test_backend.conf missing"
        success_msg: "upstream-test_backend.conf exists"

    #
    # Authentik Forward Auth Verification
    #

    - name: Verify | Read test-authentik-proxy.conf content
      ansible.builtin.slurp:
        src: '{{ __nginx_sites_dir }}/test-authentik-proxy.conf'
      register: __nginx_authentik_content

    - name: Verify | Assert authentik forward auth directives
      ansible.builtin.assert:
        that:
          - "'auth_request' in (__nginx_authentik_content.content | b64decode)"
          - "'outpost.goauthentik.io' in (__nginx_authentik_content.content | b64decode)"
          - "'X-authentik-username' in (__nginx_authentik_content.content | b64decode)"
        fail_msg: "Authentik forward auth directives missing"
        success_msg: "Authentik forward auth directives present"

    #
    # Configuration Validation
    #

    - name: Verify | Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: __nginx_test
      changed_when: false
      failed_when: __nginx_test.rc != 0

    - name: Verify | Assert configuration syntax is valid
      ansible.builtin.assert:
        that:
          - "'syntax is ok' in __nginx_test.stderr"
          - "'test is successful' in __nginx_test.stderr"
        fail_msg: "Nginx configuration test failed"
        success_msg: "Nginx configuration syntax valid"

    #
    # Service Verification
    #

    - name: Verify | Check Nginx service status
      ansible.builtin.systemd_service:
        name: '{{ __nginx_service_name }}'
      register: __nginx_svc_check

    - name: Verify | Assert Nginx service is active and enabled
      ansible.builtin.assert:
        that:
          - __nginx_svc_check.status.ActiveState == 'active'
          - __nginx_svc_check.status.UnitFileState == 'enabled'
        fail_msg: "Nginx service is not active or enabled"
        success_msg: "Nginx service is active and enabled"

    #
    # Ansible Managed Header Verification
    #

    - name: Verify | Check ansible_managed header in nginx.conf
      ansible.builtin.command:
        cmd: 'head -3 {{ __nginx_config_file }}'
      register: __nginx_config_header
      changed_when: false

    - name: Verify | Assert ansible_managed header
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in __nginx_config_header.stdout"
        fail_msg: "nginx.conf missing ansible_managed header"
        success_msg: "nginx.conf has ansible_managed header"

    #
    # Sensitive Paths
    #

    - name: Verify | Request sensitive paths that must be denied
      ansible.builtin.uri:
        url: 'http://127.0.0.1/{{ item }}'
        headers:
          Host: 'static.example.com'
        status_code: 403
      loop:
        - '.env'
        - '.env.local'
        - '.git/config'
        - '.hg/hgrc'
        - '.htaccess'
        - '.DS_Store'
        - 'dump.sql'
        - 'dump.sql.gz'
        - 'index.html.bak'
        - 'notes.txt~'

    # Neighbours of the denied names: the patterns match whole path
    # components only, so these stay reachable.
    - name: Verify | Request paths that must stay reachable
      ansible.builtin.uri:
        url: 'http://127.0.0.1/{{ item }}'
        headers:
          Host: 'static.example.com'
        status_code: 200
      loop:
        - '.github/workflow.yml'
        - '.envrc'
        - 'allowed.txt'

    #
    # Targeted package update (side_effect rolled the packages back and ran
    # the converge playbook with nginx_packages_state: latest)
    #

    - name: Verify | Read the nginx package versions around the rollback
      ansible.builtin.slurp:
        src: /root/nginx-update-versions
      register: __verify_update_versions

    - name: Verify | Stat the version record
      ansible.builtin.stat:
        path: /root/nginx-update-versions
      register: __verify_update_stat

    - name: Verify | Gather package facts after the update
      ansible.builtin.package_facts:

    - name: Verify | Set update version facts
      ansible.builtin.set_fact:
        __verify_version_latest: '{{ (__verify_update_versions.content | b64decode).splitlines()[0] | trim }}'
        __verify_version_rolled_back: '{{ (__verify_update_versions.content | b64decode).splitlines()[1] | trim }}'
        __verify_version_now: >-
          {{ [(ansible_facts['packages']['nginx'] | first).version,
              (ansible_facts['packages']['nginx'] | first).release | default('')]
             | select | join('-') }}

    - name: Verify | Assert the update restored the latest build
      ansible.builtin.assert:
        that:
          - __verify_version_now == __verify_version_latest
        fail_msg: >-
          nginx is at {{ __verify_version_now }} after the update, expected
          {{ __verify_version_latest }} (rolled back to {{ __verify_version_rolled_back }})
        success_msg: >-
          Updated from {{ __verify_version_rolled_back }} to {{ __verify_version_now }}
      when: __verify_version_rolled_back != __verify_version_latest

    - name: Verify | Read the nginx master PID
      ansible.builtin.slurp:
        src: '{{ __nginx_pid_file }}'
      register: __verify_master_pid
      when: __verify_version_rolled_back != __verify_version_latest

    # readlink reports a replaced binary as "<path> (deleted)"
    - name: Verify | Read the binary of the running master
      ansible.builtin.command:
        argv:
          - readlink
          - '/proc/{{ __verify_master_pid.content | b64decode | trim }}/exe'
      register: __verify_master_exe
      changed_when: false
      when: __verify_version_rolled_back != __verify_version_latest

    - name: Verify | Assert nginx runs the updated binary
      ansible.builtin.assert:
        that:
          - __verify_master_exe.stdout is not search(' \(deleted\)$')
        fail_msg: 'The nginx master still runs the replaced binary: {{ __verify_master_exe.stdout }}'
        success_msg: 'nginx runs the updated binary'
      when: __verify_version_rolled_back != __verify_version_latest

    # side_effect blocks the package restart on Debian, so the role has to
    # restart nginx there; where the package restarts or upgrades it, the
    # role must not restart it again.
    - name: Verify | Read the nginx starts since the update
      ansible.builtin.command:
        argv:
          - journalctl
          - '--unit={{ __nginx_service_name }}'
          - '--since=@{{ __verify_update_stat.stat.mtime }}'
          - '--output=cat'
          - '--no-pager'
      register: __verify_update_journal
      changed_when: false
      when: __verify_version_rolled_back != __verify_version_latest

    - name: Verify | Assert the update restarted nginx at most once
      ansible.builtin.assert:
        that:
          - __verify_update_starts | length <= 1
        fail_msg: >-
          nginx started {{ __verify_update_starts | length }} times after the
          package update: {{ __verify_update_starts }}
        success_msg: 'nginx started {{ __verify_update_starts | length }} time(s) after the package update'
      vars:
        __verify_update_starts: >-
          {{ __verify_update_journal.stdout_lines | select('match', '^Started ') | list }}
      when: __verify_version_rolled_back != __verify_version_latest
