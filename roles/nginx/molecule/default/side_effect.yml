---
# The second pass of the site tasks (tasks_from: sites.yml), as the web play
# runs it once certbot obtained a certificate. First play of the file: no run
# of main.yml has set anything yet, so the tasks have to work on their own.
- name: Side Effect | First certificate
  hosts: all
  gather_facts: true

  vars:
    nginx_enabled: true
    nginx_acme_challenge_enabled: true
    __side_effect_acme_sites:
      - name: 'test-acme-redirect'
        server_names:
          - 'acme-redirect.example.com'
        root: '/var/www/html'
        http_redirect: true
        www_redirect: 'non-www'
        ssl:
          enabled: true
          certificate: '/etc/nginx/ssl/acme-redirect.crt'
          certificate_key: '/etc/nginx/ssl/acme-redirect.key'
      - name: 'test-acme-pending'
        server_names:
          - 'acme-pending.example.com'
        root: '/var/www/html'
        ssl:
          enabled: true
          certificate: '/etc/nginx/ssl/acme-pending.crt'
          certificate_key: '/etc/nginx/ssl/acme-pending.key'
    # A path only known per connection, a certificate in the configuration
    # itself and a quoted path must not count as missing files
    __side_effect_acme_path_sites:
      - name: 'test-acme-variable'
        server_names:
          - 'acme-variable.example.com'
        root: '/var/www/html'
        ssl:
          enabled: true
          certificate: '/etc/nginx/ssl/$ssl_server_name.crt'
          certificate_key: '/etc/nginx/ssl/$ssl_server_name.key'
      - name: 'test-acme-data'
        server_names:
          - 'acme-data.example.com'
        root: '/var/www/html'
        ssl:
          enabled: true
          certificate: '"data:{{ __side_effect_acme_pem.content | b64decode }}"'
          certificate_key: '"/etc/nginx/ssl/acme-pending.key"'

  tasks:
    # converge.yml left both sites waiting. The disabled site is not checked.
    - name: Side Effect | Include the site tasks while the certificates are missing  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_sites: >-
          {{ __side_effect_acme_sites
             + [__side_effect_acme_sites[0] | combine({'name': 'test-acme-disabled', 'enabled': false})] }}

    - name: Side Effect | Assert the role lists the waiting sites
      ansible.builtin.assert:
        that:
          - __nginx_sites_pending | sort == ['test-acme-pending', 'test-acme-redirect']
          - __nginx_sites_active | map(attribute='name') == ['test-acme-redirect']
        fail_msg: 'Waiting {{ __nginx_sites_pending }}, active {{ __nginx_sites_active }}'
        success_msg: 'The role lists the sites waiting for their certificate'

    - name: Side Effect | Create the missing certificates
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout /etc/nginx/ssl/{{ item }}.key
          -out /etc/nginx/ssl/{{ item }}.crt
          -subj "/CN={{ item }}.example.com"
        creates: '/etc/nginx/ssl/{{ item }}.crt'
      loop:
        - 'acme-redirect'
        - 'acme-pending'

    - name: Side Effect | Read a certificate for the data value
      ansible.builtin.slurp:
        src: /etc/nginx/ssl/acme-pending.crt
      register: __side_effect_acme_pem

    - name: Side Effect | Include the site tasks with the certificates  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_sites: '{{ __side_effect_acme_sites + __side_effect_acme_path_sites }}'

    - name: Side Effect | Reload nginx with the certificates
      ansible.builtin.meta: flush_handlers

    # The reload is asynchronous, hence the retries. The www name of
    # test-acme-redirect has a server of its own.
    - name: Side Effect | Check the certificates nginx serves
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          openssl s_client -connect 127.0.0.1:443 -servername {{ item.host }}.example.com \
            < /dev/null 2> /dev/null | openssl x509 -noout -subject
        executable: /bin/bash
      register: __side_effect_acme_subject
      changed_when: false
      until: __side_effect_acme_subject.stdout is search('CN ?= ?' ~ item.subject ~ '\.example\.com')
      retries: 5
      delay: 1
      loop:
        - {host: 'acme-redirect', subject: 'acme-redirect'}
        - {host: 'www.acme-redirect', subject: 'acme-redirect'}
        - {host: 'acme-pending', subject: 'acme-pending'}
        - {host: 'acme-data', subject: 'acme-pending'}

    - name: Side Effect | Check the site with a variable path is enabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/test-acme-variable.conf
      register: __side_effect_acme_variable
      failed_when: not __side_effect_acme_variable.stat.exists

    - name: Side Effect | Remove the sites with special paths
      ansible.builtin.file:
        path: '/etc/nginx/{{ item.0 }}/{{ item.1 }}.conf'
        state: absent
      loop: >-
        {{ ['sites-enabled', 'sites-available']
           | product(['test-acme-data', 'test-acme-variable']) | list }}

    # A deployed HTTPS site that lost a file: the run fails and leaves the
    # deployed configuration alone.
    - name: Side Effect | Remove the key of one site
      ansible.builtin.file:
        path: /etc/nginx/ssl/acme-redirect.key
        state: absent

    - name: Side Effect | Run the site tasks without the key
      block:
        - name: Side Effect | Include the site tasks without the key  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: sites.yml
          vars:
            nginx_sites: >-
              {{ __side_effect_acme_sites | map('combine', {'root': '/var/www/changed'}) | list }}
      rescue:
        - name: Side Effect | Record the missing key failure
          ansible.builtin.set_fact:
            __side_effect_acme_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Read the enabled sites after the failure
      ansible.builtin.slurp:
        src: '/etc/nginx/sites-enabled/{{ item.name }}.conf'
      loop: '{{ __side_effect_acme_sites }}'
      loop_control:
        label: '{{ item.name }}'
      register: __side_effect_acme_deployed

    - name: Side Effect | Assert the missing key failed the run before any change
      ansible.builtin.assert:
        that:
          - __side_effect_acme_error | default('') is search("Site 'test-acme-redirect' serves HTTPS")
          - __side_effect_acme_error | default('') is search('/etc/nginx/ssl/acme-redirect\.key')
          - __side_effect_acme_error | default('') is not search('acme-redirect\.crt')
          - __deployed | select('search', 'listen 443 ssl') | list | length == 2
          - __deployed | select('search', '/var/www/changed') | list | length == 0
        fail_msg: >-
          A deployed HTTPS site without its key did not fail the run as expected
          (error: {{ __side_effect_acme_error | default('none') }})
        success_msg: 'A deployed HTTPS site without its key fails the run before any change'
      vars:
        __deployed: "{{ __side_effect_acme_deployed.results | map(attribute='content') | map('b64decode') | list }}"

    # Back to the state of converge.yml, as the message says: without the
    # link the sites wait for their certificates again.
    - name: Side Effect | Remove the certificates and the links of the sites
      ansible.builtin.file:
        path: '/etc/nginx/{{ item }}'
        state: absent
      loop:
        - 'ssl/acme-redirect.crt'
        - 'ssl/acme-pending.crt'
        - 'ssl/acme-pending.key'
        - 'sites-enabled/test-acme-redirect.conf'
        - 'sites-enabled/test-acme-pending.conf'

    - name: Side Effect | Include the site tasks without the certificates  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_sites: '{{ __side_effect_acme_sites }}'

    - name: Side Effect | Reload nginx without the certificates
      ansible.builtin.meta: flush_handlers

    # Own challenge locations in every form: nginx refuses a duplicate. The
    # certificate of the default site does not exist.
    - name: Side Effect | Include the site tasks with own challenge locations  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_default_site_ssl_certificate: '/etc/nginx/ssl/acme-default.crt'
        nginx_default_site_ssl_certificate_key: '/etc/nginx/ssl/acme-default.key'
        nginx_sites:
          - name: 'test-own-prefix'
            server_names:
              - 'own-prefix.example.com'
            root: '/var/www/html'
            locations:
              - path: '^~ "/.well-known/acme-challenge"'
                config: 'root /var/www/acme-own;'
          - name: 'test-own-regex'
            server_names:
              - 'own-regex.example.com'
            root: '/var/www/html'
            locations:
              - path: '~ ^/\.well-known/acme-challenge/'
                config: 'root /var/www/acme-own;'
          - name: 'test-own-raw'
            server_names:
              - 'own-raw.example.com'
            root: '/var/www/html'
            extra_config: |
              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/acme-own;
              }
          - name: 'test-own-nested'
            server_names:
              - 'own-nested.example.com'
            root: '/var/www/html'
            locations:
              - path: '^~ /.well-known/'
                config: |
                  location /.well-known/acme-challenge/ {
                      root /var/www/acme-own;
                  }
          # Its own location belongs to the HTTPS server, which waits
          - name: 'test-own-waiting'
            server_names:
              - 'own-waiting.example.com'
            root: '/var/www/html'
            http_redirect: true
            ssl:
              enabled: true
              certificate: '/etc/nginx/ssl/acme-waiting.crt'
              certificate_key: '/etc/nginx/ssl/acme-waiting.key'
            locations:
              - path: '/.well-known/acme-challenge/'
                config: 'root /var/www/acme-own;'
          # Neither a comment nor a negative lookahead names the location; an
          # exact match serves one file and leaves the rest to the role
          - name: 'test-own-comment'
            server_names:
              - 'own-comment.example.com'
            root: '/var/www/html'
            extra_config: |
              # location ^~ /.well-known/acme-challenge/ {
              location  = /.well-known/acme-challenge/exact {
                  return 204;
              }
              location ~ /\.(?!well-known/acme-challenge) {
                  deny all;
              }
          - name: 'test-own-exact'
            server_names:
              - 'own-exact.example.com'
            root: '/var/www/html'
            locations:
              - path: '= /.well-known/acme-challenge/exact'
                config: 'return 204;'

    - name: Side Effect | Reload nginx with own challenge locations
      ansible.builtin.meta: flush_handlers

    - name: Side Effect | Request the own challenge locations
      ansible.builtin.uri:
        url: 'http://127.0.0.1/.well-known/acme-challenge/molecule'
        headers:
          Host: '{{ item.host }}.example.com'
        return_content: true
      register: __side_effect_acme_own
      until: __side_effect_acme_own.content | default('') == item.content
      retries: 5
      delay: 1
      loop:
        - {host: 'own-prefix', content: 'own'}
        - {host: 'own-regex', content: 'own'}
        - {host: 'own-raw', content: 'own'}
        - {host: 'own-nested', content: 'own'}
        - {host: 'own-waiting', content: 'shared'}
        - {host: 'own-comment', content: 'shared'}
        - {host: 'own-exact', content: 'shared'}
        - {host: 'unknown', content: 'shared'}

    - name: Side Effect | Read the default site without a certificate
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/default.conf
      register: __side_effect_acme_default

    - name: Side Effect | Assert the default site keeps its HTTPS server
      ansible.builtin.assert:
        that:
          - (__side_effect_acme_default.content | b64decode) is search('listen 443 ssl.* default_server;')
          - (__side_effect_acme_default.content | b64decode) is search('ssl_certificate /etc/nginx/ssl/default\.crt;')
          - (__side_effect_acme_default.content | b64decode) is not search('acme-default')
        fail_msg: 'The default site does not fall back to its self-signed certificate'
        success_msg: 'The default site uses its self-signed certificate until its own exists'

# A deployed HTTP site that gets ssl before its certificate exists keeps
# serving over HTTP, with and without http_redirect.
- name: Side Effect | HTTP site gets a certificate
  hosts: all
  gather_facts: true

  vars:
    nginx_enabled: true
    nginx_acme_challenge_enabled: true
    __side_effect_keep_sites:
      - name: 'test-keep-plain'
        server_names:
          - 'keep-plain.example.com'
        root: '/var/www/html'
      - name: 'test-keep-redirect'
        server_names:
          - 'keep-redirect.example.com'
        root: '/var/www/html'
        http_redirect: true
        www_redirect: 'non-www'
    __side_effect_keep_ssl:
      ssl:
        enabled: true
        certificate: '/etc/nginx/ssl/keep.crt'
        certificate_key: '/etc/nginx/ssl/keep.key'

  tasks:
    - name: Side Effect | Include the site tasks with HTTP sites  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_sites: '{{ __side_effect_keep_sites }}'

    - name: Side Effect | Read the HTTP sites
      ansible.builtin.stat:
        path: '/etc/nginx/sites-enabled/{{ item.name }}.conf'
        follow: true
      loop: '{{ __side_effect_keep_sites }}'
      register: __side_effect_keep_before

    # Same configuration as before and once more: the state survives a run
    - name: Side Effect | Include the site tasks with ssl and no certificate  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_sites: "{{ __side_effect_keep_sites | map('combine', __side_effect_keep_ssl) | list }}"
      loop: [1, 2]
      loop_control:
        loop_var: __side_effect_keep_run

    - name: Side Effect | Reload nginx with the sites kept on HTTP
      ansible.builtin.meta: flush_handlers

    - name: Side Effect | Read the sites kept on HTTP
      ansible.builtin.stat:
        path: '/etc/nginx/sites-enabled/{{ item.name }}.conf'
        follow: true
      loop: '{{ __side_effect_keep_sites }}'
      register: __side_effect_keep_after

    # An unchanged modification time means that no run wrote the file
    - name: Side Effect | Assert the sites are kept on HTTP
      ansible.builtin.assert:
        that:
          - __side_effect_keep_before.results | map(attribute='stat.mtime') | list
            == __side_effect_keep_after.results | map(attribute='stat.mtime', default='missing') | list
          - __nginx_sites_http | sort == ['test-keep-plain', 'test-keep-redirect']
          - __nginx_sites_pending | length == 0
        fail_msg: 'Kept on HTTP: {{ __nginx_sites_http }}, waiting: {{ __nginx_sites_pending }}'
        success_msg: 'A deployed HTTP site keeps serving until its certificate exists'

    - name: Side Effect | Request the sites kept on HTTP
      ansible.builtin.uri:
        url: 'http://127.0.0.1/{{ item.1.path }}'
        headers:
          Host: '{{ item.0 }}.example.com'
        follow_redirects: none
        return_content: true
      register: __side_effect_keep_http
      until: item.1.content in __side_effect_keep_http.content | default('')
      retries: 5
      delay: 1
      loop: >-
        {{ ['keep-plain', 'keep-redirect']
           | product([{'path': 'allowed.txt', 'content': 'fixture'},
                      {'path': '.well-known/acme-challenge/molecule', 'content': 'shared'}]) | list }}

    - name: Side Effect | Create the certificate of the HTTP sites
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout /etc/nginx/ssl/keep.key
          -out /etc/nginx/ssl/keep.crt
          -subj "/CN=keep.example.com"
        creates: /etc/nginx/ssl/keep.crt

    - name: Side Effect | Include the site tasks with ssl and the certificate  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_sites: "{{ __side_effect_keep_sites | map('combine', __side_effect_keep_ssl) | list }}"

    - name: Side Effect | Reload nginx with the sites on HTTPS
      ansible.builtin.meta: flush_handlers

    - name: Side Effect | Check the certificates of the sites
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          openssl s_client -connect 127.0.0.1:443 -servername {{ item }}.example.com \
            < /dev/null 2> /dev/null | openssl x509 -noout -subject
        executable: /bin/bash
      register: __side_effect_keep_subject
      changed_when: false
      until: __side_effect_keep_subject.stdout is search('CN ?= ?keep\.example\.com')
      retries: 5
      delay: 1
      loop:
        - 'keep-plain'
        - 'keep-redirect'
        - 'www.keep-redirect'

    - name: Side Effect | Remove the sites and their certificate
      ansible.builtin.file:
        path: '/etc/nginx/{{ item }}'
        state: absent
      loop:
        - 'sites-enabled/test-keep-plain.conf'
        - 'sites-enabled/test-keep-redirect.conf'
        - 'sites-available/test-keep-plain.conf'
        - 'sites-available/test-keep-redirect.conf'
        - 'ssl/keep.crt'
        - 'ssl/keep.key'

    - name: Side Effect | Reload nginx without the sites
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

# Without nginx_acme_challenge_enabled and nginx_acme_webroot in the inventory
# the role follows certbot_enabled and certbot_webroot_path. A challenge
# location in nginx_global_locations stays the only one of a site.
- name: Side Effect | ACME challenge default
  hosts: all
  gather_facts: true

  vars:
    nginx_enabled: true
    nginx_global_locations:
      - path: '/.well-known/acme-challenge/'
        config: 'root /var/www/acme-own;'
    nginx_sites:
      - name: 'test-own-global'
        server_names:
          - 'own-global.example.com'
        root: '/var/www/html'
      - name: 'test-own-redirect'
        server_names:
          - 'own-redirect.example.com'
        root: '/var/www/html'
        http_redirect: true
        ssl:
          enabled: true
          certificate: '/etc/nginx/ssl/test.crt'
          certificate_key: '/etc/nginx/ssl/test.key'
      # Waiting, and still no duplicate of the global location
      - name: 'test-own-waiting'
        server_names:
          - 'own-waiting.example.com'
        root: '/var/www/html'
        http_redirect: true
        ssl:
          enabled: true
          certificate: '/etc/nginx/ssl/acme-waiting.crt'
          certificate_key: '/etc/nginx/ssl/acme-waiting.key'

  tasks:
    - name: Side Effect | Include the site tasks next to certbot  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        certbot_enabled: true
        certbot_webroot_path: '/var/www/acme-certbot'

    - name: Side Effect | Reload nginx with a global challenge location
      ansible.builtin.meta: flush_handlers

    - name: Side Effect | Request the global challenge location
      ansible.builtin.uri:
        url: 'http://127.0.0.1/.well-known/acme-challenge/molecule'
        headers:
          Host: '{{ item.host }}.example.com'
        return_content: true
      register: __side_effect_acme_global
      until: __side_effect_acme_global.content | default('') == item.content
      retries: 5
      delay: 1
      loop:
        - {host: 'own-global', content: 'own'}
        - {host: 'own-redirect', content: 'own'}
        - {host: 'own-waiting', content: 'own'}
        - {host: 'unknown', content: 'certbot'}

    - name: Side Effect | Include the site tasks without certbot  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: sites.yml
      vars:
        nginx_global_locations: []

    - name: Side Effect | Read the configuration without certbot
      ansible.builtin.slurp:
        src: '/etc/nginx/sites-available/{{ item }}.conf'
      loop:
        - 'default'
        - 'test-own-global'
        - 'test-own-redirect'
      register: __side_effect_acme_off

    - name: Side Effect | Assert the challenge is off without certbot
      ansible.builtin.assert:
        that:
          - >-
            __side_effect_acme_off.results | map(attribute='content') | map('b64decode')
            | select('search', 'acme-challenge') | list | length == 0
        fail_msg: 'The challenge is served although certbot is not enabled'
        success_msg: 'The challenge follows certbot_enabled'

    - name: Side Effect | Remove the sites with own challenge locations
      ansible.builtin.file:
        path: '/etc/nginx/{{ item.0 }}/test-own-{{ item.1 }}.conf'
        state: absent
      loop: >-
        {{ ['sites-enabled', 'sites-available']
           | product(['prefix', 'regex', 'raw', 'nested', 'waiting', 'comment',
                      'exact', 'global', 'redirect']) | list }}

    - name: Side Effect | Reload nginx without the sites
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

# Targeted update: the next play rolls the nginx packages back to an older
# build. A minimum the repository does not offer must fail before any
# change, a mapping without a key for the host must fail, and on Debian a
# configuration the new binary rejects must fail the update without a
# restart. The converge playbook then runs with nginx_packages_state:
# latest and the full distribution version as minimum, and nginx must run
# the new binary after at most one restart. Arch Linux ignores the state.
- name: Side Effect | Roll back
  hosts: all
  gather_facts: true

  vars:
    # version-release of the nginx package from the latest package facts
    # (Debian has no separate release field). The epoch is left out, so the
    # minimum check has to add it on EL (nginx carries epoch 2 there).
    __side_effect_version: >-
      {{ [(ansible_facts['packages']['nginx'] | first).version,
          (ansible_facts['packages']['nginx'] | first).release | default('')]
         | select | join('-') }}

  tasks:
    - name: Side Effect | Gather package facts before the rollback
      ansible.builtin.package_facts:

    - name: Side Effect | Record the current nginx package version
      ansible.builtin.set_fact:
        __side_effect_version_current: '{{ __side_effect_version }}'

    # Debian: policy-rc.d keeps the maintainer scripts from restarting
    # nginx, so only the role can restart it
    - name: Side Effect | Block service restarts by packages (Debian)
      ansible.builtin.copy:
        content: "#!/bin/sh\nexit 101\n"
        dest: /usr/sbin/policy-rc.d
        mode: '0755'
      when: ansible_facts['os_family'] == 'Debian'

    # The EL AppStream keeps the older builds of a release. When the
    # repository holds only one build, nothing is rolled back and verify.yml
    # skips the version comparison.
    - name: Side Effect | Roll the nginx packages back (RedHat)
      ansible.builtin.command:
        cmd: dnf downgrade -y 'nginx*'
      changed_when: true
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    # Every installed package built from the nginx source carries its
    # version and moves back with it.
    - name: Side Effect | Roll the nginx packages back (Debian)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          installed=$(dpkg-query -W -f '${Version}' nginx)
          # madison lists the newest build first; take the first older one
          old=$(apt-cache madison nginx \
            | awk -F' [|] ' -v cur="${installed}" '$2 != cur { print $2; exit }')
          [ -n "${old}" ] || exit 0
          pkgs=$(dpkg-query -W -f '${Package} ${Version} ${db:Status-Abbrev}\n' 'nginx*' 'libnginx-mod-*' \
            | awk -v cur="${installed}" '$2 == cur && $3 == "ii" { print $1 }')
          args=''
          for pkg in ${pkgs}; do args="${args} ${pkg}=${old}"; done
          # shellcheck disable=SC2086
          DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-downgrades ${args}
        executable: /bin/bash
      changed_when: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Side Effect | Gather package facts after the rollback
      ansible.builtin.package_facts:

    - name: Side Effect | Record the rolled back nginx package version
      ansible.builtin.set_fact:
        __side_effect_version_rolled_back: '{{ __side_effect_version }}'

    # verify.yml runs as a separate playbook; the versions before and after
    # the rollback and the time of the update reach it through this file.
    - name: Side Effect | Record the nginx package versions around the rollback
      ansible.builtin.copy:
        content: |
          {{ __side_effect_version_current }}
          {{ __side_effect_version_rolled_back }}
        dest: /root/nginx-update-versions
        mode: '0600'

- name: Side Effect | Minimum
  hosts: all
  gather_facts: true

  vars:
    __side_effect_version: >-
      {{ [(ansible_facts['packages']['nginx'] | first).version,
          (ansible_facts['packages']['nginx'] | first).release | default('')]
         | select | join('-') }}

  tasks:
    # The pre-check runs before the package task, so a minimum the
    # repository does not offer leaves the rolled back packages in place.
    - name: Side Effect | Run with a minimum the repository does not offer
      block:
        - name: Side Effect | Include nginx role with an unmet minimum  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_packages_state: 'latest'
            nginx_packages_minimum: "{{ {ansible_facts['os_family']: '99.0'} }}"
      rescue:
        - name: Side Effect | Record the minimum check failure
          ansible.builtin.set_fact:
            __side_effect_minimum_error: '{{ ansible_failed_result.msg | default("") }}'

    - name: Side Effect | Gather package facts after the unmet minimum
      ansible.builtin.package_facts:

    - name: Side Effect | Assert the unmet minimum failed without a change
      ansible.builtin.assert:
        that:
          - __side_effect_minimum_error is defined
          - "'requires 99.0' in __side_effect_minimum_error"
          - "'nothing was changed' in __side_effect_minimum_error"
          - __side_effect_version == __side_effect_version_rolled_back
        fail_msg: >-
          A minimum of 99.0 did not fail before the update (error:
          {{ __side_effect_minimum_error | default('none') }}, nginx
          {{ __side_effect_version_rolled_back }} -> {{ __side_effect_version }})
        success_msg: 'The pre-check rejects a minimum the repository does not offer'

    - name: Side Effect | Run with a mapping without a key for the host
      block:
        - name: Side Effect | Include nginx role with a mapping for another platform  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_packages_state: 'latest'
            nginx_packages_minimum:
              Solaris: '1.0'
      rescue:
        - name: Side Effect | Record the mapping failure
          ansible.builtin.set_fact:
            __side_effect_mapping_error: '{{ ansible_failed_result.msg | default("") }}'

    - name: Side Effect | Assert the mapping without a key failed
      ansible.builtin.assert:
        that:
          - __side_effect_mapping_error is defined
          - "'has no key for this host' in __side_effect_mapping_error"
        fail_msg: 'A mapping without a key for the host did not fail the run'
        success_msg: 'A mapping without a key for the host fails the run'

# Debian only: policy-rc.d keeps the old master running after the update,
# so the role has to restart it and tests the configuration first.
- name: Side Effect | Configuration test
  hosts: all
  gather_facts: true

  vars:
    # Only a rolled back build leaves a replaced binary to restart
    __side_effect_config_test: >-
      {{ ansible_facts['os_family'] == 'Debian'
         and __side_effect_version_rolled_back != __side_effect_version_current }}

  tasks:
    - name: Side Effect | Add a configuration the new binary rejects (Debian)
      ansible.builtin.copy:
        content: "not_a_directive on;\n"
        dest: /etc/nginx/conf.d/zz-broken.conf
        mode: '0644'
      when: __side_effect_config_test | bool

    - name: Side Effect | Run the update with a rejected configuration (Debian)
      when: __side_effect_config_test | bool
      block:
        - name: Side Effect | Include nginx role with a rejected configuration  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_packages_state: 'latest'
      rescue:
        - name: Side Effect | Record the failed task
          ansible.builtin.set_fact:
            __side_effect_config_task: '{{ ansible_failed_task.name | default("") }}'

    - name: Side Effect | Read the nginx master PID (Debian)
      ansible.builtin.slurp:
        src: /run/nginx.pid
      register: __side_effect_pid
      when: __side_effect_config_test | bool

    - name: Side Effect | Read the binary of the running master (Debian)
      ansible.builtin.command:
        argv:
          - readlink
          - '/proc/{{ __side_effect_pid.content | b64decode | trim }}/exe'
      register: __side_effect_exe
      changed_when: false
      when: __side_effect_config_test | bool

    - name: Side Effect | Assert the rejected configuration stopped the restart (Debian)
      ansible.builtin.assert:
        that:
          - __side_effect_config_task | default('') == 'Install | Test the configuration before the restart'
          - __side_effect_exe.stdout is search(' \(deleted\)$')
        fail_msg: >-
          The update did not stop at the configuration test (failed task:
          {{ __side_effect_config_task | default('none') }}, master runs
          {{ __side_effect_exe.stdout }})
        success_msg: 'The old master keeps serving when the new binary rejects the configuration'
      when: __side_effect_config_test | bool

    - name: Side Effect | Remove the rejected configuration (Debian)
      ansible.builtin.file:
        path: /etc/nginx/conf.d/zz-broken.conf
        state: absent
      when: __side_effect_config_test | bool

# nginx resolves a relative include against the directory of nginx.conf.
# The check of a changed nginx.conf must see the same includes as the
# running server: the role runs without the converge settings, so
# nginx.conf changes and is checked while conf.d holds a relative include.
- name: Side Effect | Relative include
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Add a configuration with a relative include
      ansible.builtin.copy:
        content: "include fastcgi_params;\n"
        dest: /etc/nginx/conf.d/zz-relative-include.conf
        mode: '0644'

    - name: Side Effect | Include nginx role with a changed nginx.conf  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        nginx_enabled: true

    # The run without the converge settings has stream disabled
    - name: Side Effect | Stat the stream config with stream disabled
      ansible.builtin.stat:
        path: /etc/nginx/stream.conf
      register: __side_effect_stream_stat

    - name: Side Effect | Assert the stream config is removed when disabled
      ansible.builtin.assert:
        that: not __side_effect_stream_stat.stat.exists
        fail_msg: '/etc/nginx/stream.conf is still present with nginx_stream_enabled: false'
        success_msg: 'The stream config is removed when stream is disabled'

    - name: Side Effect | Remove the configuration with the relative include
      ansible.builtin.file:
        path: /etc/nginx/conf.d/zz-relative-include.conf
        state: absent

    - name: Side Effect | Read nginx.conf before a rejected change
      ansible.builtin.stat:
        path: /etc/nginx/nginx.conf
        checksum_algorithm: sha256
      register: __side_effect_conf_before

    # A rejected nginx.conf must fail the task, keep the old file and leave
    # no copy of the check behind
    - name: Side Effect | Run with an nginx.conf the check rejects
      block:
        - name: Side Effect | Include nginx role with an invalid directive  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_http_extra_config: 'not_a_directive on;'
      rescue:
        - name: Side Effect | Record the rejected change
          ansible.builtin.set_fact:
            __side_effect_rejected_task: '{{ ansible_failed_task.name | default("") }}'

    - name: Side Effect | Read nginx.conf after the rejected change
      ansible.builtin.stat:
        path: /etc/nginx/nginx.conf
        checksum_algorithm: sha256
      register: __side_effect_conf_after

    - name: Side Effect | Assert the check rejected the change
      ansible.builtin.assert:
        that:
          - __side_effect_rejected_task | default('') == 'Configure | Deploy main nginx.conf'
          - __side_effect_conf_after.stat.checksum == __side_effect_conf_before.stat.checksum
        fail_msg: >-
          The invalid nginx.conf was not rejected by the check (failed task:
          {{ __side_effect_rejected_task | default('none') }})
        success_msg: 'The check rejects an invalid nginx.conf and keeps the old one'

    - name: Side Effect | Find leftover copies of the configuration check
      ansible.builtin.find:
        paths: /etc/nginx
        patterns: '.nginx.conf.*'
        hidden: true
      register: __side_effect_validate_copies

    - name: Side Effect | Assert the configuration check removed its copies
      ansible.builtin.assert:
        that: __side_effect_validate_copies.matched == 0
        fail_msg: >-
          The configuration check left copies behind:
          {{ __side_effect_validate_copies.files | map(attribute='path') | join(', ') }}
        success_msg: 'The configuration check removed its copies'

# On Debian the packages are already updated; the role restarts the master
# that still runs the replaced binary.
- name: Side Effect | Update
  ansible.builtin.import_playbook: converge.yml
  vars:
    nginx_packages_state: 'latest'
    nginx_packages_minimum: '{{ __side_effect_version_current }}'

# Every invalid writable path entry must fail the validation in main.yml,
# which runs before any change.
- name: Side Effect | Writable path validation
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Run with a relative path
      block:
        - name: Side Effect | Include nginx role with a relative path  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_writable_paths:
              - path: 'var/www/relative'
      rescue:
        - name: Side Effect | Record the error for a relative path
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'relative': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with a trailing slash
      block:
        - name: Side Effect | Include nginx role with a trailing slash  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_writable_paths:
              - path: '/var/www/trailing/'
      rescue:
        - name: Side Effect | Record the error for a trailing slash
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'trailing': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with a '..' component
      block:
        - name: Side Effect | Include nginx role with a '..' component  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_writable_paths:
              - path: '/var/www/../etc'
      rescue:
        - name: Side Effect | Record the error for a '..' component
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'dotdot': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with an entry without a path
      block:
        - name: Side Effect | Include nginx role with an entry without a path  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_writable_paths:
              - type: 'httpd_log_t'
      rescue:
        - name: Side Effect | Record the error for an entry without a path
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'nopath': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with an unsupported type
      block:
        - name: Side Effect | Include nginx role with an unsupported type  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_writable_paths:
              - path: '/var/www/type'
                type: 'httpd_sys_content_t'
      rescue:
        - name: Side Effect | Record the error for an unsupported type
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'type': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with a numeric mode
      block:
        - name: Side Effect | Include nginx role with a numeric mode  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_writable_paths:
              - path: '/var/www/mode'
                mode: 750
      rescue:
        - name: Side Effect | Record the error for a numeric mode
          ansible.builtin.set_fact:
            __side_effect_writable_errors: >-
              {{ __side_effect_writable_errors | default({})
                 | combine({'mode': __side_effect_writable_error}) }}
          vars:
            # The assert loops over the entries; the message is in the item
            __side_effect_writable_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Assert every invalid writable path failed the validation
      ansible.builtin.assert:
        that:
          - __errors['relative'] | default('') is search('must be absolute')
          - __errors['trailing'] | default('') is search('must be absolute')
          - __errors['dotdot'] | default('') is search('must be absolute')
          - __errors['nopath'] | default('') is search('needs a path')
          - __errors['type'] | default('') is search('must be one of')
          - __errors['mode'] | default('') is search('must be a quoted octal string')
        fail_msg: 'Unexpected validation results: {{ __errors }}'
        success_msg: 'The validation rejects every invalid writable path'
      vars:
        __errors: '{{ __side_effect_writable_errors | default({}) }}'

# A per-site http2 that is not a boolean must fail the validation in
# main.yml, which runs before any change.
- name: Side Effect | HTTP/2 validation
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Run with a string as http2 of a site
      block:
        - name: Side Effect | Include nginx role with a string as http2  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_sites:
              - name: 'test-http2-string'
                server_names:
                  - 'http2-string.example.com'
                root: '/var/www/html'
                http2: 'off'
      rescue:
        - name: Side Effect | Record the HTTP/2 validation failure
          ansible.builtin.set_fact:
            __side_effect_http2_error: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | first | default('') }}

    - name: Side Effect | Run with a typo as HTTP/2 default
      block:
        - name: Side Effect | Include nginx role with a typo in nginx_http2_enabled  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_http2_enabled: 'flase'
      rescue:
        - name: Side Effect | Record the HTTP/2 default failure
          ansible.builtin.set_fact:
            __side_effect_http2_default_error: '{{ ansible_failed_result.msg | default("") }}'

    # -e nginx_http2_enabled=false passes the string 'false'; it must pass the
    # validation and switch HTTP/2 off like the boolean
    - name: Side Effect | Include nginx role with the string 'false' as HTTP/2 default  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        nginx_enabled: true
        nginx_http2_enabled: 'false'

    - name: Side Effect | Read the default site rendered with the string 'false'
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/default.conf
      register: __side_effect_http2_false_site

    - name: Side Effect | Assert the string 'false' switched HTTP/2 off
      ansible.builtin.assert:
        that:
          - (__side_effect_http2_false_site.content | b64decode) is not search('http2 on;|ssl http2')
          - (__side_effect_http2_false_site.content | b64decode) is search('listen 443 ssl default_server;')
        fail_msg: >-
          The default site still has HTTP/2 with nginx_http2_enabled: 'false':
          {{ __side_effect_http2_false_site.content | b64decode }}
        success_msg: "The string 'false' switches HTTP/2 off"

    - name: Side Effect | Assert a string as http2 failed the validation
      ansible.builtin.assert:
        that:
          - __side_effect_http2_error | default('') is search("http2 of site 'test-http2-string' must be true or false")
          - >-
            __side_effect_http2_default_error | default('')
            is search('nginx_http2_enabled must be true or false')
        fail_msg: >-
          A string as http2 or a typo in nginx_http2_enabled did not fail the validation
          (errors: {{ __side_effect_http2_error | default('none') }};
          {{ __side_effect_http2_default_error | default('none') }})
        success_msg: 'A per-site http2 that is not a boolean or a typo in the default fails the run'

# A site with http2: false on port 443, which the default site and
# test-redirect-default share with HTTP/2 on. From nginx 1.25.1 the
# directive sits in the server blocks with HTTP/2 on only, so the site
# stays on HTTP/1.1 by itself; before that (EL 9) the
# listen parameter would switch it on for the whole port, so the run must
# fail before any configuration change and name the port and the sites.
- name: Side Effect | HTTP/2 on a shared port
  hosts: all
  gather_facts: true

  vars:
    __side_effect_shared_site:
      name: 'test-http2-shared'
      server_names:
        - 'http2-shared.example.com'
      root: '/var/www/html'
      http2: false
      ssl:
        enabled: true
        certificate: '/etc/nginx/ssl/test.crt'
        certificate_key: '/etc/nginx/ssl/test.key'

  tasks:
    - name: Side Effect | Read the installed nginx version
      ansible.builtin.command:
        argv:
          - nginx
          - -v
      register: __side_effect_nginx_version
      changed_when: false

    - name: Side Effect | Select the expected outcome
      ansible.builtin.set_fact:
        __side_effect_http2_directive: >-
          {{ (__side_effect_nginx_version.stderr | regex_search('nginx/([0-9.]+)', '\1') or ['0'])
             | first is version('1.25.1', '>=') }}

    - name: Side Effect | Run with sites disagreeing on HTTP/2 on port 443
      block:
        - name: Side Effect | Include nginx role with a shared port  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_sites:
              - '{{ __side_effect_shared_site }}'
      rescue:
        - name: Side Effect | Record the shared port failure
          ansible.builtin.set_fact:
            __side_effect_shared_error: '{{ ansible_failed_result.msg | default("") }}'

    - name: Side Effect | Check whether the shared port site was deployed
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/test-http2-shared.conf
      register: __side_effect_shared_conf

    - name: Side Effect | Assert the shared port failed before any change (nginx before 1.25.1)
      ansible.builtin.assert:
        that:
          - >-
            __side_effect_shared_error | default('')
            is search('Port 443: HTTP/2 on for default site, off for test-http2-shared')
          - not __side_effect_shared_conf.stat.exists
        fail_msg: >-
          Sites disagreeing on HTTP/2 on one port did not fail before the
          configuration (error: {{ __side_effect_shared_error | default('none') }},
          site deployed: {{ __side_effect_shared_conf.stat.exists }})
        success_msg: 'nginx before 1.25.1 refuses sites that disagree on HTTP/2 on one port'
      when: not (__side_effect_http2_directive | bool)

    - name: Side Effect | Flush the reload of the shared port site
      ansible.builtin.meta: flush_handlers

    # After an h2 handshake the server sends a binary SETTINGS frame, which
    # is not valid text; only the ALPN line is kept.
    - name: Side Effect | Negotiate the protocol on the shared port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          openssl s_client -connect 127.0.0.1:443 -servername {{ item }} \
            -alpn h2,http/1.1 < /dev/null 2> /dev/null \
            | grep -a -E '^(ALPN protocol|No ALPN)'
        executable: /bin/bash
      loop:
        - 'redirect-default.example.com'
        - 'http2-shared.example.com'
      register: __side_effect_alpn
      changed_when: false
      when: __side_effect_http2_directive | bool

    - name: Side Effect | Assert the shared port serves both settings (nginx 1.25.1 and later)
      ansible.builtin.assert:
        that:
          - __side_effect_shared_error is not defined
          - __side_effect_alpn_result['redirect-default.example.com'] == 'h2'
          - __side_effect_alpn_result['http2-shared.example.com'] == 'http/1.1'
        fail_msg: >-
          Expected h2 for redirect-default.example.com and http/1.1 for
          http2-shared.example.com on port 443, got {{ __side_effect_alpn_result }}
          (error: {{ __side_effect_shared_error | default('none') }})
        success_msg: 'Sites on one port negotiate their own HTTP/2 setting'
      vars:
        __side_effect_alpn_result: >-
          {{ dict(__side_effect_alpn.results | map(attribute='item')
                  | zip(__side_effect_alpn.results | map(attribute='stdout')
                        | map('regex_search', 'ALPN protocol: (\S+)', '\1')
                        | map('default', ['none'], true) | map('first'))) }}
      when: __side_effect_http2_directive | bool

    - name: Side Effect | Remove the shared port site
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/nginx/sites-enabled/test-http2-shared.conf
        - /etc/nginx/sites-available/test-http2-shared.conf

    - name: Side Effect | Reload nginx without the shared port site
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

- name: Side Effect | Clean up
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Allow service restarts by packages again (Debian)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: ansible_facts['os_family'] == 'Debian'

# nginx_selinux_network_connect: false cannot be combined with a proxy site.
# The assert runs before any configuration change, on every platform.
- name: Side Effect | SELinux validation
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Run with network connections denied next to a proxy site
      block:
        - name: Side Effect | Include nginx role with a proxy site and no network connect  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            nginx_enabled: true
            nginx_selinux_network_connect: false
            nginx_sites:
              - name: 'test-proxy'
                server_names:
                  - 'proxy.example.com'
                type: 'proxy'
                proxy_pass: 'http://127.0.0.1:8080'
      rescue:
        - name: Side Effect | Record the SELinux validation failure
          ansible.builtin.set_fact:
            __side_effect_selinux_error: '{{ ansible_failed_result.msg | default("") }}'

    - name: Side Effect | Assert network connections denied next to a proxy site failed
      ansible.builtin.assert:
        that:
          - __side_effect_selinux_error is defined
          - "'nginx_selinux_network_connect is false' in __side_effect_selinux_error"
        fail_msg: >-
          nginx_selinux_network_connect: false next to a proxy site did not fail
          the run (error: {{ __side_effect_selinux_error | default('none') }})
        success_msg: 'nginx_selinux_network_connect: false next to a proxy site fails the run'

# Each boolean follows true, null, false and null again; null must leave the
# value of the run before untouched. The PHP site has no upstream and no proxy
# type, so only nginx_selinux_network_connect decides whether its location
# reaches the backend on an unlabeled port (httpd_t, shared with PHP-FPM).
# The false case defines an upstream nothing uses: it does not count as a
# proxy and must not fail the run. Needs SELinux, so RedHat only and skipped
# where the container runs without it.
- name: Side Effect | SELinux booleans
  hosts: all
  gather_facts: true

  vars:
    __side_effect_selinux_enabled: >-
      {{ ansible_facts['os_family'] == 'RedHat'
         and ansible_facts['selinux']['status'] | default('disabled') == 'enabled' }}
    __side_effect_selinux_sites:
      - name: 'test-selinux-php'
        server_names:
          - 'selinux-php.example.com'
        type: 'php'
        root: '/var/www/html'
        php:
          socket: 'unix:/run/php-fpm/www.sock'
        locations:
          - path: '/backend/'
            config: 'proxy_pass http://127.0.0.1:15555/;'

  tasks:
    - name: Side Effect | Create the backend document root
      ansible.builtin.file:
        path: /var/www/selinux-backend
        state: directory
        mode: '0755'
      when: __side_effect_selinux_enabled | bool

    - name: Side Effect | Create the backend index
      ansible.builtin.copy:
        content: "backend\n"
        dest: /var/www/selinux-backend/index.html
        mode: '0644'
      when: __side_effect_selinux_enabled | bool

    - name: Side Effect | Start the backend on an unlabeled port
      ansible.builtin.command:
        argv:
          - systemd-run
          - '--unit=nginx-selinux-backend'
          - python3
          - '-m'
          - http.server
          - '15555'
          - '--bind'
          - '127.0.0.1'
          - '--directory'
          - /var/www/selinux-backend
      changed_when: true
      when: __side_effect_selinux_enabled | bool

    - name: Side Effect | Wait for the backend
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 15555
        timeout: 30
      when: __side_effect_selinux_enabled | bool

    - name: Side Effect | Run the SELinux boolean cases
      ansible.builtin.include_tasks: tasks/selinux_booleans.yml
      loop:
        - name: 'true'
          value: true
          expected: 'on'
        - name: 'null after true'
          value: null
          expected: 'on'
        - name: 'false'
          value: false
          expected: 'off'
          upstreams:
            - name: 'selinux_unused'
              servers:
                - address: '127.0.0.1:15555'
        - name: 'null after false'
          value: null
          expected: 'off'
      loop_control:
        loop_var: __side_effect_case
        label: '{{ __side_effect_case.name }}'
      when: __side_effect_selinux_enabled | bool

    - name: Side Effect | Stop the backend
      ansible.builtin.systemd_service:
        name: nginx-selinux-backend
        state: stopped
      when: __side_effect_selinux_enabled | bool

# The SELinux plays ran the role with its defaults; restore the configuration
# verify.yml expects.
- name: Side Effect | Restore
  ansible.builtin.import_playbook: converge.yml
