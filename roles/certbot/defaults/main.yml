---
# =============================================================================
# ANSIBLE-CERTBOT ROLE - DEFAULT VARIABLES
# =============================================================================
# This role installs and configures Certbot for Let's Encrypt SSL certificates.
# All variables are optional and have sensible defaults.
# =============================================================================

# =============================================================================
# SERVICE CONTROL
# =============================================================================
# Enable this role (opt-in — set to true in inventory to manage Certbot)
certbot_enabled: false

# Enable automatic certificate renewal
certbot_auto_renew: true

# =============================================================================
# PACKAGE OPTIONS
# =============================================================================
# Install specific plugins
certbot_plugins: []
# Available plugins:
#   - 'nginx'       # Nginx authenticator and installer
#   - 'apache'      # Apache authenticator and installer
#   - 'dns-cloudflare'
#   - 'dns-route53'
#   - 'dns-google'
#   - 'dns-digitalocean'
#   - 'dns-linode'
#   - 'dns-ovh'
#   - 'dns-rfc2136'
#   - 'dns-nsone'
#   - 'dns-dnsimple'
#   - 'dns-gehirn'
#   - 'dns-sakuracloud'

# =============================================================================
# ACCOUNT SETTINGS
# =============================================================================
# Email address for Let's Encrypt notifications
certbot_email: ''

# Agree to Let's Encrypt Terms of Service automatically
certbot_agree_tos: true

# Register with ACME server without email (not recommended)
certbot_register_unsafely_without_email: false

# =============================================================================
# CERTIFICATE DEFAULTS
# =============================================================================
# Use staging server for testing (rate limits are higher)
certbot_staging: false

# Key type: rsa or ecdsa
certbot_key_type: 'ecdsa'

# Key size for RSA keys
certbot_rsa_key_size: 4096

# Elliptic curve for ECDSA keys
certbot_elliptic_curve: 'secp384r1'

# Preferred chain (e.g., 'ISRG Root X1' for better compatibility)
certbot_preferred_chain: ''

# Certificate validity preferences
certbot_preferred_challenges: []
# Examples:
#   - 'http-01'
#   - 'dns-01'
#   - 'tls-alpn-01'

# =============================================================================
# DEFAULT AUTHENTICATOR
# =============================================================================
# Default authenticator to use: webroot, standalone, nginx, apache, dns-*
certbot_authenticator: 'webroot'

# Webroot path (for webroot authenticator)
certbot_webroot_path: '/var/www/letsencrypt'

# Create webroot directory
certbot_create_webroot: true
certbot_webroot_owner: 'root'
certbot_webroot_group: 'root'
certbot_webroot_mode: '0755'

# =============================================================================
# DNS PLUGIN CONFIGURATION
# =============================================================================
# Cloudflare API credentials
certbot_dns_cloudflare_email: ''
certbot_dns_cloudflare_api_key: '{{ vault_certbot_dns_cloudflare_api_key | default("") }}'
certbot_dns_cloudflare_api_token: '{{ vault_certbot_dns_cloudflare_api_token | default("") }}'
certbot_dns_cloudflare_credentials_file: '/etc/letsencrypt/cloudflare.ini'

# Route53 (AWS) configuration
certbot_dns_route53_access_key_id: ''
certbot_dns_route53_secret_access_key: '{{ vault_certbot_dns_route53_secret_access_key | default("") }}'
certbot_dns_route53_credentials_file: '/etc/letsencrypt/route53.ini'

# DigitalOcean configuration
certbot_dns_digitalocean_token: '{{ vault_certbot_dns_digitalocean_token | default("") }}'
certbot_dns_digitalocean_credentials_file: '/etc/letsencrypt/digitalocean.ini'

# Generic DNS credentials file (for other providers)
certbot_dns_credentials_file: ''

# DNS propagation wait time in seconds
certbot_dns_propagation_seconds: 60

# =============================================================================
# CERTIFICATES TO OBTAIN
# =============================================================================
certbot_certificates: []
# Example configurations:
#
# Simple webroot certificate:
#   - domains:
#       - 'example.com'
#       - 'www.example.com'
#     authenticator: 'webroot'
#     webroot: '/var/www/letsencrypt'
#
# Nginx plugin (auto-configures nginx):
#   - domains:
#       - 'app.example.com'
#     authenticator: 'nginx'
#
# Standalone (certbot runs its own server):
#   - domains:
#       - 'mail.example.com'
#     authenticator: 'standalone'
#     pre_hook: 'systemctl stop nginx'
#     post_hook: 'systemctl start nginx'
#
# DNS challenge (for wildcards):
#   - domains:
#       - '*.example.com'
#       - 'example.com'
#     authenticator: 'dns-cloudflare'
#
# Full options:
#   - name: 'custom-cert-name'  # Custom certificate name
#     domains:
#       - 'example.com'
#       - 'www.example.com'
#     authenticator: 'webroot'
#     webroot: '/var/www/letsencrypt'
#     key_type: 'ecdsa'
#     elliptic_curve: 'secp384r1'
#     staging: false
#     force_renewal: false
#     expand: false  # Expand existing cert with new domains
#     pre_hook: ''
#     post_hook: ''
#     deploy_hook: 'systemctl reload nginx'
#     must_staple: false  # Add OCSP Must-Staple extension

# =============================================================================
# RENEWAL CONFIGURATION
# =============================================================================
# Renewal timer schedule (systemd timer or cron)
certbot_renew_schedule: 'daily'

# Randomize renewal time to avoid thundering herd
certbot_renew_random_delay: 3600

# Days before expiry to renew
certbot_renew_before_expiry: 30

# Global hooks for all renewals
certbot_pre_hook: ''
certbot_post_hook: ''
certbot_deploy_hook: ''

# Common deploy hooks:
# - 'systemctl reload nginx'
# - 'systemctl reload apache2'
# - 'systemctl reload postfix'
# - >-
#     cat $RENEWED_LINEAGE/privkey.pem $RENEWED_LINEAGE/fullchain.pem
#     > /etc/haproxy/certs/combined.pem && systemctl reload haproxy

# =============================================================================
# RENEWAL METHOD
# =============================================================================
# Use systemd timer (preferred) or cron
certbot_use_systemd_timer: true

# Custom cron schedule (if not using systemd timer)
certbot_cron_minute: '0'
certbot_cron_hour: '3'
certbot_cron_day: '*'
certbot_cron_month: '*'
certbot_cron_weekday: '*'

# =============================================================================
# DIRECTORIES AND PERMISSIONS
# =============================================================================
# Let's Encrypt configuration directory
certbot_config_dir: '/etc/letsencrypt'

# Let's Encrypt work directory
certbot_work_dir: '/var/lib/letsencrypt'

# Let's Encrypt log directory
certbot_log_dir: '/var/log/letsencrypt'

# =============================================================================
# CERTIFICATE MANAGEMENT
# =============================================================================
# Remove certificates not in certbot_certificates list
certbot_remove_orphaned: false

# List of certificate names to explicitly remove
certbot_remove_certificates: []

# =============================================================================
# ACME SERVER
# =============================================================================
# Custom ACME server (default: Let's Encrypt)
certbot_server: ''
# Examples:
#   - 'https://acme-v02.api.letsencrypt.org/directory'  # Production (default)
#   - 'https://acme-staging-v02.api.letsencrypt.org/directory'  # Staging
#   - 'https://api.buypass.com/acme/directory'  # Buypass
#   - 'https://acme.zerossl.com/v2/DV90'  # ZeroSSL

# =============================================================================
# ADDITIONAL OPTIONS
# =============================================================================
# Suppress all output except errors
certbot_quiet: false

# Keep old certificate versions
certbot_keep_until_expiring: true

# Don't expand existing certificates with new domains automatically
certbot_allow_subset_of_names: false

# Number of rotated log files to keep in /var/log/letsencrypt. certbot
# rotates its log on every run, so this is the number of past runs kept.
certbot_max_log_backups: 10

# =============================================================================
# INTEGRATION OPTIONS
# =============================================================================
# Create combined PEM files (cert + key, useful for HAProxy)
certbot_create_combined_pem: false
certbot_combined_pem_path: '/etc/letsencrypt/combined'

# Create PKCS12 files (useful for Java applications)
certbot_create_pkcs12: false
certbot_pkcs12_path: '/etc/letsencrypt/pkcs12'
certbot_pkcs12_password: '{{ vault_certbot_pkcs12_password | default("") }}'

# =============================================================================
# MAIL SERVICE INTEGRATION
# =============================================================================
# Automatically reload mail services on certificate renewal
# These add deploy hooks to reload services when certs are renewed

# Reload Postfix on renewal
certbot_postfix_enabled: false

# Reload Dovecot on renewal
certbot_dovecot_enabled: false

# Reload nginx on renewal (common for webmail)
certbot_nginx_enabled: false

# Reload Apache on renewal
certbot_apache_enabled: false

# Custom services to reload on renewal (list of systemd service names)
certbot_reload_services: []
# Example:
#   - 'postfix'
#   - 'dovecot'
#   - 'nginx'

# -----------------------------------------------------------------------------
# Mail Certificate Helper
# -----------------------------------------------------------------------------
# Generate a mail-specific certificate with common mail hostnames
# This creates a certificate for: mail.domain, smtp.domain, imap.domain, etc.
certbot_mail_certificate_enabled: false

# Base domain for mail certificate
certbot_mail_domain: '{{ ansible_domain }}'

# Mail hostnames to include (prefixes added to mail_domain)
certbot_mail_hostnames:
  - 'mail'
  - 'smtp'
  - 'imap'
  - 'pop3'

# Include autodiscover/autoconfig hostnames (for email client auto-configuration)
certbot_mail_autodiscover: true
# Adds: autodiscover.domain, autoconfig.domain

# Authenticator for mail certificate
certbot_mail_authenticator: '{{ certbot_authenticator }}'

# Webroot for mail certificate (if using webroot authenticator)
certbot_mail_webroot: '{{ certbot_webroot_path }}'

# =============================================================================
# MONITORING
# =============================================================================
# Check certificate expiry and warn if less than X days
certbot_expiry_warning_days: 14

# Create a script for monitoring systems
certbot_monitoring_script: false
certbot_monitoring_script_path: '/usr/local/bin/check-certs'

# =============================================================================
# EXTRA OPTIONS
# =============================================================================
# Additional arguments to pass to certbot
certbot_extra_args: []
# Example:
#   - '--debug'
#   - '--non-interactive'

# Custom configuration file content
certbot_custom_config: ''
# Example: |
#   rsa-key-size = 4096
#   email = admin@example.com
