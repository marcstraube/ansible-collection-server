---
# Handler topic contract: the tasks that obtain a certificate notify
# 'Reload cert services' when certbot actually issued one. Roles consuming the
# certificates subscribe with `listen` on their own reload or restart handler,
# keeping their own service conditionals. The inventory configures nothing.
#
# This role subscribes itself with the service reload script, so the services
# it reloads after a renewal run (certbot_*_enabled, certbot_reload_services)
# also pick up a certificate issued inside a play. The script never restarts
# and fails the handler when a configuration check or a reload fails (the
# retry timer or cron job then retries it). The script is written by the
# renewal tasks; a run limited to `--tags certbot:certificates` on a host
# without it skips the reload (`removes:`) instead of failing. The listener is
# always defined, as Ansible aborts a run when a notification reaches no
# handler at all.
- name: Run certbot service reload script
  ansible.builtin.command:
    cmd: '{{ __certbot_reload_script }}'
    removes: '{{ __certbot_reload_script }}'
  changed_when: true
  listen: Reload cert services
  when:
    - certbot_enabled | bool
    - __certbot_reload_services | length > 0
