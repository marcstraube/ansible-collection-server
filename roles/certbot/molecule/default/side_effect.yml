---
# Runs after verify.yml. The first play checks the refusal of a certificate
# post hook and of a foreign POST_HOOK (EL), the read-only check of saved post
# hooks, the cron job with post hook and retry, and a configured unit that
# does not exist, at a renewal and at an issuance. The second play checks the
# key options of the certonly command lines, the third the key reuse of
# existing certificates, the fourth removes all reload services, the fifth
# checks that the role removed the script and every reference to it, and the
# sixth that a foreign POST_HOOK survives the removal (EL). The last two
# check the command lines of the certificate tasks and the renewal with
# another certbot_config_dir.
- name: Side Effect — Post hook guard and cron job
  hosts: all
  gather_facts: true

  vars:
    certbot_enabled: true
    certbot_email: 'test@example.com'
    certbot_staging: true
    certbot_nginx_enabled: true
    certbot_reload_services:
      - 'molecule-reload-test.service'
      - 'molecule-stopped.service'

  tasks:
    - name: Side Effect | Include certbot with a per-certificate post hook
      block:
        - name: Side Effect | Include certbot role with a certificate post hook  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            certbot_certificates:
              - domains:
                  - 'www.example.com'
                authenticator: 'standalone'
                post_hook: 'systemctl start nginx'

        - name: Side Effect | Fail when the certificate post hook was accepted
          ansible.builtin.fail:
            msg: 'The role accepted a certificate post hook next to the reload services'

      rescue:
        - name: Side Effect | Assert the role refused the certificate post hook
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('certbot_certificates sets post_hook')
            fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
            quiet: true

    - name: Side Effect | Refuse a foreign POST_HOOK (EL)
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Side Effect | Set a foreign POST_HOOK (EL)
          ansible.builtin.lineinfile:
            path: /etc/sysconfig/certbot
            regexp: '^POST_HOOK='
            line: 'POST_HOOK="--post-hook=/usr/bin/true"'

        - name: Side Effect | Include certbot role with a foreign POST_HOOK (EL)  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'

        - name: Side Effect | Fail when the foreign POST_HOOK was accepted (EL)
          ansible.builtin.fail:
            msg: 'The role accepted a foreign POST_HOOK'

      rescue:
        - name: Side Effect | Read the environment file after the refusal (EL)
          ansible.builtin.slurp:
            src: /etc/sysconfig/certbot
          register: __side_effect_sysconfig_foreign

        - name: Side Effect | Assert the role refused the foreign POST_HOOK and kept it (EL)
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('POST_HOOK in /etc/sysconfig/certbot is set to')
              - >-
                'POST_HOOK="--post-hook=/usr/bin/true"'
                in (__side_effect_sysconfig_foreign.content | b64decode).splitlines()
            fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
            quiet: true

        - name: Side Effect | Restore the POST_HOOK of the role (EL)
          ansible.builtin.lineinfile:
            path: /etc/sysconfig/certbot
            regexp: '^POST_HOOK='
            line: 'POST_HOOK="--post-hook=/usr/local/sbin/certbot-reload-services"'

    # systemd uses the last of several assignments; a foreign one on any line
    # is refused, an empty one with a trailing space is not foreign
    - name: Side Effect | Refuse a foreign POST_HOOK on a second line (EL)
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Side Effect | Add an empty and a foreign POST_HOOK line (EL)
          ansible.builtin.blockinfile:
            path: /etc/sysconfig/certbot
            marker: '# {mark} MOLECULE POST_HOOK'
            insertbefore: '^POST_HOOK='
            # The trailing space of the empty value is part of the test
            block: "POST_HOOK=\"\" \nPOST_HOOK=\"--post-hook=/usr/bin/false\""

        - name: Side Effect | Include certbot role with two extra POST_HOOK lines (EL)  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'

        - name: Side Effect | Fail when the second POST_HOOK line was accepted (EL)
          ansible.builtin.fail:
            msg: 'The role accepted a foreign POST_HOOK on another line'

      rescue:
        - name: Side Effect | Assert the role refused only the foreign line (EL)
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('is set to --post-hook=/usr/bin/false, which')
            fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
            quiet: true

        - name: Side Effect | Remove the extra POST_HOOK lines (EL)
          ansible.builtin.blockinfile:
            path: /etc/sysconfig/certbot
            marker: '# {mark} MOLECULE POST_HOOK'
            state: absent

    # Saved post hooks of certificates: one of another owner, one of the role
    - name: Side Effect | Create the renewal configuration directory
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Side Effect | Create a nested renewal directory
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal/nested
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Side Effect | Plant renewal configurations with saved post hooks
      ansible.builtin.copy:
        content: "[renewalparams]\npost_hook = {{ item.hook }}\n"
        dest: '/etc/letsencrypt/renewal/{{ item.name }}.conf'
        owner: root
        group: root
        mode: '0644'
      loop:
        - {name: 'foreign.example.com', hook: 'systemctl start nginx'}
        - {name: 'own.example.com', hook: '/usr/local/sbin/certbot-reload-services'}
        - {name: 'nested/ignored.example.com', hook: 'systemctl start apache2'}

    # certbot reads only the top level, and follows symlinks there
    - name: Side Effect | Link a renewal configuration
      ansible.builtin.file:
        src: /etc/letsencrypt/renewal/foreign.example.com.conf
        dest: /etc/letsencrypt/renewal/link.example.com.conf
        state: link

    - name: Side Effect | Include certbot role with the cron job  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        certbot_use_systemd_timer: false
        certbot_reload_services:
          - 'molecule-reload-test.service'
          - 'molecule-missing.service'

    - name: Side Effect | Read the planted renewal configurations
      ansible.builtin.slurp:
        src: /etc/letsencrypt/renewal/foreign.example.com.conf
      register: __side_effect_planted

    # The role found both, warned about the foreign one and changed nothing
    - name: Side Effect | Assert the role read the saved post hooks without changing them
      ansible.builtin.assert:
        that:
          - __certbot_saved_post_hooks.stdout_lines | length == 3
          - >-
            __certbot_saved_post_hooks.stdout_lines
            | select('search', 'foreign.example.com.conf:post_hook = systemctl start nginx') | list | length == 1
          - >-
            __certbot_saved_post_hooks.stdout_lines
            | select('search', 'link.example.com.conf:post_hook = systemctl start nginx') | list | length == 1
          - "'apache2' not in __certbot_saved_post_hooks.stdout"
          - (__side_effect_planted.content | b64decode) == "[renewalparams]\npost_hook = systemctl start nginx\n"
        fail_msg: '{{ __certbot_saved_post_hooks.stdout_lines }}'
        quiet: true

    # certbot renew would refuse the incomplete files later in side_effect
    - name: Side Effect | Remove the planted renewal configurations
      ansible.builtin.file:
        path: '/etc/letsencrypt/renewal/{{ item }}'
        state: absent
      loop:
        - 'link.example.com.conf'
        - 'foreign.example.com.conf'
        - 'own.example.com.conf'
        - 'nested'

    - name: Side Effect | Read the crontab of root
      ansible.builtin.command:
        cmd: crontab -l -u root
      register: __side_effect_crontab
      changed_when: false

    - name: Side Effect | Check the reload retry timer in cron mode
      ansible.builtin.stat:
        path: /etc/systemd/system/certbot-reload-retry.timer
      register: __side_effect_retry_timer_cron

    - name: Side Effect | Assert the cron jobs pass the post hook and retry the reload
      ansible.builtin.assert:
        that:
          - >-
            '0 3 * * * certbot renew --quiet --post-hook=/usr/local/sbin/certbot-reload-services'
            in __side_effect_crontab.stdout_lines
          - "'30 * * * * /usr/local/sbin/certbot-reload-services --retry' in __side_effect_crontab.stdout_lines"
          - not __side_effect_retry_timer_cron.stat.exists
        fail_msg: '{{ __side_effect_crontab.stdout_lines }}'
        quiet: true

    - name: Side Effect | Run the service reload script with a unit that does not exist
      ansible.builtin.command:
        cmd: /usr/local/sbin/certbot-reload-services
      register: __side_effect_reload_missing
      changed_when: false
      failed_when: false

    - name: Side Effect | Check the retry marker after the missing unit
      ansible.builtin.stat:
        path: /var/lib/certbot-reload-services/pending
      register: __side_effect_marker_missing

    - name: Side Effect | Assert a missing unit fails the script and leaves the marker
      ansible.builtin.assert:
        that:
          - __side_effect_reload_missing.rc == 1
          - "'certbot-reload-services: molecule-missing.service: unit not found, not reloaded'
            in __side_effect_reload_missing.stderr_lines"
          - "'certbot-reload-services: nginx reloaded' in __side_effect_reload_missing.stdout_lines"
          - __side_effect_marker_missing.stat.exists
        fail_msg: '{{ __side_effect_reload_missing.stdout_lines + __side_effect_reload_missing.stderr_lines }}'
        quiet: true

    - name: Side Effect | Retry the reload with the missing unit
      ansible.builtin.command:
        cmd: /usr/local/sbin/certbot-reload-services --retry
      register: __side_effect_retry_missing
      changed_when: false
      failed_when: >-
        __side_effect_retry_missing.rc != 1
        or 'molecule-missing.service: unit not found, not reloaded' not in __side_effect_retry_missing.stderr

    # The issuance on a host where a later play installs the service: the
    # handler skips the missing unit and reloads the rest. It does not clear
    # the marker of the failure above, and leaves none of its own.
    - name: Side Effect | Read the reload count of the test unit before the handlers
      ansible.builtin.command:
        cmd: cat /run/molecule-reload-test.log
      register: __side_effect_reloads_before
      changed_when: false
      failed_when: false

    - name: Side Effect | Notify the certificate handler with a pending reload
      ansible.builtin.command:
        cmd: 'true'
      changed_when: true
      notify: Reload cert services

    - name: Side Effect | Run the certificate handler with a pending reload
      ansible.builtin.meta: flush_handlers

    - name: Side Effect | Check the retry marker after the handler
      ansible.builtin.stat:
        path: /var/lib/certbot-reload-services/pending
      register: __side_effect_marker_kept

    - name: Side Effect | Remove the retry marker
      ansible.builtin.file:
        path: /var/lib/certbot-reload-services/pending
        state: absent

    - name: Side Effect | Notify the certificate handler
      ansible.builtin.command:
        cmd: 'true'
      changed_when: true
      notify: Reload cert services

    - name: Side Effect | Run the certificate handler
      ansible.builtin.meta: flush_handlers

    - name: Side Effect | Check the retry marker after the second handler run
      ansible.builtin.stat:
        path: /var/lib/certbot-reload-services/pending
      register: __side_effect_marker_issuance

    - name: Side Effect | Read the reload count of the test unit after the handlers
      ansible.builtin.command:
        cmd: cat /run/molecule-reload-test.log
      register: __side_effect_reloads_after
      changed_when: false

    - name: Side Effect | Run the service reload script as the handler does
      ansible.builtin.command:
        cmd: /usr/local/sbin/certbot-reload-services --issuance
      register: __side_effect_reload_issuance
      changed_when: false
      failed_when: false

    - name: Side Effect | Assert the issuance skips a missing unit
      ansible.builtin.assert:
        that:
          - >-
            __side_effect_reloads_after.stdout_lines | length
            == __side_effect_reloads_before.stdout_lines | length + 2
          - "__certbot_reload_result.stderr_lines | select('search', 'unit not found, skipped$') | list | length == 1"
          - __side_effect_marker_kept.stat.exists
          - not __side_effect_marker_issuance.stat.exists
          - __side_effect_reload_issuance.rc == 0
          - "'certbot-reload-services: molecule-missing.service: unit not found, skipped'
            in __side_effect_reload_issuance.stderr_lines"
          - "'certbot-reload-services: nginx reloaded' in __side_effect_reload_issuance.stdout_lines"
        fail_msg: >-
          marker kept {{ __side_effect_marker_kept.stat.exists }},
          marker left {{ __side_effect_marker_issuance.stat.exists }},
          {{ __side_effect_reload_issuance.stdout_lines + __side_effect_reload_issuance.stderr_lines }}
        quiet: true

    # A failure of another service still fails the issuance
    - name: Side Effect | Fail the issuance on a broken configuration
      block:
        - name: Side Effect | Break the nginx configuration
          ansible.builtin.copy:
            content: "this_is_not_a_directive;\n"
            dest: /etc/nginx/molecule.d/broken.conf
            owner: root
            group: root
            mode: '0644'

        - name: Side Effect | Run the service reload script for the issuance with a broken service
          ansible.builtin.command:
            cmd: /usr/local/sbin/certbot-reload-services --issuance
          register: __side_effect_issuance_broken
          changed_when: false
          failed_when: __side_effect_issuance_broken.rc != 1

        - name: Side Effect | Check the retry marker after the failed issuance
          ansible.builtin.stat:
            path: /var/lib/certbot-reload-services/pending
          register: __side_effect_marker_broken
          failed_when: not __side_effect_marker_broken.stat.exists

      always:
        - name: Side Effect | Restore the nginx configuration
          ansible.builtin.file:
            path: /etc/nginx/molecule.d/broken.conf
            state: absent

        - name: Side Effect | Remove the marker of the failed issuance
          ansible.builtin.file:
            path: /var/lib/certbot-reload-services/pending
            state: absent

    # Back to the systemd timer, with the retry timer switched off: both cron
    # jobs go away, the retry units stay but the timer does not run
    - name: Side Effect | Include certbot role with the systemd timer and no retry timer  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        certbot_reload_retry_timer_enabled: false

    - name: Side Effect | Read the crontab of root after the switch
      ansible.builtin.command:
        cmd: crontab -l -u root
      register: __side_effect_crontab_switched
      changed_when: false
      # crontab -l exits with 1 when root has no crontab left
      failed_when: __side_effect_crontab_switched.rc > 1

    - name: Side Effect | Read the reload retry timer with the toggle off
      ansible.builtin.systemd_service:
        name: certbot-reload-retry.timer
      register: __side_effect_retry_timer_off

    - name: Side Effect | Assert the switch removed the cron jobs and the toggle stopped the retry timer
      ansible.builtin.assert:
        that:
          - "'certbot renew' not in __side_effect_crontab_switched.stdout"
          - "'--retry' not in __side_effect_crontab_switched.stdout"
          - __side_effect_retry_timer_off.status.LoadState == 'loaded'
          - __side_effect_retry_timer_off.status.ActiveState == 'inactive'
          - __side_effect_retry_timer_off.status.UnitFileState == 'disabled'
        fail_msg: >-
          {{ __side_effect_crontab_switched.stdout_lines }},
          timer {{ __side_effect_retry_timer_off.status.ActiveState }}
          {{ __side_effect_retry_timer_off.status.UnitFileState }}
        quiet: true

# The certonly command lines of the role, recorded by a certbot stub that
# comes first in PATH and reports every call as an issuance (the scenario
# requests no certificate): with certbot_reuse_key for every certificate,
# for the mail certificate and turned off for one entry, and with the role
# defaults, where --reuse-key is missing.
- name: Side Effect — Key options on the certonly command
  hosts: all
  gather_facts: false

  environment:
    PATH: '/root/certbot-stub:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

  vars:
    certbot_enabled: true
    certbot_email: 'test@example.com'
    certbot_staging: true
    certbot_mail_domain: 'example.net'
    certbot_mail_hostnames: ['mail']
    certbot_mail_autodiscover: false

  tasks:
    # A kept instance may hold the stub of an aborted run
    - name: Side Effect | Record the key options of the certonly command lines
      block:
        - name: Side Effect | Remove a leftover certbot stub
          ansible.builtin.file:
            path: /root/certbot-stub
            state: absent

        - name: Side Effect | Create the certbot stub directory
          ansible.builtin.file:
            path: /root/certbot-stub
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Side Effect | Deploy the certbot stub
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              # Records the arguments of every call on one line
              printf '%s\n' "$*" >> /root/certbot-stub/calls
              echo 'Successfully received certificate.'
            dest: /root/certbot-stub/certbot
            owner: root
            group: root
            mode: '0755'

        # certificates.yml alone: main.yml would refuse the RSA entry with key
        # reuse next to the role-wide ECDSA, as cli.ini breaks its renewal
        - name: Side Effect | Run the certificate tasks with key reuse for every certificate  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: certificates.yml
          vars:
            certbot_reuse_key: true
            certbot_mail_certificate_enabled: true
            certbot_certificates:
              - domains: ['all.example.com']
              - domains: ['rsa.example.com']
                key_type: 'rsa'
              - domains: ['off.example.com']
                reuse_key: false

        - name: Side Effect | Read the command lines with key reuse
          ansible.builtin.slurp:
            src: /root/certbot-stub/calls
          register: __side_effect_calls_reuse

        - name: Side Effect | Remove the recorded command lines
          ansible.builtin.file:
            path: /root/certbot-stub/calls
            state: absent

        - name: Side Effect | Run the certificate tasks with the role defaults  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: certificates.yml
          vars:
            certbot_mail_certificate_enabled: true
            certbot_certificates:
              - domains: ['default.example.com']
              - domains: ['reuse.example.com']
                reuse_key: true

        - name: Side Effect | Read the command lines with the role defaults
          ansible.builtin.slurp:
            src: /root/certbot-stub/calls
          register: __side_effect_calls_default

        - name: Side Effect | Assert the key options of the certonly command lines
          ansible.builtin.assert:
            that:
              - __side_effect_reuse == [
                  __side_effect_mail ~ ' --key-type ecdsa --elliptic-curve secp384r1 --reuse-key',
                  __side_effect_cert ~ 'all.example.com -d all.example.com' ~ __side_effect_auth
                    ~ ' --key-type ecdsa --elliptic-curve secp384r1 --reuse-key',
                  __side_effect_cert ~ 'rsa.example.com -d rsa.example.com' ~ __side_effect_auth
                    ~ ' --key-type rsa --rsa-key-size 4096 --reuse-key',
                  __side_effect_cert ~ 'off.example.com -d off.example.com' ~ __side_effect_auth
                    ~ ' --key-type ecdsa --elliptic-curve secp384r1']
              - __side_effect_default == [
                  __side_effect_mail ~ ' --key-type ecdsa --elliptic-curve secp384r1',
                  __side_effect_cert ~ 'default.example.com -d default.example.com' ~ __side_effect_auth
                    ~ ' --key-type ecdsa --elliptic-curve secp384r1',
                  __side_effect_cert ~ 'reuse.example.com -d reuse.example.com' ~ __side_effect_auth
                    ~ ' --key-type ecdsa --elliptic-curve secp384r1 --reuse-key']
            fail_msg: '{{ __side_effect_reuse }} {{ __side_effect_default }}'
            quiet: true
          vars:
            __side_effect_reuse: '{{ (__side_effect_calls_reuse.content | b64decode).splitlines() }}'
            __side_effect_default: '{{ (__side_effect_calls_default.content | b64decode).splitlines() }}'
            __side_effect_cert: 'certonly --non-interactive --agree-tos --email test@example.com --staging --cert-name '
            __side_effect_auth: ' --authenticator webroot --webroot-path /var/www/letsencrypt'
            __side_effect_mail: >-
              {{ __side_effect_cert }}mail.example.net -d mail.example.net{{ __side_effect_auth }}

      always:
        - name: Side Effect | Remove the certbot stub
          ansible.builtin.file:
            path: /root/certbot-stub
            state: absent

# Key reuse of certificates that exist already: the renewal configurations
# are fixtures in the form certbot writes them, one of them a symlink, and
# the certificate tasks skip the request because the certificate exists.
# reuse_key on the entry sets or removes reuse_key in [renewalparams];
# without it (role-wide default false) a setting made by hand stays; the
# mail certificate gets it with certbot_reuse_key. Check mode changes
# nothing, a second run neither. A certificate without renewal
# configuration fails the run.
- name: Side Effect — Key reuse of existing certificates
  hosts: all
  gather_facts: false

  vars:
    certbot_enabled: true
    certbot_email: 'test@example.com'
    certbot_staging: true
    certbot_mail_domain: 'example.net'
    __side_effect_lineages:
      - name: 'reuse.example.com'
        reuse_key_line: ''
      - name: 'new-key.example.com'
        reuse_key_line: 'reuse_key = True'
      - name: 'manual.example.com'
        reuse_key_line: 'reuse_key = True'
      - name: 'link.example.com'
        reuse_key_line: ''
      - name: 'mail.example.net'
        reuse_key_line: ''
    # The role runs: the certificate entries with the role-wide default, and
    # the mail certificate with certbot_reuse_key
    __side_effect_reuse_runs:
      - reuse_key: false
        mail: false
        certificates:
          - domains: ['reuse.example.com']
            reuse_key: true
          - domains: ['new-key.example.com']
            reuse_key: false
          - domains: ['manual.example.com']
          - domains: ['link.example.com']
            reuse_key: true
      - reuse_key: true
        mail: true
        certificates: []
    __side_effect_reuse_files: >-
      {{ __side_effect_lineages | map(attribute='name')
         | map('regex_replace', '^(.*)$', '/etc/letsencrypt/renewal/\1.conf') | list }}

  tasks:
    - name: Side Effect | Create the certificate directories
      ansible.builtin.file:
        path: '/etc/letsencrypt/live/{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: "{{ __side_effect_lineages | map(attribute='name') | list + ['orphan.example.com'] }}"

    - name: Side Effect | Plant the certificates
      ansible.builtin.copy:
        content: ''
        dest: '/etc/letsencrypt/live/{{ item }}/fullchain.pem'
        owner: root
        group: root
        mode: '0644'
      loop: "{{ __side_effect_lineages | map(attribute='name') | list + ['orphan.example.com'] }}"

    - name: Side Effect | Create the renewal configuration directories for the key reuse
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/letsencrypt/renewal
        - /etc/letsencrypt/renewal-linked

    # link.example.com lives in another directory, linked from renewal/
    - name: Side Effect | Plant the renewal configurations of the certificates
      ansible.builtin.copy:
        content: |
          # renew_before_expiry = 30 days
          version = 3.1.0
          archive_dir = /etc/letsencrypt/archive/{{ item.name }}
          cert = /etc/letsencrypt/live/{{ item.name }}/cert.pem
          privkey = /etc/letsencrypt/live/{{ item.name }}/privkey.pem
          chain = /etc/letsencrypt/live/{{ item.name }}/chain.pem
          fullchain = /etc/letsencrypt/live/{{ item.name }}/fullchain.pem

          # Options used in the renewal process
          [renewalparams]
          account = 0123456789abcdef0123456789abcdef
          authenticator = webroot
          webroot_path = /var/www/letsencrypt,
          server = https://acme-staging-v02.api.letsencrypt.org/directory
          key_type = ecdsa
          {{ item.reuse_key_line }}
          [[webroot_map]]
          {{ item.name }} = /var/www/letsencrypt
        dest: >-
          /etc/letsencrypt/{{ 'renewal-linked' if item.name == 'link.example.com' else 'renewal' }}/{{ item.name }}.conf
        owner: root
        group: root
        mode: '0644'
      loop: '{{ __side_effect_lineages }}'
      loop_control:
        label: '{{ item.name }}'

    - name: Side Effect | Link the renewal configuration of link.example.com
      ansible.builtin.file:
        src: /etc/letsencrypt/renewal-linked/link.example.com.conf
        dest: /etc/letsencrypt/renewal/link.example.com.conf
        state: link
        owner: root
        group: root

    - name: Side Effect | Read the renewal configurations before the runs
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: true
      loop: '{{ __side_effect_reuse_files }}'
      register: __side_effect_reuse_before

    - name: Side Effect | Run the certificate tasks in check mode  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: certificates.yml
        apply:
          check_mode: true
      vars:
        certbot_certificates: '{{ __side_effect_run.certificates }}'
        certbot_reuse_key: '{{ __side_effect_run.reuse_key }}'
        certbot_mail_certificate_enabled: '{{ __side_effect_run.mail }}'
      loop: '{{ __side_effect_reuse_runs }}'
      loop_control:
        loop_var: __side_effect_run

    - name: Side Effect | Read the renewal configurations after check mode
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: true
      loop: '{{ __side_effect_reuse_files }}'
      register: __side_effect_reuse_check

    - name: Side Effect | Run the certificate tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: certificates.yml
      vars:
        certbot_certificates: '{{ __side_effect_run.certificates }}'
        certbot_reuse_key: '{{ __side_effect_run.reuse_key }}'
        certbot_mail_certificate_enabled: '{{ __side_effect_run.mail }}'
      loop: '{{ __side_effect_reuse_runs }}'
      loop_control:
        loop_var: __side_effect_run

    - name: Side Effect | Read the renewal configurations after the run
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: true
      loop: '{{ __side_effect_reuse_files }}'
      register: __side_effect_reuse_after

    - name: Side Effect | Run the certificate tasks again  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: certificates.yml
      vars:
        certbot_certificates: '{{ __side_effect_run.certificates }}'
        certbot_reuse_key: '{{ __side_effect_run.reuse_key }}'
        certbot_mail_certificate_enabled: '{{ __side_effect_run.mail }}'
      loop: '{{ __side_effect_reuse_runs }}'
      loop_control:
        loop_var: __side_effect_run

    - name: Side Effect | Read the renewal configurations after the second run
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: true
      loop: '{{ __side_effect_reuse_files }}'
      register: __side_effect_reuse_again

    - name: Side Effect | Check the link of the linked renewal configuration
      ansible.builtin.stat:
        path: /etc/letsencrypt/renewal/link.example.com.conf
      register: __side_effect_reuse_link

    # Parsed with configobj, as certbot reads the files: reuse_key belongs to
    # [renewalparams], not to its subsection [[webroot_map]]
    - name: Side Effect | Read the renewal parameters with configobj
      ansible.builtin.command:
        argv: >-
          {{ [ansible_python_interpreter | default('/usr/bin/python3'), '-c', __side_effect_script]
             + __side_effect_reuse_files }}
      register: __side_effect_reuse_params
      changed_when: false
      vars:
        __side_effect_script: |
          import json, sys, configobj
          out = {}
          for path in sys.argv[1:]:
              params = configobj.ConfigObj(path)['renewalparams']
              out[path.split('/')[-1][:-5]] = {
                  'reuse_key': params.as_bool('reuse_key') if 'reuse_key' in params else None,
                  'webroot_map': sorted(params['webroot_map'].keys()),
              }
          print(json.dumps(out))

    - name: Side Effect | Assert the key reuse of the existing certificates
      ansible.builtin.assert:
        that:
          # Check mode changes nothing
          - >-
            __side_effect_reuse_check.results | map(attribute='stat.checksum') | list
            == __side_effect_reuse_before.results | map(attribute='stat.checksum') | list
          # Set for reuse_key: true (also through the link and for the mail
          # certificate), removed for reuse_key: false, a setting made by
          # hand kept without reuse_key on the entry
          - >-
            __side_effect_params | dict2items | map(attribute='value.reuse_key') | list
            == [true, none, true, true, true]
          - >-
            __side_effect_params | dict2items | map(attribute='value.webroot_map') | list
            == __side_effect_lineages | map(attribute='name') | map('split') | list
          # The file of the setting made by hand is untouched, the link stays
          - __side_effect_reuse_after.results[2].stat.checksum == __side_effect_reuse_before.results[2].stat.checksum
          - __side_effect_reuse_link.stat.islnk
          # The second run changes nothing
          - >-
            __side_effect_reuse_again.results | map(attribute='stat.checksum') | list
            == __side_effect_reuse_after.results | map(attribute='stat.checksum') | list
        fail_msg: '{{ __side_effect_reuse_params.stdout }}'
        quiet: true
      vars:
        __side_effect_params: '{{ __side_effect_reuse_params.stdout | from_json }}'

    - name: Side Effect | Refuse key reuse for a certificate without renewal configuration
      block:
        - name: Side Effect | Run the certificate tasks without renewal configuration  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: certificates.yml
          vars:
            certbot_certificates:
              - domains: ['orphan.example.com']
                reuse_key: true

        - name: Side Effect | Fail when the missing renewal configuration was accepted
          ansible.builtin.fail:
            msg: 'The role set key reuse for a certificate without renewal configuration'

      rescue:
        - name: Side Effect | Assert the role named the missing renewal configuration
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.msg is search('renewal configuration of these certificates is missing:
                /etc/letsencrypt/renewal/orphan.example.com.conf')
            fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
            quiet: true

    - name: Side Effect | Remove the certificate fixtures
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop: >-
        {{ (__side_effect_lineages | map(attribute='name') | list + ['orphan.example.com'])
           | map('regex_replace', '^(.*)$', '/etc/letsencrypt/live/\1') | list
           + __side_effect_reuse_files + ['/etc/letsencrypt/renewal-linked'] }}

- name: Side Effect — No reload services
  hosts: all
  gather_facts: false

  vars:
    certbot_enabled: true
    certbot_email: 'test@example.com'
    certbot_staging: true
    certbot_use_systemd_timer: false
    certbot_deploy_hook: 'echo "Certificate renewed"'

  tasks:
    - name: Side Effect | Include certbot role without reload services  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

# A separate play, so the checks read the state after the removal run
- name: Side Effect — Check the removal
  hosts: all
  gather_facts: true

  tasks:
    - name: Side Effect | Load the OS variables of the role
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../../vars/{{ ansible_facts["os_family"] }}.yml'

    - name: Side Effect | Check the service reload script
      ansible.builtin.stat:
        path: /usr/local/sbin/certbot-reload-services
      register: __side_effect_script

    - name: Side Effect | Find files in the renewal deploy hook directory
      ansible.builtin.find:
        paths: /etc/letsencrypt/renewal-hooks/deploy
        hidden: true
        file_type: any
      register: __side_effect_deploy_hooks

    - name: Side Effect | Check the global deploy hook
      ansible.builtin.stat:
        path: /etc/letsencrypt/renewal-hooks/deploy/global-deploy-hook.sh
      register: __side_effect_global_deploy_hook

    - name: Side Effect | Check the retry marker directory
      ansible.builtin.stat:
        path: /var/lib/certbot-reload-services
      register: __side_effect_marker_dir

    - name: Side Effect | Check the reload retry units
      ansible.builtin.stat:
        path: '/etc/systemd/system/{{ item }}'
      loop:
        - certbot-reload-retry.service
        - certbot-reload-retry.timer
      register: __side_effect_retry_units

    - name: Side Effect | Assert the script is removed and the global deploy hook is kept
      ansible.builtin.assert:
        that:
          - not __side_effect_script.stat.exists
          - not __side_effect_marker_dir.stat.exists
          - __side_effect_retry_units.results | selectattr('stat.exists') | list | length == 0
          - >-
            __side_effect_deploy_hooks.files | map(attribute='path') | map('basename') | list
            == ['global-deploy-hook.sh']
          - __side_effect_global_deploy_hook.stat.mode == '0755'
        fail_msg: >-
          Deploy hooks: {{ __side_effect_deploy_hooks.files | map(attribute='path') | list }}
        quiet: true

    - name: Side Effect | Check the post hook drop-in
      ansible.builtin.stat:
        path: '/etc/systemd/system/{{ __certbot_service_name }}.d/post-hook.conf'
      register: __side_effect_dropin

    - name: Side Effect | Read the state of the renewal unit
      ansible.builtin.systemd_service:
        name: '{{ __certbot_service_name }}'
      register: __side_effect_renew_unit

    - name: Side Effect | Assert the drop-in is removed and the packaged command runs
      ansible.builtin.assert:
        that:
          - not __side_effect_dropin.stat.exists
          - __side_effect_renew_unit.status.ExecStart.count('argv[]=') == 1
          - ('argv[]=' ~ __certbot_renew_command ~ ' ;') in __side_effect_renew_unit.status.ExecStart
        fail_msg: 'ExecStart: {{ __side_effect_renew_unit.status.ExecStart }}'
        quiet: true
      when: ansible_facts['os_family'] in ['Archlinux', 'Debian']

    - name: Side Effect | Read the environment file of the renewal unit (EL)
      ansible.builtin.slurp:
        src: /etc/sysconfig/certbot
      register: __side_effect_sysconfig
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Side Effect | Assert POST_HOOK is empty again (EL)
      ansible.builtin.assert:
        that:
          - "'POST_HOOK=\"\"' in __side_effect_lines"
          - __side_effect_lines | select('match', '^POST_HOOK=') | list | length == 1
        fail_msg: '/etc/sysconfig/certbot: {{ __side_effect_lines }}'
        quiet: true
      vars:
        __side_effect_lines: '{{ (__side_effect_sysconfig.content | b64decode).splitlines() }}'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Side Effect | Read the crontab of root
      ansible.builtin.command:
        cmd: crontab -l -u root
      register: __side_effect_crontab
      changed_when: false

    - name: Side Effect | Assert the cron job no longer passes the post hook
      ansible.builtin.assert:
        that:
          - "'0 3 * * * certbot renew --quiet' in __side_effect_crontab.stdout_lines"
          - "'post-hook' not in __side_effect_crontab.stdout"
          - "'--retry' not in __side_effect_crontab.stdout"
        fail_msg: '{{ __side_effect_crontab.stdout_lines }}'
        quiet: true

    # The renewal unit still runs without the hook. Not on Debian, where
    # certbot cannot start in the test image (see verify.yml).
    - name: Side Effect | Run the renewal unit
      ansible.builtin.systemd_service:
        name: '{{ __certbot_service_name }}'
        state: started
      changed_when: false
      when: ansible_facts['os_family'] != 'Debian'

    - name: Side Effect | Read the result of the renewal unit
      ansible.builtin.systemd_service:
        name: '{{ __certbot_service_name }}'
      register: __side_effect_renew_result
      when: ansible_facts['os_family'] != 'Debian'

    - name: Side Effect | Read the arguments certbot received
      ansible.builtin.command:
        cmd: grep -m1 'Arguments:' /var/log/letsencrypt/letsencrypt.log
      register: __side_effect_renew_args
      changed_when: false
      when: ansible_facts['os_family'] != 'Debian'

    - name: Side Effect | Assert the renewal unit ran without a post hook
      ansible.builtin.assert:
        that:
          - __side_effect_renew_result.status.Result == 'success'
          - "'post-hook' not in __side_effect_renew_args.stdout"
        fail_msg: >-
          Result {{ __side_effect_renew_result.status.Result }}, {{ __side_effect_renew_args.stdout }}
        quiet: true
      when: ansible_facts['os_family'] != 'Debian'

# Without reload services the role resets only its own POST_HOOK value
- name: Side Effect — Foreign POST_HOOK survives the removal (EL)
  hosts: all
  gather_facts: true

  vars:
    certbot_enabled: true
    certbot_email: 'test@example.com'
    certbot_staging: true

  tasks:
    - name: Side Effect | Keep a foreign POST_HOOK without reload services (EL)
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Side Effect | Set a foreign POST_HOOK without reload services (EL)
          ansible.builtin.lineinfile:
            path: /etc/sysconfig/certbot
            regexp: '^POST_HOOK='
            line: 'POST_HOOK="--post-hook=/usr/bin/true"'

        - name: Side Effect | Include certbot role without reload services (EL)  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'

        - name: Side Effect | Read the environment file after the removal run (EL)
          ansible.builtin.slurp:
            src: /etc/sysconfig/certbot
          register: __side_effect_sysconfig_kept

        - name: Side Effect | Assert the foreign POST_HOOK is kept (EL)
          ansible.builtin.assert:
            that:
              - >-
                'POST_HOOK="--post-hook=/usr/bin/true"'
                in (__side_effect_sysconfig_kept.content | b64decode).splitlines()
            quiet: true

        # Leaves kept instances ready for another converge
        - name: Side Effect | Reset the foreign POST_HOOK (EL)
          ansible.builtin.lineinfile:
            path: /etc/sysconfig/certbot
            regexp: '^POST_HOOK='
            line: 'POST_HOOK=""'

# The command lines of the certificate tasks, recorded by a certbot stub that
# comes first in PATH and reports every call as an issuance (the scenario
# requests no certificate): the key options of the mail certificate, and
# --config only with a certbot_config_dir other than the default
- name: Side Effect — Command lines of the certificate tasks
  hosts: all
  gather_facts: false

  environment:
    PATH: '/root/certbot-stub:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

  vars:
    certbot_enabled: true
    certbot_email: 'test@example.com'
    certbot_staging: true
    certbot_mail_certificate_enabled: true
    certbot_mail_domain: 'example.net'
    certbot_mail_hostnames: ['mail']
    certbot_mail_autodiscover: false
    certbot_certificates:
      - domains:
          - 'www.example.net'
    __side_effect_config_dir: '/srv/certbot-molecule'

  tasks:
    - name: Side Effect | Record the certbot calls of the certificate tasks
      block:
        # A stub left behind by an aborted run would keep its old calls
        - name: Side Effect | Remove a leftover certbot stub
          ansible.builtin.file:
            path: /root/certbot-stub
            state: absent

        - name: Side Effect | Create the certbot stub directory
          ansible.builtin.file:
            path: /root/certbot-stub
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Side Effect | Deploy the certbot stub
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              # Records the arguments of every call on one line
              printf '%s\n' "$*" >> /root/certbot-stub/calls
              echo 'Successfully received certificate.'
            dest: /root/certbot-stub/certbot
            owner: root
            group: root
            mode: '0755'

        - name: Side Effect | Request the certificates with an RSA key  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: certificates.yml
          vars:
            certbot_key_type: 'rsa'
            certbot_rsa_key_size: 3072

        - name: Side Effect | Request the certificates with the default ECDSA key  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: certificates.yml

        # A trailing slash still names the default directory
        - name: Side Effect | Request the certificates with a trailing slash  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: certificates.yml
          vars:
            certbot_config_dir: '/etc/letsencrypt/'

        # No certificate exists in the other directory either, and the role
        # removes one there
        - name: Side Effect | Request the certificates in another configuration directory  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: certificates.yml
          vars:
            certbot_config_dir: '{{ __side_effect_config_dir }}'
            certbot_remove_certificates:
              - 'gone.example.net'

        - name: Side Effect | Read the recorded command lines
          ansible.builtin.slurp:
            src: /root/certbot-stub/calls
          register: __side_effect_calls

        - name: Side Effect | Assert the key options and --config on the command lines
          ansible.builtin.assert:
            that:
              - __side_effect_lines | length == 9
              # Default directory: mail and www certificate, three times (the
              # last with a trailing slash), no --config
              - __side_effect_lines[:6] | select('search', '--config') | list | length == 0
              - __side_effect_lines[4] is search(' --cert-name mail\.example\.net ')
              - __side_effect_lines[0] is search('^certonly --non-interactive .* --cert-name mail\.example\.net ')
              - __side_effect_lines[0] is search(' --key-type rsa --rsa-key-size 3072$')
              - __side_effect_lines[1] is search(' --cert-name www\.example\.net ')
              - __side_effect_lines[1] is search(' --key-type rsa --rsa-key-size 3072$')
              - __side_effect_lines[2] is search(' --cert-name mail\.example\.net ')
              - __side_effect_lines[2] is search(' --key-type ecdsa --elliptic-curve secp384r1$')
              - __side_effect_lines[2] is not search('--rsa-key-size')
              # Other directory: every call points certbot at its cli.ini
              - __side_effect_lines[6] is search(__side_effect_certonly ~ 'mail\.example\.net ')
              - __side_effect_lines[7] is search(__side_effect_certonly ~ 'www\.example\.net ')
              - >-
                __side_effect_lines[8]
                == 'delete --config=' ~ __side_effect_config_dir ~ '/cli.ini'
                ~ ' --non-interactive --cert-name gone.example.net'
            fail_msg: '{{ __side_effect_lines }}'
            quiet: true
          vars:
            __side_effect_lines: '{{ (__side_effect_calls.content | b64decode).splitlines() }}'
            __side_effect_config_re: '{{ __side_effect_config_dir | regex_escape }}/cli\.ini'
            __side_effect_certonly: '^certonly --config={{ __side_effect_config_re }} --non-interactive .*--cert-name '

      always:
        - name: Side Effect | Remove the certbot stub and the other configuration directory
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - /root/certbot-stub
            - '{{ __side_effect_config_dir }}'

# The renewal unit and the cron job with another certbot_config_dir, and back
# to the default directory: the state the plays above left (systemd timer, no
# reload services), so kept instances stay ready for another converge
- name: Side Effect — Renewal with another configuration directory
  hosts: all
  gather_facts: true

  vars:
    certbot_enabled: true
    certbot_email: 'test@example.com'
    certbot_staging: true
    __side_effect_config_dir: '/srv/certbot-molecule'
    __side_effect_config_arg: '--config=/srv/certbot-molecule/cli.ini'

  tasks:
    - name: Side Effect | Load the OS variables of the role
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../../vars/{{ ansible_facts["os_family"] }}.yml'

    - name: Side Effect | Refuse a certbot_config_dir with a character outside the allow-list
      block:
        - name: Side Effect | Include certbot role with a % in certbot_config_dir  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            certbot_config_dir: '/srv/cert%bot'

        - name: Side Effect | Fail when the certbot_config_dir was accepted
          ansible.builtin.fail:
            msg: 'The role accepted /srv/cert%bot as certbot_config_dir'

      rescue:
        - name: Side Effect | Assert the role refused the certbot_config_dir
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search("certbot_config_dir '/srv/cert%bot' must be an absolute path")
            fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
            quiet: true

    # $ in the pattern would accept a trailing newline, as a block scalar or a
    # file lookup leaves it
    - name: Side Effect | Refuse a certbot_config_dir with a trailing newline
      block:
        - name: Side Effect | Include certbot role with a newline in certbot_config_dir  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            certbot_config_dir: "/srv/certbot\n"

        - name: Side Effect | Fail when the certbot_config_dir with a newline was accepted
          ansible.builtin.fail:
            msg: 'The role accepted a certbot_config_dir with a trailing newline'

      rescue:
        - name: Side Effect | Assert the role refused the certbot_config_dir with a newline
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search("must be an absolute path")
            fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
            quiet: true

    # certbot reads the role-wide key options from cli.ini at every renewal
    # and refuses to change those of a kept key
    - name: Side Effect | Refuse a kept key with other key options
      block:
        - name: Side Effect | Include certbot role with a kept RSA key next to role-wide ECDSA  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            certbot_certificates:
              - domains: ['same.example.com']
                reuse_key: true
              - domains: ['rsa.example.com']
                key_type: 'rsa'
                reuse_key: true

        - name: Side Effect | Fail when the kept key with other key options was accepted
          ansible.builtin.fail:
            msg: 'The role accepted a kept RSA key next to role-wide ECDSA'

      rescue:
        - name: Side Effect | Assert the role refused only the kept key with other key options
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('keeps the key of rsa\.example\.com \(reuse_key\)')
            fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
            quiet: true

    # With the default directory the role leaves CERTBOT_ARGS lines without
    # its marker alone, whatever they hold
    - name: Side Effect | Keep hand-set CERTBOT_ARGS with the default directory (EL)
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Side Effect | Set hand-set CERTBOT_ARGS lines (EL)
          ansible.builtin.blockinfile:
            path: /etc/sysconfig/certbot
            marker: '# {mark} MOLECULE CERTBOT_ARGS'
            insertbefore: '^CERTBOT_ARGS='
            block: "CERTBOT_ARGS=\"--no-autorenew\"\nCERTBOT_ARGS=\"--config=/etc/certbot-alt/cli.ini\""

        - name: Side Effect | Read the environment file before the default run (EL)
          ansible.builtin.slurp:
            src: /etc/sysconfig/certbot
          register: __side_effect_handset_before

        - name: Side Effect | Include certbot role with hand-set CERTBOT_ARGS (EL)  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'

        - name: Side Effect | Read the environment file after the default run (EL)
          ansible.builtin.slurp:
            src: /etc/sysconfig/certbot
          register: __side_effect_handset_after

        - name: Side Effect | Assert the hand-set CERTBOT_ARGS lines are unchanged (EL)
          ansible.builtin.assert:
            that:
              - __side_effect_handset_after.content == __side_effect_handset_before.content
              - >-
                'CERTBOT_ARGS="--config=/etc/certbot-alt/cli.ini"'
                in (__side_effect_handset_after.content | b64decode).splitlines()
            fail_msg: '{{ __side_effect_handset_after.content | b64decode }}'
            quiet: true

      always:
        - name: Side Effect | Remove the hand-set CERTBOT_ARGS lines (EL)
          ansible.builtin.blockinfile:
            path: /etc/sysconfig/certbot
            marker: '# {mark} MOLECULE CERTBOT_ARGS'
            state: absent

    - name: Side Effect | Renew with another configuration directory
      block:
        # On EL the role owns only a CERTBOT_ARGS line under its marker
        - name: Side Effect | Refuse a foreign CERTBOT_ARGS (EL)
          when: ansible_facts['os_family'] == 'RedHat'
          block:
            - name: Side Effect | Set a foreign CERTBOT_ARGS (EL)
              ansible.builtin.lineinfile:
                path: /etc/sysconfig/certbot
                regexp: '^CERTBOT_ARGS='
                line: 'CERTBOT_ARGS="--no-autorenew"'

            - name: Side Effect | Include certbot role with a foreign CERTBOT_ARGS (EL)  # noqa: role-name[path]
              ansible.builtin.include_role:
                name: '{{ playbook_dir }}/../..'
              vars:
                certbot_config_dir: '{{ __side_effect_config_dir }}'

            - name: Side Effect | Fail when the foreign CERTBOT_ARGS was accepted (EL)
              ansible.builtin.fail:
                msg: 'The role accepted a foreign CERTBOT_ARGS'

          rescue:
            - name: Side Effect | Read the environment file after the refusal (EL)
              ansible.builtin.slurp:
                src: /etc/sysconfig/certbot
              register: __side_effect_sysconfig_args_foreign

            - name: Side Effect | Assert the role refused the foreign CERTBOT_ARGS and kept it (EL)
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('CERTBOT_ARGS in \S+ is set to --no-autorenew,')
                  - >-
                    'CERTBOT_ARGS="--no-autorenew"'
                    in (__side_effect_sysconfig_args_foreign.content | b64decode).splitlines()
                fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
                quiet: true

            - name: Side Effect | Reset the foreign CERTBOT_ARGS (EL)
              ansible.builtin.lineinfile:
                path: /etc/sysconfig/certbot
                regexp: '^CERTBOT_ARGS='
                line: 'CERTBOT_ARGS=""'

        # A certificate left in the default directory would expire unnoticed
        - name: Side Effect | Plant a renewal configuration in the default directory
          ansible.builtin.copy:
            content: "# leftover\n"
            dest: /etc/letsencrypt/renewal/leftover.example.com.conf
            mode: '0644'

        - name: Side Effect | Refuse another directory with a leftover renewal configuration
          block:
            - name: Side Effect | Include certbot role with a leftover renewal configuration  # noqa: role-name[path]
              ansible.builtin.include_role:
                name: '{{ playbook_dir }}/../..'
              vars:
                certbot_config_dir: '{{ __side_effect_config_dir }}'

            - name: Side Effect | Fail when the leftover renewal configuration was accepted
              ansible.builtin.fail:
                msg: 'The role accepted another directory with a leftover renewal configuration'

          rescue:
            - name: Side Effect | Check the other directory after the refusal
              ansible.builtin.stat:
                path: '{{ __side_effect_config_dir }}'
              register: __side_effect_leftover_dir

            - name: Side Effect | Assert the role refused the leftover before any change
              ansible.builtin.assert:
                that:
                  - >-
                    ansible_failed_result.msg
                    is search('/etc/letsencrypt/renewal holds renewal configurations \(leftover\.example\.com\.conf\)')
                  - not __side_effect_leftover_dir.stat.exists
                fail_msg: '{{ ansible_failed_result.msg | default(ansible_failed_result) }}'
                quiet: true

        # With reload services, so the renew command carries both options; the
        # leftover stays, as certbot_default_dir_leftovers_ok allows it
        - name: Side Effect | Include certbot role with another configuration directory  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            certbot_config_dir: '{{ __side_effect_config_dir }}'
            certbot_nginx_enabled: true
            certbot_default_dir_leftovers_ok: true

        - name: Side Effect | Remove the leftover renewal configuration
          ansible.builtin.file:
            path: /etc/letsencrypt/renewal/leftover.example.com.conf
            state: absent

        - name: Side Effect | Read the cli.ini in the other directory
          ansible.builtin.slurp:
            src: '{{ __side_effect_config_dir }}/cli.ini'
          register: __side_effect_custom_cli_ini

        - name: Side Effect | Read the renewal unit with another directory
          ansible.builtin.systemd_service:
            name: '{{ __certbot_service_name }}'
          register: __side_effect_custom_unit

        - name: Side Effect | Assert the drop-in passes --config and the post hook
          ansible.builtin.assert:
            that:
              - >-
                'config-dir = /srv/certbot-molecule'
                in (__side_effect_custom_cli_ini.content | b64decode).splitlines()
              - __side_effect_custom_unit.status.ExecStart.count('argv[]=') == 1
              - >-
                ('argv[]=' ~ __certbot_renew_command ~ ' ' ~ __side_effect_config_arg
                ~ ' --post-hook=/usr/local/sbin/certbot-reload-services ;')
                in __side_effect_custom_unit.status.ExecStart
            fail_msg: 'ExecStart: {{ __side_effect_custom_unit.status.ExecStart }}'
            quiet: true
          when: ansible_facts['os_family'] in ['Archlinux', 'Debian']

        - name: Side Effect | Read the environment file with another directory (EL)
          ansible.builtin.slurp:
            src: /etc/sysconfig/certbot
          register: __side_effect_custom_sysconfig
          when: ansible_facts['os_family'] == 'RedHat'

        - name: Side Effect | Assert CERTBOT_ARGS passes --config next to the post hook (EL)
          ansible.builtin.assert:
            that:
              - "'$CERTBOT_ARGS' in __side_effect_custom_unit.status.ExecStart"
              - ('CERTBOT_ARGS="' ~ __side_effect_config_arg ~ '"') in __side_effect_lines
              - __side_effect_lines | select('match', '^CERTBOT_ARGS=') | list | length == 1
              # The marker of the role directly above its line
              - >-
                __side_effect_lines[__side_effect_lines.index('CERTBOT_ARGS="' ~ __side_effect_config_arg ~ '"') - 1]
                == '# Managed by Ansible (marcstraube.server.certbot): CERTBOT_ARGS'
              - "'POST_HOOK=\"--post-hook=/usr/local/sbin/certbot-reload-services\"' in __side_effect_lines"
            fail_msg: '/etc/sysconfig/certbot: {{ __side_effect_lines }}'
            quiet: true
          vars:
            __side_effect_lines: '{{ (__side_effect_custom_sysconfig.content | b64decode).splitlines() }}'
          when: ansible_facts['os_family'] == 'RedHat'

        # certbot renews nothing, as the directory holds no certificate. Not
        # on Debian, where certbot cannot start in the test image (see
        # verify.yml).
        - name: Side Effect | Run the renewal unit with another directory
          ansible.builtin.systemd_service:
            name: '{{ __certbot_service_name }}'
            state: started
          changed_when: false
          when: ansible_facts['os_family'] != 'Debian'

        - name: Side Effect | Read the result of the renewal unit with another directory
          ansible.builtin.systemd_service:
            name: '{{ __certbot_service_name }}'
          register: __side_effect_custom_renew_result
          when: ansible_facts['os_family'] != 'Debian'

        - name: Side Effect | Read the arguments certbot received with another directory
          ansible.builtin.command:
            cmd: grep -m1 'Arguments:' /var/log/letsencrypt/letsencrypt.log
          register: __side_effect_custom_renew_args
          changed_when: false
          when: ansible_facts['os_family'] != 'Debian'

        # systemd's argv as certbot logs it (a Python list): --config is one
        # element, also from the unquoted $CERTBOT_ARGS on EL
        - name: Side Effect | Assert the renewal unit passed --config as one argument
          ansible.builtin.assert:
            that:
              - __side_effect_custom_renew_result.status.Result == 'success'
              - >-
                __side_effect_custom_renew_args.stdout
                is search("[\\[ ]'" ~ (__side_effect_config_arg | regex_escape) ~ "'[,\\]]")
            fail_msg: >-
              Result {{ __side_effect_custom_renew_result.status.Result }},
              {{ __side_effect_custom_renew_args.stdout }}
            quiet: true
          when: ansible_facts['os_family'] != 'Debian'

        # Without reload services the drop-in stays for --config alone
        - name: Side Effect | Include certbot role with another directory and the cron job  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            certbot_config_dir: '{{ __side_effect_config_dir }}'
            certbot_use_systemd_timer: false

        - name: Side Effect | Read the crontab of root with another directory
          ansible.builtin.command:
            cmd: crontab -l -u root
          register: __side_effect_custom_crontab
          changed_when: false

        - name: Side Effect | Read the renewal unit with another directory and no reload services
          ansible.builtin.systemd_service:
            name: '{{ __certbot_service_name }}'
          register: __side_effect_custom_unit_noreload

        - name: Side Effect | Assert the cron job passes only --config
          ansible.builtin.assert:
            that:
              - >-
                ('0 3 * * * certbot renew --quiet ' ~ __side_effect_config_arg)
                in __side_effect_custom_crontab.stdout_lines
              - "'post-hook' not in __side_effect_custom_crontab.stdout"
            fail_msg: '{{ __side_effect_custom_crontab.stdout_lines }}'
            quiet: true

        - name: Side Effect | Assert the drop-in stays for --config alone
          ansible.builtin.assert:
            that:
              - __side_effect_custom_unit_noreload.status.ExecStart.count('argv[]=') == 1
              - >-
                ('argv[]=' ~ __certbot_renew_command ~ ' ' ~ __side_effect_config_arg ~ ' ;')
                in __side_effect_custom_unit_noreload.status.ExecStart
            fail_msg: 'ExecStart: {{ __side_effect_custom_unit_noreload.status.ExecStart }}'
            quiet: true
          when: ansible_facts['os_family'] in ['Archlinux', 'Debian']

        - name: Side Effect | Include certbot role with the default directory and the cron job  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            certbot_use_systemd_timer: false

        - name: Side Effect | Read the crontab of root with the default directory and cron
          ansible.builtin.command:
            cmd: crontab -l -u root
          register: __side_effect_default_cron_crontab
          changed_when: false

        - name: Side Effect | Assert the cron job drops --config with the default directory
          ansible.builtin.assert:
            that:
              - "'0 3 * * * certbot renew --quiet' in __side_effect_default_cron_crontab.stdout_lines"
              - "'--config' not in __side_effect_default_cron_crontab.stdout"
            fail_msg: '{{ __side_effect_default_cron_crontab.stdout_lines }}'
            quiet: true

        - name: Side Effect | Include certbot role with the default directory again  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'

        - name: Side Effect | Check the drop-in with the default directory
          ansible.builtin.stat:
            path: '/etc/systemd/system/{{ __certbot_service_name }}.d/post-hook.conf'
          register: __side_effect_default_dropin

        - name: Side Effect | Read the renewal unit with the default directory
          ansible.builtin.systemd_service:
            name: '{{ __certbot_service_name }}'
          register: __side_effect_default_unit

        - name: Side Effect | Read the crontab of root with the default directory
          ansible.builtin.command:
            cmd: crontab -l -u root
          register: __side_effect_default_crontab
          changed_when: false
          # crontab -l exits with 1 when root has no crontab left
          failed_when: __side_effect_default_crontab.rc > 1

        - name: Side Effect | Assert the default directory drops --config again
          ansible.builtin.assert:
            that:
              - "'certbot renew' not in __side_effect_default_crontab.stdout"
              - "'--config' not in __side_effect_default_unit.status.ExecStart"
            fail_msg: >-
              {{ __side_effect_default_crontab.stdout_lines }},
              ExecStart: {{ __side_effect_default_unit.status.ExecStart }}
            quiet: true

        - name: Side Effect | Assert the drop-in is gone with the default directory
          ansible.builtin.assert:
            that:
              - not __side_effect_default_dropin.stat.exists
              - __side_effect_default_unit.status.ExecStart.count('argv[]=') == 1
              - ('argv[]=' ~ __certbot_renew_command ~ ' ;') in __side_effect_default_unit.status.ExecStart
            fail_msg: 'ExecStart: {{ __side_effect_default_unit.status.ExecStart }}'
            quiet: true
          when: ansible_facts['os_family'] in ['Archlinux', 'Debian']

        - name: Side Effect | Read the environment file with the default directory (EL)
          ansible.builtin.slurp:
            src: /etc/sysconfig/certbot
          register: __side_effect_default_sysconfig
          when: ansible_facts['os_family'] == 'RedHat'

        - name: Side Effect | Assert CERTBOT_ARGS and POST_HOOK are empty again (EL)
          ansible.builtin.assert:
            that:
              - "'CERTBOT_ARGS=\"\"' in __side_effect_lines"
              - "'POST_HOOK=\"\"' in __side_effect_lines"
              - __side_effect_lines | select('match', '^(CERTBOT_ARGS|POST_HOOK)=') | list | length == 2
              - __side_effect_lines | select('search', 'marcstraube\.server\.certbot') | list | length == 0
            fail_msg: '/etc/sysconfig/certbot: {{ __side_effect_lines }}'
            quiet: true
          vars:
            __side_effect_lines: '{{ (__side_effect_default_sysconfig.content | b64decode).splitlines() }}'
          when: ansible_facts['os_family'] == 'RedHat'

      always:
        - name: Side Effect | Remove the other configuration directory and the leftover
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - '{{ __side_effect_config_dir }}'
            - /etc/letsencrypt/renewal/leftover.example.com.conf
