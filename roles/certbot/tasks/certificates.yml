---
# =============================================================================
# Mail Certificate (automatic generation)
# =============================================================================

- name: Certificates | Build mail certificate domain list
  ansible.builtin.set_fact:
    __certbot_mail_domains: >-
      {{
        (certbot_mail_hostnames |
          map('regex_replace', '$', '.' ~ certbot_mail_domain) | list) +
        (['autodiscover.' ~ certbot_mail_domain,
          'autoconfig.' ~ certbot_mail_domain]
          if certbot_mail_autodiscover else [])
      }}
  when: certbot_mail_certificate_enabled | bool

- name: Certificates | Check existing mail certificate
  ansible.builtin.stat:
    path: "{{ certbot_config_dir }}/live/mail.{{ certbot_mail_domain }}/fullchain.pem"
  register: __certbot_mail_cert_exists
  when: certbot_mail_certificate_enabled | bool

- name: Certificates | Obtain mail certificate
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      {% if __certbot_config_arg | length > 0 %}
      {{ __certbot_config_arg }}
      {% endif %}
      --non-interactive
      --agree-tos
      {% if certbot_email | length > 0 %}
      --email {{ certbot_email }}
      {% elif certbot_register_unsafely_without_email | bool %}
      --register-unsafely-without-email
      {% endif %}
      {% if certbot_staging | bool %}
      --staging
      {% endif %}
      --cert-name mail.{{ certbot_mail_domain }}
      {% for domain in __certbot_mail_domains %}
      -d {{ domain }}
      {% endfor %}
      --authenticator {{ certbot_mail_authenticator }}
      {% if certbot_mail_authenticator == 'webroot' %}
      --webroot-path {{ certbot_mail_webroot }}
      {% endif %}
      {% if certbot_mail_authenticator == 'dns-cloudflare' %}
      --dns-cloudflare-credentials {{ certbot_dns_cloudflare_credentials_file }}
      --dns-cloudflare-propagation-seconds {{ certbot_dns_propagation_seconds }}
      {% endif %}
      --key-type {{ certbot_key_type }}
      {% if certbot_key_type == 'rsa' %}
      --rsa-key-size {{ certbot_rsa_key_size }}
      {% endif %}
      {% if certbot_key_type == 'ecdsa' %}
      --elliptic-curve {{ certbot_elliptic_curve }}
      {% endif %}
      {% if certbot_reuse_key | bool %}
      --reuse-key
      {% endif %}
  register: __certbot_mail_obtain
  changed_when: "'Successfully received certificate' in __certbot_mail_obtain.stdout | default('')"
  notify: Reload cert services
  when:
    - certbot_mail_certificate_enabled | bool
    - not __certbot_mail_cert_exists.stat.exists | default(false)

# =============================================================================
# Standard Certificates
# =============================================================================

- name: Certificates | Check existing certificates
  ansible.builtin.stat:
    path: "{{ certbot_config_dir }}/live/{{ item.name | default(item.domains[0]) }}/fullchain.pem"
  loop: "{{ certbot_certificates }}"
  loop_control:
    label: "{{ item.name | default(item.domains[0]) }}"
  register: __certbot_existing_certs

- name: Certificates | Obtain certificates
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      {% if __certbot_config_arg | length > 0 %}
      {{ __certbot_config_arg }}
      {% endif %}
      --non-interactive
      --agree-tos
      {% if certbot_email | length > 0 %}
      --email {{ certbot_email }}
      {% elif certbot_register_unsafely_without_email | bool %}
      --register-unsafely-without-email
      {% endif %}
      {% if item.item.staging | default(certbot_staging) | bool %}
      --staging
      {% endif %}
      --cert-name {{ item.item.name | default(item.item.domains[0]) }}
      {% for domain in item.item.domains %}
      -d {{ domain }}
      {% endfor %}
      --authenticator {{ item.item.authenticator | default(certbot_authenticator) }}
      {% if item.item.authenticator | default(certbot_authenticator) == 'webroot' %}
      --webroot-path {{ item.item.webroot | default(certbot_webroot_path) }}
      {% endif %}
      {% if item.item.authenticator | default(certbot_authenticator) == 'dns-cloudflare' %}
      --dns-cloudflare-credentials {{ certbot_dns_cloudflare_credentials_file }}
      --dns-cloudflare-propagation-seconds {{ certbot_dns_propagation_seconds }}
      {% endif %}
      {% if item.item.authenticator | default(certbot_authenticator) == 'dns-route53' %}
      --dns-route53-propagation-seconds {{ certbot_dns_propagation_seconds }}
      {% endif %}
      {% if item.item.authenticator | default(certbot_authenticator) == 'dns-digitalocean' %}
      --dns-digitalocean-credentials {{ certbot_dns_digitalocean_credentials_file }}
      --dns-digitalocean-propagation-seconds {{ certbot_dns_propagation_seconds }}
      {% endif %}
      {{ __certbot_key_args | join(' ') }}
      {% if item.item.must_staple | default(false) | bool %}
      --must-staple
      {% endif %}
      {% if certbot_preferred_chain | length > 0 %}
      --preferred-chain "{{ certbot_preferred_chain }}"
      {% endif %}
      {% if item.item.pre_hook | default('') | length > 0 %}
      --pre-hook "{{ item.item.pre_hook }}"
      {% endif %}
      {% if item.item.post_hook | default('') | length > 0 %}
      --post-hook "{{ item.item.post_hook }}"
      {% endif %}
      {% if item.item.deploy_hook | default('') | length > 0 %}
      --deploy-hook "{{ item.item.deploy_hook }}"
      {% endif %}
      {% for arg in certbot_extra_args %}
      {{ arg }}
      {% endfor %}
  vars:
    __certbot_cert: '{{ item.item }}'
  loop: "{{ __certbot_existing_certs.results }}"
  loop_control:
    label: "{{ item.item.name | default(item.item.domains[0]) }}"
  when:
    - not item.stat.exists or (item.item.force_renewal | default(false) | bool)
  register: __certbot_obtain
  changed_when: "'Successfully received certificate' in __certbot_obtain.stdout | default('')"
  notify: Reload cert services

# certbot saves reuse_key in the renewal configuration of a certificate only
# when it issues one: certonly changes nothing for a certificate that is not
# due. The role sets it there itself, so a change applies at the next
# renewal. certbot reconfigure would do the same after a test renewal
# against the staging server, with the challenge and the hooks of the
# certificate. The role-wide default false leaves the setting of an existing
# certificate alone; reuse_key: false on the entry removes it. The mail
# certificate follows certbot_reuse_key: true only.
- name: Certificates | Collect existing certificates for the key reuse
  ansible.builtin.set_fact:
    __certbot_reuse_key_certs: >-
      {%- set ns = namespace(certs=[]) -%}
      {%- for result in __certbot_existing_certs.results
            if result.stat.exists | default(false)
            and (result.item.reuse_key is defined or certbot_reuse_key | bool) -%}
      {%- set ns.certs = ns.certs + [{
            'name': result.item.name | default(result.item.domains[0]),
            'reuse_key': result.item.reuse_key | default(certbot_reuse_key) | bool}] -%}
      {%- endfor -%}
      {%- if certbot_mail_certificate_enabled | bool and certbot_reuse_key | bool
            and __certbot_mail_cert_exists.stat.exists | default(false) -%}
      {%- set ns.certs = ns.certs + [{'name': 'mail.' ~ certbot_mail_domain, 'reuse_key': true}] -%}
      {%- endif -%}
      {{ ns.certs }}

# Symlinked renewal configurations count as certbot reads them (followed); a
# dangling link counts as missing
- name: Certificates | Check the renewal configurations for the key reuse
  ansible.builtin.stat:
    path: "{{ certbot_config_dir }}/renewal/{{ item.name }}.conf"
    follow: true
    get_checksum: false
  loop: "{{ __certbot_reuse_key_certs }}"
  loop_control:
    label: "{{ item.name }}"
  register: __certbot_reuse_key_confs

# Without its renewal configuration certbot neither renews the certificate
# nor knows it; the run fails before any change, like the other ownership
# checks of the role
- name: Certificates | Assert the renewal configurations exist
  ansible.builtin.assert:
    that:
      - __certbot_reuse_key_missing | length == 0
    fail_msg: >-
      The renewal configuration of these certificates is missing:
      {{ __certbot_reuse_key_missing | join(', ') }}. certbot cannot renew
      them, and the role cannot set reuse_key there. Restore the file from a
      backup, or remove the live and archive directories of the certificate
      below {{ __certbot_config_dir_real }} so that the role requests it again.
    quiet: true
  vars:
    __certbot_reuse_key_missing: >-
      {{ __certbot_reuse_key_confs.results | rejectattr('stat.exists')
         | map(attribute='item.name')
         | map('regex_replace', '^', __certbot_config_dir_real ~ '/renewal/')
         | map('regex_replace', '$', '.conf') | list }}

- name: Certificates | Apply key reuse to existing certificates
  community.general.ini_file:
    path: "{{ certbot_config_dir }}/renewal/{{ item.name }}.conf"
    section: 'renewalparams'
    option: 'reuse_key'
    value: "{{ 'True' if item.reuse_key else omit }}"
    state: "{{ 'present' if item.reuse_key else 'absent' }}"
    create: false
    follow: true
  loop: "{{ __certbot_reuse_key_certs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Certificates | Remove orphaned certificates
  ansible.builtin.command:
    cmd: >-
      certbot delete
      {% if __certbot_config_arg | length > 0 %}
      {{ __certbot_config_arg }}
      {% endif %}
      --non-interactive --cert-name {{ item }}
  loop: "{{ certbot_remove_certificates }}"
  register: __certbot_delete
  changed_when: "'Deleted all files' in __certbot_delete.stdout | default('')"
  failed_when: false
