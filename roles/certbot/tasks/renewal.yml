---
- name: Renewal | Configure renewal hooks directory
  ansible.builtin.file:
    path: "{{ certbot_config_dir }}/renewal-hooks/{{ item }}"
    state: directory
    owner: 'root'
    group: 'root'
    mode: '0755'
  loop:
    - 'pre'
    - 'post'
    - 'deploy'

- name: Renewal | Configure global pre-hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ certbot_pre_hook }}
    dest: "{{ certbot_config_dir }}/renewal-hooks/pre/global-pre-hook.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_pre_hook | length > 0

- name: Renewal | Configure global post-hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ certbot_post_hook }}
    dest: "{{ certbot_config_dir }}/renewal-hooks/post/global-post-hook.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_post_hook | length > 0

- name: Renewal | Configure global deploy-hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ certbot_deploy_hook }}
    dest: "{{ certbot_config_dir }}/renewal-hooks/deploy/global-deploy-hook.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_deploy_hook | length > 0

- name: Renewal | Configure combined PEM deploy hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Create combined PEM for HAProxy/other services
      CERT_NAME=$(basename "$RENEWED_LINEAGE")
      cat "$RENEWED_LINEAGE/privkey.pem" "$RENEWED_LINEAGE/fullchain.pem" \
        > "{{ certbot_combined_pem_path }}/${CERT_NAME}.pem"
      chmod 600 "{{ certbot_combined_pem_path }}/${CERT_NAME}.pem"
    dest: "{{ certbot_config_dir }}/renewal-hooks/deploy/combined-pem.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_create_combined_pem | bool

# Reload of the services after a renewal: the script runs as --post-hook of
# the renew command, which certbot runs once per renewal run and only when it
# attempted a renewal. The renewal-hooks directories would also run on
# `certonly` (post since certbot 3.2.0, deploy since 5.3.0), and a deploy
# hook runs once per renewed certificate.
- name: Renewal | Deploy the service reload script
  ansible.builtin.template:
    src: certbot-reload-services.j2
    dest: '{{ __certbot_reload_script }}'
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: __certbot_reload_services | length > 0

# Earlier versions of the role reloaded the services from this deploy hook,
# once per renewed certificate and with a restart as fallback. Drop this task
# in v2.0.0 of the collection.
- name: Renewal | Remove the former service reload deploy hook
  ansible.builtin.file:
    path: '{{ certbot_config_dir }}/renewal-hooks/deploy/reload-services.sh'
    state: absent

# EL: certbot-renew.service passes $POST_HOOK from its environment file to the
# renew command. systemd expands the unbraced variable unquoted and splits it
# at whitespace, so the value is a single word. The package ships the file as
# configuration; only the POST_HOOK line is managed, and preflight.yml failed
# before when it holds a value of another owner. In check mode a first run
# only simulates the installation, so the file does not exist yet.
- name: Renewal | Set the post hook of the renewal unit (EL)
  ansible.builtin.lineinfile:
    path: '{{ __certbot_sysconfig_file }}'
    regexp: '^POST_HOOK='
    line: 'POST_HOOK="{{ __certbot_post_hook_arg }}"'
  when:
    - __certbot_sysconfig_file | default('') | length > 0
    - __certbot_reload_services | length > 0
    - not (ansible_check_mode and __certbot_install | default({}) is changed)

# Without reload services only the role's own value is reset; a value of
# another owner stays
- name: Renewal | Reset the post hook of the renewal unit (EL)
  ansible.builtin.replace:
    path: '{{ __certbot_sysconfig_file }}'
    regexp: '^POST_HOOK="{{ __certbot_post_hook_arg | regex_escape }}"$'
    replace: 'POST_HOOK=""'
  when:
    - __certbot_sysconfig_file | default('') | length > 0
    - __certbot_reload_services | length == 0
    - not (ansible_check_mode and __certbot_install | default({}) is changed)

# EL: certbot-renew.service also passes $CERTBOT_ARGS, expanded like
# $POST_HOOK. With a certbot_config_dir other than the default the last
# CERTBOT_ARGS line (the one systemd uses) carries --config=<dir>/cli.ini under
# the marker of the role; preflight.yml failed before when a CERTBOT_ARGS line
# without the marker holds a value.
- name: Renewal | Set the cli.ini of the renewal unit (EL)
  ansible.builtin.replace:
    path: '{{ __certbot_sysconfig_file }}'
    regexp: '^(?:{{ __certbot_args_marker | regex_escape }}\n)?CERTBOT_ARGS=.*$(?![\s\S]*^CERTBOT_ARGS=)'
    replace: '{{ __certbot_args_marker }}\nCERTBOT_ARGS="{{ __certbot_config_arg }}"'
  when:
    - __certbot_sysconfig_file | default('') | length > 0
    - __certbot_config_arg | length > 0
    - not (ansible_check_mode and __certbot_install | default({}) is changed)

# The packaged file has a CERTBOT_ARGS line; preflight.yml read whether a
# file that existed before the run still has one
- name: Renewal | Add the cli.ini of the renewal unit (EL)
  ansible.builtin.lineinfile:
    path: '{{ __certbot_sysconfig_file }}'
    # Two lines; the task runs only while the file has no CERTBOT_ARGS line
    line: "{{ __certbot_args_marker }}\nCERTBOT_ARGS=\"{{ __certbot_config_arg }}\""
  when:
    - __certbot_sysconfig_file | default('') | length > 0
    - __certbot_config_arg | length > 0
    - __certbot_sysconfig_content is not skipped
    - __certbot_sysconfig_content.content | b64decode is not search('(?m)^CERTBOT_ARGS=')

# With the default directory only the line under the marker of the role is
# reset, and the marker removed; any other CERTBOT_ARGS line stays as it is
- name: Renewal | Reset the cli.ini of the renewal unit (EL)
  ansible.builtin.replace:
    path: '{{ __certbot_sysconfig_file }}'
    regexp: '^{{ __certbot_args_marker | regex_escape }}\nCERTBOT_ARGS=.*$'
    replace: 'CERTBOT_ARGS=""'
  when:
    - __certbot_sysconfig_file | default('') | length > 0
    - __certbot_config_arg | length == 0
    - not (ansible_check_mode and __certbot_install | default({}) is changed)

# Debian and Arch Linux: the packaged unit has no hook variable, so a drop-in
# replaces ExecStart with the packaged renew command plus the post hook and
# --config (__certbot_renew_options); without them there is no drop-in.
- name: Renewal | Create the renewal unit drop-in directory
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ __certbot_service_name }}.d'
    state: directory
    owner: 'root'
    group: 'root'
    mode: '0755'
  register: __certbot_dropin_dir_result
  when:
    - __certbot_renew_command | default('') | length > 0
    - __certbot_renew_options | length > 0

- name: Renewal | Deploy the drop-in of the renewal unit
  ansible.builtin.template:
    src: post-hook.conf.j2
    dest: '/etc/systemd/system/{{ __certbot_service_name }}.d/post-hook.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: __certbot_dropin_result
  # Check mode does not create the directory the template writes into
  when:
    - __certbot_renew_command | default('') | length > 0
    - __certbot_renew_options | length > 0
    - not (ansible_check_mode and __certbot_dropin_dir_result is changed)

- name: Renewal | Remove the drop-in of the renewal unit
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ __certbot_service_name }}.d/post-hook.conf'
    state: absent
  register: __certbot_dropin_absent_result
  when:
    - __certbot_renew_command | default('') | length > 0
    - __certbot_renew_options | length == 0

# Right away, so the checks below read the effective unit
- name: Renewal | Reload systemd units after a drop-in change
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - __certbot_dropin_result is changed or __certbot_dropin_absent_result is changed

- name: Renewal | Read the renewal unit
  ansible.builtin.systemd_service:
    name: '{{ __certbot_service_name }}'
  register: __certbot_renew_unit
  # In check mode a changed drop-in is not in effect yet
  when:
    - __certbot_renew_command | default('') | length > 0
    - __certbot_renew_options | length > 0
    - not (ansible_check_mode and __certbot_install | default({}) is changed)
    - >-
      not (ansible_check_mode
      and (__certbot_dropin_dir_result | default({}) is changed
           or __certbot_dropin_result | default({}) is changed))

# A masked or missing unit has no ExecStart to check; the renewal does not
# run then either
- name: Renewal | Warn about a renewal unit that is not loaded
  ansible.builtin.debug:
    msg: >-
      {{ __certbot_service_name }} is {{ __certbot_renew_unit.status.LoadState | default('not found') }},
      so the renewal does not run and the drop-in of the role has no effect.
  when:
    - __certbot_renew_unit is not skipped
    - __certbot_renew_unit.status.LoadState | default('') != 'loaded'

- name: Renewal | Read the packaged renewal unit
  ansible.builtin.slurp:
    src: '{{ __certbot_renew_unit.status.FragmentPath }}'
  register: __certbot_renew_unit_file
  when:
    - __certbot_renew_unit is not skipped
    - __certbot_renew_unit.status.LoadState | default('') == 'loaded'

# The drop-in repeats the packaged renew command from the vars of the role; a
# package update that changes it is dropped until the vars follow
- name: Renewal | Warn about a changed packaged renew command
  ansible.builtin.debug:
    msg: >-
      The packaged {{ __certbot_service_name }} no longer runs
      '{{ __certbot_renew_command }}'. The drop-in of the role replaces its
      ExecStart with that command, so the change of the package is not in
      effect. Update __certbot_renew_command in the vars of the certbot role.
  when:
    - __certbot_renew_unit_file is not skipped
    - >-
      ('ExecStart=' ~ __certbot_renew_command)
      not in (__certbot_renew_unit_file.content | b64decode).splitlines()

# Another drop-in that adds ExecStart would make the unit renew twice, the
# second time without the post hook and --config; one that replaces
# ExecStart drops them
- name: Renewal | Assert the renewal unit runs a single renew command with the options of the role
  ansible.builtin.assert:
    that:
      - (__certbot_renew_unit.status.ExecStart | default('')).count('argv[]=') == 1
      - __certbot_renew_options | reject('in', __certbot_renew_unit.status.ExecStart | default('')) | list | length == 0
    fail_msg: >-
      {{ __certbot_service_name }} does not run exactly one renew command with
      {{ __certbot_renew_options | join(' ') }} (ExecStart:
      {{ __certbot_renew_unit.status.ExecStart | default('') }}). Another
      drop-in in /etc/systemd/system/{{ __certbot_service_name }}.d sets
      ExecStart; remove it or clear ExecStart there.
    quiet: true
  when:
    - __certbot_renew_unit is not skipped
    - __certbot_renew_unit.status.LoadState | default('') == 'loaded'

# The timer unit ships with the certbot package. In check mode a first run
# only simulates the installation, so the unit does not exist yet.
- name: Renewal | Enable certbot systemd timer
  ansible.builtin.systemd:
    name: "{{ __certbot_timer_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - certbot_auto_renew | bool and certbot_use_systemd_timer | bool
    - not (ansible_check_mode and __certbot_install is changed)

- name: Renewal | Disable certbot systemd timer
  ansible.builtin.systemd:
    name: "{{ __certbot_timer_name }}"
    enabled: false
    state: stopped
  when: not (certbot_auto_renew | bool) or not (certbot_use_systemd_timer | bool)
  failed_when: false

# The cron jobs also reach 'absent' with the systemd timer, wherever cron
# is installed; without crontab there is nothing to remove
- name: Renewal | Check for crontab
  ansible.builtin.stat:
    path: /usr/bin/crontab
  register: __certbot_crontab_stat

- name: Renewal | Configure certbot cron job
  ansible.builtin.cron:
    name: 'certbot renewal'
    minute: "{{ certbot_cron_minute }}"
    hour: "{{ certbot_cron_hour }}"
    day: "{{ certbot_cron_day }}"
    month: "{{ certbot_cron_month }}"
    weekday: "{{ certbot_cron_weekday }}"
    job: "{{ (['certbot renew --quiet'] + __certbot_renew_options) | join(' ') }}"
    user: 'root'
    state: "{{ (certbot_auto_renew | bool and not certbot_use_systemd_timer | bool) | ternary('present', 'absent') }}"
  when: not (certbot_use_systemd_timer | bool) or __certbot_crontab_stat.stat.exists

# Retry of a failed reload: the script leaves a marker, and the retry service
# runs it again hourly while the marker exists (cron fallback: a cron job)
- name: Renewal | Deploy the reload retry units
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop:
    - '{{ __certbot_reload_retry_service }}'
    - '{{ __certbot_reload_retry_timer }}'
  register: __certbot_retry_units_result
  when: __certbot_reload_retry_units_present | bool

- name: Renewal | Manage the reload retry timer
  ansible.builtin.systemd_service:
    name: '{{ __certbot_reload_retry_timer }}'
    enabled: "{{ certbot_reload_retry_timer_enabled | bool }}"
    state: "{{ certbot_reload_retry_timer_enabled | bool | ternary('started', 'stopped') }}"
    daemon_reload: true
  when:
    - __certbot_reload_retry_units_present | bool
    - not (ansible_check_mode and __certbot_retry_units_result is changed)

# Without reload services or with cron, the units go away with the script
- name: Renewal | Check the reload retry timer
  ansible.builtin.stat:
    path: '/etc/systemd/system/{{ __certbot_reload_retry_timer }}'
  register: __certbot_retry_timer_stat
  when: not __certbot_reload_retry_units_present | bool

- name: Renewal | Disable the reload retry timer
  ansible.builtin.systemd_service:
    name: '{{ __certbot_reload_retry_timer }}'
    enabled: false
    state: stopped
  when:
    - not __certbot_reload_retry_units_present | bool
    - __certbot_retry_timer_stat.stat.exists

- name: Renewal | Remove the reload retry units
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}'
    state: absent
  loop:
    - '{{ __certbot_reload_retry_service }}'
    - '{{ __certbot_reload_retry_timer }}'
  register: __certbot_retry_units_absent_result
  when: not __certbot_reload_retry_units_present | bool

- name: Renewal | Reload systemd units after removing the retry units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - __certbot_retry_units_absent_result is changed

- name: Renewal | Configure the reload retry cron job
  ansible.builtin.cron:
    name: 'certbot reload retry'
    minute: '30'
    job: '{{ __certbot_reload_retry_cron_job }}'
    user: 'root'
    state: >-
      {{ (__certbot_reload_services | length > 0
          and not certbot_use_systemd_timer | bool
          and certbot_reload_retry_timer_enabled | bool) | ternary('present', 'absent') }}
  when: not (certbot_use_systemd_timer | bool) or __certbot_crontab_stat.stat.exists

- name: Renewal | Create certificate monitoring script
  ansible.builtin.template:
    src: check-certs.sh.j2
    dest: "{{ certbot_monitoring_script_path }}"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_monitoring_script | bool

# Removed after the post hook and the retry no longer reference them
- name: Renewal | Remove the service reload script and its retry marker
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - '{{ __certbot_reload_script }}'
    - '{{ __certbot_reload_marker_dir }}'
  when: __certbot_reload_services | length == 0
