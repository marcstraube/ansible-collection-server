---
- name: Renewal | Configure renewal hooks directory
  ansible.builtin.file:
    path: "{{ certbot_config_dir }}/renewal-hooks/{{ item }}"
    state: directory
    owner: 'root'
    group: 'root'
    mode: '0755'
  loop:
    - 'pre'
    - 'post'
    - 'deploy'

- name: Renewal | Configure global pre-hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ certbot_pre_hook }}
    dest: "{{ certbot_config_dir }}/renewal-hooks/pre/global-pre-hook.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_pre_hook | length > 0

- name: Renewal | Configure global post-hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ certbot_post_hook }}
    dest: "{{ certbot_config_dir }}/renewal-hooks/post/global-post-hook.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_post_hook | length > 0

- name: Renewal | Configure global deploy-hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ certbot_deploy_hook }}
    dest: "{{ certbot_config_dir }}/renewal-hooks/deploy/global-deploy-hook.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_deploy_hook | length > 0

- name: Renewal | Configure combined PEM deploy hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Create combined PEM for HAProxy/other services
      CERT_NAME=$(basename "$RENEWED_LINEAGE")
      cat "$RENEWED_LINEAGE/privkey.pem" "$RENEWED_LINEAGE/fullchain.pem" \
        > "{{ certbot_combined_pem_path }}/${CERT_NAME}.pem"
      chmod 600 "{{ certbot_combined_pem_path }}/${CERT_NAME}.pem"
    dest: "{{ certbot_config_dir }}/renewal-hooks/deploy/combined-pem.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_create_combined_pem | bool

- name: Renewal | Build service reload list
  ansible.builtin.set_fact:
    __certbot_reload_services: >-
      {{
        (['postfix'] if certbot_postfix_enabled else []) +
        (['dovecot'] if certbot_dovecot_enabled else []) +
        (['nginx'] if certbot_nginx_enabled else []) +
        ([__certbot_apache_service_name] if certbot_apache_enabled else []) +
        certbot_reload_services
      }}

- name: Renewal | Configure mail service deploy hook
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Reload mail and web services after certificate renewal
      # Generated by certbot role
      {% for service in __certbot_reload_services %}
      systemctl reload {{ service }} 2>/dev/null || systemctl restart {{ service }} 2>/dev/null || true
      {% endfor %}
    dest: "{{ certbot_config_dir }}/renewal-hooks/deploy/reload-services.sh"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: __certbot_reload_services | length > 0

- name: Renewal | Remove mail service deploy hook if no services
  ansible.builtin.file:
    path: "{{ certbot_config_dir }}/renewal-hooks/deploy/reload-services.sh"
    state: absent
  when: __certbot_reload_services | length == 0

# The timer unit ships with the certbot package. In check mode a first run
# only simulates the installation, so the unit does not exist yet.
- name: Renewal | Enable certbot systemd timer
  ansible.builtin.systemd:
    name: "{{ __certbot_timer_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - certbot_auto_renew | bool and certbot_use_systemd_timer | bool
    - not (ansible_check_mode and __certbot_install is changed)

- name: Renewal | Disable certbot systemd timer
  ansible.builtin.systemd:
    name: "{{ __certbot_timer_name }}"
    enabled: false
    state: stopped
  when: not (certbot_auto_renew | bool) or not (certbot_use_systemd_timer | bool)
  failed_when: false

- name: Renewal | Configure certbot cron job
  ansible.builtin.cron:
    name: 'certbot renewal'
    minute: "{{ certbot_cron_minute }}"
    hour: "{{ certbot_cron_hour }}"
    day: "{{ certbot_cron_day }}"
    month: "{{ certbot_cron_month }}"
    weekday: "{{ certbot_cron_weekday }}"
    job: 'certbot renew --quiet'
    user: 'root'
    state: "{{ (certbot_auto_renew | bool and not certbot_use_systemd_timer | bool) | ternary('present', 'absent') }}"
  when: not (certbot_use_systemd_timer | bool)

- name: Renewal | Create certificate monitoring script
  ansible.builtin.template:
    src: check-certs.sh.j2
    dest: "{{ certbot_monitoring_script_path }}"
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: certbot_monitoring_script | bool
