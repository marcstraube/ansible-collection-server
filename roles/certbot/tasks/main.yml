---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Assert the EPEL certbot packages are installable
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] not in (__certbot_blocked_major_versions | default([], true))
    fail_msg: >-
      certbot cannot be installed on {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}: the EPEL packages
      python3-acme and python3-pyOpenSSL depend on a newer python3-cryptography
      than the distribution ships. See
      https://github.com/marcstraube/ansible-collection-server/issues/145
    quiet: true
  when: certbot_enabled | bool
  tags:
    - always

- name: Main | Import installation tasks
  ansible.builtin.import_tasks: install.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:install

- name: Main | Import configuration tasks
  ansible.builtin.import_tasks: configure.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:configure

- name: Main | Import certificate tasks
  ansible.builtin.import_tasks: certificates.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:certificates

- name: Main | Import renewal tasks
  ansible.builtin.import_tasks: renewal.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:renewal
