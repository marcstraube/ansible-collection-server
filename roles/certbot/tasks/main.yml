---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Assert the EPEL certbot packages are installable
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] not in (__certbot_blocked_major_versions | default([], true))
    fail_msg: >-
      certbot cannot be installed on {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}: the EPEL packages
      python3-acme and python3-pyOpenSSL depend on a newer python3-cryptography
      than the distribution ships. See
      https://github.com/marcstraube/ansible-collection-server/issues/145
    quiet: true
  when: certbot_enabled | bool
  tags:
    - always

# The renew command of the renewal unit passes the service reload script as
# --post-hook. A post hook on the command line replaces the one certbot saved
# for a certificate at issuance, and certbot then saves it in place of the
# certificate's own, so a per-certificate post_hook would never run again.
- name: Main | Assert no certificate sets its own post hook next to the reload services
  ansible.builtin.assert:
    that:
      - __certbot_reload_services | length == 0 or __certbot_certificate_post_hooks | length == 0
    fail_msg: >-
      certbot_certificates sets post_hook while services are reloaded after
      renewal (certbot_*_enabled, certbot_reload_services). The post hook of
      the renewal run replaces a certificate's own post hook. Move the command
      to certbot_post_hook, which certbot runs in addition.
    quiet: true
  when: certbot_enabled | bool
  tags:
    - always

# The renew command carries --config=<dir>/cli.ini unquoted: in systemd
# ExecStart, the EL environment file and the cron job
- name: Main | Assert certbot_config_dir is an absolute path of plain characters
  ansible.builtin.assert:
    that:
      - certbot_config_dir is match(__certbot_config_dir_pattern)
    fail_msg: >-
      certbot_config_dir '{{ certbot_config_dir }}' must be an absolute path
      of letters, digits and . _ / @ + - only; the renew command passes it
      unquoted to systemd, the EL environment file and cron.
    quiet: true
  when: certbot_enabled | bool
  tags:
    - always

#
# Certificates in the Default Directory
#
# With another certbot_config_dir certbot renews only the certificates there.
# Certificates in the default directory, for example from a role version that
# did not pass --config yet, would expire unnoticed, so the run fails before
# any change. Read only; tagged always, so runs limited by tags check it too.
#

- name: Main | Check the renewal directory of the default directory
  ansible.builtin.stat:
    path: '{{ __certbot_default_config_dir }}/renewal'
  register: __certbot_default_renewal_dir
  check_mode: false
  when:
    - certbot_enabled | bool
    - __certbot_config_arg | length > 0
    - not certbot_default_dir_leftovers_ok | bool
  tags:
    - always

- name: Main | Find renewal configurations in the default directory
  ansible.builtin.find:
    paths: '{{ __certbot_default_config_dir }}/renewal'
    patterns: '*.conf'
    file_type: any
  register: __certbot_default_renewal_confs
  check_mode: false
  when:
    - __certbot_default_renewal_dir is not skipped
    - __certbot_default_renewal_dir.stat.isdir | default(false)
  tags:
    - always

- name: Main | Assert the default directory holds no renewal configurations
  ansible.builtin.assert:
    that:
      - __certbot_default_renewal_confs.files | length == 0
    fail_msg: >-
      {{ __certbot_default_config_dir }}/renewal holds renewal configurations
      ({{ __certbot_default_renewal_confs.files | map(attribute='path') | map('basename') | sort | join(', ') }}),
      but certbot_config_dir is {{ certbot_config_dir }}: certbot would no
      longer renew these certificates. Move them to certbot_config_dir, remove
      them once nothing reads them, or set certbot_config_dir to
      {{ __certbot_default_config_dir }}; see MIGRATION.md of the collection.
      Set certbot_default_dir_leftovers_ok to true when another tool manages
      them.
    quiet: true
  when: __certbot_default_renewal_confs is not skipped
  tags:
    - always

- name: Main | Import preflight tasks
  ansible.builtin.import_tasks: preflight.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:renewal

- name: Main | Import installation tasks
  ansible.builtin.import_tasks: install.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:install

- name: Main | Import configuration tasks
  ansible.builtin.import_tasks: configure.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:configure

- name: Main | Import certificate tasks
  ansible.builtin.import_tasks: certificates.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:certificates

- name: Main | Import renewal tasks
  ansible.builtin.import_tasks: renewal.yml
  when: certbot_enabled | bool
  tags:
    - certbot
    - certbot:renewal
