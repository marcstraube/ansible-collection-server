---
# Debian/Ubuntu-specific variables for Certbot

__certbot_packages:
  - 'certbot'

__certbot_plugin_packages:
  nginx: 'python3-certbot-nginx'
  apache: 'python3-certbot-apache'
  dns-cloudflare: 'python3-certbot-dns-cloudflare'
  dns-route53: 'python3-certbot-dns-route53'
  dns-google: 'python3-certbot-dns-google'
  dns-digitalocean: 'python3-certbot-dns-digitalocean'
  dns-linode: 'python3-certbot-dns-linode'
  dns-ovh: 'python3-certbot-dns-ovh'
  dns-rfc2136: 'python3-certbot-dns-rfc2136'
  dns-nsone: 'python3-certbot-dns-nsone'
  dns-dnsimple: 'python3-certbot-dns-dnsimple'

__certbot_config_dir: '/etc/letsencrypt'
__certbot_work_dir: '/var/lib/letsencrypt'
__certbot_log_dir: '/var/log/letsencrypt'

__certbot_timer_name: 'certbot.timer'
__certbot_service_name: 'certbot.service'

# Apache service reloaded by the renewal deploy hook (certbot_apache_enabled)
__certbot_apache_service_name: 'apache2'

__certbot_cron_file: '/etc/cron.d/certbot'
