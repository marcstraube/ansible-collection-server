---
# RedHat/Fedora/Rocky-specific variables for Certbot

__certbot_packages:
  - 'certbot'

__certbot_plugin_packages:
  nginx: 'python3-certbot-nginx'
  apache: 'python3-certbot-apache'
  dns-cloudflare: 'python3-certbot-dns-cloudflare'
  dns-route53: 'python3-certbot-dns-route53'
  dns-google: 'python3-certbot-dns-google'
  dns-digitalocean: 'python3-certbot-dns-digitalocean'
  dns-linode: 'python3-certbot-dns-linode'
  dns-ovh: 'python3-certbot-dns-ovh'
  dns-rfc2136: 'python3-certbot-dns-rfc2136'

__certbot_config_dir: '/etc/letsencrypt'
__certbot_work_dir: '/var/lib/letsencrypt'
__certbot_log_dir: '/var/log/letsencrypt'

__certbot_timer_name: 'certbot-renew.timer'
__certbot_service_name: 'certbot-renew.service'

# Apache service reloaded by the renewal deploy hook (certbot_apache_enabled)
__certbot_apache_service_name: 'httpd'

__certbot_cron_file: '/etc/cron.d/certbot'

# EL major versions where the EPEL certbot packages cannot be installed; the
# role fails on them before it installs anything. EL 10: python3-acme needs
# python3-pyOpenSSL >= 25, and the only build EPEL offers requires a newer
# python3-cryptography than the distribution ships (#145). The drift
# detection workflow opens an issue when certbot installs again. To lift the
# block: remove the version from this list, uncomment the platform in
# molecule/default/molecule.yml, revert the EL 10 notes in this role's README
# and the collection README, and remove the target from
# .github/drift-targets.yml.
__certbot_blocked_major_versions:
  - '10'
