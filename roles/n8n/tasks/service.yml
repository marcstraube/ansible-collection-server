---
- name: Service | Deploy systemd service file
  ansible.builtin.template:
    src: n8n.service.j2
    dest: '/etc/systemd/system/{{ __n8n_service_name }}'
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload n8n systemd units
    - Restart n8n

- name: Service | Deploy task runner service file
  ansible.builtin.template:
    src: n8n-runner.service.j2
    dest: '/etc/systemd/system/{{ __n8n_runner_service_name }}'
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload n8n systemd units
    - Restart n8n runner

- name: Service | Flush handlers to apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Service | Manage n8n service
  ansible.builtin.systemd_service:
    name: '{{ __n8n_service_name }}'
    enabled: "{{ n8n_service_enabled | bool }}"
    state: "{{ n8n_service_enabled | bool | ternary('started', 'stopped') }}"
    daemon_reload: true

# Bound to n8n.service: it starts with n8n and stops with it. A check run
# has not deployed the unit yet, so report the failure and continue.
- name: Service | Manage task runner service
  ansible.builtin.systemd_service:
    name: '{{ __n8n_runner_service_name }}'
    enabled: "{{ n8n_service_enabled | bool }}"
    state: "{{ n8n_service_enabled | bool | ternary('started', 'stopped') }}"
  ignore_errors: '{{ ansible_check_mode }}'

# /healthz/readiness answers 200 only once the database is connected and
# migrated, so a version change with long migrations is covered as well.
# n8n itself always listens on plain HTTP; n8n_protocol only shapes the
# URLs it generates behind a TLS-terminating proxy. The same goes for the
# URL path prefix (n8n_endpoints_rest): n8n keeps its backend routes at
# the root and the reverse proxy strips the prefix, so the readiness URL
# never carries it. The waits verify the deployment, which a check run does
# not perform.
- name: Service | Wait for n8n to be ready
  ansible.builtin.uri:
    url: "http://{{ n8n_host if n8n_host != '0.0.0.0' else '127.0.0.1' }}:{{ n8n_port }}/healthz/readiness"
    status_code: 200
    timeout: 10
  register: __n8n_ready
  until: __n8n_ready.status | default(0) == 200
  retries: '{{ ((n8n_ready_timeout | int) / 5) | round(0, "ceil") | int }}'
  delay: 5
  when:
    - n8n_service_enabled | bool
    - not ansible_check_mode

- name: Service | Wait for the task runner launcher to be healthy
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ n8n_runners_health_check_port }}/healthz'
    status_code: 200
    timeout: 5
  register: __n8n_runner_healthy
  until: __n8n_runner_healthy.status | default(0) == 200
  retries: 12
  delay: 5
  when:
    - n8n_service_enabled | bool
    - not ansible_check_mode

#
# Images of the replaced release
#
# Every release leaves its n8n and runners images in the podman storage
# of the n8n user. After a version change, once both health checks have
# passed (a failed update keeps the previous image), every tag of the two
# repositories except the ones the services run is removed. Other
# repositories are not touched, so the images of other containers stay.
# The version change fact comes from update.yml; a run limited to the
# service tag has not set it and removes nothing.

- name: Service | List the images of the n8n user
  containers.podman.podman_image_info:
  register: __n8n_images
  become: true
  become_user: '{{ n8n_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __n8n_runtime_dir }}'
  when:
    - n8n_update_remove_old_images | bool
    - __n8n_version_changed | default(false) | bool
    - n8n_service_enabled | bool
    - not ansible_check_mode

# Removing a tag untags the image and deletes it with its last tag.
- name: Service | Remove the images of other n8n releases
  containers.podman.podman_image:
    name: '{{ item }}'
    state: absent
  loop: >-
    {{ __n8n_images.images | default([])
       | map(attribute='RepoTags') | map('default', [], true) | flatten | unique
       | select('match', '^(' ~ (n8n_podman_image | regex_escape)
                         ~ '|' ~ (n8n_runners_podman_image | regex_escape) ~ '):')
       | reject('in', __n8n_current_images) | list }}
  vars:
    __n8n_current_images:
      - '{{ n8n_podman_image }}:{{ n8n_version }}'
      - '{{ n8n_runners_podman_image }}:{{ n8n_version }}{{ n8n_runners_podman_image_tag_suffix }}'
  become: true
  become_user: '{{ n8n_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __n8n_runtime_dir }}'
  when:
    - n8n_update_remove_old_images | bool
    - __n8n_version_changed | default(false) | bool
    - n8n_service_enabled | bool
    - not ansible_check_mode
