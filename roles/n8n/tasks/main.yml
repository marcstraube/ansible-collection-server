---
# The deprecated name of the URL path prefix still takes effect; the
# replacement is the only name the tasks and templates use.
- name: Main | Handle deprecated variables
  ansible.builtin.set_fact:
    n8n_path: '{{ n8n_endpoints_rest | default(n8n_path) }}'
  when: n8n_endpoints_rest is defined
  tags:
    - always

- name: Main | Warn about the deprecated n8n_endpoints_rest
  ansible.builtin.debug:
    msg: >-
      n8n_endpoints_rest is deprecated and will be removed in the next major
      version. Use n8n_path instead.
  when:
    - n8n_enabled | bool
    - n8n_endpoints_rest is defined
  tags:
    - always

- name: Main | Warn about the deprecated n8n_trusted_proxy_ips
  ansible.builtin.debug:
    msg: >-
      n8n_trusted_proxy_ips is deprecated and will be removed in the next
      major version. It has no effect: n8n has no list of trusted proxy
      addresses and counts the reverse proxies in front of it instead
      (n8n_proxy_hops).
  when:
    - n8n_enabled | bool
    - n8n_trusted_proxy_ips | length > 0
  tags:
    - always

- name: Main | Validate encryption key is set
  ansible.builtin.assert:
    that:
      - n8n_encryption_key | length > 0
    fail_msg: |
      n8n_encryption_key must be set for credential security!
      Generate one with: openssl rand -base64 32
      Store in vault as: vault_n8n_encryption_key
  when:
    - n8n_enabled | bool
    - ansible_facts['env'].MOLECULE_SCENARIO_NAME is not defined
  tags:
    - always

- name: Main | Validate task runner auth token is set
  ansible.builtin.assert:
    that:
      - n8n_runners_auth_token | length > 0
    fail_msg: |
      n8n_runners_auth_token must be set: n8n and the task runner launcher
      share it to authenticate.
      Generate one with: openssl rand -hex 32
      Store in vault as: vault_n8n_runners_auth_token
  when:
    - n8n_enabled | bool
  tags:
    - always

- name: Main | Validate webhook URL for production
  ansible.builtin.assert:
    that:
      - n8n_webhook_url | length > 0
      - n8n_webhook_url is match('^https://')
    fail_msg: |
      n8n_webhook_url must be set and use HTTPS for webhooks!
      Example: https://n8n.example.com
  when:
    - n8n_enabled | bool
    - n8n_webhook_url | length > 0
    - ansible_facts['env'].MOLECULE_SCENARIO_NAME is not defined
  tags:
    - always

# n8n inserts the prefix verbatim in front of every editor URL, so a value
# without both slashes produces broken asset paths ('/n8nstatic/...').
- name: Main | Validate the URL path prefix
  ansible.builtin.assert:
    that:
      - n8n_path is match('^/([^/]+/)*$')
    fail_msg: |
      n8n_path must start and end with a slash, e.g. '/' or
      '/n8n/': n8n puts it verbatim in front of every editor URL.
  when:
    - n8n_enabled | bool
  tags:
    - always

- name: Main | Import update tasks
  ansible.builtin.import_tasks: update.yml
  when: n8n_enabled | bool
  tags:
    - n8n
    - n8n:install

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: n8n_enabled | bool
  tags:
    - n8n
    - n8n:install

- name: Main | Import database tasks
  ansible.builtin.import_tasks: database.yml
  when:
    - n8n_enabled | bool
    - n8n_db_type == 'postgresdb'
    - n8n_db_create | bool
  tags:
    - n8n
    - n8n:database

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: n8n_enabled | bool
  tags:
    - n8n
    - n8n:configure

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: n8n_enabled | bool
  tags:
    - n8n
    - n8n:service

- name: Main | Include firewall tasks
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - n8n
        - n8n:firewall
  when:
    - n8n_enabled | bool
    - n8n_firewalld_enabled | bool
  tags:
    - n8n
    - n8n:firewall
