---
# Runs the scheduled backup twice after the update: with n8n_backup_keep 1
# the second run removes the scheduled set of the first, while the
# pre-update set of the converge run is of the other kind and has to stay.
# The script stops n8n for the set and starts it again, so the play waits
# for readiness before verify checks the service.
- name: Side Effect
  hosts: all
  gather_facts: false

  tasks:
    - name: Side Effect | Load shared variables
      ansible.builtin.include_vars:
        file: '../../vars/main.yml'

    # A oneshot unit is inactive again once the script has finished, so a
    # second start runs it again.
    - name: Side Effect | Run the scheduled backup
      ansible.builtin.systemd_service:
        name: '{{ __n8n_backup_service_name }}'
        state: started
      loop:
        - first
        - second
      loop_control:
        label: '{{ item }} run'

    - name: Side Effect | Wait for n8n to be ready after the backup
      ansible.builtin.uri:
        url: 'http://127.0.0.1:5678/healthz/readiness'
        status_code: 200
        timeout: 10
      register: __side_effect_ready
      until: __side_effect_ready.status | default(0) == 200
      retries: 180
      delay: 5

    - name: Side Effect | Wait for the task runner launcher to be healthy
      ansible.builtin.uri:
        url: 'http://127.0.0.1:5680/healthz'
        status_code: 200
        timeout: 5
      register: __side_effect_runner_healthy
      until: __side_effect_runner_healthy.status | default(0) == 200
      retries: 12
      delay: 5
