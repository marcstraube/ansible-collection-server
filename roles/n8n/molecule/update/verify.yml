---
- name: Verify
  hosts: all
  gather_facts: true

  vars:
    __verify_backup_dir: '/var/backups/n8n'
    __verify_ready_url: 'http://127.0.0.1:5678/healthz/readiness'

  tasks:
    - name: Verify | Load shared variables
      ansible.builtin.include_vars:
        file: '../../vars/main.yml'

    - name: Verify | Load role defaults
      ansible.builtin.include_vars:
        file: '../../defaults/main.yml'
        name: __verify_defaults

    #
    # After the update and the scheduled runs of side_effect: default
    # version installed, images of the previous release removed, one
    # pre-update set of the previous release next to one scheduled set,
    # service ready.
    #

    - name: Verify | Read the running image
      ansible.builtin.command:
        cmd: podman ps --filter name=^n8n$ --format '{{ "{{" }}.Image{{ "}}" }}'
      register: __verify_version
      changed_when: false
      become: true
      become_user: n8n
      environment:
        XDG_RUNTIME_DIR: '{{ __n8n_runtime_dir }}'

    - name: Verify | Assert the role default is running
      ansible.builtin.assert:
        that:
          - __verify_version.stdout | trim == __verify_image ~ ':' ~ __verify_defaults.n8n_version
        fail_msg: >-
          Running {{ __verify_version.stdout | trim }},
          expected {{ __verify_image }}:{{ __verify_defaults.n8n_version }}
      vars:
        __verify_image: '{{ __verify_defaults.n8n_podman_image }}'

    - name: Verify | List the images of the n8n user
      ansible.builtin.command:
        cmd: podman images --format '{{ "{{" }}.Repository{{ "}}" }}:{{ "{{" }}.Tag{{ "}}" }}'
      register: __verify_images
      changed_when: false
      become: true
      become_user: n8n
      environment:
        XDG_RUNTIME_DIR: '{{ __n8n_runtime_dir }}'

    # Only the tags of the role default remain in the two repositories of
    # the role; the tag of another repository survives.
    - name: Verify | Assert the images of the previous release are removed
      ansible.builtin.assert:
        that:
          - __verify_image ~ ':' ~ __verify_expected_version in __verify_images.stdout_lines
          - __verify_images.stdout_lines | select('match', '^' ~ __verify_image ~ ':') | list | length == 1
          - >-
            __verify_runner_image ~ ':' ~ __verify_expected_version ~ __verify_suffix
            in __verify_images.stdout_lines
          - __verify_images.stdout_lines | select('match', '^' ~ __verify_runner_image ~ ':') | list | length == 1
          - n8n_update_unrelated_image in __verify_images.stdout_lines
        fail_msg: 'Images: {{ __verify_images.stdout_lines }}'
      # __verify_version is the registered image of the running container
      # above; a task var of that name would be shadowed by it
      vars:
        __verify_image: '{{ __verify_defaults.n8n_podman_image }}'
        __verify_runner_image: '{{ __verify_defaults.n8n_runners_podman_image }}'
        __verify_expected_version: '{{ __verify_defaults.n8n_version }}'
        __verify_suffix: '{{ __verify_defaults.n8n_runners_podman_image_tag_suffix }}'

    - name: Verify | List backup sets
      ansible.builtin.find:
        paths: '{{ __verify_backup_dir }}'
        file_type: directory
        patterns: 'n8n-*'
      register: __verify_sets

    # The scheduled retention of 1 removed the first scheduled set only;
    # the pre-update set of the update is of the other kind and stays.
    - name: Verify | Assert the pre-update set survived the scheduled retention
      ansible.builtin.assert:
        that:
          - __verify_set_names | length == 2
          - >-
            __verify_set_names
            | select('match', '^n8n-scheduled-' ~ __verify_version_re ~ '-[0-9]{8}T[0-9]{6}$')
            | list | length == 1
          - >-
            __verify_set_names
            | select('match', '^n8n-' ~ __verify_previous_re ~ '-[0-9]{8}T[0-9]{6}$')
            | list | length == 1
        fail_msg: 'Backup sets: {{ __verify_set_names }}'
      vars:
        __verify_set_names: "{{ __verify_sets.files | map(attribute='path') | map('basename') | list }}"
        __verify_version_re: '{{ __verify_defaults.n8n_version | regex_escape }}'
        __verify_previous_re: '{{ n8n_update_previous_version | regex_escape }}'

    - name: Verify | Set the pre-update set fact
      ansible.builtin.set_fact:
        __verify_update_set: >-
          {{ __verify_sets.files | map(attribute='path')
             | reject('search', '/n8n-scheduled-') | first }}

    # Listing an archive has no module equivalent.
    - name: Verify | Assert the backup archives contain the SQLite database  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: 'tar -tzf {{ item }}/data.tar.gz .n8n/database.sqlite'
      changed_when: false
      loop: "{{ __verify_sets.files | map(attribute='path') | list }}"

    - name: Verify | Assert n8n reports ready
      ansible.builtin.uri:
        url: '{{ __verify_ready_url }}'
        status_code: 200

    #
    # Downgrade guard: pinning the previous release without a backup set
    # to restore fails at the assert in update.yml.
    #

    - name: Verify | Run the role with the previous release pinned
      block:
        - name: Verify | Include n8n role (downgrade)  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
          vars:
            n8n_version: '{{ n8n_update_previous_version }}'
      rescue:
        - name: Verify | Record the downgrade failure
          ansible.builtin.set_fact:
            __verify_downgrade_msg: '{{ ansible_failed_result.msg | default("") }}'

    - name: Verify | Assert the downgrade was refused
      ansible.builtin.assert:
        that:
          - __verify_downgrade_msg is defined
          - "'Refusing to downgrade n8n' in __verify_downgrade_msg"
        fail_msg: 'Downgrade result: {{ __verify_downgrade_msg | default("role run succeeded") }}'

    - name: Verify | Assert the default version is still installed and running
      ansible.builtin.uri:
        url: '{{ __verify_ready_url }}'
        status_code: 200

    #
    # Restore: the backup set together with the matching pin brings the
    # previous release back; the current state is backed up first. The
    # update removed the image of the previous release, so the restore
    # pulls it again and removes the images of the newer release in turn.
    #

    # Two older pre-update sets: the deprecated n8n_update_backup_keep (2)
    # has to take effect until its removal, so the pre-update rotation of
    # the restore keeps the newer of the two besides the set it restores
    # (never removed) and the set it writes.
    - name: Verify | Create older pre-update sets
      ansible.builtin.file:
        path: '{{ __verify_backup_dir }}/{{ item.name }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
        modification_time: '{{ item.mtime }}'
        access_time: '{{ item.mtime }}'
      loop:
        - { name: 'n8n-2.40.0-20250101T000000', mtime: '202501010000.00' }
        - { name: 'n8n-2.41.0-20250102T000000', mtime: '202501020000.00' }
      loop_control:
        label: '{{ item.name }}'

    - name: Verify | Include n8n role (restore)  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        n8n_version: '{{ n8n_update_previous_version }}'
        n8n_update_restore: '{{ __verify_update_set | basename }}'

    - name: Verify | Read the running image after the restore
      ansible.builtin.command:
        cmd: podman ps --filter name=^n8n$ --format '{{ "{{" }}.Image{{ "}}" }}'
      register: __verify_restored_version
      changed_when: false
      become: true
      become_user: n8n
      environment:
        XDG_RUNTIME_DIR: '{{ __n8n_runtime_dir }}'

    - name: Verify | Assert the previous release is running again
      ansible.builtin.assert:
        that:
          - >-
            __verify_restored_version.stdout | trim
            == __verify_defaults.n8n_podman_image ~ ':' ~ n8n_update_previous_version

    - name: Verify | List backup sets after the restore
      ansible.builtin.find:
        paths: '{{ __verify_backup_dir }}'
        file_type: directory
        patterns: 'n8n-*'
      register: __verify_sets_after

    # The restore took a pre-update set of the state before it; with the
    # deprecated retention of 2 the older of the two created sets is gone,
    # the restored set is untouched and the scheduled set is of the other
    # kind.
    - name: Verify | Assert the state before the restore was backed up
      ansible.builtin.assert:
        that:
          - __verify_update_sets_after | length == 3
          - "'n8n-2.40.0-20250101T000000' not in __verify_update_sets_after"
          - "'n8n-2.41.0-20250102T000000' in __verify_update_sets_after"
          - __verify_update_set | basename in __verify_update_sets_after
          - __verify_update_sets_after | select('match', '^n8n-' ~ __verify_version_re ~ '-') | list | length == 1
          - __verify_set_names_after | select('match', '^n8n-scheduled-') | list | length == 1
        fail_msg: 'Backup sets: {{ __verify_set_names_after }}'
      vars:
        __verify_set_names_after: "{{ __verify_sets_after.files | map(attribute='path') | map('basename') | list }}"
        __verify_update_sets_after: "{{ __verify_set_names_after | reject('match', '^n8n-scheduled-') | list }}"
        __verify_version_re: '{{ __verify_defaults.n8n_version | regex_escape }}'

    - name: Verify | Assert n8n reports ready after the restore
      ansible.builtin.uri:
        url: '{{ __verify_ready_url }}'
        status_code: 200

    - name: Verify | List the images of the n8n user after the restore
      ansible.builtin.command:
        cmd: podman images --format '{{ "{{" }}.Repository{{ "}}" }}:{{ "{{" }}.Tag{{ "}}" }}'
      register: __verify_images_after
      changed_when: false
      become: true
      become_user: n8n
      environment:
        XDG_RUNTIME_DIR: '{{ __n8n_runtime_dir }}'

    - name: Verify | Assert only the images of the restored release remain
      ansible.builtin.assert:
        that:
          - __verify_image ~ ':' ~ n8n_update_previous_version in __verify_images_after.stdout_lines
          - __verify_images_after.stdout_lines | select('match', '^' ~ __verify_image ~ ':') | list | length == 1
          - >-
            __verify_runner_image ~ ':' ~ n8n_update_previous_version ~ __verify_suffix
            in __verify_images_after.stdout_lines
          - __verify_images_after.stdout_lines | select('match', '^' ~ __verify_runner_image ~ ':') | list | length == 1
          - n8n_update_unrelated_image in __verify_images_after.stdout_lines
        fail_msg: 'Images: {{ __verify_images_after.stdout_lines }}'
      vars:
        __verify_image: '{{ __verify_defaults.n8n_podman_image }}'
        __verify_runner_image: '{{ __verify_defaults.n8n_runners_podman_image }}'
        __verify_suffix: '{{ __verify_defaults.n8n_runners_podman_image_tag_suffix }}'
