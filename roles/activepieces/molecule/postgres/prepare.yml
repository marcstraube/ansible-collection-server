---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Archlinux:
        - systemd
        - dbus
        - procps-ng
      Debian:
        - systemd
        - dbus
        - procps
        - gnupg
        - ca-certificates
        - locales
      RedHat:
        - systemd
        - dbus
        - procps-ng
        - glibc-langpack-en

  tasks:
    # The podman storage of the activepieces user lives on a tmpfs (test
    # container only): the root file system of the container is an
    # overlay, and extracting an image layer there fails because the
    # whiteouts of the layer are character devices an overlay refuses to
    # create. The user and group are the ones the role creates, so the role
    # finds them in place.

    - name: Prepare | Create activepieces system group
      ansible.builtin.group:
        name: activepieces
        system: true

    - name: Prepare | Create activepieces system user
      ansible.builtin.user:
        name: activepieces
        group: activepieces
        home: /var/lib/activepieces
        shell: /usr/sbin/nologin
        system: true
        create_home: true
      register: __prepare_activepieces_user

    - name: Prepare | Create the podman storage directory of the activepieces user
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: activepieces
        group: activepieces
        mode: '0700'
      loop:
        - /var/lib/activepieces/.local
        - /var/lib/activepieces/.local/share
        - /var/lib/activepieces/.local/share/containers

    - name: Prepare | Mount a tmpfs on the podman storage directory
      ansible.posix.mount:
        path: /var/lib/activepieces/.local/share/containers
        src: tmpfs
        fstype: tmpfs
        opts: 'size=6g,uid={{ __prepare_activepieces_user.uid }},gid={{ __prepare_activepieces_user.group }},mode=0700'
        state: ephemeral

    # Sudo PAM bypass — required for tasks using `become_user` on
    # geerlingguy Rocky containers under GitHub-hosted runners
    # (test container only).

    - name: Prepare | Bypass sudo PAM stack (RedHat container)
      ansible.builtin.copy:
        content: |
          #%PAM-1.0
          auth       sufficient   pam_permit.so
          account    sufficient   pam_permit.so
          password   sufficient   pam_permit.so
          session    sufficient   pam_permit.so
        dest: /etc/pam.d/sudo
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Disable sudoers authentication (RedHat container)
      ansible.builtin.copy:
        content: 'Defaults !authenticate'
        dest: /etc/sudoers.d/molecule-no-auth
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
      when: ansible_facts['os_family'] == 'RedHat'

    # The Arch Linux and Rocky 10 test images ship newuidmap/newgidmap
    # without the file capabilities the shadow package sets on a real host;
    # rootless podman as the activepieces user cannot create its user
    # namespace without them (test container only).

    - name: Prepare | Restore the ID map helper capabilities (Arch and Rocky 10 containers)
      community.general.capabilities:
        path: '/usr/bin/{{ item.helper }}'
        capability: '{{ item.capability }}'
        state: present
      loop:
        - { helper: newuidmap, capability: cap_setuid+ep }
        - { helper: newgidmap, capability: cap_setgid+ep }
      when: >-
        ansible_facts['os_family'] == 'Archlinux'
        or (ansible_facts['os_family'] == 'RedHat'
            and ansible_facts['distribution_major_version'] == '10')

    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      when: ansible_facts['os_family'] == 'Archlinux'

    # The pacman ignore drop-in setup of marcstraube.common.package_management
    # that the postgresql role expects; pacman fails on an Include glob
    # without a match, so a file is in place before the Include line
    - name: Prepare | Create pacman ignore drop-in directory (Arch)
      ansible.builtin.file:
        path: /etc/pacman.d/ignore.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Create pacman ignore drop-in (Arch)
      ansible.builtin.copy:
        content: "# molecule\n"
        dest: /etc/pacman.d/ignore.d/00-molecule.conf
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Include pacman ignore drop-ins (Arch)
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        line: 'Include = /etc/pacman.d/ignore.d/*.conf'
        insertafter: '^\[options\]'
        firstmatch: true
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5

    # The database is created with the en_US.UTF-8 locale.
    - name: Prepare | Generate en_US.UTF-8 locale (Debian)
      community.general.locale_gen:
        name: en_US.UTF-8
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Enable PostgreSQL 16 module stream (EL9)
      ansible.builtin.dnf:
        name: '@postgresql:16'
        state: present
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - ansible_facts['distribution_major_version'] == '9'
