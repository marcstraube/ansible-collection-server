---
# PostgreSQL scenario: the postgresql role of this collection runs on the
# instance, Activepieces uses it instead of PGlite through the pasta port
# forward to the loopback of the host, and the backup sets carry the dump.
driver:
  name: podman
platforms:
  - name: activepieces-postgres-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: activepieces-postgres-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: activepieces-postgres-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: activepieces-postgres-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Shared by converge, side_effect and verify
        activepieces_enabled: true
        activepieces_port: 8080
        activepieces_frontend_url: 'https://activepieces.example.com'
        activepieces_db_type: 'POSTGRES'
        activepieces_db_password: 'test-db-password-do-not-use-in-production'
        activepieces_encryption_key: '0123456789abcdef0123456789abcdef'
        activepieces_jwt_secret: 'test-jwt-secret-do-not-use-in-production'
        # A first start copies the image layers into the user namespace of
        # the activepieces user; on a host whose audit rules throttle the
        # chown of every file that takes longer than the role defaults allow
        activepieces_service_start_timeout: 900
        activepieces_ready_timeout: 900
        # The molecule instance is a rootless container itself and maps
        # 65536 IDs, so the subordinate range of the activepieces user has
        # to fit below that.
        activepieces_subid_start: 10000
        activepieces_subid_count: 50000
        # side_effect runs the scheduled backup twice, and verify expects
        # the retention to leave one set
        activepieces_backup_keep: 1
        podman_compose_enabled: false
        podman_docker_enabled: false
        podman_docker_alias_enabled: false
        podman_docker_socket_symlink_enabled: false
        podman_tools: []
        # PostgreSQL on the instance, listening on localhost only; the
        # container reaches it through the pasta port forward
        postgresql_enabled: true
        postgresql_ssl_enabled: false
        postgresql_firewalld_enabled: false
        postgresql_shared_buffers: '64MB'
        postgresql_effective_cache_size: '128MB'
        postgresql_lc_messages: 'en_US.UTF-8'
        postgresql_lc_monetary: 'en_US.UTF-8'
        postgresql_lc_numeric: 'en_US.UTF-8'
        postgresql_lc_time: 'en_US.UTF-8'
    host_vars:
      activepieces-postgres-archlinux:
        ansible_python_interpreter: /usr/bin/python
      activepieces-postgres-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
      activepieces-postgres-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
      activepieces-postgres-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
