---
# Update scenario: prepare deploys the previous release, converge updates
# to the role default (stop, backup set, image pull, health check),
# side_effect runs the scheduled backup, verify then exercises the
# downgrade guard and the restore of the pre-update set. One platform only
# — every stage pulls an Activepieces image.
driver:
  name: podman
platforms:
  - name: activepieces-update-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # Shared by prepare, converge, side_effect and verify
        activepieces_enabled: true
        activepieces_port: 8080
        activepieces_frontend_url: 'https://activepieces.example.com'
        activepieces_db_type: 'PGLITE'
        activepieces_encryption_key: '0123456789abcdef0123456789abcdef'
        activepieces_jwt_secret: 'test-jwt-secret-do-not-use-in-production'
        # The molecule instance is a rootless container itself and maps
        # 65536 IDs, so the subordinate range of the activepieces user has
        # to fit below that.
        activepieces_subid_start: 10000
        activepieces_subid_count: 50000
        podman_compose_enabled: false
        podman_docker_enabled: false
        podman_docker_alias_enabled: false
        podman_docker_socket_symlink_enabled: false
        podman_tools: []
        # Release installed by prepare; converge updates to the role default
        activepieces_update_previous_version: '0.91.4'
        # A first start copies the image layers into the user namespace of
        # the activepieces user; on a host whose audit rules throttle the
        # chown of every file that takes longer than the role defaults allow
        activepieces_service_start_timeout: 900
        activepieces_ready_timeout: 900
        # Tag of another repository that the image cleanup must keep
        activepieces_update_unrelated_image: 'localhost/molecule/unrelated:1'
        # side_effect runs the scheduled backup twice; the pre-update set
        # of the converge run has to survive the scheduled retention
        activepieces_backup_keep: 1
        # verify expects the rotation of the restore to keep two pre-update
        # sets besides the restored one
        activepieces_backup_update_keep: 2
    host_vars:
      activepieces-update-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
