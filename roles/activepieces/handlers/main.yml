---
- name: Reload Activepieces systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: activepieces_enabled | bool
  failed_when: false

# A check run cannot restart a unit the run has not deployed yet; report
# the failure and continue so the remaining diffs show
- name: Restart Activepieces
  ansible.builtin.systemd_service:
    name: '{{ __activepieces_service_name }}'
    state: restarted
  when: activepieces_service_enabled | bool
  ignore_errors: '{{ ansible_check_mode }}'

- name: Restart Activepieces backup timer
  ansible.builtin.systemd_service:
    name: '{{ __activepieces_backup_timer_name }}'
    state: restarted
  when:
    - activepieces_backup_enabled | bool
    - activepieces_backup_timer_enabled | bool
  ignore_errors: '{{ ansible_check_mode }}'
