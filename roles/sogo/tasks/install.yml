---
# Debian installs the distribution package, Arch Linux builds the AUR
# packages, Rocky Linux builds a container image (container.yml). The
# minimum version check and the restart of a replaced binary run here for
# the packages; container.yml does both for the image.

#
# Packages (Debian, Arch Linux)
#

# A targeted update must see the current repository state
- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  retries: 3
  delay: 5
  when:
    - sogo_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# A targeted update covers every installed package of the SOGo family: the
# SOPE libraries and sogo-common pin the exact version of the main package
# and must move in the same transaction. The facts also hold the version
# before the update for the minimum check and the report.
- name: Install | Gather package facts for update
  ansible.builtin.package_facts:
  when:
    - __sogo_install_method != 'container'
    - sogo_packages_state == 'latest' or __sogo_minimum | length > 0
  tags:
    - always

- name: Install | Set SOGo package list
  ansible.builtin.set_fact:
    __sogo_install_packages: >-
      {{ (__sogo_packages
          + ((ansible_facts['packages'] | list | select('match', __sogo_update_pattern) | list)
             if (sogo_packages_state == 'latest' and ansible_facts['os_family'] == 'Debian')
             else []))
         | unique | list }}
  when: __sogo_install_method != 'container'

# Full version of the main package as the package manager writes it:
# [epoch:]version[-release]
- name: Install | Record the installed SOGo version
  ansible.builtin.set_fact:
    __sogo_version_before: >-
      {{ ((__sogo_pkg.epoch ~ ':')
          if ((__sogo_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__sogo_pkg.version | default(''))
         ~ (('-' ~ __sogo_pkg.release) if (__sogo_pkg.release | default('', true)) else '') }}
  vars:
    __sogo_pkg: "{{ ansible_facts['packages'][__sogo_packages | first] | default([{}]) | first }}"
  when:
    - __sogo_install_method != 'container'
    - sogo_packages_state == 'latest' or __sogo_minimum | length > 0
  tags:
    - always

# Pre-check: ask the package manager which version the package task would
# install (apt honors pinning). Arch Linux builds a missing package from the
# current AUR release and otherwise keeps the installed version, which the
# system upgrade updates. The queries change nothing, so they also run
# under --check.
- name: Install | Query the version the update would install (Debian)
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - '{{ __sogo_packages | first }}'
  environment:
    LC_ALL: C
  register: __sogo_candidate_apt
  changed_when: false
  check_mode: false
  when:
    - __sogo_minimum | length > 0
    - ansible_facts['os_family'] == 'Debian'
    - sogo_packages_state == 'latest' or __sogo_version_before | length == 0
  tags:
    - always

- name: Install | Query the release the AUR would build (Archlinux)
  ansible.builtin.uri:
    url: 'https://aur.archlinux.org/rpc/v5/info?arg[]={{ __sogo_packages | first }}'
    return_content: true
  register: __sogo_candidate_aur
  check_mode: false
  retries: 5
  delay: 10
  when:
    - __sogo_minimum | length > 0
    - ansible_facts['os_family'] == 'Archlinux'
    - __sogo_version_before | length == 0
  tags:
    - always

- name: Install | Check the minimum version before the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __sogo_check_stage: 'pre'
    __sogo_check_installed: '{{ __sogo_version_before }}'
    __sogo_check_candidate: >-
      {{ ((((__sogo_candidate_apt.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
           | first | replace('(none)', ''))
         ~ (((__sogo_candidate_aur.json.results | default([])) | map(attribute='Version') | list) + [''])
           | first }}
  when:
    - __sogo_install_method != 'container'
    - __sogo_minimum | length > 0
  tags:
    - always

- name: Install | SOGo packages (Debian)
  ansible.builtin.package:
    name: '{{ __sogo_install_packages }}'
    state: '{{ sogo_packages_state }}'
  register: __sogo_packages_result
  retries: 3
  delay: 5
  when: __sogo_install_method == 'package'

# sogod loads the ActiveSync bundle when it starts, and the package does not
# restart it (its maintainer scripts only move a directory). A targeted
# update moves an installed sogo-activesync with the task above.
- name: Install | ActiveSync package (Debian)
  ansible.builtin.package:
    name: '{{ __sogo_activesync_packages }}'
    state: present
  retries: 3
  delay: 5
  notify: Restart SOGo
  when:
    - __sogo_install_method == 'package'
    - sogo_activesync_enabled | bool

# makepkg resolves no AUR dependencies: sope and libwbxml first
- name: Install | SOGo dependencies from the AUR (Archlinux)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __sogo_aur_packages.dependencies }}'
    state: present
  register: __sogo_aur_dependencies_result
  retries: 3
  delay: 5
  when: __sogo_install_method == 'aur'

- name: Install | SOGo from the AUR (Archlinux)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  kewlfft.aur.aur:
    name: '{{ __sogo_aur_packages.server }}'
    state: present
  register: __sogo_aur_result
  retries: 3
  delay: 5
  when: __sogo_install_method == 'aur'

# Check mode installs nothing: on a new host the sogo user, the
# configuration directory and the unit do not exist yet, and the tasks that
# need them are skipped.
- name: Install | Record a pending first install in check mode
  ansible.builtin.set_fact:
    __sogo_check_mode_install: >-
      {{ ansible_check_mode
         and ((__sogo_packages_result | default({})) is changed
              or (__sogo_aur_result | default({})) is changed) }}
  when: __sogo_install_method != 'container'

# Re-read the installed packages, the facts gathered before the update show
# the old versions.
- name: Install | Gather package facts after the update
  ansible.builtin.package_facts:
  when:
    - __sogo_install_method != 'container'
    - not ansible_check_mode
    - __sogo_minimum | length > 0
      or (sogo_packages_state == 'latest' and (__sogo_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Record the updated SOGo version
  ansible.builtin.set_fact:
    __sogo_version_after: >-
      {{ ((__sogo_pkg.epoch ~ ':')
          if ((__sogo_pkg.epoch | default('', true) | string) not in ['', 'None', '0']) else '')
         ~ (__sogo_pkg.version | default(''))
         ~ (('-' ~ __sogo_pkg.release) if (__sogo_pkg.release | default('', true)) else '') }}
  vars:
    __sogo_pkg: "{{ ansible_facts['packages'][__sogo_packages | first] | default([{}]) | first }}"
  when:
    - __sogo_install_method != 'container'
    - not ansible_check_mode
    - __sogo_minimum | length > 0
      or (sogo_packages_state == 'latest' and (__sogo_packages_result | default({})) is changed)
  tags:
    - always

- name: Install | Report the SOGo version change
  ansible.builtin.debug:
    msg: >-
      {{ __sogo_packages | first }} {{ __sogo_version_before | default('none', true) }}
      -> {{ __sogo_version_after }}
  when:
    - __sogo_install_method != 'container'
    - not ansible_check_mode
    - sogo_packages_state == 'latest'
    - (__sogo_packages_result | default({})) is changed
    - __sogo_version_before != __sogo_version_after

#
# Restart After Update
#
# A running sogod keeps executing the old binary after an update. The Debian
# package restarts it itself, but policy-rc.d can prevent that, and pacman
# never restarts it. With 'latest' the role restarts SOGo while its parent
# process still executes a replaced binary, so an update never restarts it
# twice. The check does not depend on changed packages: on Arch Linux the
# role run together with the system upgrade restarts a SOGo whose binary
# the upgrade replaced.
#

- name: Install | Read the PID of sogod
  ansible.builtin.slurp:
    src: '{{ __sogo_pid_file }}'
  register: __sogo_main_pid
  failed_when: false
  when:
    - __sogo_install_method != 'container'
    - sogo_packages_state == 'latest'

# readlink reports a replaced binary as "<path> (deleted)"
- name: Install | Read the binary of sogod
  ansible.builtin.command:
    argv:
      - readlink
      - '/proc/{{ __sogo_main_pid_value }}/exe'
  register: __sogo_main_exe
  changed_when: false
  # Exit status 1: a stale PID file; there is no running binary to replace
  failed_when: __sogo_main_exe.rc not in [0, 1]
  check_mode: false
  vars:
    __sogo_main_pid_value: '{{ __sogo_main_pid.content | default("") | b64decode | trim }}'
  when:
    - __sogo_install_method != 'container'
    - sogo_packages_state == 'latest'
    - __sogo_main_pid_value is match('^[0-9]+$')

# Check mode installs nothing, so a pending update reports the restart
- name: Install | Decide on the restart for a replaced binary
  ansible.builtin.set_fact:
    __sogo_restart_binary: >-
      {{ (__sogo_main_exe.rc | default(1)) == 0
         and sogo_service_enabled | bool
         and (((__sogo_main_exe.stdout | default('')) is search(' \(deleted\)$'))
              or (ansible_check_mode and (__sogo_packages_result | default({})) is changed)) }}
  when:
    - __sogo_install_method != 'container'
    - sogo_packages_state == 'latest'

# Restart right away rather than through the handler: a failing minimum
# check below would otherwise skip the restart and leave the old binary
# running. sogo.conf was validated when it was written; SOGo has no
# configuration test of its own.
- name: Install | Restart SOGo for a replaced binary
  ansible.builtin.systemd_service:
    name: '{{ __sogo_service_name }}'
    state: restarted
  when:
    - __sogo_install_method != 'container'
    - sogo_packages_state == 'latest'
    - __sogo_restart_binary | default(false) | bool

# Post-check: the transaction can install something else than the queried
# candidate, so the installed version is checked again.
- name: Install | Check the minimum version after the update
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __sogo_check_stage: 'post'
    __sogo_check_installed: '{{ __sogo_version_after }}'
    __sogo_check_candidate: ''
  when:
    - __sogo_install_method != 'container'
    - __sogo_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always

#
# memcached
#

- name: Install | memcached packages
  ansible.builtin.package:
    name: '{{ __sogo_memcached_packages }}'
    state: present
  register: __sogo_memcached_result
  retries: 3
  delay: 5
  when: __sogo_memcached_local | bool

#
# Rocky Linux: user and rootless podman
#

- name: Install | Verify podman is available (RedHat)
  ansible.builtin.command:
    argv:
      - podman
      - --version
  register: __sogo_podman_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: __sogo_install_method == 'container'

- name: Install | Assert podman is installed (RedHat)
  ansible.builtin.assert:
    that:
      - __sogo_podman_version.rc == 0
    fail_msg: >-
      SOGo runs as a podman container on Rocky Linux: run
      marcstraube.common.podman before the sogo role.
    quiet: true
  when: __sogo_install_method == 'container'

- name: Install | Create the sogo group (RedHat)
  ansible.builtin.group:
    name: '{{ __sogo_group }}'
    system: true
    state: present
  register: __sogo_group_result
  when: __sogo_install_method == 'container'

- name: Install | Create the sogo user (RedHat)
  ansible.builtin.user:
    name: '{{ __sogo_user }}'
    group: '{{ __sogo_group }}'
    home: '{{ __sogo_home }}'
    shell: '/usr/sbin/nologin'
    system: true
    create_home: true
    state: present
  register: __sogo_user_result
  when: __sogo_install_method == 'container'

# Check mode creates no user: the tasks owned by it are skipped on a new
# host
- name: Install | Record a pending first install in check mode (RedHat)
  ansible.builtin.set_fact:
    __sogo_check_mode_install: '{{ ansible_check_mode and __sogo_user_result is changed }}'
  when: __sogo_install_method == 'container'

# Rootless podman maps the users of the container onto a subordinate ID
# range of the sogo user
- name: Install | Configure subordinate UIDs and GIDs (RedHat)
  ansible.builtin.lineinfile:
    path: '{{ item }}'
    regexp: '^{{ __sogo_user }}:'
    line: '{{ __sogo_user }}:{{ sogo_subid_start }}:{{ sogo_subid_count }}'
    create: true
    owner: root
    group: root
    mode: '0644'
  loop:
    - /etc/subuid
    - /etc/subgid
  when: __sogo_install_method == 'container'

- name: Install | Create the directories of the sogo user (RedHat)
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ __sogo_user }}'
    group: '{{ __sogo_group }}'
    mode: '{{ item.mode }}'
  loop:
    - { path: '{{ __sogo_home }}', mode: '0750' }
    - { path: '{{ __sogo_spool_dir }}', mode: '0750' }
    - { path: '{{ __sogo_runtime_dir }}', mode: '0700' }
  loop_control:
    label: '{{ item.path }}'
  when:
    - __sogo_install_method == 'container'
    - not __sogo_check_mode_install | default(false) | bool
