---
# Rocky Linux: builds the local SOGo image on a Debian base image as the
# sogo user (rootless podman) and copies the WebServerResources of the image
# to sogo_web_resources_dir for the web server. The build script runs in a
# container of the base image, which is committed as the image: podman build
# mounts an overlay over its build context, which fails where podman itself
# runs in a container (Molecule, CI), and the image needs nothing else of a
# Containerfile. The image is rebuilt when the build script changes, when it
# is missing, and with sogo_packages_state 'latest' (freshly pulled base
# image, fresh package lists). A new image restarts a running SOGo.

- name: Container | Create the build directory
  ansible.builtin.file:
    path: '{{ __sogo_container_build_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  register: __sogo_build_dir_result

# Check mode creates no directory; the directory task reports the change
- name: Container | Deploy the build script
  ansible.builtin.template:
    src: sogo-image.sh.j2
    dest: '{{ __sogo_container_build_script }}'
    owner: root
    group: root
    mode: '0644'
  when: not (ansible_check_mode and __sogo_build_dir_result is changed)

# The label of the image holds the checksum of the build script it was
# built from (the script names the base image); computed from the template,
# so check mode on a new host compares the same value.
- name: Container | Compute the checksum of the build script
  ansible.builtin.set_fact:
    __sogo_containerfile_checksum: "{{ lookup('ansible.builtin.template', 'sogo-image.sh.j2') | hash('sha256') }}"

# podman needs the runtime directory of the sogo user, which install.yml
# creates and the service keeps; check mode creates nothing, so on a new
# host (or before the first start after a reboot) it does not ask podman
# and reports the build
- name: Container | Check the podman runtime directory
  ansible.builtin.stat:
    path: '{{ __sogo_runtime_dir }}'
  register: __sogo_runtime_dir_stat

- name: Container | Record whether podman can be asked
  ansible.builtin.set_fact:
    __sogo_podman_ready: >-
      {{ not (__sogo_check_mode_install | default(false) | bool)
         and __sogo_runtime_dir_stat.stat.exists }}

- name: Container | Inspect the SOGo image
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - '{{ __sogo_container_image }}'
  register: __sogo_image_inspect
  changed_when: false
  # Exit status 125: no such image yet
  failed_when: __sogo_image_inspect.rc not in [0, 125]
  check_mode: false
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when: __sogo_podman_ready | bool

- name: Container | Record the current image
  ansible.builtin.set_fact:
    __sogo_image_before: '{{ __sogo_image.Id | default("") }}'
    __sogo_build_needed: >-
      {{ sogo_packages_state == 'latest'
         or (__sogo_image.Labels | default({}, true)).get(__sogo_container_label, '')
            != __sogo_containerfile_checksum }}
  vars:
    __sogo_image: >-
      {{ (__sogo_image_inspect.stdout | from_json | first)
         if (__sogo_image_inspect.rc | default(1)) == 0 else {} }}

#
# Minimum Version
#

- name: Container | Read the SOGo version of the image
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --cgroups=disabled
      - --userns=host
      - --network=none
      - --entrypoint=dpkg-query
      - '{{ __sogo_container_image }}'
      - --show
      - --showformat=${Version}
      - sogo
  register: __sogo_image_version
  changed_when: false
  check_mode: false
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when:
    - __sogo_image_before | length > 0
    - sogo_packages_state == 'latest' or __sogo_minimum | length > 0
  tags:
    - always

# The candidate is the version the build would install: apt-cache policy in
# the base image the build would start from (pulled fresh with 'latest').
# Read-only, so it also runs under --check.
- name: Container | Query the version the build would install
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --cgroups=disabled
      - --userns=host
      - "--pull={{ 'newer' if sogo_packages_state == 'latest' else 'missing' }}"
      - --entrypoint=sh
      - '{{ sogo_container_base_image }}'
      - -c
      - >-
        {{ __sogo_container_apt_mirrors }}
        && apt-get -o APT::Sandbox::User=root update >/dev/null
        && LC_ALL=C apt-cache policy sogo
  register: __sogo_candidate_image
  changed_when: false
  check_mode: false
  retries: 5
  delay: 10
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when:
    - __sogo_podman_ready | bool
    - __sogo_minimum | length > 0
    - __sogo_build_needed | bool
  tags:
    - always

- name: Container | Check the minimum version before the build
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __sogo_check_stage: 'pre'
    __sogo_check_installed: '{{ __sogo_image_version.stdout | default("") }}'
    __sogo_check_candidate: >-
      {{ ((((__sogo_candidate_image.stdout | default('')) | regex_findall('(?m)^ *Candidate: *([^ ]+)$')) + [''])
          | first | replace('(none)', '')) }}
  when:
    - __sogo_podman_ready | bool
    - __sogo_minimum | length > 0
  tags:
    - always

#
# Build
#

# Check mode builds nothing; it reports the pending build
- name: Container | Report the pending image build in check mode
  ansible.builtin.debug:
    msg: 'The SOGo image {{ __sogo_container_image }} would be built.'
  changed_when: true
  when:
    - ansible_check_mode
    - __sogo_check_mode_install | default(false) | bool or __sogo_build_needed | bool

# 'latest' pulls the base image again, so the package lists and the security
# updates of the base image are fresh. Outside the service the sogo user has
# no systemd session and no cgroup of its own: the containers of the build
# and the short podman runs below run without cgroups, on the host network.
# --userns=host keeps them in the user namespace of the sogo user (root in
# the container is sogo on the host) whatever containers.conf sets
# (marcstraube.common.podman defaults to userns=auto).
- name: Container | Build the SOGo image
  ansible.builtin.shell:
    cmd: |
      set -eu
      # The image the build replaces stays as the one previous image
      # (rollback, see README); it replaces an older previous image
      if podman image exists '{{ __sogo_container_image }}'; then
        podman tag '{{ __sogo_container_image }}' '{{ __sogo_container_previous_image }}'
      fi
      podman rm --force --ignore {{ __sogo_container_name }}-build
      podman run --interactive --name={{ __sogo_container_name }}-build --cgroups=disabled --userns=host \
        --network=host \
        --pull={{ 'always' if sogo_packages_state == 'latest' else 'missing' }} --entrypoint=/bin/sh \
        '{{ sogo_container_base_image }}' -s < '{{ __sogo_container_build_script }}'
      podman commit \
        --change 'USER {{ __sogo_user }}' \
        --change 'ENTRYPOINT {{ __sogo_container_entrypoint | to_json }}' \
        --change 'CMD []' \
        --change 'LABEL {{ __sogo_container_label }}={{ __sogo_containerfile_checksum }}' \
        {{ __sogo_container_name }}-build '{{ __sogo_container_image }}'
      podman rm {{ __sogo_container_name }}-build
    chdir: '{{ __sogo_home }}'
  register: __sogo_image_build
  changed_when: true
  retries: 5
  delay: 10
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when:
    - not ansible_check_mode
    - __sogo_build_needed | bool

- name: Container | Inspect the built image
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - --format=json
      - '{{ __sogo_container_image }}'
  register: __sogo_image_inspect_after
  changed_when: false
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when: not ansible_check_mode

- name: Container | Record the built image
  ansible.builtin.set_fact:
    __sogo_image_after: '{{ (__sogo_image_inspect_after.stdout | from_json | first).Id }}'
  when: not ansible_check_mode

- name: Container | Read the SOGo version of the built image
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --cgroups=disabled
      - --userns=host
      - --network=none
      - --entrypoint=dpkg-query
      - '{{ __sogo_container_image }}'
      - --show
      - --showformat=${Version}
      - sogo
  register: __sogo_image_version_after
  changed_when: false
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when:
    - not ansible_check_mode
    - __sogo_image_build is changed or __sogo_minimum | length > 0
  tags:
    - always

- name: Container | Report the SOGo version change
  ansible.builtin.debug:
    msg: >-
      sogo {{ __sogo_image_version.stdout | default('none', true) }}
      -> {{ __sogo_image_version_after.stdout }} (image {{ __sogo_image_before[:19] | default('none', true) }}
      -> {{ __sogo_image_after[:19] }})
  when:
    - not ansible_check_mode
    - __sogo_image_build is changed

#
# Web Resources
#
# The web server serves the WebServerResources of the image from the file
# system. A file in the copy names the image it came from; the copy is
# renewed when the image differs. The image links some files to other
# packages (JavaScript libraries), so the copy follows the links inside the
# container.
#

- name: Container | Read the image of the web resources
  ansible.builtin.slurp:
    src: '{{ sogo_web_resources_dir }}/{{ __sogo_web_resources_stamp }}'
  register: __sogo_web_resources_stamp_content
  failed_when: false

- name: Container | Decide on the copy of the web resources
  ansible.builtin.set_fact:
    __sogo_web_resources_copy: >-
      {{ (__sogo_web_resources_stamp_content.content | default('') | b64decode | trim)
         != (__sogo_image_after | default('')) }}

- name: Container | Report the pending copy of the web resources in check mode
  ansible.builtin.debug:
    msg: 'The web resources in {{ sogo_web_resources_dir }} would be copied from the image.'
  changed_when: true
  when:
    - ansible_check_mode
    - __sogo_check_mode_install | default(false) | bool or __sogo_build_needed | bool
      or (__sogo_web_resources_stamp_content.content | default('') | b64decode | trim) != __sogo_image_before

- name: Container | Create the staging directory of the web resources
  ansible.builtin.file:
    path: '{{ __sogo_web_resources_staging }}'
    state: '{{ item }}'
    owner: '{{ __sogo_user }}'
    group: '{{ __sogo_group }}'
    mode: '0750'
  loop:
    - absent
    - directory
  when:
    - not ansible_check_mode
    - __sogo_web_resources_copy | bool

- name: Container | Copy the web resources out of the image
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --cgroups=disabled
      - --userns=host
      - --network=none
      - --user=root
      - '--volume={{ __sogo_web_resources_staging }}:/out:Z'
      - --entrypoint=cp
      - '{{ __sogo_container_image }}'
      - --recursive
      - --dereference
      - '{{ __sogo_container_web_resources }}/.'
      - /out/
  changed_when: true
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when:
    - not ansible_check_mode
    - __sogo_web_resources_copy | bool

# The copy owned by root, readable by everyone (the web server); the new
# tree replaces the old one in one rename
- name: Container | Install the web resources
  ansible.builtin.shell:
    cmd: |
      set -eu
      dest={{ sogo_web_resources_dir | quote }}
      # Only a copy of the role is replaced, never another directory
      if [ -e "$dest" ] && [ ! -e "$dest/{{ __sogo_web_resources_stamp }}" ]; then
        echo "$dest exists but is not a copy of the role (no {{ __sogo_web_resources_stamp }});" \
          "move it away or set sogo_web_resources_dir to another path" >&2
        exit 1
      fi
      rm -rf "$dest.new" "$dest.old"
      mkdir -p "$(dirname "$dest")"
      cp --recursive --no-preserve=all '{{ __sogo_web_resources_staging }}/.' "$dest.new"
      chmod -R u=rwX,go=rX "$dest.new"
      printf '%s\n' '{{ __sogo_image_after }}' > "$dest.new/{{ __sogo_web_resources_stamp }}"
      if [ -e "$dest" ]; then mv "$dest" "$dest.old"; fi
      mv "$dest.new" "$dest"
      rm -rf "$dest.old" '{{ __sogo_web_resources_staging }}'
  changed_when: true
  when:
    - not ansible_check_mode
    - __sogo_web_resources_copy | bool

#
# Restart for a New Image
#
# A running SOGo keeps the image it started with. The role restarts it right
# away when the image changed, before the post-check, so a failing minimum
# check does not leave the old image running.
#

- name: Container | Inspect the running SOGo container
  ansible.builtin.command:
    argv:
      - podman
      - container
      - inspect
      - '{{ __sogo_container_name }}'
  register: __sogo_container_inspect
  changed_when: false
  # Exit status 125: no running container
  failed_when: __sogo_container_inspect.rc not in [0, 125]
  check_mode: false
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when: __sogo_podman_ready | bool

- name: Container | Restart SOGo with the new image
  ansible.builtin.systemd_service:
    name: '{{ __sogo_service_name }}'
    state: restarted
  register: __sogo_image_restart
  when:
    - sogo_service_enabled | bool
    - (__sogo_container_inspect.rc | default(1)) == 0
    - >-
      (__sogo_build_needed | bool)
      if ansible_check_mode
      else (__sogo_container_inspect.stdout | from_json | first).Image != __sogo_image_after

# Images without a tag: the previous image the last build replaced. After
# the restart, so the image of the old container is no longer in use.
- name: Container | Remove replaced images
  ansible.builtin.command:
    argv:
      - podman
      - image
      - prune
      - --force
  register: __sogo_image_prune
  changed_when: __sogo_image_prune.stdout | trim | length > 0
  become: true
  become_user: '{{ __sogo_user }}'
  environment:
    XDG_RUNTIME_DIR: '{{ __sogo_runtime_dir }}'
  when:
    - not ansible_check_mode
    - __sogo_image_build is changed

- name: Container | Check the minimum version after the build
  ansible.builtin.include_tasks:
    file: version_check.yml
    apply:
      tags:
        - always
  vars:
    __sogo_check_stage: 'post'
    __sogo_check_installed: '{{ __sogo_image_version_after.stdout }}'
    __sogo_check_candidate: ''
  when:
    - __sogo_minimum | length > 0
    - not ansible_check_mode
  tags:
    - always
