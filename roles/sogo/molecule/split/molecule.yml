---
# Split scenario: SOGo on Rocky Linux 10 (the rootless container) with nginx
# and memcached in one container; PostgreSQL, PostfixAdmin, Postfix and
# Dovecot in a second one (Debian 13) on a podman network. SOGo reaches the
# databases over TCP with TLS (sslmode verify-full against the test CA; the
# PostgreSQL server accepts the SOGo users only with TLS), IMAP, submission
# and ManageSieve of the other container with TLS by its name, and the
# Sieve administrator is a Dovecot master user there. verify runs the
# checks of the postgresql scenario with the database and Dovecot on the
# second container. Both containers run in one job: the scenario needs both
# platforms at once.
driver:
  name: podman
platforms:
  - name: sogo-split-sogo
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    network: sogo-split
    groups:
      - sogo
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
      /var/tmp: rw,nosuid,nodev
  - name: sogo-split-backend
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    network: sogo-split
    groups:
      - backend
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
      /var/tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      sogo-split-sogo:
        ansible_python_interpreter: /usr/bin/python3
      sogo-split-backend:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
