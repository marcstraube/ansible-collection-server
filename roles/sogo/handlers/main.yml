---
# failed_when: false — daemon_reload is unavailable in some containers
# (molecule)
- name: Reload SOGo systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  failed_when: false
  when: sogo_enabled | bool

# A host where the service was not installed yet (check mode on a new host,
# or the container unit check mode would create) has nothing to restart.
- name: Restart SOGo
  ansible.builtin.systemd_service:
    name: '{{ __sogo_service_name }}'
    state: restarted
  when:
    - sogo_service_enabled | bool
    - not __sogo_check_mode_install | default(false) | bool
    - not (ansible_check_mode and (__sogo_unit_result | default({})) is changed)
