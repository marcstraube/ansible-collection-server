---
# =============================================================================
# Database Server Playbook
# =============================================================================
# Database server stack: pki-issued certificates and PostgreSQL. The stack
# and its order live in tasks/database_server.yml; this play adds the Arch
# Linux system update in front of it.
#
# Usage:
#   ansible-playbook marcstraube.server.database_server -i inventory/
#   ansible-playbook marcstraube.server.database_server -i inventory/ \
#     --tags postgresql
#
# Configure roles via inventory variables (group_vars/host_vars).
# See each role's defaults/main.yml for available variables.
# =============================================================================

- name: Database Server Deployment
  hosts: db_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Database | Import system update tasks
      ansible.builtin.import_tasks:
        file: tasks/system_update.yml

  tasks:
    - name: Database | Import database server tasks
      ansible.builtin.import_tasks:
        file: tasks/database_server.yml
