---
# =============================================================================
# Web Server Playbook
# =============================================================================
# Web server stack: apache or nginx with certbot certificates. The stack and
# its order live in tasks/web_server.yml; this play adds the Arch Linux
# system update in front of it.
#
# Usage:
#   ansible-playbook marcstraube.server.web_server -i inventory/
#   ansible-playbook marcstraube.server.web_server -i inventory/ --tags nginx
#
# Configure roles via inventory variables (group_vars/host_vars).
# See each role's defaults/main.yml for available variables.
# =============================================================================

- name: Web Server Deployment
  hosts: web_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Web | Import system update tasks
      ansible.builtin.import_tasks:
        file: tasks/system_update.yml

  tasks:
    - name: Web | Import web server tasks
      ansible.builtin.import_tasks:
        file: tasks/web_server.yml
