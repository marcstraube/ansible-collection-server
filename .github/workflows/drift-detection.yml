---
name: Drift Detection

# Weekly checks of the targets in .github/drift-targets.yml. Two kinds:
#
# - targets:  packages a role blocks on a platform (Layer-1 no-op). Each
#             is probed for re-availability; an installable package opens
#             an issue so the vars/<OS>.yml entry can be restored.
# - profiles: AppArmor profiles (and the abstractions they include) of
#             the Arch Linux packages that roles extend with local
#             overrides. The packages are installed in the Arch Linux
#             container and the SHA-256 of each file is compared with the
#             recorded value. A changed or missing file opens one issue
#             per role; resolving it means checking the overrides of the
#             role against the new file and updating sha256 and version
#             in drift-targets.yml. Only the Arch Linux package is
#             watched: Debian's apparmor-profiles ships php-fpm in
#             complain mode and is out of scope.
#
# A failed install or invalid entry fails the profile job without opening
# issues. Issues are deduplicated by exact title against open issues.

on:
  schedule:
    # Weekly on Monday at 06:00 UTC. The CI matrix also runs weekly
    # (Sunday 07:00 UTC) — staggered so a runner crunch on one does not
    # delay the other.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege: only the jobs that open issues get issues: write.
permissions:
  contents: read

# A manual run overlapping the scheduled one could pass the title dedupe
# in both and open duplicate issues; queue runs instead.
concurrency:
  group: drift-detection
  cancel-in-progress: false

jobs:
  # =============================================================================
  # LOAD-TARGETS — parse drift-targets.yml into a matrix
  # =============================================================================
  load-targets:
    name: Load drift targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      has_targets: ${{ steps.parse.outputs.has_targets }}
      has_profiles: ${{ steps.parse.outputs.has_profiles }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Parse drift-targets.yml
        id: parse
        run: |
          if [ ! -f .github/drift-targets.yml ]; then
            {
              echo 'matrix={"include":[]}'
              echo 'has_targets=false'
              echo 'has_profiles=false'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Either list may be absent or empty; each kind is gated on its
          # own flag so a file with only one kind still works.
          python3 -c "
          import json, yaml
          with open('.github/drift-targets.yml') as f:
              data = yaml.safe_load(f) or {}
          targets = data.get('targets') or []
          profiles = data.get('profiles') or []
          print('matrix=' + json.dumps({'include': targets}, separators=(',', ':')))
          print('has_targets=' + ('true' if targets else 'false'))
          print('has_profiles=' + ('true' if profiles else 'false'))
          " >> "$GITHUB_OUTPUT"

  # =============================================================================
  # PROBE — one job per target (parallel, fail-fast disabled)
  # =============================================================================
  probe:
    name: Probe ${{ matrix.role }}/${{ matrix.package }} on ${{ matrix.platform }}
    needs: load-targets
    if: needs.load-targets.outputs.has_targets == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-targets.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image and probe command
        id: resolve
        env:
          PLATFORM: ${{ matrix.platform }}
          SOURCE: ${{ matrix.source || 'repo' }}
        run: |
          case "$PLATFORM" in
            archlinux)
              IMAGE='docker.io/marcstraube/archlinux-ansible:latest'
              if [ "$SOURCE" = "aur" ]; then
                # AUR probe: clone + makepkg --syncdeps. --skippgpcheck
                # avoids per-package PGP setup. The build only needs to
                # *complete* — we discard the artifact.
                # The Arch image does not ship a build user; provision
                # one inline (makepkg refuses to run as root). The
                # wheel-group sudoers entry lets makepkg --syncdeps
                # install build-time deps via pacman.  # pragma: allowlist secret
                PROBE='set -euo pipefail
                pacman -Sy --noconfirm >/dev/null
                pacman -S --needed --noconfirm git base-devel sudo >/dev/null
                id aur_builder >/dev/null 2>&1 || useradd -m -G wheel aur_builder
                printf "%%wheel ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/wheel-nopw  # pragma: allowlist secret
                chmod 0440 /etc/sudoers.d/wheel-nopw
                rm -rf /tmp/aur-probe
                sudo -u aur_builder -- bash -c "
                  git clone --depth=1 https://aur.archlinux.org/$PKG.git /tmp/aur-probe &&
                  cd /tmp/aur-probe &&
                  makepkg --syncdeps --noconfirm --skippgpcheck
                "'
              else
                PROBE='set -euo pipefail
                pacman -Sy --noconfirm >/dev/null
                pacman -S --downloadonly --noconfirm "$PKG"'
              fi
              ;;
            debian-trixie)
              IMAGE='docker.io/geerlingguy/docker-debian13-ansible:latest'
              PROBE='set -euo pipefail
              apt-get update -qq
              apt-get install -y --download-only --no-install-recommends "$PKG"'
              ;;
            rocky-9)
              IMAGE='docker.io/geerlingguy/docker-rockylinux9-ansible:latest'
              PROBE='set -euo pipefail
              dnf install -y --downloadonly --setopt=install_weak_deps=0 "$PKG"'
              ;;
            rocky-10)
              IMAGE='docker.io/geerlingguy/docker-rockylinux10-ansible:latest'
              PROBE='set -euo pipefail
              dnf install -y --downloadonly --setopt=install_weak_deps=0 "$PKG"'
              ;;
            *)
              echo "::error::Unknown platform: $PLATFORM"
              exit 1
              ;;
          esac
          {
            echo "image=$IMAGE"
            echo 'probe<<EOF'
            echo "$PROBE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run probe
        id: probe
        continue-on-error: true
        env:
          PKG: ${{ matrix.package }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          PROBE_SCRIPT: ${{ steps.resolve.outputs.probe }}
        run: |
          # Pull image once (faster, clearer logs).
          docker pull --quiet "$IMAGE"
          # Run probe inside container. Stdout/stderr stream live to logs.
          if docker run --rm \
              -e PKG="$PKG" \
              "$IMAGE" \
              bash -c "$PROBE_SCRIPT"; then
            echo 'result=available' >> "$GITHUB_OUTPUT"
            echo "::notice::Package $PKG is installable on ${{ matrix.platform }} — drift detected"
          else
            echo 'result=unavailable' >> "$GITHUB_OUTPUT"
            echo "::notice::Package $PKG is still unavailable on ${{ matrix.platform }} — no action"
          fi

      - name: Open drift issue
        if: steps.probe.outputs.result == 'available'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # pragma: allowlist secret
          GH_REPO: ${{ github.repository }}
          TITLE: "Drift detected: re-enable `${{ matrix.package }}` on `${{ matrix.platform }}` in ${{ matrix.vars_file }}"
        run: |
          # pipefail: a failing gh issue list must fail the step instead of
          # yielding an empty result and a duplicate issue.
          set -o pipefail
          # Dedupe: skip if an open issue with this exact title already exists.
          EXISTING=$(gh issue list \
            --state open \
            --search "in:title \"Drift detected: re-enable\" \"${{ matrix.package }}\" \"${{ matrix.platform }}\"" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Existing open drift issue #$EXISTING — skipping"
            exit 0
          fi

          BODY=$(cat <<EOF
          The drift-detection workflow successfully probed \`${{ matrix.package }}\` on \`${{ matrix.platform }}\` — the package is installable again.

          To restore: revert the Layer-1 no-op in \`roles/${{ matrix.role }}/${{ matrix.vars_file }}\` (set the package back to its upstream name and drop the explanatory comment), remove this package's entry from \`.github/drift-targets.yml\`, then run the role's molecule to confirm.

          - Role: \`${{ matrix.role }}\`
          - Package: \`${{ matrix.package }}\`
          - Platform: \`${{ matrix.platform }}\`
          - Vars file: \`roles/${{ matrix.role }}/${{ matrix.vars_file }}\`
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The probe used a downloadonly / makepkg dry-run, so this issue may still false-positive on packages that install metadata cleanly but fail at use time — verify locally before closing.
          EOF
          )

          gh issue create \
            --title "$TITLE" \
            --label "bug,enhancement" \
            --body "$BODY"

  # =============================================================================
  # PROFILE-CHECK — hash the AppArmor profiles roles extend (single job)
  # =============================================================================
  # One job for all entries: the packages are installed once in one
  # container and every profile is hashed there; a matrix would repeat the
  # install per entry. Runs without issues: write — the container executes
  # package scripts, so the token that can write stays in profile-report.
  profile-check:
    name: Check AppArmor profiles
    needs: load-targets
    if: needs.load-targets.outputs.has_profiles == 'true'
    runs-on: ubuntu-24.04
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      has_drift: ${{ steps.compare.outputs.has_drift }}
    env:
      IMAGE: docker.io/marcstraube/archlinux-ansible:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate profile entries
        id: plan
        run: python3 .github/scripts/profile_drift.py plan .github/drift-targets.yml >> "$GITHUB_OUTPUT"

      - name: Install packages and hash profiles
        env:
          PKGS: ${{ steps.plan.outputs.packages }}
          FILES: ${{ steps.plan.outputs.files }}
        # No continue-on-error: a failed pull or install fails the job
        # visibly and no issue is opened.
        run: |
          docker pull --quiet "$IMAGE"
          # Package output goes to stderr (job log); stdout carries only
          # the PKG/SHA/NOTFILE/MISSING records parsed by the compare step.
          docker run --rm -e PKGS="$PKGS" -e FILES="$FILES" "$IMAGE" bash -c '
            set -euo pipefail
            # Word splitting of $PKGS is intended; names are validated.
            pacman -Syu --needed --noconfirm $PKGS >&2
            for pkg in $PKGS; do
              echo "PKG $(pacman -Q "$pkg")"
            done
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              if [ -f "$file" ]; then
                echo "SHA $(sha256sum "$file")"
              elif [ -e "$file" ]; then
                echo "NOTFILE $file"
              else
                echo "MISSING $file"
              fi
            done <<< "$FILES"
          ' > "$RUNNER_TEMP/profile-probe.txt"
          cat "$RUNNER_TEMP/profile-probe.txt"

      - name: Compare with recorded SHA-256
        id: compare
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/profile_drift.py compare \
            .github/drift-targets.yml "$RUNNER_TEMP/profile-probe.txt" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # PROFILE-REPORT — one issue per role with a changed or missing profile
  # =============================================================================
  profile-report:
    name: Report AppArmor drift for ${{ matrix.role }}
    needs: profile-check
    if: needs.profile-check.outputs.has_drift == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profile-check.outputs.drift) }}
    steps:
      - name: Open drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # pragma: allowlist secret
          GH_REPO: ${{ github.repository }}
          ROLE: ${{ matrix.role }}
          TITLE: ${{ matrix.title }}
          BODY: ${{ matrix.body }}
        run: |
          # pipefail: a failing gh issue list must fail the step instead of
          # yielding an empty result and a duplicate issue.
          set -o pipefail
          # Dedupe: skip if an open issue with this exact title already exists.
          EXISTING=$(gh issue list \
            --state open \
            --search "in:title \"Drift detected: AppArmor profile changed\" \"$ROLE\"" \
            --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' \
            | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Existing open drift issue #$EXISTING — skipping"
            exit 0
          fi

          gh issue create \
            --title "$TITLE" \
            --label "bug,enhancement" \
            --body "$BODY"
